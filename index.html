/* ----- Pestaña Registro por RA (hoja de cálculo) ----- */
function renderRegistro(m) {
  if (!m.ras.length) return `<div class="empty"><div class="big">🧩</div><p><strong>Este módulo aún no tiene RA.</strong></p><p class="small">Créalos en la pestaña Configuración.</p><p style="margin-top:1rem"><button class="btn btn-primary" data-act="tab" data-id="config">Ir a Configuración</button></p></div>`;
  if (!m.students.length) return `<div class="empty"><div class="big">👥</div><p><strong>No hay estudiantes.</strong></p><p style="margin-top:1rem"><button class="btn btn-primary" data-act="import-stu">${ICON.upload} Importar lista</button></p></div>`;
  let ra = findRa(m, state.raId); if (!ra) { ra = m.ras[0]; state.raId = ra.id; }
  const ri = m.ras.indexOf(ra);
  const list = visibleStudents(m, 'num');
  const pts = raPoints(ra);

  const chips = m.ras.map((r, i) => `<button class="chip ${r.id === ra.id ? 'active' : ''}" data-act="ra-select" data-id="${r.id}" title="${esc(r.name)}">RA ${i + 1} <small>${fmtN(r.w)}%</small></button>`).join('');
  const h1 = ra.cats.map(c => `<th class="cat-h cat-${c.color}" colspan="${c.count}">${esc(c.label)} <span style="font-weight:600;text-transform:none">· ${c.count}×${fmtN(c.max)}</span></th>`).join('');
  let col = 0;
  const h2 = ra.cats.map(c => Array.from({ length: c.count }, (_, i) => `<th class="item-h cat-${c.color}" data-act="col-menu" data-cat="${c.id}" data-idx="${i}" title="${esc(actFull(c, i))} · clic para nombrar, poner fecha o llenar la columna">${esc(itemLabel(c, i))}<small>/${fmtN(c.max)}</small>${actOf(c, i).n ? `<small class="act-n">${esc(actOf(c, i).n)}</small>` : ''}${actOf(c, i).d ? `<small>${fmtDate(actOf(c, i).d)}</small>` : ''}</th>`).join('')).join('');
  const rows = list.map((s, r) => {
    col = 0;
    const cells = ra.cats.map(c => Array.from({ length: c.count }, (_, i) => {
      const v = getGrade(s, ra.id, c.id, i);
      const k = `${s.id}|${ra.id}|${c.id}|${i}`;
      return `<td><input class="cell${v !== '' ? ' filled' : ''}" data-g="${k}" data-key="${k}" data-r="${r}" data-c="${col++}" value="${fmtN(v)}" inputmode="decimal" autocomplete="off"></td>`;
    }).join('')).join('');
    const x = calcRA(m, s, ra);
    return `<tr><td class="sticky-num">${s.num}</td><td class="sticky-name" title="${esc(s.name)}">${esc(s.name)}</td>${cells}
      <td class="out" data-out="raobt:${s.id}:${ra.id}">${fmtN(x.obt)}/${fmtN(x.max)}</td>
      <td class="out" data-out="rapct:${s.id}:${ra.id}">${Math.round(x.pct * 100)}%</td>
      <td class="out" style="color:var(--primary)" data-out="ra:${s.id}:${ra.id}">${fmt(x.pts, 2)}</td>
      <td class="out" data-out="rabadge:${s.id}:${ra.id}">${raBadge(x)}</td></tr>`;
  }).join('');

  return `${weightAlert(m)}
  <div class="chips">${chips}</div>
  <div class="card">
    <div class="toolbar">
      <div style="min-width:200px;flex:1"><strong>RA ${ri + 1}: ${esc(ra.name)}</strong><div class="muted small">Vale ${fmtN(ra.w)}% · ${raItemCount(ra)} actividades · ${fmtN(pts)} puntos en total</div><div class="small" style="color:var(--primary-dark);font-weight:600">Para lograrlo: ${esc(raRequirements(m, ra))}</div>${ra.desc ? `<div class="ra-desc">${esc(ra.desc)}</div>` : ''}</div>
      ${searchBox('Filtrar estudiante…')}
      <button class="btn btn-sm btn-ok" data-act="fill" data-scope="ra" data-mode="max" title="Pone la nota máxima en todas las casillas vacías de este RA">${ICON.bolt} Vacías → máximo</button>
      <button class="btn btn-sm btn-secondary" data-act="fill" data-scope="ra" data-mode="zero" title="Pone 0 en todas las casillas vacías de este RA">Vacías → 0</button>
      <button class="btn btn-sm btn-danger" data-act="fill" data-scope="ra" data-mode="clear" title="Borra todas las notas de este RA">Vaciar RA</button>
    </div>
    <div class="alert alert-info" style="margin:.6rem .8rem;padding:.5rem .8rem;font-size:.8rem">
      <div><strong>Atajos:</strong> Enter baja al siguiente estudiante · flechas para moverse · pega una columna o tabla copiada de Excel/Notion y se reparte sola · clic en el encabezado de una actividad para llenarla completa.</div>
    </div>
    <div class="grid-wrap"><table class="grid" data-grid="grid">
      <thead><tr><th class="sticky-num" rowspan="2">No.</th><th class="sticky-name" rowspan="2">Estudiante</th>${h1}<th class="out-h" rowspan="2">Puntos</th><th class="out-h" rowspan="2">%</th><th class="out-h" rowspan="2">Aporte<br>/${fmtN(ra.w)}</th><th class="out-h" rowspan="2">Estado</th></tr><tr>${h2}</tr></thead>
      <tbody>${rows || `<tr><td colspan="99" class="muted" style="padding:2rem">Ningún estudiante coincide con la búsqueda.</td></tr>`}</tbody>
    </table></div>
  </div>`;
}

/* ----- Pestaña Por estudiante ----- */
function renderEstudiante(m) {
  if (!m.students.length) return `<div class="empty"><div class="big">👥</div><p><strong>No hay estudiantes.</strong></p><p style="margin-top:1rem"><button class="btn btn-primary" data-act="import-stu">${ICON.upload} Importar lista</button></p></div>`;
  const list = allStudents(m);
  let s = findStu(m, state.stuId); if (!s) { s = list[0] || m.students[0]; state.stuId = s.id; }
  const c = calcStudent(m, s), stt = statusOf(c);
  const pos = list.findIndex(x => x.id === s.id);
  const opts = allStudents(m).map(x => `<option value="${x.id}" ${x.id === s.id ? 'selected' : ''}>${x.num}. ${esc(x.name)}</option>`).join('');

  const raCards = m.ras.map((ra, i) => {
    const x = c.ras[i];
    const cats = ra.cats.map(cat => {
      const cs = calcCat(s, ra, cat);
      const items = Array.from({ length: cat.count }, (_, k) => {
        const v = getGrade(s, ra.id, cat.id, k), key = `${s.id}|${ra.id}|${cat.id}|${k}`;
        return `<label title="${esc(actFull(cat, k))}">${cat.count > 1 ? k + 1 : '&nbsp;'}${actOf(cat, k).d ? `<span class="act-d">${fmtDate(actOf(cat, k).d)}</span>` : ''}<input class="cell${v !== '' ? ' filled' : ''}" data-g="${key}" data-key="${key}" value="${fmtN(v)}" inputmode="decimal" autocomplete="off" title="${esc(actFull(cat, k))} (máx. ${fmtN(cat.max)})"></label>`;
      }).join('');
      return `<div class="cat-row cat-${cat.color}"><span class="cat-tag"><span class="cat-dot"></span>${esc(cat.label)} <span style="font-weight:600;opacity:.8">/${fmtN(cat.max)}</span></span>
        <div class="cat-items">${items}</div><span class="cat-sum" data-out="cat:${s.id}:${ra.id}:${cat.id}">${fmtN(cs.obt)} / ${fmtN(cs.max)}</span></div>`;
    }).join('');
    return `<div class="card ra-card">
      <div class="ra-card-head"><span class="ra-num">RA ${i + 1}</span><span class="ra-title">${esc(ra.name)}</span><span class="ra-weight">${fmtN(ra.w)}%</span>
        <button class="btn btn-sm btn-ok" data-act="fill" data-scope="stu-ra" data-ra="${ra.id}" data-mode="max" title="Pone la nota máxima en las casillas vacías de este RA">${ICON.bolt} Máximo</button>
        <button class="btn btn-sm btn-ghost" data-act="fill" data-scope="stu-ra" data-ra="${ra.id}" data-mode="clear" title="Borra las notas de este RA para este estudiante">Vaciar</button>
        ${x.status === 'no' || x.rec ? `<button class="btn btn-sm ${x.status === 'rec' ? 'btn-ok' : 'btn-secondary'}" data-act="rec-open" data-sid="${s.id}" data-ra="${ra.id}" title="Registrar la recuperación de este RA">↺ ${x.rec ? 'Recuperación: ' + fmtN(x.rec.score) : 'Recuperación'}</button>` : ''}
        <span class="ra-res">Aporte: <span data-out="ra:${s.id}:${ra.id}">${fmt(x.pts, 2)}</span> · <span data-out="rapct:${s.id}:${ra.id}">${Math.round(x.pct * 100)}%</span></span>
        <span data-out="rabadge:${s.id}:${ra.id}">${raBadge(x)}</span>
      </div>
      ${ra.desc ? `<div class="ra-desc" style="padding:.5rem 1rem 0">${esc(ra.desc)}</div>` : ''}
      <div class="ra-reasons"><span class="muted">Para lograrlo: ${esc(raRequirements(m, ra))}</span><span data-out="rareason:${s.id}:${ra.id}">${raReasonLine(x)}</span></div>
      <div class="ra-body">${cats || '<span class="muted small">Este RA no tiene criterios. Agrégalos en Configuración.</span>'}</div>
    </div>`;
  }).join('');

  return `${weightAlert(m)}
  <div class="card stu-head">
    <div class="row-wrap">
      <span class="badge neutral" data-out="raok-badge:${s.id}">RA logrados: ${c.raOk}/${m.ras.length}</span>
      <button class="btn btn-secondary btn-sm" data-act="stu-nav" data-id="-1" ${pos <= 0 ? 'disabled' : ''}>◀ Anterior</button>
      <select id="stuSel" style="width:auto;max-width:300px;font-weight:700">${opts}</select>
      <button class="btn btn-secondary btn-sm" data-act="stu-nav" data-id="1" ${pos >= list.length - 1 ? 'disabled' : ''}>Siguiente ▶</button>
      ${copyBtn(s.name, 'btn-secondary')}
      <button class="btn btn-sm btn-secondary" data-act="anec-new" data-sid="${s.id}" title="Agregar una anotación al cuaderno anecdótico">${ICON.note.replace('class="i"', 'class="i i-sm"')} Anotación</button>
      <button class="btn btn-sm btn-ok" data-act="fill" data-scope="stu" data-mode="max" title="Llena con la nota máxima todas las casillas vacías de todos los RA">${ICON.bolt} Completar todo con máximo</button>
    </div>
    ${stuSideInfo(m, s)}
    <div class="stu-total"><span>Nota final</span><b data-out="total-big:${s.id}" style="color:var(--${stt.cls === 'ok' ? 'ok' : stt.cls === 'risk' ? 'risk' : 'bad'})">${fmtTotal(c.total)}</b><span data-out="status:${s.id}"><span class="badge ${stt.cls}">${stt.label}</span></span></div>
  </div>
  ${studentProfile(m, s, c)}
  <div id="stuGrid" data-grid="linear">
    ${m.ras.length ? raCards : `<div class="empty" style="margin-bottom:1rem"><p>Este módulo no tiene RA. Créalos en Configuración.</p></div>`}
    <div class="card final-card">
      <div class="row" style="flex:1;min-width:220px"><span class="tag">${fmtN(m.finalWeight)}%</span><strong>${esc(m.finalLabel)}</strong></div>
      <label class="row" style="gap:.5rem"><input class="cell" data-final="${s.id}" data-key="f|${s.id}" value="${fmtN(s.final)}" inputmode="decimal" autocomplete="off"><span style="opacity:.6">/ ${fmtN(m.finalWeight)}</span></label>
      <div style="text-align:right" title="Suma de lo que aporta cada RA. No se suma aparte: la nota final es esto más el ${esc(m.finalLabel)}."><span class="small" style="opacity:.7;text-transform:uppercase;font-weight:700">Puntos de los RA</span><div class="big"><span data-out="acc:${s.id}">${fmt(c.acc)}</span> <span style="font-size:.55em;opacity:.6">/ ${fmtN(100 - m.finalWeight)}</span></div></div>
    </div>
    <p class="small muted" style="margin:-.4rem 0 1rem;text-align:right">Nota final = puntos de los RA (sobre ${fmtN(100 - m.finalWeight)}) + ${esc(m.finalLabel)} (sobre ${fmtN(m.finalWeight)})</p>
  </div>
  <div class="card card-pad"><label class="field">Observaciones (aparecen en el boletín)<textarea data-obs="${s.id}" data-key="obs|${s.id}" placeholder="Comentarios sobre el desempeño, recomendaciones…">${esc(s.obs)}</textarea></label></div>`;
}

/* ----- Pestaña Configuración ----- */
function renderConfig(m) {
  const wi = weightIssue(m);
  const sum = r2(m.ras.reduce((a, r) => a + (+r.w || 0), 0));
  const otherMods = db.modules.filter(x => x.id !== m.id && x.ras.length);
  const raCards = m.ras.map((ra, i) => {
    const pts = raPoints(ra);
    const cats = ra.cats.map(c => {
      const sub = c.count * c.max;
      return `<tr>
        <td><select data-cfg-cat="${ra.id}|${c.id}|color" data-key="cc|${c.id}|color" style="width:auto" title="Color">${CAT_COLORS.map(col => `<option value="${col}" ${c.color === col ? 'selected' : ''}>${COLOR_NAMES[col]}</option>`).join('')}</select></td>
        <td><input type="text" data-cfg-cat="${ra.id}|${c.id}|label" data-key="cc|${c.id}|label" value="${esc(c.label)}"></td>
        <td><input type="text" class="n" inputmode="numeric" data-cfg-cat="${ra.id}|${c.id}|count" data-key="cc|${c.id}|count" value="${c.count}"></td>
        <td><input type="text" class="n" inputmode="decimal" data-cfg-cat="${ra.id}|${c.id}|max" data-key="cc|${c.id}|max" value="${fmtN(c.max)}"></td>
        <td><input type="text" class="n" inputmode="numeric" data-cfg-cat="${ra.id}|${c.id}|minDone" data-key="cc|${c.id}|minDone" value="${c.minDone || ''}" placeholder="—" title="Cuántas actividades de este criterio debe realizar (nota mayor que 0) para lograr el RA. Vacío = sin mínimo."></td>
        <td class="c tabnum"><b>${fmtN(sub)}</b></td>
        <td class="c tabnum muted">${pts ? Math.round(sub / pts * 100) : 0}%</td>
        <td class="r" style="white-space:nowrap"><button class="btn btn-sm btn-ghost" data-act="cfg-acts" data-ra="${ra.id}" data-id="${c.id}" title="Nombre y fecha de cada actividad">📝 Actividades${c.acts.filter(a => a.n || a.d).length ? ` (${c.acts.filter(a => a.n || a.d).length}/${c.count})` : ''}</button><button class="btn btn-ghost btn-icon" style="color:var(--bad)" data-act="cfg-del-cat" data-ra="${ra.id}" data-id="${c.id}" title="Quitar criterio">${ICON.trash}</button></td>
      </tr>`;
    }).join('');
    return `<div class="card cfg-ra">
      <div class="cfg-ra-head">
        <span class="ra-num">RA ${i + 1}</span>
        <input type="text" data-cfg-ra="${ra.id}|name" data-key="cr|${ra.id}|name" value="${esc(ra.name)}" placeholder="Nombre o descripción del RA">
        <label class="mini">Valor<div class="w-input" title="Valor del RA en la nota final"><input type="text" inputmode="decimal" data-cfg-ra="${ra.id}|w" data-key="cr|${ra.id}|w" value="${fmtN(ra.w)}"><span>%</span></div></label>
        <label class="mini">Logro mín.<div class="w-input" title="Logro mínimo para este RA. Vacío = usar el del módulo (${fmtN(m.raPass)}%)"><input type="text" inputmode="decimal" data-cfg-ra="${ra.id}|minPct" data-key="cr|${ra.id}|minPct" value="${isNum(ra.minPct) ? fmtN(ra.minPct) : ''}" placeholder="${fmtN(m.raPass)}"><span>%</span></div></label>
        <div class="row">
          <button class="btn btn-ghost btn-icon" data-act="cfg-move-ra" data-id="${ra.id}" data-dir="-1" title="Subir" ${i === 0 ? 'disabled' : ''}>${ICON.up}</button>
          <button class="btn btn-ghost btn-icon" data-act="cfg-move-ra" data-id="${ra.id}" data-dir="1" title="Bajar" ${i === m.ras.length - 1 ? 'disabled' : ''}>${ICON.down}</button>
          <button class="btn btn-ghost btn-icon" data-act="cfg-dup-ra" data-id="${ra.id}" title="Duplicar RA">${ICON.copy}</button>
          <button class="btn btn-ghost btn-icon" style="color:var(--bad)" data-act="cfg-del-ra" data-id="${ra.id}" title="Eliminar RA">${ICON.trash}</button>
        </div>
      </div>
      <div class="ra-desc-edit"><textarea rows="2" data-cfg-ra="${ra.id}|desc" data-key="cr|${ra.id}|desc" placeholder="Descripción del RA o indicadores de logro (opcional). Aparece en el registro y en el boletín.">${esc(ra.desc)}</textarea></div>
      <div class="table-wrap"><table class="tbl cfg-cats">
        <thead><tr><th style="width:110px">Color</th><th>Criterio</th><th class="c" style="width:90px">Actividades</th><th class="c" style="width:90px">Máx. c/u</th><th class="c" style="width:90px" title="Actividades realizadas (nota mayor que 0) que exige para lograr el RA">Mín. para lograr</th><th class="c">Puntos</th><th class="c">% del RA</th><th></th></tr></thead>
        <tbody>${cats || '<tr><td colspan="8" class="muted c">Sin criterios.</td></tr>'}</tbody>
      </table></div>
      <div class="cfg-foot">
        <div class="row-wrap"><button class="btn btn-sm btn-secondary" data-act="cfg-add-cat" data-id="${ra.id}">${ICON.plus} Criterio</button>
        ${m.ras.length > 1 ? `<button class="btn btn-sm btn-ghost" data-act="cfg-copy-cats" data-id="${ra.id}" title="Copia estos criterios a todos los demás RA">Copiar estos criterios a todos los RA</button>` : ''}</div>
        <span class="muted">Total del RA: <b style="color:var(--ink)">${fmtN(pts)} puntos</b> · ${raItemCount(ra)} actividades</span>
      </div>
    </div>`;
  }).join('');

  return `
  <div class="card card-pad" style="margin-bottom:1rem">
    <h3 style="font-size:1rem;margin-bottom:.9rem">Datos del módulo</h3>
    <div class="form-grid">
      <label class="field">Nombre completo del módulo<input type="text" data-cfg-mod="name" data-key="cm|name" value="${esc(modFull(m))}"></label>
      <label class="field">Abreviatura o acrónimo<input type="text" data-cfg-mod="abbr" data-key="cm|abbr" value="${esc(modShort(m))}" maxlength="20" placeholder="Ej.: D.A.S"><small>Se usa en el inicio, la agenda, Mi semana y los reportes.</small></label>
      <label class="field">Curso / sección<input type="text" data-cfg-mod="course" data-key="cm|course" value="${esc(m.course)}" placeholder="Ej.: 5to B"></label>
      <label class="field">Nombre del cierre<input type="text" data-cfg-mod="finalLabel" data-key="cm|finalLabel" value="${esc(m.finalLabel)}"></label>
      <label class="field">Valor del cierre (%)<input type="text" inputmode="decimal" data-cfg-mod="finalWeight" data-key="cm|finalWeight" value="${fmtN(m.finalWeight)}"></label>
      <label class="field">Casillas vacías
        <select data-cfg-mod="blankMode" data-key="cm|blankMode">
          <option value="ignore" ${m.blankMode === 'ignore' ? 'selected' : ''}>No cuentan (ver progreso)</option>
          <option value="zero" ${m.blankMode === 'zero' ? 'selected' : ''}>Cuentan como 0 (nota definitiva)</option>
        </select>
        <small>Durante el periodo usa «No cuentan»; al cerrar, cambia a «Cuentan como 0».</small>
      </label>
    </div>
  </div>

  <div class="card card-pad" style="margin-bottom:1rem">
    <h3 style="font-size:1rem;margin-bottom:.3rem">Regla de logro de los RA</h3>
    <p class="muted small" style="margin-bottom:.9rem">Un RA queda <strong>logrado</strong> cuando el estudiante alcanza el logro mínimo de puntos <em>y</em> realiza las actividades mínimas que pidas en cada criterio (columna «Mín. para lograr»). Una actividad cuenta como realizada si tiene nota mayor que 0.</p>
    <div class="form-grid">
      <label class="field">Logro mínimo para lograr un RA (%)<input type="text" inputmode="decimal" data-cfg-mod="raPass" data-key="cm|raPass" value="${fmtN(m.raPass)}"><small>Se aplica a todos los RA que no tengan uno propio.</small></label>
      <label class="check" style="align-self:center"><input type="checkbox" data-cfg-mod="requireAllRA" data-key="cm|requireAllRA" ${m.requireAllRA ? 'checked' : ''}> Para aprobar el módulo, el estudiante debe lograr <strong>todos</strong> los RA</label>
      <label class="field">Nota del RA recuperado
        <select data-cfg-mod="recCap" data-key="cm|recCap">
          <option value="min" ${m.recCap !== 'none' ? 'selected' : ''}>Hasta el logro mínimo (recomendado)</option>
          <option value="none" ${m.recCap === 'none' ? 'selected' : ''}>La nota de la recuperación, sin tope</option>
        </select><small>Con «hasta el mínimo», quien recupera no supera a quien lo logró a tiempo.</small></label>
    </div>
  </div>

  ${sumBox(m)}

  <div class="section-head" style="margin-top:.5rem"><h2>Resultados de Aprendizaje (${m.ras.length})</h2>
    <div class="row-wrap">
      <select id="tplSel" style="width:auto">
        ${Object.entries(TEMPLATES).map(([k, t]) => `<option value="tpl:${k}">${esc(t.label)}</option>`).join('')}
        ${otherMods.map(x => `<option value="mod:${x.id}">Copiar de: ${esc(x.name)}${x.course ? ' (' + esc(x.course) + ')' : ''}</option>`).join('')}
      </select>
      <button class="btn btn-secondary" data-act="cfg-apply-tpl" title="Aplica la plantilla elegida a todos los RA">Aplicar a todos</button>
      <button class="btn btn-primary" data-act="cfg-add-ra">${ICON.plus} Añadir RA</button>
    </div>
  </div>
  ${raCards || '<div class="empty"><p>No hay RA. Pulsa «Añadir RA».</p></div>'}`;
}

/* ----- Pestaña Reportes ----- */
function renderReportes(m) {
  const ras = m.ras.map((r, i) => `<option value="${r.id}">RA ${i + 1}: ${esc(r.name)}</option>`).join('');
  const stus = allStudents(m).map(s => `<option value="${s.id}">${s.num}. ${esc(s.name)}</option>`).join('');
  const dis = m.students.length ? '' : 'disabled';
  return `${weightAlert(m)}
  ${m.blankMode === 'ignore' ? `<div class="alert alert-warn"><div>Este módulo está en <strong>modo progreso</strong> (las casillas vacías no cuentan). Para el reporte definitivo de fin de periodo, cambia a «Cuentan como 0» en Configuración.</div><button class="btn btn-sm btn-secondary" data-act="tab" data-id="config">Cambiar</button></div>` : ''}
  <p class="muted small" style="margin-bottom:1rem">Los reportes se abren en la ventana de impresión. Para obtener el PDF, elige <strong>«Guardar como PDF»</strong> como impresora. Funciona sin internet.</p>
  <div class="rep-grid">
    <div class="card rep-card"><h3>${ICON.print} Registro general</h3><p>Todos los estudiantes con el aporte de cada RA, el cierre, la nota final y la condición. Incluye estadísticas y línea de firma.</p>
      <button class="btn btn-primary" data-act="print-general" ${dis}>Imprimir / PDF</button></div>
    <div class="card rep-card"><h3>${ICON.user} Boletines individuales</h3><p>Una página por estudiante con el detalle de cada RA por criterio, el cierre y las observaciones.</p>
      <select id="rpStu" ${dis}><option value="all">Todos los estudiantes</option>${stus}</select>
      <button class="btn btn-primary" data-act="print-boletin" ${dis}>Imprimir / PDF</button></div>
    <div class="card rep-card"><h3>${ICON.sheet} Detalle de un RA</h3><p>Planilla con cada actividad del RA (participaciones, prácticas, etc.) por estudiante.</p>
      <select id="rpRa" ${m.ras.length ? '' : 'disabled'}>${ras}</select>
      <button class="btn btn-primary" data-act="print-ra" ${dis || (m.ras.length ? '' : 'disabled')}>Imprimir / PDF</button></div>
    <div class="card rep-card"><h3>${ICON.sheet} Exportar a Excel</h3><p>Archivos CSV que se abren directamente en Excel o Google Sheets.</p>

/* =========================================================
   Panel (dashboards) — gráficos dibujados en SVG/HTML, sin internet
   ========================================================= */
const VIZ = {
  ok: '#16a34a', risk: '#f59e0b', bad: '#dc2626', pend: '#cbd5e1',
  series: '#2a78d6', avg: '#0f172a',
  seq: ['#cde2fb', '#9ec5f4', '#6da7ec', '#3987e5', '#1c5cab']   // una sola tonalidad: más oscuro = más logro
};
/* En modo oscuro la escala se invierte: lo bajo se funde con el fondo y lo alto brilla. */
const SEQ_DARK = ['#1c3352', '#1f4a80', '#2a6bbd', '#4c8fe0', '#86b6ef'];
const seqIdx = p => p < 0.2 ? 0 : p < 0.4 ? 1 : p < 0.6 ? 2 : p < 0.8 ? 3 : 4;
const seqRamp = () => (typeof isDark === 'function' && isDark()) ? SEQ_DARK : VIZ.seq;
const seqColor = p => seqRamp()[seqIdx(p)];
const seqInk = p => (typeof isDark === 'function' && isDark()) ? (seqIdx(p) >= 3 ? '#0c1222' : '#e6e9ef') : (seqIdx(p) >= 3 ? '#fff' : '#0f172a');
const tip = t => `data-tip="${esc(t)}" tabindex="0"`;
const pct0 = p => `${Math.round(p * 100)}%`;
const RA_ST_COLOR = { ok: VIZ.ok, proc: VIZ.risk, no: VIZ.bad, get pend() { return (typeof isDark === 'function' && isDark()) ? '#475569' : VIZ.pend; } };
const statusColor = cls => cls === 'ok' ? VIZ.ok : cls === 'risk' ? VIZ.risk : VIZ.bad;

function vLegend(items) {
  return `<div class="viz-legend">${items.map(([c, l]) => `<span><i style="background:${c}"></i>${esc(l)}</span>`).join('')}</div>`;
}
function vCard(title, sub, body, wide = false) {
  return `<section class="card viz-card${wide ? ' viz-wide' : ''}"><div class="viz-head"><h3>${esc(title)}</h3>${sub ? `<p>${sub}</p>` : ''}</div>${body}</section>`;
}
/** Barra apilada horizontal (conteos). segs: [{v, c, label, ink}] */
function stackBar(segs, total) {
  if (!total) return '<div class="stack stack-empty"></div>';
  return `<div class="stack">${segs.filter(s => s.v > 0).map(s =>
    `<div style="flex:${s.v};background:${s.c}" ${tip(`${s.v} ${s.label} (${pct0(s.v / total)})`)}>${s.v / total >= 0.09 ? `<span style="color:${s.ink || '#fff'}">${s.v}</span>` : ''}</div>`).join('')}</div>`;
}

/* ---------- Panel del módulo ---------- */
function renderPanel(m) {
  if (!m.students.length) return `<div class="empty"><div class="big">📊</div><p><strong>Todavía no hay estudiantes en este módulo.</strong></p><p class="small">El panel se llena solo a medida que registras notas.</p></div>`;
  const st = moduleStats(m);
  const res = m.students.map((s, i) => ({ s, c: st.res[i] }));
  return `${weightAlert(m)}${statsTiles(m)}
  <p class="muted small" style="margin:-.3rem 0 1rem">${m.blankMode === 'zero' ? 'Nota definitiva: las casillas vacías cuentan como 0.' : 'Modo progreso: los gráficos muestran solo lo ya evaluado.'} Pasa el cursor (o toca) cualquier barra o celda para ver el detalle.</p>
  <div class="viz-grid">
    ${vCard('Distribución de notas finales', 'Cuántos estudiantes hay en cada rango de nota.', histogram(m, res))}
    ${vCard('Logro de cada RA', `Estado de los estudiantes en cada RA y logro promedio del curso (mínimo ${fmtN(m.raPass)}%).`, raStatusChart(m, res))}
    ${vCard('Logro por tipo de actividad', 'Promedio del curso en cada criterio, sumando todos los RA. Muestra en qué tipo de actividad fallan más.', criteriaChart(m))}
    ${vCard('Evolución del curso', 'Promedio del curso en cada actividad con fecha, en orden cronológico.', evolutionChart(m))}
    ${vCard('Mapa de logro: estudiantes × RA', 'Porcentaje de logro de cada estudiante en cada RA. Más oscuro = más logro. Ordenado de mayor a menor nota. Haz clic en un nombre para calificarlo.', heatmap(m, res), true)}
  </div>`;
}

function histogram(m, res) {
  const pass = db.settings.pass, risk = db.settings.risk;
  const bins = Array.from({ length: 10 }, () => []);
  res.forEach(({ s, c }) => bins[Math.min(9, Math.max(0, Math.floor(c.total / 10)))].push(s.name));
  const W = 560, H = 230, pl = 30, pr = 8, pt = 18, pb = 30, ih = H - pt - pb;
  const bw = (W - pl - pr) / 10, max = Math.max(1, ...bins.map(b => b.length));
  const step = Math.max(1, Math.ceil(max / 4)), top = Math.ceil(max / step) * step;
  const y = v => pt + ih - (v / top) * ih;
  let g = '';
  for (let v = 0; v <= top; v += step) g += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" class="grid-l"/><text x="${pl - 6}" y="${y(v) + 4}" class="ax" text-anchor="end">${v}</text>`;
  bins.forEach((b, i) => {
    const lo = i * 10, hi = i === 9 ? 100 : lo + 9;
    const col = lo >= pass ? VIZ.ok : lo >= risk ? VIZ.risk : VIZ.bad;
    const x = pl + i * bw + 2, w = bw - 4, h = (b.length / top) * ih, yy = pt + ih - h;
    const names = b.slice(0, 8).join(', ') + (b.length > 8 ? ` y ${b.length - 8} más` : '');
    if (b.length) {
      const r = Math.min(4, w / 2, h);
      g += `<path d="M${x},${pt + ih} V${yy + r} Q${x},${yy} ${x + r},${yy} H${x + w - r} Q${x + w},${yy} ${x + w},${yy + r} V${pt + ih} Z" fill="${col}"/>`;
      g += `<text x="${x + w / 2}" y="${yy - 5}" class="val" text-anchor="middle">${b.length}</text>`;
    }
    g += `<rect x="${pl + i * bw}" y="${pt}" width="${bw}" height="${ih}" fill="transparent" ${tip(`${b.length} estudiantes con nota ${lo}–${hi}${b.length ? ': ' + names : ''}`)}/>`;
    g += `<text x="${pl + i * bw + bw / 2}" y="${H - 10}" class="ax" text-anchor="middle">${lo}–${hi}</text>`;
  });
  const px = pl + (pass / 10) * bw;
  g += `<line x1="${px}" x2="${px}" y1="${pt - 8}" y2="${pt + ih}" class="ref-l"/><text x="${px + 4}" y="${pt - 1}" class="ref-t">Aprueba ${pass}</text>`;
  return `${vLegend([[VIZ.ok, 'Aprobado'], [VIZ.risk, 'En riesgo'], [VIZ.bad, 'Reprobado']])}
    <svg viewBox="0 0 ${W} ${H}" class="viz-svg" role="img" aria-label="Histograma de notas finales">${g}</svg>`;
}

function raStatusChart(m, res) {
  if (!m.ras.length) return '<p class="muted small">Este módulo no tiene RA.</p>';
  const n = res.length;
  const rows = m.ras.map((ra, i) => {
    const cnt = { ok: 0, proc: 0, no: 0, pend: 0 };
    let sum = 0;
    res.forEach(({ c }) => { const st = c.ras[i].status === 'rec' ? 'ok' : c.ras[i].status; cnt[st]++; sum += c.ras[i].pct; });
    const avg = n ? sum / n : 0;
    return `<div class="ra-row">
      <div class="ra-lbl" title="${esc(ra.name)}"><b>RA ${i + 1}</b><span>${esc(ra.name)}</span></div>
      ${stackBar([
        { v: cnt.ok, c: RA_ST_COLOR.ok, label: 'logrado o recuperado' },
        { v: cnt.proc, c: RA_ST_COLOR.proc, label: 'en proceso', ink: '#0f172a' },
        { v: cnt.no, c: RA_ST_COLOR.no, label: 'no logrado' },
        { v: cnt.pend, c: RA_ST_COLOR.pend, label: 'sin evaluar', ink: isDark() ? '#e6e9ef' : '#334155' }], n)}
      <div class="ra-avg" ${tip(`Logro promedio del curso en el RA ${i + 1}: ${pct0(avg)}`)}>${pct0(avg)}</div>
    </div>`;
  }).join('');
  return `${vLegend([[VIZ.ok, 'Logrado o recuperado'], [VIZ.risk, 'En proceso'], [VIZ.bad, 'No logrado'], [RA_ST_COLOR.pend, 'Sin evaluar']])}<div class="ra-rows">${rows}</div>`;
}

/** Agrupa los criterios por nombre (Práctica, Examen…) en todos los RA. */
function criteriaAgg(m) {
  const agg = new Map();
  m.ras.forEach(ra => ra.cats.forEach(c => {
    const k = norm(c.label);
    if (!agg.has(k)) agg.set(k, { label: c.label, obt: 0, max: 0, n: 0 });
    const a = agg.get(k);
    m.students.forEach(s => {
      const arr = (s.g[ra.id] || {})[c.id] || [];
      for (let i = 0; i < c.count; i++) {
        if (isNum(arr[i])) { a.obt += arr[i]; a.max += c.max; a.n++; }
        else if (m.blankMode === 'zero') a.max += c.max;
      }
    });
  }));
  return [...agg.values()];
}
function criteriaChart(m) {
  const data = criteriaAgg(m).filter(d => d.max > 0);
  if (!data.length) return '<p class="muted small viz-empty">Aún no hay notas registradas.</p>';
  const min = m.raPass;
  const rows = data.map(d => {
    const p = d.obt / d.max;
    return `<div class="hb-row" ${tip(`${d.label}: ${pct0(p)} de logro · ${fmtN(d.obt)} de ${fmtN(d.max)} puntos · ${d.n} notas`)}>
      <span class="hb-lbl">${esc(d.label)}</span>
      <div class="hb-track"><div class="hb-fill" style="width:${(p * 100).toFixed(1)}%;background:${VIZ.series}"></div><div class="hb-ref" style="left:${min}%"></div></div>
      <span class="hb-val">${pct0(p)}</span></div>`;
  }).join('');
  return `<div class="hb-list">${rows}</div><p class="viz-note"><span class="ref-key"></span> Línea: logro mínimo del RA (${fmtN(min)}%)</p>`;
}

function evolutionChart(m) {
  const pts = new Map();   // fecha -> {sum, n, acts:[]}
  m.ras.forEach((ra, ri) => ra.cats.forEach(c => {
    for (let i = 0; i < c.count; i++) {
      const a = actOf(c, i); if (!a.d) continue;
      let sum = 0, n = 0;
      m.students.forEach(s => { const v = getGrade(s, ra.id, c.id, i); if (isNum(v)) { sum += v / c.max; n++; } });
      if (!n) continue;
      if (!pts.has(a.d)) pts.set(a.d, { sum: 0, n: 0, acts: [] });
      const p = pts.get(a.d); p.sum += sum; p.n += n; p.acts.push(`RA${ri + 1} ${itemLabel(c, i)}${a.n ? ' – ' + a.n : ''}`);
    }
  }));
  const data = [...pts.entries()].sort((a, b) => a[0].localeCompare(b[0])).map(([d, p]) => ({ d, v: p.sum / p.n, n: p.n, acts: p.acts }));
  if (data.length < 2) return `<p class="muted small viz-empty">Para ver la evolución, ponle fecha a las actividades (clic en el encabezado de la actividad en «Registro por RA», o el botón 📝 Actividades en Configuración) y registra sus notas. Se necesitan al menos 2 fechas con notas.</p>`;
  const W = 560, H = 220, pl = 36, pr = 14, pt = 14, pb = 30, iw = W - pl - pr, ih = H - pt - pb;
  const x = i => pl + (data.length === 1 ? iw / 2 : (i / (data.length - 1)) * iw);
  const y = v => pt + ih - v * ih;
  let g = '';
  [0, 0.25, 0.5, 0.75, 1].forEach(v => { g += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" class="grid-l"/><text x="${pl - 6}" y="${y(v) + 4}" class="ax" text-anchor="end">${v * 100}%</text>`; });
  const pass = m.raPass / 100;
  g += `<line x1="${pl}" x2="${W - pr}" y1="${y(pass)}" y2="${y(pass)}" class="ref-l"/>`;
  const refLabel = `<text x="${pl + 4}" y="${pass > 0.85 ? y(pass) + 14 : y(pass) - 6}" class="ref-t">Logro mínimo ${fmtN(m.raPass)}%</text>`;
  g += `<polyline points="${data.map((p, i) => `${x(i)},${y(p.v)}`).join(' ')}" fill="none" stroke="${VIZ.series}" stroke-width="2" stroke-linejoin="round"/>`;
  const every = Math.ceil(data.length / 8);
  data.forEach((p, i) => {
    g += `<circle cx="${x(i)}" cy="${y(p.v)}" r="4" fill="${VIZ.series}" stroke="#fff" stroke-width="2"/>`;
    g += `<rect x="${x(i) - 14}" y="${pt}" width="28" height="${ih}" fill="transparent" ${tip(`${fmtDate(p.d)}: ${pct0(p.v)} de logro promedio · ${p.acts.join(', ')} · ${p.n} notas`)}/>`;
    if (i % every === 0 || i === data.length - 1) g += `<text x="${x(i)}" y="${H - 10}" class="ax" text-anchor="middle">${fmtDate(p.d)}</text>`;
  });
  g += refLabel;   // la etiqueta de referencia va encima de la línea de datos
  return `<svg viewBox="0 0 ${W} ${H}" class="viz-svg" role="img" aria-label="Evolución del logro promedio del curso">${g}</svg>`;
}

function heatmap(m, res) {
  if (!m.ras.length) return '<p class="muted small">Este módulo no tiene RA.</p>';
  const rows = res.slice().sort((a, b) => b.c.total - a.c.total).map(({ s, c }) => {
    const stt = statusOf(c);
    const cells = c.ras.map((x, i) => {
      if (x.status === 'pend') return `<td class="hm-cell hm-pend" ${tip(`${s.name} · RA ${i + 1}: sin notas`)}>—</td>`;
      const st = RA_STATUS[x.status];

    }).join('');

/* ---------- Tooltip único para todos los gráficos ---------- */
(function initTooltip() {
  const t = document.createElement('div');
  t.id = 'vizTip'; t.setAttribute('role', 'tooltip');
  document.body.appendChild(t);
  let cur = null;
  const place = (x, y) => {
    const r = t.getBoundingClientRect();
    let left = x + 14, top = y + 14;
    if (left + r.width > window.innerWidth - 8) left = x - r.width - 14;
    if (top + r.height > window.innerHeight - 8) top = y - r.height - 14;
    t.style.left = Math.max(8, left) + 'px'; t.style.top = Math.max(8, top) + 'px';
  };
  const show = (el, x, y) => { cur = el; t.textContent = el.getAttribute('data-tip'); t.classList.add('on'); place(x, y); };
  const hide = () => { cur = null; t.classList.remove('on'); };
  document.addEventListener('pointermove', e => {
    const el = e.target.closest ? e.target.closest('[data-tip]') : null;
    if (!el) { if (cur) hide(); return; }
    if (el !== cur) show(el, e.clientX, e.clientY); else place(e.clientX, e.clientY);
  });
  document.addEventListener('focusin', e => {
    const el = e.target.closest && e.target.closest('[data-tip]');
    if (el) { const r = el.getBoundingClientRect(); show(el, r.left + r.width / 2, r.bottom); }
  });
  document.addEventListener('focusout', hide);
  window.addEventListener('scroll', hide, true);
})();

/* ---------- Diálogo de evento ---------- */
/** Lista de actividades de un módulo para vincular («RA 1 · Práctica 2»). */
function actSlots(m) {
  const out = [];
  m.ras.forEach((ra, ri) => ra.cats.forEach(c => {
    for (let i = 0; i < c.count; i++) {
      const a = actOf(c, i);
      out.push({ key: `${m.id}|${ra.id}|${c.id}|${i}`, label: `RA ${ri + 1} · ${c.count > 1 ? c.label + ' ' + (i + 1) : c.label}${a.n ? ' – ' + a.n : ''}${a.d ? ' (' + fmtDate(a.d) + ')' : ''}`, type: typeFromCat(c.label), taken: !!a.d });
    }
  }));
  return out;
}
function resolveAct(key) {
  const [mid, rid, cid, i] = String(key).split('|');
  const m = findMod(mid), ra = m && findRa(m, rid), c = ra && findCat(ra, cid);
  if (!c || +i >= c.count) return null;
  c.acts = normActs(c.acts, c.count);
  return { m, ra, c, i: +i, act: c.acts[+i] };
}
function eventDialog({ date, src, key, sid } = {}) {

  };

  }

  actions.push({
    label: editing ? 'Guardar' : 'Agendar', cls: 'btn-primary', onClick: ov => {

          if (!title) { toast('Escribe un título.', 'error'); ov.querySelector('#evTitle').focus(); return false; }
          const data = normAgenda({ id: ev ? ev.id : uid(), title, date: d, time: h, type: ov.querySelector('#evType').value, modId: ov.querySelector('#evMod').value, notes: ov.querySelector('#evNotes').value.trim(), done: isEv ? ov.querySelector('#evDone').checked : false });
          if (isEv) Object.assign(ev, data); else db.agenda.push(data);
        }
      }
      persist(); if (state.view === 'calendar') state.calYM = ymOf(d);
      render(); toast(editing ? 'Cambios guardados.' : `Agendado para el ${longDate(d)}.`, 'ok', 2600);
    }
  });
  openModal({
    title: isAct ? 'Actividad del registro' : isEv ? 'Editar evento' : 'Agendar', icon: '📅', wide: !isAct, body, actions,
    onOpen: ov => {
      if (isAct) return;
      const modSel = ov.querySelector('#evMod'), link = ov.querySelector('#evLink'), typeSel = ov.querySelector('#evType');
      const fill = () => {
        const m = findMod(modSel.value);
        ov.querySelector('#evLinkWrap').style.display = m && m.ras.length ? '' : 'none';
        if (!m) { link.innerHTML = '<option value="">No vincular</option>'; return; }
        const slots = actSlots(m), t = typeSel.value;
        const sorted = [...slots.filter(x => x.type === t && !x.taken), ...slots.filter(x => !(x.type === t && !x.taken))];
        link.innerHTML = `<option value="">No vincular (solo agenda)</option>` + sorted.map(x => `<option value="${esc(x.key)}">${esc(x.label)}${x.taken ? ' · ya tiene fecha' : ''}</option>`).join('');
      };
      const toggleNotes = () => { ov.querySelector('#evNotesWrap').style.display = link.value ? 'none' : ''; };
      modSel.addEventListener('change', () => { fill(); toggleNotes(); });
      typeSel.addEventListener('change', () => { const keep = link.value; fill(); if (keep) link.value = keep; toggleNotes(); });
      link.addEventListener('change', toggleNotes);
      fill(); toggleNotes();
    }
  });
}

/* ---------- Edición ---------- */
const ATT_CYCLE = ['', 'P', 'A', 'T', 'E'];
function setAttCell(sid, d, code, moveDown) {
  const m = curMod(), s = findStu(m, sid); if (!s) return;
  setAtt(s, state.attYM, d, code); persist();
  const btn = document.activeElement;
  const r = btn && btn.dataset ? +btn.dataset.r : null, c = btn && btn.dataset ? +btn.dataset.c : null;
  render();
  if (moveDown && r !== null) {
    const next = document.querySelector(`.att-grid .att-cell[data-r="${r + 1}"][data-c="${c}"]`);
    if (next) { next.focus(); next.scrollIntoView({ block: 'nearest', inline: 'nearest' }); }
  }
}
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('.att-cell[data-att]'); if (!b) return;
  const m = curMod(); if (!m) return;
  const [sid, d] = b.dataset.att.split('|'), s = findStu(m, sid); if (!s) return;
  const next = ATT_CYCLE[(ATT_CYCLE.indexOf(getAtt(s, state.attYM, +d)) + 1) % ATT_CYCLE.length];
  b.focus(); setAttCell(sid, +d, next, false);
});
document.addEventListener('keydown', e => {
  const t = e.target;
  if (!t.classList || !t.classList.contains('att-cell') || !t.dataset.att) return;
  const [sid, d] = t.dataset.att.split('|');
  const k = e.key.toUpperCase();
  const r = +t.dataset.r, c = +t.dataset.c;
  const at = (rr, cc) => document.querySelector(`.att-grid .att-cell[data-r="${rr}"][data-c="${cc}"]`);
  let target = null;
  if (ATT_CODES.includes(k) && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); return setAttCell(sid, +d, k, true); }
  if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); return setAttCell(sid, +d, '', false); }
  if (e.key === 'Enter' || e.key === 'ArrowDown') target = at(r + 1, c);
  else if (e.key === 'ArrowUp') target = at(r - 1, c);
  else if (e.key === 'ArrowRight') target = at(r, c + 1);
  else if (e.key === 'ArrowLeft') target = at(r, c - 1);
  else return;
  e.preventDefault();
  if (target) { target.focus(); target.scrollIntoView({ block: 'nearest', inline: 'nearest' }); }
});

function attDayMenu(d) {
  const m = curMod(), ym = state.attYM, iso = `${ym}-${pad2(d)}`;
  const marked = m.students.filter(s => getAtt(s, ym, d)).length;

    title: cap(longDate(iso)), icon: '🗓️', sub: `${marked} de ${m.students.length} estudiantes marcados`,
    body: `<div class="menu-list">

  });
  md.el.querySelectorAll('[data-m]').forEach(b => b.onclick = () => {
    const mode = b.dataset.m; md.close();

      const run = () => { snapshot('Antes de quitar un día de clase'); removeClassDay(m, ym, d); persist(); render(); toast('Día de clase quitado.', 'ok'); };

/** Limpiar asistencia: marcas del mes, días sin marcas, días del mes, un estudiante o todo el año. */
function attClearDialog() {
  const m = curMod(), ym = state.attYM, days = classDays(m, ym), lbl = ymLabel(ym);
  const markedDays = days.filter(d => m.students.some(s => getAtt(s, ym, d)));
  const emptyDays = days.length - markedDays.length;
  const yearMarks = m.students.reduce((a, s) => a + Object.values(s.att || {}).reduce((b, v) => b + (String(v).match(/[PATE]/g) || []).length, 0), 0);
  const yearDays = Object.values(m.classDays || {}).reduce((a, l) => a + l.length, 0);
  const md = openModal({
    title: 'Limpiar asistencia', icon: '🧹', wide: true, sub: `${esc(cap(lbl))} · ${days.length} días de clase · ${markedDays.length} con marcas`,
    body: `<div class="menu-list">
      <button class="btn btn-secondary" data-c="marks" ${markedDays.length ? '' : 'disabled'}>Vaciar las marcas de ${esc(lbl)} <small class="muted">(se quedan los días)</small></button>
      <button class="btn btn-secondary" data-c="empty" ${emptyDays ? '' : 'disabled'}>Quitar los ${emptyDays} días de ${esc(lbl)} que no tienen marcas</button>
      <button class="btn btn-secondary" data-c="month" ${days.length ? '' : 'disabled'}>Quitar todos los días de clase de ${esc(lbl)} (y sus marcas)</button>
      <div class="field" style="margin:.3rem 0"><span>Vaciar las marcas de un estudiante en ${esc(lbl)}</span>
        <div class="row" style="gap:.4rem"><select id="acStu" style="flex:1"><option value="">— Elegir estudiante —</option>${allStudents(m).map(s => `<option value="${s.id}">${s.num}. ${esc(s.name)}</option>`).join('')}</select><button class="btn btn-secondary" data-c="stu">Vaciar</button></div></div>
      <button class="btn btn-danger" data-c="all" ${yearMarks || yearDays ? '' : 'disabled'}>Borrar toda la asistencia del año de este módulo (${yearDays} días · ${yearMarks} marcas)</button>
    </div><p class="small muted" style="margin-top:.6rem">Antes de cada limpieza se guarda una copia de seguridad (Respaldo › Copias automáticas).</p>`,
  });
  md.el.querySelectorAll('[data-c]').forEach(b => b.onclick = () => {
    const c = b.dataset.c;
    const done = msg => { persist(); render(); toast(msg, 'ok', 2800); };
    if (c === 'stu') {
      const s = findStu(m, md.el.querySelector('#acStu').value); if (!s) return toast('Elige un estudiante.', 'error');
      md.close(); snapshot('Antes de vaciar la asistencia de un estudiante'); days.forEach(d => setAtt(s, ym, d, '')); return done(`Asistencia de ${s.name} vaciada en ${lbl}.`);
    }
    md.close();
    if (c === 'marks') { snapshot('Antes de vaciar la asistencia del mes'); m.students.forEach(s => days.forEach(d => setAtt(s, ym, d, ''))); return done(`Marcas de ${lbl} vaciadas.`); }
    if (c === 'empty') { snapshot('Antes de quitar días sin marcas'); days.filter(d => !markedDays.includes(d)).forEach(d => removeClassDay(m, ym, d)); return done(`${emptyDays} días sin marcas quitados.`); }
    if (c === 'month') confirmBox('Quitar los días del mes', `Se quitarán los ${days.length} días de clase de ${lbl}${markedDays.length ? ` y las marcas de ${markedDays.length} días` : ''}.`, 'Quitar', () => {
      snapshot('Antes de quitar los días del mes'); m.students.forEach(s => days.forEach(d => setAtt(s, ym, d, ''))); delete m.classDays[ym]; done(`Días de ${lbl} quitados.`);
    });
    if (c === 'all') confirmBox('Borrar toda la asistencia', `Se borrarán los ${yearDays} días de clase y las ${yearMarks} marcas de asistencia de este módulo. Las notas no cambian.`, 'Borrar todo', () => {
      snapshot('Antes de borrar toda la asistencia'); m.students.forEach(s => { s.att = {}; }); m.classDays = {}; done('Asistencia del módulo borrada.');
    });
  });
}

function attToday(force) {

  const wd = new Date().getDay();

    return confirmBox('Hoy es fin de semana', `Hoy es ${longDate(t)}. ¿Quieres agregarlo como día de clase de todos modos?`, 'Sí, agregar', () => attToday(true), { danger: false });

}

function printAttRanking(m, scope) {
  const months = scope === 'year' ? schoolMonths() : [scope];
  const list = allStudents(m).map(s => ({ s, r: attStats(m, s, months) })).filter(x => x.r.A + x.r.E > 0)
    .sort((a, b) => (b.r.A + b.r.E) - (a.r.A + a.r.E) || b.r.A - a.r.A || a.s.num - b.s.num);
  const label = scope === 'year' ? 'en el año escolar' : 'en ' + ymLabel(scope);
  if (!list.length) return toast(`Nadie tiene ausencias ni excusas ${label}.`, 'ok');
  const alertN = db.settings.attAlert || 3;
  const rows = list.map(({ s, r }, i) => `<tr><td>${i + 1}</td><td>${s.num}</td><td class="l">${esc(s.name)}</td><td class="${r.A >= alertN ? 'low' : ''}">${r.A}</td><td>${r.E}</td><td class="tot">${r.A + r.E}</td><td>${r.T}</td><td>${r.attended}/${r.marked}</td><td class="tot">${r.pct === null ? '—' : Math.round(r.pct * 100) + '%'}</td></tr>`).join('');
  printHTML(`<section class="rp-page">${reportHead(m, `Estudiantes con más ausencias y excusas ${label}`)}
    <table class="rp-table"><thead><tr><th>#</th><th>No.</th><th class="l">Estudiante</th><th>Ausencias</th><th>Excusas</th><th>Total faltas</th><th>Tardanzas</th><th>Asistió</th><th>%</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="rp-foot"><div>Ordenado por total de faltas (ausencias + excusas). En rojo: ${alertN} o más ausencias.</div></div>
    <div class="rp-box"><b>Acciones a tomar:</b></div>${signLine()}</section>`, 'portrait');
}
function exportAttCSV(m) {
  const months = schoolMonths().filter(ym => classDays(m, ym).length);
  if (!months.length) return toast('Todavía no hay días de clase registrados.', 'error');
  const head = ['No.', 'Estudiante'];
  months.forEach(ym => classDays(m, ym).forEach(d => head.push(`${ym}-${pad2(d)}`)));
  head.push('P', 'A', 'T', 'E', 'Asistió', 'Días marcados', '%');
  const lines = [head];
  allStudents(m).forEach(s => {
    const row = [s.num, s.name];
    months.forEach(ym => classDays(m, ym).forEach(d => row.push(getAtt(s, ym, d))));
    const r = attStats(m, s, months);
    row.push(r.P, r.A, r.T, r.E, r.attended, r.marked, r.pct === null ? '' : Math.round(r.pct * 100));
    lines.push(row);
  });
  downloadFile(`${safeName(modShort(m))}${m.course ? '_' + safeName(m.course) : ''}_asistencia_${fileDate()}.csv`, '﻿' + lines.map(r => r.map(csvCell).join(',')).join('\r\n'), 'text/csv;charset=utf-8');
  toast('Asistencia exportada. Ábrela con Excel.', 'ok');
}

/* =========================================================

function anecFiltered(m) {
  const f = state.anec, q = norm(f.q);
  return m.anec.filter(e => {
    if (f.sid && e.sid !== f.sid) return false;
    if (f.kind && e.kind !== f.kind) return false;
    if (f.cat && e.cat !== f.cat) return false;
    if (q) {
      const s = findStu(m, e.sid);
      if (!norm([s ? s.name : '', e.cat, e.desc, e.action, e.follow].join(' ')).includes(q)) return false;
    }
    return true;
  }).sort(anecSort);
}
function renderAnecdotario(m) {

  const all = m.anec, list = anecFiltered(m);
  const per = anecByStudent(m);
  const attention = per.filter(r => r.neg > 0).sort((a, b) => anecScore(b) - anecScore(a) || b.neg - a.neg || b.last.localeCompare(a.last));
  const neg = all.filter(e => e.kind === 'neg').length, pos = all.filter(e => e.kind === 'pos').length, graves = all.filter(e => e.sev === 'grave').length;
  const cats = [...new Set(all.map(e => e.cat))].sort();

      <div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:.5rem;margin-bottom:.6rem"><h3 style="font-size:1rem">Estudiantes que requieren atención</h3><span class="muted small">Ordenados por gravedad: grave = 3 · moderada = 2 · leve = 1</span></div>
      <div class="an-rank">${attention.slice(0, 8).map(r => {

        </button>`;

  const cards = list.map(e => {

      </div>
      <div class="an-body">
        <p><b>Hecho observado:</b> ${esc(e.desc).replace(/\n/g, '<br>')}</p>

        ${e.follow ? `<p><b>Seguimiento / compromiso:</b> ${esc(e.follow).replace(/\n/g, '<br>')}</p>` : ''}

  </div>`;
}

      </div>
      <label class="field">Hecho observado<textarea id="anDesc" rows="3" placeholder="Ej.: Durante la práctica de redes estuvo usando el celular y no realizó la actividad, aun después de dos llamados de atención.">${esc(v.desc)}</textarea></label>
      <div class="form-grid">
        <label class="field">Acción tomada<select id="anAct">${ANEC_ACTIONS.map(a => `<option ${v.action === a ? 'selected' : ''}>${esc(a)}</option>`).join('')}</select></label>
        <label class="check" style="align-self:end;padding-bottom:.5rem"><input type="checkbox" id="anPar" ${v.parents ? 'checked' : ''}> Se informó a los padres o tutores</label>
      </div>

    actions: [{ label: 'Cancelar' }, {
      label: e ? 'Guardar' : 'Guardar anotación', cls: 'btn-primary', onClick: ov => {

        if (!ids.length) { toast('Elige al menos un estudiante.', 'error'); return false; }

        };
        if (e) Object.assign(e, normAnec({ ...e, ...base, sid: ids[0] }));

        catSel.innerHTML = ANEC_CATS[k].map(c => `<option>${esc(c)}</option>`).join('');
        if (keep && ANEC_CATS[k].includes(keep)) catSel.value = keep;
        sevWrap.style.visibility = k === 'neg' ? 'visible' : 'hidden';

      fillCats(v.cat);
      if (e) { ov.querySelector('#anAct').value = v.action || 'Ninguna'; return; }

      q.addEventListener('input', () => {

      });
      ov.querySelector('#anPicks').addEventListener('change', upd); upd();
      if (v.sid) setTimeout(() => ov.querySelector('#anDesc').focus(), 80);
    }
  });
  return md;
}

/* =========================================================
   Recuperación de RA
   ========================================================= */
/** Filas estudiante × RA que necesitan (o ya tuvieron) recuperación. */
function recRows(m, mode) {
  const rows = [];
  allStudents(m).forEach(s => {
    const c = calcStudent(m, s);
    m.ras.forEach((ra, i) => {
      const x = c.ras[i];
      const ex = !!(s.rec && s.rec[ra.id] && s.rec[ra.id].ex);
      if (mode === 'excl') { if (ex) rows.push({ s, ra, ri: i, x, c, ex }); return; }
      if (ex) return;
      const show = mode === 'all' ? (x.status === 'no' || x.status === 'rec' || x.status === 'proc' || x.rec)
        : mode === 'done' ? !!x.rec
          : (x.status === 'no' || x.status === 'rec' || !!x.rec);
      if (show) rows.push({ s, ra, ri: i, x, c });
    });
  });
  return rows;
}
function renderRecuperacion(m) {
  if (!m.students.length || !m.ras.length) return `<div class="empty"><div class="big">↺</div><p><strong>${!m.ras.length ? 'Este módulo no tiene RA.' : 'No hay estudiantes.'}</strong></p></div>`;
  const mode = state.recMode || 'pend';
  const q = norm(state.search).replace(/^#/, '');
  let rows = recRows(m, mode);
  if (q) rows = rows.filter(r => norm(r.s.name).includes(q) || String(r.s.num) === q);
  if (state.recRa) rows = rows.filter(r => r.ra.id === state.recRa);
  const allRows = recRows(m, 'pend');
  const pending = allRows.filter(r => r.x.status === 'no' && !r.x.rec).length;
  const recovered = allRows.filter(r => r.x.status === 'rec').length;
  const failed = allRows.filter(r => r.x.status === 'no' && r.x.rec).length;
  const proc = recRows(m, 'all').filter(r => r.x.status === 'proc' && !r.x.rec).length;
  const excl = recRows(m, 'excl').length;

  const body = rows.map((r, k) => {
    const rec = r.x.rec || (r.s.rec && r.s.rec[r.ra.id]) || {};
    const st = RA_STATUS[r.x.status];
    const why = r.x.status === 'rec' ? '' : raReasons(r.x).filter(t => !t.startsWith('Recuperación')).join(' · ');
    const key = `${r.s.id}|${r.ra.id}`;
    return `<tr>
      <td class="num-col tabnum">${r.s.num}</td>
      <td><div class="name-cell"><b>${esc(r.s.name)}</b>${copyBtn(r.s.name)}</div></td>
      <td title="${esc(r.ra.name)}"><b>RA ${r.ri + 1}</b> <span class="muted small rec-ra">${esc(r.ra.name)}</span></td>
      <td class="c tabnum">${Math.round(r.x.origPct * 100)}%</td>
      <td class="small rec-why">${esc(why)}</td>
      <td><input type="text" class="rec-in" data-rec="${key}|act" data-key="rec|${key}|act" value="${esc(rec.act || '')}" placeholder="Ej.: Práctica de recuperación" maxlength="200"></td>
      <td><input type="date" class="rec-in rec-date" data-rec="${key}|date" data-key="rec|${key}|date" value="${esc(rec.date || '')}"></td>
      <td class="c"><input class="cell" data-rec="${key}|score" data-key="rec|${key}|score" data-r="${k}" data-c="0" value="${fmtN(rec.score)}" inputmode="decimal" autocomplete="off" title="Nota de la recuperación (0 a 100)"></td>
      <td class="c"><span class="badge ${st.cls}">${st.icon} ${st.label}</span></td>
      <td class="c tabnum"><b>${fmt(r.x.pts, 2)}</b><span class="muted small">/${fmtN(r.ra.w)}</span></td>
      <td class="c">${r.ex ? `<button class="btn btn-sm btn-secondary" data-act="rec-back" data-sid="${r.s.id}" data-ra="${r.ra.id}" title="Volver a ponerlo en la lista de recuperación">↩ Devolver</button>` : `<button class="btn btn-ghost btn-icon" style="color:var(--bad)" data-act="rec-remove" data-sid="${r.s.id}" data-ra="${r.ra.id}" title="Quitar de la lista de recuperación">${ICON.trash}</button>`}</td>
    </tr>`;
  }).join('');

  return `${weightAlert(m)}
  <div class="stats">
    <div class="stat bad"><span>Pendientes de recuperar</span><b>${pending}</b></div>
    <div class="stat ok"><span>RA recuperados</span><b>${recovered}</b></div>
    <div class="stat risk"><span>Recuperación no aprobada</span><b>${failed}</b></div>
    <div class="stat"><span>RA aún en proceso</span><b>${proc}</b></div>
  </div>
  <div class="alert alert-info"><div>Escribe la nota de la recuperación sobre <b>100</b>. Si llega al logro mínimo del RA (${fmtN(m.raPass)} por defecto), el RA queda <b>Recuperado</b> y cuenta como logrado.
    ${m.recCap === 'none' ? 'El RA toma la nota de la recuperación (sin tope).' : `El logro del RA recuperado se toma <b>hasta el mínimo</b> (${fmtN(m.raPass)}%), para no superar a quien lo logró a tiempo.`}</div>
    <button class="btn btn-sm btn-secondary" data-act="tab" data-id="config">Cambiar la regla</button></div>
  <div class="card">
    <div class="toolbar">
      ${searchBox('Filtrar estudiante…')}
      <select id="recMode" style="width:auto">
        <option value="pend" ${mode === 'pend' ? 'selected' : ''}>RA no logrados y recuperaciones</option>
        <option value="all" ${mode === 'all' ? 'selected' : ''}>Incluir RA en proceso</option>
        <option value="done" ${mode === 'done' ? 'selected' : ''}>Solo con recuperación registrada</option>
        <option value="excl" ${mode === 'excl' ? 'selected' : ''}>Quitados de la lista (${excl})</option>
      </select>
      <select id="recRa" style="width:auto;max-width:200px"><option value="">Todos los RA</option>${m.ras.map((ra, i) => `<option value="${ra.id}" ${state.recRa === ra.id ? 'selected' : ''}>RA ${i + 1}</option>`).join('')}</select>
      <span class="spacer"></span>
      ${rows.length ? (mode === 'excl' ? `<button class="btn btn-secondary" data-act="rec-back-all">↩ Devolver todos (${rows.length})</button>` : `<button class="btn btn-danger" data-act="rec-remove-all" title="Quita de la lista a todos los que se ven ahora (respeta el filtro de RA y la búsqueda)">${ICON.trash} Quitar todos (${rows.length})</button>`) : ''}
      <button class="btn btn-secondary" data-act="rec-bulk" title="Asigna la misma actividad y fecha a todos los pendientes de un RA">Misma actividad para todos</button>
      <button class="btn btn-secondary" data-act="print-rec-list">${ICON.print} Lista para recuperar</button>
      <button class="btn btn-secondary" data-act="print-rec-res">${ICON.print} Resultados</button>

/* ---------- Edición ---------- */
function onRecChange(t) {
  const m = curMod(); if (!m) return;
  const [sid, raId, field] = t.dataset.rec.split('|');
  const s = findStu(m, sid); if (!s || !findRa(m, raId)) return;
  if (field === 'score') {
    const v = parseNum(t.value);
    if (v === null || (isNum(v) && (v < 0 || v > 100))) {
      t.value = fmtN(s.rec[raId] && s.rec[raId].score);
      return toast('La nota de recuperación va de 0 a 100.', 'error');
    }
    setRec(s, raId, { score: v === '' ? '' : r2(v), date: (s.rec[raId] && s.rec[raId].date) || (v === '' ? '' : todayISO()) });
  } else if (field === 'date') setRec(s, raId, { date: isoDate(t.value) });
  else if (field === 'act') setRec(s, raId, { act: t.value.trim().slice(0, 200) });
  persist(); queueRender();
}

/* =========================================================
   Herramientas de clase: participación al azar y grupos equilibrados

function toolState(m) {
  if (!state.tool || state.tool.modId !== m.id) state.tool = { modId: m.id, raId: '', catId: '', pick: '', used: [], onlyPresent: true, showList: false, savedOpen: false, preview: null, swap: '', opts: { type: 'Exposición', mode: 'count', n: 5, balance: 'perf', present: true, conduct: true, norepeat: true } };
  const t = state.tool;
  if (!findRa(m, t.raId)) t.raId = (findRa(m, state.raId) || m.ras[0] || {}).id || '';
  const ra = findRa(m, t.raId);
  if (ra && !findCat(ra, t.catId)) t.catId = (ra.cats.find(c => norm(c.label).includes('particip')) || ra.cats[0] || {}).id || '';
  return t;
}
/** Ausente o con excusa hoy (según la asistencia del día, si ya se pasó). */
function absentToday(m, s) {
  const t = todayISO(), ym = ymOf(t), d = +t.slice(8, 10);
  const c = classDays(m, ym).includes(d) ? getAtt(s, ym, d) : '';
  return c === 'A' || c === 'E';
}
/** Rendimiento de 0 a 1: promedio del logro de los RA que ya tienen notas. */
function perfOf(m, s) {
  const c = calcStudent(m, s);
  const xs = c.ras.filter(x => x.filled > 0 || x.rec);
  return xs.length ? xs.reduce((a, x) => a + x.pct, 0) / xs.length : null;
}

function renderHerramientas(m) {
  if (!m.students.length) return `<div class="empty"><div class="big">👥</div><p><strong>No hay estudiantes.</strong></p><p style="margin-top:1rem"><button class="btn btn-primary" data-act="import-stu">${ICON.upload} Importar lista</button></p></div>`;
  const t = toolState(m);
  const busy = t.pick || t.used.length || t.preview || t.showList || t.savedOpen;
  return `<div class="tools-bar">
      <p class="muted small">Las notas que anotes aquí ya quedan guardadas en el registro. «Limpiar» solo despeja la pantalla.</p>
      <button class="btn btn-sm btn-secondary" data-act="tools-clear" ${busy ? '' : 'disabled'}>🧹 Limpiar todo</button>
    </div>
    <div class="tools-grid${t.preview ? ' has-groups' : ''}">${renderPartTool(m, t)}${renderGroupTool(m, t)}</div>${renderSavedGroups(m, t)}`;
}
/** Limpia la pantalla de herramientas (no borra notas ni grupos guardados). */
function toolsClear(what) {
  const t = toolState(curMod());
  if (what !== 'grp') { t.pick = ''; t.used = []; t.showList = false; }
  if (what !== 'part') { t.preview = null; t.swap = ''; }

  render();
  toast(what === 'part' ? 'Participación limpia: empieza una ronda nueva.' : what === 'grp' ? 'Grupos descartados.' : 'Pantalla limpia.', 'ok', 1800);
}

function partPick() {
  const m = curMod(), t = toolState(m);
  let pool = allStudents(m).filter(s => !t.onlyPresent || !absentToday(m, s));
  if (!pool.length) return toast('No hay estudiantes presentes.', 'error');
  let free = pool.filter(s => !t.used.includes(s.id) && s.id !== t.pick);
  if (!free.length) { t.used = []; free = pool.filter(s => s.id !== t.pick); if (!free.length) free = pool; toast('Ya pasaron todos: empieza una ronda nueva.', 'info'); }
  const s = free[Math.floor(Math.random() * free.length)];
  t.pick = s.id; if (!t.used.includes(s.id)) t.used.push(s.id);
  render();
}
function partScore(v) {
  const m = curMod(), t = toolState(m), s = findStu(m, t.pick), ra = findRa(m, t.raId), cat = ra && findCat(ra, t.catId);
  if (!s || !cat) return;
  const a = ((s.g[ra.id] || {})[cat.id]) || [];
  let i = 0; while (i < cat.count && isNum(a[i])) i++;
  if (i >= cat.count) return toast(`${s.name} ya tiene las ${cat.count} actividades de «${cat.label}» en este RA.`, 'warn', 3500);
  setGrade(s, ra.id, cat.id, i, Math.min(cat.max, Math.max(0, +v)));
  persist();
  toast(`Anotado: ${fmtN(+v)} en ${cat.count > 1 ? cat.label + ' ' + (i + 1) : cat.label} · RA ${m.ras.indexOf(ra) + 1} · ${s.name}`, 'ok', 2600);
  partPick();
}

/* ---------- Formar grupos ---------- */
function renderGroupTool(m, t) {
  const o = t.opts, pv = t.preview;
  const n = allStudents(m).filter(s => !o.present || !absentToday(m, s)).length;
  const cards = pv ? pv.groups.map((g, gi) => {
    const ps = g.members.map(id => perfOf(m, findStu(m, id))).filter(x => x !== null);
    const avg = ps.length ? ps.reduce((a, b) => a + b, 0) / ps.length : null;
    return `<div class="grp-card"><div class="grp-head"><b>${esc(g.name)}</b><span class="muted small">${g.members.length} est.${avg !== null ? ` · prom. ${Math.round(avg * 100)}%` : ''}</span></div>
      <ul>${g.members.map(id => { const s = findStu(m, id); if (!s) return ''; const p = perfOf(m, s); const flag = m.anec.some(e => e.sid === id && e.kind === 'neg');
        return `<li><button class="grp-mem${t.swap === id ? ' sel' : ''}" data-act="grp-swap" data-sid="${id}" title="Toca a dos estudiantes para intercambiarlos"><span class="perf-dot" style="background:${p === null ? 'var(--border-2)' : p >= 0.7 ? 'var(--ok)' : p >= 0.6 ? 'var(--risk)' : 'var(--bad)'}"></span>${s.num}. ${esc(s.name)}${flag ? ' <span title="Tiene anotaciones de conducta">⚠</span>' : ''}</button></li>`; }).join('')}</ul></div>`;
  }).join('') : '';
  const spread = pv ? groupSpread(m, pv.groups) : null;
  return `<section class="card card-pad tool-card">
    <h3 class="tool-h">👥 Formar grupos</h3>
    <div class="form-grid">
      <label class="field">Para<select id="gpType">${['Exposición', 'Práctica', 'Proyecto', 'Otro'].map(x => `<option ${o.type === x ? 'selected' : ''}>${x}</option>`).join('')}</select></label>
      <label class="field">Cómo dividir<select id="gpMode"><option value="count" ${o.mode === 'count' ? 'selected' : ''}>Cantidad de grupos</option><option value="size" ${o.mode === 'size' ? 'selected' : ''}>Estudiantes por grupo</option></select></label>
      <label class="field">${o.mode === 'count' ? 'Grupos' : 'Por grupo'}<input type="text" id="gpN" inputmode="numeric" value="${o.n}"></label>
      <label class="field">Distribución<select id="gpBal"><option value="perf" ${o.balance === 'perf' ? 'selected' : ''}>Equilibrados por rendimiento</option><option value="random" ${o.balance === 'random' ? 'selected' : ''}>Al azar</option></select></label>
    </div>
    <div class="gp-checks">
      <label class="check"><input type="checkbox" id="gpPresent" ${o.present ? 'checked' : ''}> Solo presentes hoy</label>
      <label class="check"><input type="checkbox" id="gpConduct" ${o.conduct ? 'checked' : ''}> Separar a quienes tienen anotaciones de conducta</label>
      <label class="check"><input type="checkbox" id="gpNorep" ${o.norepeat ? 'checked' : ''}> Evitar repetir compañeros de grupos guardados</label>
    </div>
    <div class="row-wrap tool-actions">
      <button class="btn btn-primary" data-act="grp-make">${pv ? '🔀 Mezclar otra vez' : '👥 Formar grupos'}</button>
      <span class="muted small">${n} estudiantes</span>
    </div>
    ${pv ? `<div class="row-wrap tool-actions grp-actions"><button class="btn btn-sm btn-secondary" data-act="grp-copy" data-id="">${ICON.copy} Copiar</button><button class="btn btn-sm btn-secondary" data-act="grp-print" data-id="">${ICON.print.replace('class="i"', 'class="i i-sm"')} Imprimir</button><button class="btn btn-sm btn-ok" data-act="grp-save">Guardar grupos</button><span class="spacer"></span><button class="btn btn-sm btn-ghost" data-act="grp-clear">🧹 Limpiar</button></div>` : ''}
    ${pv ? `<p class="small muted" style="margin-bottom:.5rem">${o.balance === 'perf' ? `Promedios de los grupos entre <b>${spread.min}%</b> y <b>${spread.max}%</b>. ` : ''}${spread.repeats ? `${spread.repeats} parejas ya trabajaron juntas antes. ` : ''}Toca a dos estudiantes para intercambiarlos.</p><div class="grp-grid">${cards}</div>` : ''}
  </section>`;
}
function groupSpread(m, groups) {
  const avgs = groups.map(g => { const ps = g.members.map(id => perfOf(m, findStu(m, id))).filter(x => x !== null); return ps.length ? ps.reduce((a, b) => a + b, 0) / ps.length : null; }).filter(x => x !== null);
  const pairs = pastPairs(m);
  let repeats = 0;
  groups.forEach(g => { for (let i = 0; i < g.members.length; i++) for (let j = i + 1; j < g.members.length; j++) if (pairs.has(pairKey(g.members[i], g.members[j]))) repeats++; });
  return { min: avgs.length ? Math.round(Math.min(...avgs) * 100) : 0, max: avgs.length ? Math.round(Math.max(...avgs) * 100) : 0, repeats };
}
const pairKey = (a, b) => a < b ? a + '|' + b : b + '|' + a;
function pastPairs(m) {
  const set = new Set();
  m.groups.forEach(gs => gs.groups.forEach(g => { for (let i = 0; i < g.members.length; i++) for (let j = i + 1; j < g.members.length; j++) set.add(pairKey(g.members[i], g.members[j])); }));
  return set;
}
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
/**
 * Grupos equilibrados: se ordena por rendimiento, se forman «niveles» del tamaño de la cantidad
 * de grupos y cada grupo recibe uno de cada nivel (en zigzag). Se prueban muchas combinaciones
 * al azar dentro de cada nivel y se elige la que menos repite compañeros y mejor separa la conducta.
 */
function makeGroups(m, o) {
  const studs = allStudents(m).filter(s => !o.present || !absentToday(m, s));
  const N = studs.length;
  if (N < 2) return null;
  let G = o.mode === 'count' ? o.n : Math.max(1, Math.floor(N / o.n));
  G = Math.max(1, Math.min(G, N));
  const perf = new Map(studs.map(s => [s.id, perfOf(m, s)]));
  const flagged = new Set(o.conduct ? m.anec.filter(e => e.kind === 'neg').map(e => e.sid) : []);
  const pairs = o.norepeat ? pastPairs(m) : new Set();
  const known = studs.filter(s => perf.get(s.id) !== null).sort((a, b) => perf.get(b.id) - perf.get(a.id));
  const unknown = studs.filter(s => perf.get(s.id) === null);
  const ordered = o.balance === 'perf' ? [...known, ...unknown] : studs.slice();
  let best = null, bestScore = Infinity;
  const tierOf = new Map(ordered.map((st, i) => [st.id, o.balance === 'perf' ? Math.floor(i / G) : 0]));
  const scoreOf = groups => {
    let score = 0;
    groups.forEach(g => {
      const f = g.filter(id => flagged.has(id)).length; if (f > 1) score += (f - 1) * 6;
      for (let i = 0; i < g.length; i++) for (let j = i + 1; j < g.length; j++) if (pairs.has(pairKey(g[i], g[j]))) score += 3;
    });
    if (o.balance === 'perf') {
      const avgs = groups.map(g => { const ps = g.map(id => perf.get(id)).filter(x => x !== null); return ps.length ? ps.reduce((a, b) => a + b, 0) / ps.length : 0.5; });
      score += (Math.max(...avgs) - Math.min(...avgs)) * 20;
    }
    return score;
  };
  for (let k = 0; k < 300; k++) {
    const groups = Array.from({ length: G }, () => []);
    if (o.balance === 'perf') {
      for (let i = 0; i < ordered.length; i += G) {
        const tier = shuffle(ordered.slice(i, i + G));
        const order = Math.floor(i / G) % 2 ? [...Array(G).keys()].reverse() : [...Array(G).keys()];
        // los grupos más pequeños reciben primero en el último nivel incompleto
        const slots = tier.length < G ? shuffle(order.slice()).slice(0, tier.length) : order;
        tier.forEach((s, j) => groups[slots[j]].push(s.id));
      }
    } else {
      shuffle(ordered.slice()).forEach((s, i) => groups[i % G].push(s.id));
    }
    const score = scoreOf(groups);
    if (score < bestScore) { bestScore = score; best = groups; if (score === 0) break; }
  }
  // Mejora local: intercambia estudiantes del mismo nivel entre grupos si eso reduce repeticiones o conflictos
  for (let pass = 0; pass < 25 && bestScore > 0; pass++) {
    let improved = false;
    for (let gi = 0; gi < best.length; gi++) for (let gj = gi + 1; gj < best.length; gj++) {
      for (let a = 0; a < best[gi].length; a++) for (let b = 0; b < best[gj].length; b++) {
        const x = best[gi][a], y = best[gj][b];
        if (tierOf.get(x) !== tierOf.get(y)) continue;
        best[gi][a] = y; best[gj][b] = x;
        const sc = scoreOf(best);
        if (sc < bestScore - 1e-9) { bestScore = sc; improved = true; }
        else { best[gi][a] = x; best[gj][b] = y; }
      }
    }
    if (!improved) break;
  }
  return { groups: best.map((members, i) => ({ name: `Grupo ${i + 1}`, members })) };
}

/* =========================================================
   Alertas tempranas
   1) Faltas seguidas (ausencias consecutivas hasta el último día con lista)
   2) No entregó las dos últimas actividades calificadas
   3) Bajó su rendimiento: las últimas 3 actividades frente a su promedio anterior
   ========================================================= */
/** Actividades «recogidas» (con al menos una nota), en orden cronológico. */
function collectedActs(m) {
  const list = [];
  m.ras.forEach((ra, ri) => ra.cats.forEach((c, ci) => {
    for (let i = 0; i < c.count; i++) {
      let graded = 0;
      m.students.forEach(s => { if (isNum(getGrade(s, ra.id, c.id, i))) graded++; });
      if (!graded) continue;
      const a = actOf(c, i);
      list.push({ ra, c, i, ri, d: a.d || '', order: ri * 10000 + ci * 100 + i, graded, label: `RA ${ri + 1} · ${c.count > 1 ? c.label + ' ' + (i + 1) : c.label}${a.n ? ' (' + a.n + ')' : ''}` });
    }
  }));
  // Con fecha: por fecha; sin fecha: en el orden del registro, después de las fechadas
  return list.sort((a, b) => (a.d && b.d) ? a.d.localeCompare(b.d) || a.order - b.order : a.d ? -1 : b.d ? 1 : a.order - b.order);
}
/** Días de clase pasados en los que ya se pasó lista (alguien tiene marca), en orden. */
function takenDays(m) {
  const t = todayISO(), out = [];
  schoolMonths().forEach(ym => classDays(m, ym).forEach(d => {
    const iso = `${ym}-${pad2(d)}`;
    if (iso <= t && m.students.some(s => getAtt(s, ym, d))) out.push({ ym, d, iso });
  }));
  return out;
}
function computeAlerts(m) {
  const S = db.settings, consecN = S.consecAlert || 3, dropN = S.dropAlert || 15;
  const out = { absent: [], missing: [], drop: [] };
  // 1) Faltas seguidas
  const days = takenDays(m);
  m.students.forEach(s => {
    let streak = 0, last = '';
    for (let k = days.length - 1; k >= 0; k--) {
      const c = getAtt(s, days[k].ym, days[k].d);
      if (c === 'A') { streak++; if (!last) last = days[k].iso; }
      else if (c === '') continue;            // ese día no se marcó a este estudiante
      else break;
    }
    if (streak >= consecN) out.absent.push({ s, n: streak, last });
  });
  // 2) y 3) según las actividades recogidas
  const acts = collectedActs(m), half = Math.max(1, Math.ceil(m.students.length / 2));
  const val = (s, a) => getGrade(s, a.ra.id, a.c.id, a.i);
  const lastTwo = acts.slice(-2);
  if (lastTwo.length === 2) m.students.forEach(s => {
    const miss = lastTwo.filter(a => { const v = val(s, a); return v === 0 || (v === '' && a.graded >= half); });
    if (miss.length === 2) out.missing.push({ s, acts: lastTwo });
  });
  if (acts.length >= 5) m.students.forEach(s => {
    const pts = acts.map(a => { const v = val(s, a); return isNum(v) ? v / a.c.max : null; }).filter(x => x !== null);
    if (pts.length < 5) return;
    const recent = pts.slice(-3), before = pts.slice(0, -3);
    const avgR = recent.reduce((a, b) => a + b, 0) / recent.length, avgB = before.reduce((a, b) => a + b, 0) / before.length;
    const diff = Math.round((avgB - avgR) * 100);
    if (diff >= dropN) out.drop.push({ s, before: Math.round(avgB * 100), recent: Math.round(avgR * 100), diff });
  });
  out.drop.sort((a, b) => b.diff - a.diff);
  out.absent.sort((a, b) => b.n - a.n);
  out.total = out.absent.length + out.missing.length + out.drop.length;
  return out;
}
function renderHomeAlerts() {
  const mods = db.modules.filter(m => m.students.length);
  if (!mods.length) return '';
  const all = mods.map(m => ({ m, a: computeAlerts(m) })).filter(x => x.a.total);
  const S = db.settings;
  const modLabel = m => esc(modShort(m)) + (m.course ? ' ' + esc(m.course) : '');
  const item = (m, s, detail, tab) => `<li class="al-item" data-act="alert-open" data-mod="${m.id}" data-sid="${s.id}" data-tab="${tab}"><b>${esc(s.name)}</b><span>${modLabel(m)} · ${detail}</span></li>`;
  const col = (title, icon, list, empty) => `<div class="al-col"><h4>${icon} ${title} <span class="badge ${list.length ? 'bad' : 'ok'}">${list.length}</span></h4>${list.length ? `<ul>${list.slice(0, 6).join('')}</ul>${list.length > 6 ? `<p class="small muted">y ${list.length - 6} más…</p>` : ''}` : `<p class="small muted">${empty}</p>`}</div>`;
  const absent = [], missing = [], drop = [];
  all.forEach(({ m, a }) => {
    a.absent.forEach(x => absent.push(item(m, x.s, `${x.n} ausencias seguidas (última: ${fmtDate(x.last)})`, 'asistencia')));
    a.missing.forEach(x => missing.push(item(m, x.s, `no entregó: ${x.acts.map(y => esc(y.label)).join(' y ')}`, 'estudiante')));
    a.drop.forEach(x => drop.push(item(m, x.s, `de ${x.before}% a ${x.recent}% en las últimas 3 actividades`, 'estudiante')));
  });
  const total = absent.length + missing.length + drop.length;
  return `<section class="card card-pad al-card">
    <div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:.5rem;margin-bottom:.6rem">
      <h3 style="font-size:1rem">⚠️ Alertas tempranas ${total ? `<span class="badge bad">${total}</span>` : '<span class="badge ok">Todo en orden</span>'}</h3>
      <span class="muted small">Faltas seguidas desde ${S.consecAlert || 3} · bajada desde ${S.dropAlert || 15} puntos · cámbialo en Ajustes</span>
    </div>
    <div class="ag-cols">
      ${col('Faltas seguidas', '🚫', absent, 'Nadie acumula faltas seguidas.')}
      ${col('No entregó las 2 últimas', '📭', missing, 'Todos entregaron al menos una de las dos últimas actividades.')}
      ${col('Bajó su rendimiento', '📉', drop, 'Nadie bajó de forma notable.')}
    </div>
  </section>`;
}

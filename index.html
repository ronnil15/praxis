/* ---------- Actualización en vivo (sin redibujar la pantalla) ---------- */
function refreshComputed() {
  const m = curMod(); if (!m) return;
  const cache = new Map();
  const calc = sid => { if (!cache.has(sid)) { const s = findStu(m, sid); cache.set(sid, s ? calcStudent(m, s) : null); } return cache.get(sid); };
  $$('[data-out]').forEach(el => {
    const [k, sid, raId, catId] = el.dataset.out.split(':');
    const r = calc(sid); if (!r) return;
    const i = raId ? m.ras.findIndex(x => x.id === raId) : -1;
    const stt = statusOf(r);
    switch (k) {
      case 'acc': el.textContent = fmt(r.acc); break;
      case 'total': el.textContent = fmtTotal(r.total); el.className = 'pill ' + stt.cls; break;
      case 'total-big': el.textContent = fmtTotal(r.total); el.style.color = `var(--${stt.cls})`; break;
      case 'status': el.innerHTML = `<span class="badge ${stt.cls}">${stt.label}</span>`; break;
      case 'ra': if (i >= 0) el.textContent = el.closest('.grid, .ra-card') ? fmt(r.ras[i].pts, 2) : fmt(r.ras[i].pts); break;
      case 'rapct': if (i >= 0) el.textContent = Math.round(r.ras[i].pct * 100) + '%'; break;
      case 'raobt': if (i >= 0) el.textContent = `${fmtN(r.ras[i].obt)}/${fmtN(r.ras[i].max)}`; break;
      case 'raic': if (i >= 0) el.innerHTML = raIcon(r.ras[i]); break;
      case 'rabadge': if (i >= 0) el.innerHTML = raBadge(r.ras[i]); break;
      case 'rareason': if (i >= 0) el.innerHTML = raReasonLine(r.ras[i]); break;
      case 'raok': el.textContent = `${r.raOk}/${m.ras.length}`; break;
      case 'raok-badge': el.textContent = `RA logrados: ${r.raOk}/${m.ras.length}`; break;
      case 'cat': {
        const ra = m.ras[i], cat = ra && findCat(ra, catId);
        if (cat) { const cs = calcCat(findStu(m, sid), ra, cat); el.textContent = `${fmtN(cs.obt)} / ${fmtN(cs.max)}`; }
        break;
      }
    }
  });
  const tiles = $('#statsTiles'); if (tiles) tiles.outerHTML = statsTiles(m);
}

/* ---------- Captura de notas ---------- */
/** Valida y guarda una casilla. Devuelve 'ok' | 'clamped' | 'invalid' | 'pending' */
function commitCell(t, final) {
  const m = curMod(); if (!m) return 'invalid';
  let max, getV, setV;
  if (t.dataset.g) {
    const [sid, raId, catId, idx] = t.dataset.g.split('|');
    const s = findStu(m, sid), ra = findRa(m, raId), cat = ra && findCat(ra, catId);
    if (!s || !cat) return 'invalid';
    max = cat.max;
    getV = () => getGrade(s, raId, catId, +idx);
    setV = v => setGrade(s, raId, catId, +idx, v);
  } else if (t.dataset.final) {
    const s = findStu(m, t.dataset.final); if (!s) return 'invalid';
    max = m.finalWeight;
    getV = () => s.final;
    setV = v => { s.final = isNum(v) ? r2(v) : ''; };
  } else return 'invalid';

  const v = parseNum(t.value);
  if (v === null) {
    t.classList.add('bad');
    if (!final) return 'pending';
    t.value = fmtN(getV()); t.classList.remove('bad');
    return 'invalid';
  }
  if (v !== '' && (v < 0 || v > max)) {
    t.classList.add('bad');
    if (!final) return 'pending';
    const c = Math.min(max, Math.max(0, v));
    setV(c); t.value = fmtN(c); t.classList.remove('bad'); t.classList.add('filled');
    persist(); return 'clamped';
  }
  t.classList.remove('bad');
  const before = getV();
  if (before !== v) { setV(v); persist(); }
  t.classList.toggle('filled', v !== '');
  if (final) t.value = fmtN(v);
  return 'ok';
}
function maxOfCell(t) {
  const m = curMod();
  if (t.dataset.final) return m.finalWeight;
  const [, raId, catId] = t.dataset.g.split('|');
  const ra = findRa(m, raId); return ra ? findCat(ra, catId).max : '';
}

/* ---------- Eventos globales ---------- */
document.addEventListener('input', e => {
  const t = e.target;
  if ((t.dataset.pl || t.dataset.pd || t.dataset.pdAct !== undefined) && onPlanInput(t)) return;
  if (t.matches('input.cell') && (t.dataset.g || t.dataset.final)) { commitCell(t, false); refreshComputed(); }
  else if (t.id === 'search') { state.search = t.value; render(); }
  else if (t.id === 'anecQ') { state.anec.q = t.value; render(); }
  else if (t.matches('[data-cfg-ra$="|w"]')) {
    const m = curMod(), ra = findRa(m, t.dataset.cfgRa.split('|')[0]), v = parseNum(t.value);
    if (ra && isNum(v) && v >= 0 && v <= 100) { ra.w = r2(v); persist(); const b = $('#sumBox'); if (b) b.outerHTML = sumBox(m); }
  }
  else if (t.matches('[data-obs]')) { const m = curMod(), s = m && findStu(m, t.dataset.obs); if (s) { s.obs = t.value; persist(); } }
});

document.addEventListener('change', e => {
  const t = e.target;
  if (onPlanChange(t)) return;
  if (t.matches('[data-rec]')) onRecChange(t);
  else if (t.matches('input.cell') && !(t.dataset.g || t.dataset.final)) return;
  else if (t.matches('input.cell')) {
    const res = commitCell(t, true); refreshComputed();
    if (res === 'clamped') toast(`La nota máxima de esa casilla es ${fmtN(maxOfCell(t))}. Se ajustó automáticamente.`, 'warn', 3200);
    else if (res === 'invalid') toast('Valor no válido. Escribe solo números (ej.: 8 o 8.5).', 'error');
  }
  else if (t.matches('[data-cfg-mod]')) onCfgMod(t);
  else if (t.matches('[data-cfg-ra]')) onCfgRa(t);
  else if (t.matches('[data-cfg-cat]')) onCfgCat(t);
  else if (t.id === 'sortSel') { state.sort = t.value; render(); }
  else if (t.id === 'calMod') { state.calMod = t.value; render(); }
  else if (t.id === 'recMode') { state.recMode = t.value; render(); }
  else if (t.id === 'recRa') { state.recRa = t.value; render(); }
  else if (t.id === 'tlRa') { const tt = toolState(curMod()); tt.raId = t.value; tt.catId = ''; render(); }
  else if (t.id === 'tlCat') { toolState(curMod()).catId = t.value; render(); }
  else if (t.id === 'tlPresent') { const tt = toolState(curMod()); tt.onlyPresent = t.checked; render(); }
  else if (['gpType', 'gpMode', 'gpN', 'gpBal', 'gpPresent', 'gpConduct', 'gpNorep'].includes(t.id)) {
    const o = toolState(curMod()).opts;
    if (t.id === 'gpType') o.type = t.value;
    else if (t.id === 'gpMode') o.mode = t.value;
    else if (t.id === 'gpN') { const v = parseInt(t.value, 10); if (v >= 1 && v <= 60) o.n = v; else { t.value = o.n; toast('Escribe un número entre 1 y 60.', 'error'); } }
    else if (t.id === 'gpBal') o.balance = t.value;
    else if (t.id === 'gpPresent') o.present = t.checked;
    else if (t.id === 'gpConduct') o.conduct = t.checked;
    else if (t.id === 'gpNorep') o.norepeat = t.checked;
    render();
  }
  else if (t.id === 'anecSid') { state.anec.sid = t.value; render(); }

/* Navegación tipo hoja de cálculo */
document.addEventListener('keydown', e => {
  const t = e.target;
  if (!t.classList || !t.classList.contains('cell')) return;
  const grid = t.closest('[data-grid]'); if (!grid) return;
  let target = null;
  const atEnd = () => t.selectionEnd === t.value.length;
  const atStart = () => t.selectionStart === 0;
  if (grid.dataset.grid === 'linear') {
    const cells = $$('input.cell', grid), i = cells.indexOf(t);
    if (e.key === 'Enter') { e.preventDefault(); target = cells[i + (e.shiftKey ? -1 : 1)]; }
    else if (e.key === 'ArrowDown') { e.preventDefault(); target = cells[i + 1]; }
    else if (e.key === 'ArrowUp') { e.preventDefault(); target = cells[i - 1]; }
    else if (e.key === 'ArrowRight' && atEnd()) target = cells[i + 1];
    else if (e.key === 'ArrowLeft' && atStart()) target = cells[i - 1];
  } else {
    const r = +t.dataset.r, c = +t.dataset.c;
    const at = (rr, cc) => grid.querySelector(`input.cell[data-r="${rr}"][data-c="${cc}"]`);
    if (e.key === 'Enter') {
      e.preventDefault();
      target = at(r + (e.shiftKey ? -1 : 1), c);
      if (!target && !e.shiftKey) { target = at(0, c + 1); if (target) toast('Columna completa → siguiente actividad', 'ok', 1400); }
    }
    else if (e.key === 'ArrowDown') { e.preventDefault(); target = at(r + 1, c); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); target = at(r - 1, c); }
    else if (e.key === 'ArrowRight' && atEnd()) target = at(r, c + 1);
    else if (e.key === 'ArrowLeft' && atStart()) target = at(r, c - 1);
  }
  if (target) { e.preventDefault(); target.focus(); target.select(); target.scrollIntoView({ block: 'nearest', inline: 'nearest' }); }
});

/* Pegar bloques copiados de Excel / Notion / Google Sheets */
document.addEventListener('paste', e => {
  const t = e.target;
  if (!t.classList || !t.classList.contains('cell')) return;
  const txt = (e.clipboardData || window.clipboardData).getData('text') || '';
  if (!/[\t\n]/.test(txt.replace(/[\r\n]+$/, ''))) return;     // un solo valor: pegado normal
  e.preventDefault();
  const grid = t.closest('[data-grid]'); if (!grid) return;
  const rows = txt.replace(/\r/g, '').replace(/\n+$/, '').split('\n').map(l => l.split('\t'));
  snapshot('Antes de pegar notas');
  let ok = 0, clamped = 0, bad = 0;
  const put = (cell, val) => { if (!cell) return; cell.value = val.trim(); const r = commitCell(cell, true); if (r === 'ok') ok++; else if (r === 'clamped') clamped++; else bad++; };
  if (grid.dataset.grid === 'linear') {
    const cells = $$('input.cell', grid); let i = cells.indexOf(t);
    rows.flat().forEach(v => put(cells[i++], v));
  } else {
    const r0 = +t.dataset.r, c0 = +t.dataset.c;
    rows.forEach((line, i) => line.forEach((v, j) => put(grid.querySelector(`input.cell[data-r="${r0 + i}"][data-c="${c0 + j}"]`), v)));
  }
  refreshComputed();
  toast(`Pegadas ${ok + clamped} notas${clamped ? ` (${clamped} ajustadas al máximo)` : ''}${bad ? ` · ${bad} valores no válidos ignorados` : ''}.`, bad ? 'warn' : 'ok', 3500);
});

/* Clic en cualquier elemento con data-act */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACTIONS[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('article[data-act], [role=button][data-act]')) { e.preventDefault(); e.target.click(); }
});

/* ---------- Rellenado masivo ---------- */
function fillGrades(m, { stuIds, raIds, catId = null, idx = null, mode, value, onlyEmpty = true }) {
  let n = 0;
  const S = new Set(stuIds), R = new Set(raIds);
  m.students.forEach(s => {
    if (!S.has(s.id)) return;
    m.ras.forEach(ra => {
      if (!R.has(ra.id)) return;
      ra.cats.forEach(c => {
        if (catId && c.id !== catId) return;
        for (let i = 0; i < c.count; i++) {
          if (idx !== null && i !== idx) continue;
          const cur = getGrade(s, ra.id, c.id, i);
          if (mode === 'clear') { if (cur !== '') { setGrade(s, ra.id, c.id, i, ''); n++; } continue; }
          if (onlyEmpty && isNum(cur)) continue;
          const v = mode === 'max' ? c.max : mode === 'zero' ? 0 : Math.min(c.max, Math.max(0, value));
          if (cur !== v) { setGrade(s, ra.id, c.id, i, v); n++; }
        }
      });
    });
  });
  return n;
}
function doFill(m, opts, label) {
  snapshot(label);
  const n = fillGrades(m, opts);
  persist(); render();
  toast(n ? `${n} casillas actualizadas.` : 'No había casillas para cambiar.', n ? 'ok' : 'info');
}

/* ---------- Estructura: copiar criterios / módulos ---------- */
/** Reemplaza criterios de todos los RA, conservando notas de criterios con el mismo nombre. */
function applyCatsToAll(m, srcCats, skipRaId) {
  m.ras.forEach(ra => {
    if (ra.id === skipRaId) return;
    const old = ra.cats;
    ra.cats = srcCats.map((c, i) => {
      const match = old.find(o => norm(o.label) === norm(c.label));
      return { id: match ? match.id : uid(), label: c.label, count: c.count, max: c.max, color: c.color || CAT_COLORS[i % CAT_COLORS.length], minDone: Math.min(c.count, c.minDone || 0), acts: normActs(match ? match.acts : [], c.count) };
    });
    const keep = new Set(ra.cats.map(c => c.id));
    m.students.forEach(s => {
      const g = s.g[ra.id]; if (!g) return;
      Object.keys(g).forEach(k => { if (!keep.has(k)) delete g[k]; });
      ra.cats.forEach(c => { if (g[c.id]) { g[c.id] = g[c.id].slice(0, c.count).map(v => isNum(v) ? Math.min(v, c.max) : ''); } });
    });
  });
}
function copyStructure(src, m) {
  const oldRas = m.ras;
  m.ras = src.ras.map((r, i) => {
    const prev = oldRas[i];
    return {
      id: prev ? prev.id : uid(), name: r.name, desc: r.desc || '', w: r.w, minPct: isNum(r.minPct) ? r.minPct : null,
      cats: r.cats.map((c, k) => {
        const match = prev && prev.cats.find(o => norm(o.label) === norm(c.label));
        return { id: match ? match.id : uid(), label: c.label, count: c.count, max: c.max, color: c.color || CAT_COLORS[k % CAT_COLORS.length], minDone: Math.min(c.count, c.minDone || 0), acts: normActs((c.acts || []).map(a => ({ n: a.n, d: '' })), c.count) };
      })
    };
  });
  m.finalWeight = src.finalWeight; m.finalLabel = src.finalLabel; m.raPass = src.raPass; m.requireAllRA = src.requireAllRA;
  const valid = new Map(m.ras.map(r => [r.id, new Map(r.cats.map(c => [c.id, c]))]));
  m.students.forEach(s => {
    Object.keys(s.g).forEach(rid => {
      const cats = valid.get(rid);
      if (!cats) { delete s.g[rid]; return; }
      Object.keys(s.g[rid]).forEach(cid => {
        const c = cats.get(cid);
        if (!c) delete s.g[rid][cid];
        else s.g[rid][cid] = s.g[rid][cid].slice(0, c.count).map(v => isNum(v) ? Math.min(v, c.max) : '');
      });
    });
  });
}

/* ---------- Configuración: cambios en campos ---------- */
function onCfgMod(t) {
  const m = curMod(), f = t.dataset.cfgMod;
  if (f === 'name') {
    const v = t.value.trim(); if (!v) { t.value = modFull(m); return toast('El nombre no puede quedar vacío.', 'error'); }
    if (m.name.includes(' · ') && !m.abbr) m.abbr = modShort(m);   // conserva la abreviatura que estaba en el nombre
    m.name = v;
  }
  else if (f === 'abbr') { const v = t.value.trim().slice(0, 20); if (m.name.includes(' · ')) { m.name = modFull(m); } m.abbr = v || autoAbbr(m.name); t.value = m.abbr; }
  else if (f === 'course') m.course = t.value.trim();
  else if (f === 'finalLabel') m.finalLabel = t.value.trim() || 'Cierre';
  else if (f === 'blankMode') m.blankMode = t.value;
  else if (f === 'requireAllRA') m.requireAllRA = t.checked;
  else if (f === 'recCap') m.recCap = t.value === 'none' ? 'none' : 'min';
  else if (f === 'raPass') {
    const v = parseNum(t.value);
    if (!isNum(v) || v < 0 || v > 100) { t.value = fmtN(m.raPass); return toast('El logro mínimo debe estar entre 0 y 100.', 'error'); }
    m.raPass = r2(v);
  }
  else if (f === 'finalWeight') {
    const v = parseNum(t.value);
    if (!isNum(v) || v < 0 || v > 100) { t.value = fmtN(m.finalWeight); return toast('El cierre debe estar entre 0 y 100.', 'error'); }
    const over = m.students.filter(s => isNum(s.final) && s.final > v);
    const apply = () => {
      m.finalWeight = r2(v);
      over.forEach(s => { s.final = m.finalWeight; });
      persist(); queueRender();
      if (weightIssue(m)) toast(`Ahora los RA deben sumar ${fmtN(100 - m.finalWeight)}%. Ajusta los valores de los RA o usa «Ajustar proporcionalmente».`, 'warn', 4000);
    };
    if (over.length) {
      confirmBox('Notas del cierre mayores al nuevo valor', `${over.length} estudiantes tienen una nota de cierre mayor que ${fmtN(v)}. ¿Ajustarlas a ${fmtN(v)}?`, 'Ajustar', () => { snapshot('Antes de cambiar el valor del cierre'); apply(); }, { danger: false, onCancel: () => { t.value = fmtN(m.finalWeight); } });
      return;
    }
    return apply();
  }
  persist(); queueRender();
}
function onCfgRa(t) {
  const m = curMod(), [raId, f] = t.dataset.cfgRa.split('|'), ra = findRa(m, raId); if (!ra) return;
  if (f === 'name') ra.name = t.value.trim() || `RA ${m.ras.indexOf(ra) + 1}`;
  else if (f === 'desc') { ra.desc = t.value.trim(); persist(); return; }
  else if (f === 'w') {
    const v = parseNum(t.value);
    if (!isNum(v) || v < 0 || v > 100) { t.value = fmtN(ra.w); return toast('El valor del RA debe estar entre 0 y 100.', 'error'); }
    ra.w = r2(v);
  }
  else if (f === 'minPct') {
    const v = parseNum(t.value);
    if (v === '') ra.minPct = null;
    else if (!isNum(v) || v < 0 || v > 100) { t.value = isNum(ra.minPct) ? fmtN(ra.minPct) : ''; return toast('El logro mínimo debe estar entre 0 y 100 (o vacío para usar el del módulo).', 'error'); }
    else ra.minPct = r2(v);
  }
  persist(); queueRender();
}
function onCfgCat(t) {
  const m = curMod(), [raId, catId, f] = t.dataset.cfgCat.split('|');
  const ra = findRa(m, raId), cat = ra && findCat(ra, catId); if (!cat) return;
  if (f === 'label') { cat.label = t.value.trim() || 'Criterio'; }
  else if (f === 'color') { cat.color = t.value; }
  else if (f === 'minDone') {
    const v = t.value.trim() === '' ? 0 : parseInt(t.value, 10);
    if (!(v >= 0 && v <= cat.count) || String(v) !== String(parseInt(v, 10))) { t.value = cat.minDone || ''; return toast(`El mínimo debe estar entre 0 y ${cat.count} (las actividades de «${cat.label}»).`, 'error'); }
    cat.minDone = v;
  }
  else if (f === 'count') {
    const v = parseInt(t.value, 10);
    if (!(v >= 1 && v <= 50)) { t.value = cat.count; return toast('La cantidad de actividades debe estar entre 1 y 50.', 'error'); }
    if (v < cat.count) {
      const lost = m.students.filter(s => { const a = (s.g[raId] || {})[catId] || []; return a.slice(v).some(isNum); }).length;
      if (lost) {
        confirmBox('Reducir actividades', `${lost} estudiantes tienen notas en las actividades ${v + 1} a ${cat.count} de «${cat.label}». Esas notas se borrarán.`, 'Reducir', () => {
          snapshot('Antes de reducir actividades');
          cat.count = v; cat.minDone = Math.min(cat.minDone || 0, v); cat.acts = normActs(cat.acts, v); m.students.forEach(s => { const a = (s.g[raId] || {})[catId]; if (a) s.g[raId][catId] = a.slice(0, v); });
          persist(); queueRender();
        }, { onCancel: () => { t.value = cat.count; } });
        return;
      }
      m.students.forEach(s => { const a = (s.g[raId] || {})[catId]; if (a) s.g[raId][catId] = a.slice(0, v); });
    }
    cat.count = v;
    cat.minDone = Math.min(cat.minDone || 0, v);
    cat.acts = normActs(cat.acts, v);
  }
  else if (f === 'max') {
    const v = parseNum(t.value);
    if (!isNum(v) || v <= 0 || v > 1000) { t.value = fmtN(cat.max); return toast('El máximo debe ser mayor que 0.', 'error'); }
    const over = m.students.filter(s => ((s.g[raId] || {})[catId] || []).some(x => isNum(x) && x > v)).length;
    if (over) {
      confirmBox('Notas mayores al nuevo máximo', `${over} estudiantes tienen notas mayores que ${fmtN(v)} en «${cat.label}». ¿Ajustarlas a ${fmtN(v)}?`, 'Ajustar', () => {
        snapshot('Antes de cambiar el máximo');
        cat.max = r2(v);
        m.students.forEach(s => { const a = (s.g[raId] || {})[catId]; if (a) s.g[raId][catId] = a.map(x => isNum(x) ? Math.min(x, cat.max) : ''); });
        persist(); queueRender();
      }, { danger: false, onCancel: () => { t.value = fmtN(cat.max); } });
      return;
    }
    cat.max = r2(v);
  }
  persist(); queueRender();
}

function parseNames(txt) {
  return String(txt || '').split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(l => {
    const cols = l.split('\t').map(x => x.trim()).filter(Boolean);
    let num = null, name = l;
    if (cols.length >= 2 && /^\d+$/.test(cols[0])) { num = parseInt(cols[0], 10); name = cols.slice(1).join(' '); }
    else {
      const mt = l.match(/^(\d{1,3})\s*[.\-)\]:]?\s+(.+)$/);
      if (mt) { num = parseInt(mt[1], 10); name = mt[2]; }
    }
    name = name.replace(/\s+/g, ' ').trim();
    return { num, name };
  }).filter(p => p.name && !/^\d+$/.test(p.name));
}
function renumberAZ(m) {
  m.students.sort((a, b) => a.name.localeCompare(b.name, 'es', { sensitivity: 'base' }));
  m.students.forEach((s, i) => { s.num = i + 1; });
}

const MES_S = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const dShort = iso => iso ? `${+iso.slice(8, 10)} ${MES_S[+iso.slice(5, 7) - 1]}` : '';

/* ---------- Clase del día ---------- */
function modDaysOfWeek(m, w) { if (!w) return []; const wd = m.weekdays && m.weekdays.length ? m.weekdays : [1, 2, 3, 4, 5]; return w.days.filter(d => wd.includes(wdOf(d))); }
function firstModDay(m, w) { return modDaysOfWeek(m, w)[0] || ''; }
function nextClassDay(m, from) {
  const W = calWeeks(); if (!W.length) return '';
  for (const w of W) for (const d of modDaysOfWeek(m, w)) if (d >= from) return d;
  const last = W[W.length - 1]; return modDaysOfWeek(m, last).slice(-1)[0] || last.last;
}
/** Minutos de una clase: horas semanales repartidas entre los días de clase del módulo. */
function sessionMinutes(m, P) { const n = m.weekdays && m.weekdays.length ? m.weekdays.filter(d => d >= 1 && d <= 5).length : 5; return Math.round(P.hw * 60 / Math.max(1, n)); }
/** Plan del día: el guardado, o uno generado desde la secuencia de esa semana. */
function dayPlan(m, P, iso) {
  const W = calWeeks(), wi = weekIndexOf(iso), w = W[wi];
  const at = w && iso >= w.mon && iso < addDays(w.mon, 7) ? planWeekAt(P, wi) : null;
  const saved = P.daily[iso];
  const mins = sessionMinutes(m, P, w);
  const split = { Inicio: Math.round(mins * 0.1 / 5) * 5 || 5, Cierre: Math.round(mins * 0.15 / 5) * 5 || 5 }; split.Desarrollo = Math.max(5, mins - split.Inicio - split.Cierre);
  const gen = {
    status: 'plan', comp: compOfDay(iso),
    ce: at ? at.week.ce.join(', ') : '',
    intent: at ? `Que los estudiantes trabajen en: ${lowerFirst(firstSentence((at.week.rows.find(r => r.m === 'Desarrollo') || at.week.rows[0] || {}).act))}` : '',
    mom: at ? MOMS.map(mm => { const rs = at.week.rows.filter(r => r.m === mm); return { m: mm, min: split[mm], act: rs.map(r => r.act).join(' ') }; }).filter(x => x.act) : MOMS.map(mm => ({ m: mm, min: split[mm], act: '' })),
    res: at ? uniqJoin(at.week.rows.map(r => r.rec)) : '', eval: at ? uniqJoin(at.week.rows.map(r => r.tec)) : '', refl: '',
  };
  return { saved: !!saved, day: saved ? Object.assign({}, gen, saved, { comp: saved.comp || gen.comp }) : gen, at, w, mins };
}
const lowerFirst = s => { s = String(s || '').trim(); return s ? s.charAt(0).toLowerCase() + s.slice(1) : '…'; };
const firstSentence = s => { const t = String(s || '').trim(); const i = t.search(/\.\s/); return (i > 0 ? t.slice(0, i) : t.replace(/\.$/, '')) + '.'; };
const uniqJoin = arr => [...new Set(arr.join(', ').split(/[;,]\s*/).map(x => x.trim()).filter(Boolean))].join(', ');
function plClase(m, P) {
  const st = plState(), W = calWeeks();

  const iso = st.date, { saved, day, at, w } = dayPlan(m, P, iso);

  const ceTxt = ra ? day.ce.split(/,\s*/).map(c => { const f = ra.ces.find(x => x[0] === c.trim()); return f ? `<li><b>${esc(f[0])}</b> ${esc(f[1])}</li>` : (c.trim() ? `<li><b>${esc(c)}</b></li>` : ''); }).join('') : '';
  const wd = m.weekdays && m.weekdays.length ? m.weekdays : null;
  return `<section class="card card-pad pl-day-top">

      <div class="row-wrap">
        ${saved ? `<span class="badge ${day.status === 'done' ? 'ok' : day.status === 'moved' ? 'warn' : 'info'}">${day.status === 'done' ? 'Impartida' : day.status === 'moved' ? 'Reprogramada' : 'Planificada y guardada'}</span>` : '<span class="badge">Generada desde la secuencia</span>'}
        <button class="btn btn-sm ${day.status === 'done' ? 'btn-secondary' : 'btn-ok'}" data-act="pl-day-done">${day.status === 'done' ? 'Desmarcar impartida' : '✓ Marcar como impartida'}</button>
        <button class="btn btn-sm btn-primary" data-act="pl-print-day">${ICON.print} PDF</button>
      </div>
    </section>
    ${!isClass ? `<div class="alert alert-warn"><div>Este día no es de clase según el calendario${holidayOf(iso) ? ` (${esc(holidayOf(iso))})` : breakOf(iso) ? ` (${esc(breakOf(iso))})` : ''}.</div></div>` : ''}
    <div class="pl-day-grid">

        <label class="field">Intención pedagógica<textarea class="pl-ta" data-pd="intent" data-key="pd-intent" rows="${taRows(day.intent)}">${esc(day.intent)}</textarea></label>
        <h3 class="pl-h3">Momentos de la clase</h3>

        ${day.mom.map((x, j) => `<div class="pl-mom pl-m-${x.m.toLowerCase()}"><div class="pl-mom-h"><b>${esc(x.m)}</b><label class="pl-num">Min<input type="text" inputmode="numeric" data-pd-min="${j}" value="${x.min}"></label></div>

      </aside>
    </div>`;
}
function saveDay(m, iso, patch) {
  const P = m.plan, { day } = dayPlan(m, P, iso);

/* ---------- Eventos ---------- */
function onPlanInput(t) {
  const m = curMod(); if (!m || !m.plan) return false;
  if (t.dataset.pl) { setPath(m.plan, t.dataset.pl, t.value); persist(); return true; }
  if (t.dataset.pd) { saveDay(m, plState().date, { [t.dataset.pd]: t.value }); return true; }
  if (t.dataset.pdAct !== undefined) { const { day } = dayPlan(m, m.plan, plState().date); const mom = day.mom.map(x => Object.assign({}, x)); mom[+t.dataset.pdAct].act = t.value; saveDay(m, plState().date, { mom }); return true; }
  return false;
}
function onPlanChange(t) {
  const m = curMod();
  if (t.dataset.cal !== undefined) return onCalChange(t), true;
  if (t.id === 'plDate') { if (isoDate(t.value)) { plState().date = t.value; render(); } return true; }
  if (!m || !m.plan) return false;
  const P = m.plan;
  if (t.dataset.plRender && t.dataset.pl) { setPath(P, t.dataset.pl, t.value); persist(); render(); return true; }
  if (t.dataset.plNum) { const v = parseNum(t.value); if (isNum(v) && v > 0) { P[t.dataset.plNum] = v; persist(); render(); } else { t.value = fmtN(P[t.dataset.plNum]); toast('Escribe un número válido.', 'error'); } return true; }
  if (t.dataset.plUc) { P.uc = t.value.split('\n').map(l => l.trim()).filter(Boolean).map(l => { const mm = l.match(/^(\S+)\s*[:\-–]?\s*(.*)$/); return [mm[1], mm[2] || '']; }); persist(); return true; }
  if (t.dataset.plCes !== undefined) { const r = P.ras[+t.dataset.plCes]; r.ces = t.value.split('\n').map(l => l.trim()).filter(Boolean).map(l => { const mm = l.match(/^(CE[\w.]+)\s*[:\-–]?\s*(.*)$/i); return mm ? [mm[1], mm[2]] : ['', l]; }); persist(); return true; }
  if (t.dataset.plWce) { const [ri, k] = t.dataset.plWce.split('|').map(Number); P.ras[ri].seq[k].ce = t.value.split(/[,;]\s*/).map(x => x.trim()).filter(Boolean); persist(); return true; }
  if (t.dataset.plPts !== undefined) { const v = parseNum(t.value); if (isNum(v) && v >= 0 && v <= 70) { P.ras[+t.dataset.plPts].points = r2(v); persist(); render(); } else { toast('Los puntos van de 0 a 70.', 'error'); render(); } return true; }
  if (t.dataset.plWeeks !== undefined) { setRaWeeks(m, +t.dataset.plWeeks, parseInt(t.value, 10)); return true; }
  if (t.dataset.pdMin !== undefined) { const v = parseInt(t.value, 10); const { day } = dayPlan(m, P, plState().date); const mom = day.mom.map(x => Object.assign({}, x)); if (v >= 0 && v <= 600) { mom[+t.dataset.pdMin].min = v; saveDay(m, plState().date, { mom }); render(); } return true; }
  if (t.dataset.pd === 'comp') { saveDay(m, plState().date, { comp: t.value }); render(); return true; }
  return false;
}
function setRaWeeks(m, ri, n) {

  if (n > r.seq.length) { while (r.seq.length < n) r.seq.push(normWeek({})); persist(); render(); return; }
  const lost = r.seq.slice(n).filter(w => w.rows.some(x => x.act.trim())).length;
  const apply = () => { snapshot('Antes de quitar semanas de la planificación'); r.seq = r.seq.slice(0, n); persist(); render(); };
  if (lost) confirmBox('Quitar semanas', `Las últimas ${r.seq.length - n} semanas del ${r.code} se borrarán (${lost} tienen actividades escritas).`, 'Quitar', apply, { onCancel: render });
  else apply();
}
function onCalChange(t) {

  if (/\.(start|end|date)$/.test(path)) { if (!isoDate(v)) return toast('Fecha no válida.', 'error'); }
  if (/\.entrega$|^comp\./.test(path)) { v = parseInt(v, 10); if (!(v >= 0 && v <= 99)) { toast('Escribe un número.', 'error'); render(); return; } }
  if (/^periods\.\d+\.id$/.test(path)) { const i = +path.split('.')[1], old = C.periods[i].id; v = String(v).trim().slice(0, 8) || old; if (old !== v) { C.comp[v] = C.comp[old] || {}; delete C.comp[old]; } }
  setPath(C, path, v);
  db.cal = normCal(C); calTouch(); persist(); render();
}

        const pick = d.plans.length === 1 ? d.plans[0] : (d.plans.find(p => libMatchPlan(m, p)) || d.plans[0]);
        const doIt = () => { snapshot('Antes de importar una planificación'); m.plan = normPlan(pick); if (d.calendar && !db.cal) { db.cal = normCal(d.calendar); calTouch(); } persist(); render(); toast(`Planificación importada: ${pick.code || pick.name}.`, 'ok'); };

/* =========================================================

   ========================================================= */
const _mo = { screen: null, tab: null, ym: null, first: true };
function motionOn() {

  try { if (matchMedia('(prefers-reduced-motion: reduce)').matches) return false; } catch (e) { }
  return true;
}

function staggerIn(root) {
  root.querySelectorAll('.stats, .mod-grid, .hero-stats, .ov-list, .tools-grid, .rep-grid, .pl-home-list, .ag-cols, .fest-strip, .cal-side').forEach(g => {
    [...g.children].slice(0, 14).forEach((c, i) => animIn(c, 'a-pop', i));
  });
}
/** Las cifras suben desde cero (respeta decimales y %). */
function countUp(root) {
  const els = [...root.querySelectorAll('.stat b, .hero-stats b, .ov-num b, .metric b, .stu-final b')].slice(0, 40);
  els.forEach(el => {
    const txt = el.textContent.trim(), mt = txt.match(/^(\d{1,4}(?:\.\d+)?)(%?)$/);
    if (!mt || el.children.length) return;
    const end = parseFloat(mt[1]), dec = (mt[1].split('.')[1] || '').length, suf = mt[2];
    if (!end) return;
    const t0 = performance.now(), dur = 650;
    const step = now => {
      if (!el.isConnected) return;
      const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      el.textContent = (end * e).toFixed(dec) + suf;
      if (k < 1) requestAnimationFrame(step); else el.textContent = txt;
    };

    requestAnimationFrame(step);
  });
}
/** Se llama al final de cada render(). */
function afterRender() {
  applyMotionPref();
  const app = document.getElementById('app'); if (!app) return;
  const screen = `${state.view}|${state.view === 'module' ? state.modId : ''}`;
  const pl = state.pl || {};
  const tab = state.view === 'module' ? `${state.tab}|${state.tab === 'planificacion' ? pl.sub : ''}|${state.tab === 'estudiante' ? state.stuId : ''}|${state.tab === 'registro' ? state.raId : ''}` : '';
  const ym = state.view === 'calendar' ? state.calYM : null;
  const prev = { ..._mo };
  Object.assign(_mo, { screen, tab, ym, first: false });
  // La pestaña activa siempre a la vista (en celular la barra se desplaza)
  const act = app.querySelector('.tabs .tab.active');
  if (act && (prev.screen !== screen || prev.tab !== tab)) { const nav = act.parentElement; const x = act.offsetLeft - (nav.clientWidth - act.offsetWidth) / 2; nav.scrollTo({ left: Math.max(0, x), behavior: prev.screen === screen && motionOn() ? 'smooth' : 'auto' }); }
  if (!motionOn()) return;
  if (prev.screen !== screen) {
    [...app.children].forEach((c, i) => animIn(c, 'a-in', i));
    staggerIn(app); countUp(app);
  } else if (prev.tab !== tab) {
    const tb = app.querySelector('.tab-body');
    if (tb) { animIn(tb, 'a-in'); staggerIn(tb); countUp(tb); }
    const nav = app.querySelector('.tabs'); if (nav) nav.classList.add('tab-anim');
  } else if (ym && prev.ym && ym !== prev.ym) {
    const g = app.querySelector('.cal-grid'), tt = app.querySelector('.cal-title');
    animIn(g, ym > prev.ym ? 'slide-l' : 'slide-r'); animIn(tt, 'a-fade');
    app.querySelectorAll('.cal-side > *').forEach((c, i) => animIn(c, 'a-pop', i));
  }
}

const modTag = m => m ? modShort(m) + (m.course ? ' ' + m.course : '') : '';

/** Revisa qué avisar. Se llama al abrir y cada minuto. */
function notifTick(force) {
  if (!db || !Array.isArray(db.modules)) return;
  if (typeof Cloud === 'object' && Cloud.on && !Cloud.user) return;
  const P = notifPrefs(), log = notifLog(), t = todayISO(), sent = [];
  const fire = (key, title, body, go, alsoToast) => {
    if (!force && log[key]) return;
    sent.push(key);

  };
  // 1) Resumen del día (una vez al día)
  if (P.agenda) {
    const al = agendaAlerts(), parts = [];
    const lst = a => a.slice(0, 3).map(e => (e.time ? fmtTime12(e.time) + ' ' : '') + e.title + (e.mod ? ` (${modTag(e.mod)})` : '')).join(', ') + (a.length > 3 ? '…' : '');
    if (al.today.length) parts.push(`Hoy: ${lst(al.today)}`);
    if (al.tomorrow.length) parts.push(`Mañana: ${lst(al.tomorrow)}`);
    if (al.pending.length) parts.push(`${al.pending.length} ${al.pending.length === 1 ? 'actividad pasada por calificar' : 'actividades pasadas por calificar'}`);
    if (al.overdue.length) parts.push(`${al.overdue.length} ${al.overdue.length === 1 ? 'evento vencido' : 'eventos vencidos'} sin completar`);
    const fests = typeof festOf === 'function' ? festOf(t, true).filter(x => x.k === 'fer' || x.k === 'pat') : [];
    if (fests.length) parts.unshift(`📅 ${fests.map(x => x.n).join(' · ')}`);
    if (parts.length) fire('day:' + t, 'Praxis Pro · Tu día', parts.join('\n'), 'calendar', false);
    // 2) Recordatorio antes de cada actividad con hora
    const now = hmToMin(nowHM()), before = Math.max(0, +P.before || 0);
    al.today.filter(e => e.time).forEach(e => {
      const m = hmToMin(e.time), left = m - now;

        fire(`ev:${e.key}:${t}:${e.time}`, `${when} · ${e.title}`, `${fmtTime12(e.time)}${e.mod ? ' · ' + modTag(e.mod) : ''}${e.sub ? ' · ' + e.sub : ''}`, e.modId && e.src === 'act' ? `mod:${e.modId}:registro` : 'calendar', true);
      }

    });

      if (notifGranted()) showNotif(`⚠️ ${fresh.length === 1 ? 'Nueva alerta temprana' : fresh.length + ' alertas tempranas nuevas'}`, body, 'alerts', mods.length === 1 ? `mod:${mods[0]}:${fresh[0].tab}` : 'home');

/* ---------- Arranque con nube ---------- */
function cloudBoot(afterLocal) {

  firebase.initializeApp(CLOUD_CONFIG);

  try { Cloud.fs.enablePersistence({ synchronizeTabs: true }).catch(() => { }); } catch (e) { }
  document.body.classList.add('auth-wait');
  Cloud.auth.onAuthStateChanged(async u => {
    document.body.classList.remove('auth-wait');
    if (!u) { Cloud.user = null; authScreen('login'); return; }
    if (Cloud.user && Cloud.user.uid === u.uid) return;
    Cloud.user = u; closeAuth();
    // Cada docente con su propia copia en este equipo
    STORE_KEY = 'praxisPro_v2_' + u.uid; SNAP_KEY = 'praxisPro_snapshots_' + u.uid;
    const st = loadDB();
    if (st === 'new' && u.displayName) db.settings.teacher = u.displayName;
    afterLocal(st);
    await cloudStart();
  });
  window.addEventListener('online', () => cloudSetStatus(Cloud.status === 'off' ? 'up' : Cloud.status));

}
function teacherRef() { return Cloud.fs.collection('teachers').doc(Cloud.user.uid); }
async function cloudStart() {
  const ref = teacherRef();
  cloudSetStatus(navigator.onLine ? 'up' : 'off');
  let snap = null;
  try { snap = await ref.get(); } catch (e) { try { snap = await ref.get({ source: 'cache' }); } catch (_) { } }
  if (snap && snap.exists) {
    // La nube manda: se toman los datos de la cuenta
    let mods = null;
    try { mods = await ref.collection('modules').get(); } catch (e) { try { mods = await ref.collection('modules').get({ source: 'cache' }); } catch (_) { } }
    if (mods) applyCloud(snap.data(), mods.docs.map(d => [d.id, d.data()]), true);
  } else if (snap) {
    // Cuenta nueva: se suben los datos de este equipo (o los de antes de la nube)
    await cloudMigrateLocal();
    cloudPush(true);
  }
  await cloudLoadLib();
  Cloud.ready = true;
  cloudListen();
  if (navigator.onLine) Cloud.fs.waitForPendingWrites().then(() => cloudSetStatus('sync')).catch(() => { });
}
/** Primera vez: ofrece subir los datos que ya había en este navegador. */

  if (db.modules.length) return;

  if (!old) return;
  let d = null; try { d = normalizeDB(JSON.parse(old)); } catch (e) { return; }
  if (!d.modules.length) return;
  const ok = await new Promise(res => confirmBox('Subir tus datos a tu cuenta', `En este navegador hay datos de Praxis Pro (${summarize(d)}). ¿Los subimos a tu cuenta para tenerlos en todos tus equipos?`, 'Sí, subirlos', () => res(true), { danger: false, onCancel: () => res(false) }));
  if (ok) { db = d; saveNow(); render(); toast('Datos subidos a tu cuenta.', 'ok'); }
}
/** Aplica los datos de la nube a este equipo. */
function applyCloud(meta, mods, full) {
  let M = null; try { M = meta && meta.meta ? JSON.parse(meta.meta) : null; } catch (e) { }
  const byId = {};
  mods.forEach(([id, d]) => { try { byId[id] = JSON.parse(d.data); Cloud.sent['m:' + id] = d.data; } catch (e) { } });
  if (M) Cloud.sent.meta = meta.meta;

  const next = {

    modules: [...order.filter(id => byId[id]).map(id => byId[id]), ...Object.keys(byId).filter(id => !order.includes(id)).map(id => byId[id])]

/** Escucha cambios hechos desde otros equipos. */
function cloudListen() {
  Cloud.unsub.forEach(f => f()); Cloud.unsub = [];
  const ref = teacherRef();
  Cloud.unsub.push(ref.onSnapshot(s => {
    if (!s.exists || s.metadata.hasPendingWrites) return;
    const d = s.data(); if (d.meta === Cloud.sent.meta || d.dev === Cloud.dev) { Cloud.sent.meta = d.meta; return; }
    if (dirty || cloudMeta() !== Cloud.sent.meta) return; // hay cambios propios sin subir: ganan los nuestros
    try {
      const M = JSON.parse(d.meta); Cloud.sent.meta = d.meta;
      db.settings = Object.assign(db.settings, M.settings); db.agenda = M.agenda || []; db.cal = M.cal; db = normalizeDB(db); Cloud.sent.meta = cloudMeta();
      if (Array.isArray(M.order)) db.modules.sort((a, b) => M.order.indexOf(a.id) - M.order.indexOf(b.id));

    } catch (e) { }
  }, () => { }));
  Cloud.unsub.push(ref.collection('modules').onSnapshot(qs => {
    if (qs.metadata.hasPendingWrites) return;
    let changed = 0; const ids = [];
    qs.docChanges().forEach(ch => {
      const id = ch.doc.id, key = 'm:' + id, d = ch.doc.data();
      if (ch.type === 'removed') {
        if (Cloud.sent[key] !== undefined && findMod(id)) { db.modules = db.modules.filter(m => m.id !== id); changed++; }
        delete Cloud.sent[key]; return;
      }
      if (d.data === Cloud.sent[key]) return;
      const cur = findMod(id);
      if (cur && JSON.stringify(cur) !== Cloud.sent[key]) return; // este equipo tiene cambios sin subir en ese módulo
      try {
        const m = JSON.parse(d.data); Cloud.sent[key] = d.data;

    if (changed) { db = normalizeDB(db); ids.forEach(id => { const m = findMod(id); if (m) Cloud.sent['m:' + id] = JSON.stringify(m); }); saveLocalOnly(); render(); if (Cloud.ready) toast('Se actualizaron tus módulos desde otro equipo.', 'ok'); }
  }, () => { }));
}
/** Sube solo lo que cambió (después de cada guardado local). */
function cloudQueue() { if (!Cloud.on || !Cloud.user || Cloud._quiet) return; clearTimeout(Cloud.timer); Cloud.timer = setTimeout(() => cloudPush(false), 1200); }

  const ts = firebase.firestore.FieldValue.serverTimestamp();

  if (force || meta !== Cloud.sent.meta) { batch.set(ref, { meta, dev: Cloud.dev, at: ts, email: Cloud.user.email || '' }); Cloud.sent.meta = meta; n++; }
  const live = new Set();
  db.modules.forEach(m => {
    const key = 'm:' + m.id, s = JSON.stringify(m); live.add(key);
    if (s.length > 950000) { toast(`El módulo ${modShort(m)} es demasiado grande para la nube; se guarda solo en este equipo.`, 'warn', 6000); return; }
    if (force || s !== Cloud.sent[key]) { batch.set(ref.collection('modules').doc(m.id), { data: s, dev: Cloud.dev, at: ts }); Cloud.sent[key] = s; n++; }

  batch.commit().catch(e => { console.error(e); cloudSetStatus('err'); toast('No se pudo subir a la nube: ' + (e.code || e.message) + '. Tus datos siguen en este equipo.', 'error', 6000); });

}

  const st = moduleStats(m);
  const list = allStudents(m);
  const head = `<tr><th>No.</th><th class="l">Estudiante</th>${m.ras.map((r, i) => `<th title="${esc(r.name)}">RA${i + 1}<br>${fmtN(r.w)}%</th>`).join('')}
    <th>RA<br>logrados</th><th>Acum.<br>${fmtN(100 - m.finalWeight)}%</th><th>${esc(m.finalLabel)}<br>${fmtN(m.finalWeight)}%</th><th>Total</th><th>Condición</th></tr>`;
  const rows = list.map(s => {
    const c = calcStudent(m, s), stt = statusOf(c);
    return `<tr><td>${s.num}</td><td class="l">${esc(s.name)}</td>${c.ras.map(x => `<td class="${x.status === 'no' ? 'low' : ''}">${fmt(x.pts)} ${RA_STATUS[x.status].icon}</td>`).join('')}
      <td>${c.raOk}/${m.ras.length}</td><td>${fmt(c.acc)}</td><td>${c.finalSet ? fmt(c.fin) : '—'}</td><td class="tot ${stt.cls !== 'ok' ? 'low' : ''}">${fmtTotal(c.total)}</td><td>${stt.label}</td></tr>`;
  }).join('');
  const legend = m.ras.map((r, i) => `<b>RA${i + 1}:</b> ${esc(r.name)}`).join(' · ');
  printHTML(`<section class="rp-page">${reportHead(m, 'Registro de calificaciones')}
    <table class="rp-table"><thead>${head}</thead><tbody>${rows}</tbody></table>
    <div class="rp-foot"><div>${legend}<br>✓ Logrado · … En proceso · ✗ No logrado · — Sin evaluar · Logro mínimo por RA: ${fmtN(m.raPass)}%${m.requireAllRA ? ' · Para aprobar se exigen todos los RA logrados' : ''}</div><div style="white-space:nowrap">Estudiantes: <b>${st.n}</b> · Promedio: <b>${fmt(st.avg)}</b> · Aprobados: <b>${st.ap}</b> · En riesgo: <b>${st.rk}</b> · Reprobados: <b>${st.rp}</b></div></div>
    ${signLine()}</section>`, 'landscape');
}

function boletinHTML(m, s) {
  const c = calcStudent(m, s), stt = statusOf(c);
  const rows = m.ras.map((ra, i) => {
    const x = c.ras[i];
    const cats = ra.cats.map(cat => { const cs = calcCat(s, ra, cat); return `${esc(cat.label)} ${fmtN(cs.obt)}/${fmtN(cs.max)}`; }).join(' · ');
    const why = x.status === 'ok' ? '' : `<div class="rp-cats" style="color:${x.status === 'rec' ? '#15803d' : '#b91c1c'}">${esc(raReasons(x).join(' · '))}</div>`;
    return `<tr><td>RA ${i + 1}</td><td class="l">${esc(ra.name)}<div class="rp-cats">${cats}</div>${why}</td><td>${fmtN(ra.w)}%</td><td>${fmtN(x.obt)} / ${fmtN(x.max)}</td><td>${Math.round(x.pct * 100)}%</td><td class="${x.status === 'no' ? 'low' : ''}">${RA_STATUS[x.status].icon} ${RA_STATUS[x.status].label}</td><td class="tot">${fmt(x.pts, 2)}</td></tr>`;
  }).join('');
  return `<section class="rp-page">${reportHead(m, 'Boletín de calificaciones')}
    <div class="rp-student"><div>Estudiante: <b>${esc(s.name)}</b></div><div>No. de lista: <b>${s.num}</b></div></div>
    <table class="rp-table"><thead><tr><th>RA</th><th class="l">Resultado de aprendizaje y criterios</th><th>Valor</th><th>Puntos</th><th>Logro</th><th>Estado</th><th>Aporte</th></tr></thead>
    <tbody>${rows}
      <tr><td colspan="6" class="l"><b>Puntos de los RA</b> (RA logrados: ${c.raOk} de ${m.ras.length})</td><td class="tot">${fmt(c.acc, 2)} / ${fmtN(100 - m.finalWeight)}</td></tr>
      <tr><td colspan="6" class="l"><b>${esc(m.finalLabel)}</b></td><td class="tot">${c.finalSet ? fmt(c.fin, 2) : '—'} / ${fmtN(m.finalWeight)}</td></tr>
    </tbody></table>
    <div class="rp-foot" style="align-items:center"><div class="rp-total">Nota final: ${fmtTotal(c.total)} / 100</div><div class="rp-total">${stt.label}</div></div>
    <div class="rp-box"><b>Observaciones:</b> ${s.obs ? esc(s.obs).replace(/\n/g, '<br>') : ''}</div>
    <div class="rp-sign"><div>Firma del docente</div><div>Firma del padre, madre o tutor</div></div></section>`;
}
function printBoletines(m, stuId) {
  const list = stuId ? [findStu(m, stuId)].filter(Boolean) : allStudents(m);
  if (!list.length) return toast('No hay estudiantes para imprimir.', 'error');
  printHTML(list.map(s => boletinHTML(m, s)).join(''), 'portrait');
}

function printRA(m, raId) {
  const ra = findRa(m, raId); if (!ra) return toast('Elige un RA.', 'error');
  const ri = m.ras.indexOf(ra);
  const h1 = ra.cats.map(c => `<th colspan="${c.count}">${esc(c.label)} (${c.count}×${fmtN(c.max)})</th>`).join('');
  const h2 = ra.cats.map(c => Array.from({ length: c.count }, (_, i) => { const a = actOf(c, i); return `<th>${esc(itemLabel(c, i))}${a.n ? `<br><span style="font-weight:400">${esc(a.n)}</span>` : ''}${a.d ? `<br><span style="font-weight:400">${fmtDate(a.d)}</span>` : ''}</th>`; }).join('')).join('');
  const rows = allStudents(m).map(s => {
    const x = calcRA(m, s, ra);
    const cells = ra.cats.map(c => Array.from({ length: c.count }, (_, i) => `<td>${fmtN(getGrade(s, ra.id, c.id, i))}</td>`).join('')).join('');
    return `<tr><td>${s.num}</td><td class="l">${esc(s.name)}</td>${cells}<td>${fmtN(x.obt)}/${fmtN(x.max)}</td><td>${Math.round(x.pct * 100)}%</td><td class="tot">${fmt(x.pts, 2)}</td><td class="${x.status === 'no' ? 'low' : ''}">${RA_STATUS[x.status].label}</td></tr>`;
  }).join('');
  printHTML(`<section class="rp-page">${reportHead(m, `Detalle del RA ${ri + 1}: ${ra.name}`)}
    <p style="font-size:9pt;margin:0 0 6px">Valor del RA: <b>${fmtN(ra.w)}%</b> · Total de puntos: <b>${fmtN(raPoints(ra))}</b> · Para lograrlo: <b>${esc(raRequirements(m, ra))}</b></p>${ra.desc ? `<p style="font-size:9pt;margin:0 0 6px"><i>${esc(ra.desc)}</i></p>` : ''}
    <table class="rp-table"><thead><tr><th rowspan="2">No.</th><th rowspan="2" class="l">Estudiante</th>${h1}<th rowspan="2">Puntos</th><th rowspan="2">Logro</th><th rowspan="2">Aporte</th><th rowspan="2">Estado</th></tr><tr>${h2}</tr></thead><tbody>${rows}</tbody></table>
    ${signLine()}</section>`, 'landscape');
}

function printRiesgo(m) {
  const pass = db.settings.pass;
  const list = allStudents(m).map(s => ({ s, c: calcStudent(m, s) }))
    .filter(x => x.c.total < pass || x.c.ras.some(r => r.status === 'no')).sort((a, b) => a.c.total - b.c.total);
  if (!list.length) return toast(`No hay estudiantes por debajo de ${pass} ni con RA no logrados. ¡Excelente!`, 'ok');
  const rows = list.map(({ s, c }) => {
    const notOk = c.ras.map((x, i) => ({ x, i })).filter(o => o.x.status === 'no');
    const weak = notOk.length
      ? notOk.map(o => `<b>RA${o.i + 1}</b>: ${esc(raReasons(o.x).join('; '))}`).join('<br>')
      : m.ras.map((ra, i) => ({ i, pct: c.ras[i].pct })).sort((a, b) => a.pct - b.pct).slice(0, 3).map(w => `RA${w.i + 1} (${Math.round(w.pct * 100)}%)`).join(', ');
    const need = Math.max(0, pass - c.total);
    return `<tr><td>${s.num}</td><td class="l">${esc(s.name)}</td><td class="tot ${c.total < pass ? 'low' : ''}">${fmtTotal(c.total)}</td><td>${statusOf(c).label}</td><td>${fmt(need)}</td><td class="l">${weak}</td></tr>`;
  }).join('');
  printHTML(`<section class="rp-page">${reportHead(m, `Estudiantes en riesgo: nota menor que ${pass} o RA no logrados`)}
    <table class="rp-table"><thead><tr><th>No.</th><th class="l">Estudiante</th><th>Nota</th><th>Condición</th><th>Le faltan</th><th class="l">RA no logrados (o con menor logro)</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="rp-box"><b>Plan de recuperación:</b></div>${signLine()}</section>`, 'portrait');
}

/* ---------- CSV para Excel ---------- */
function csvCell(v) {
  const s = String(v ?? '');
  return /[",\n;]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}
function exportCSV(m, detail) {
  if (!m.students.length) return toast('No hay estudiantes para exportar.', 'error');
  const head = ['No.', 'Estudiante'];
  m.ras.forEach((ra, i) => {
    if (detail) ra.cats.forEach(c => { for (let k = 0; k < c.count; k++) head.push(`RA${i + 1} ${actFull(c, k)} (/${fmtN(c.max)})`); });
    head.push(`RA${i + 1} aporte (${fmtN(ra.w)}%)`, `RA${i + 1} estado`);
  });
  head.push('RA logrados', `Puntos de los RA (de ${fmtN(100 - m.finalWeight)})`, `${m.finalLabel} (${fmtN(m.finalWeight)}%)`, 'Total', 'Condición');
  if (detail) head.push('Observaciones');
  const lines = [head];
  allStudents(m).forEach(s => {
    const c = calcStudent(m, s), row = [s.num, s.name];
    m.ras.forEach((ra, i) => {
      if (detail) ra.cats.forEach(cat => { for (let k = 0; k < cat.count; k++) row.push(fmtN(getGrade(s, ra.id, cat.id, k))); });
      row.push(fmt(c.ras[i].pts, 2), RA_STATUS[c.ras[i].status].label);
    });
    row.push(`${c.raOk} de ${m.ras.length}`, fmt(c.acc, 2), c.finalSet ? fmt(c.fin, 2) : '', fmtTotal(c.total), statusOf(c).label);
    if (detail) row.push(s.obs || '');
    lines.push(row);
  });
  const csv = '﻿' + lines.map(r => r.map(csvCell).join(',')).join('\r\n');
  downloadFile(`${safeName(m.name)}${m.course ? '_' + safeName(m.course) : ''}_${detail ? 'detalle' : 'resumen'}_${fileDate()}.csv`, csv, 'text/csv;charset=utf-8');
  toast('Archivo descargado. Ábrelo con Excel.', 'ok');
}

/* =========================================================
   Arranque
   ========================================================= */
function boot() {
  document.title = AppConfig.appName;
  $('#navName').textContent = AppConfig.appName;
  $('#navLogo').textContent = AppConfig.logo;
  $('#footName').textContent = AppConfig.appName;
  $('#footVer').textContent = 'v' + AppConfig.version;
  $('#footAuthor').textContent = AppConfig.author;
  applyTheme();
  if (cloudAvailable()) { cloudBoot(afterLoad); return; }
  afterLoad(loadDB());
}
function afterLoad(st) {
  render();
  notifStart();
  try { const g = decodeURIComponent((location.hash.match(/go=([^&]+)/) || [])[1] || ''); if (g) { history.replaceState(null, '', location.pathname); notifGo(g); } } catch (e) { }
  if (st === 'migrated') toast(`Tus datos de la versión anterior se pasaron al nuevo formato (${summarize(db)}).`, 'ok', 5000);
  else if (st === 'corrupt') toast('Los datos guardados estaban dañados. Se apartó una copia; restaura tu último respaldo.', 'error', 8000);
  else if (st === 'blocked') toast('El navegador no permite guardar datos (modo privado o bloqueo). Las notas no se conservarán.', 'error', 8000);
}
window.addEventListener('beforeunload', () => { if (dirty) saveNow(); });
/* Cualquier error inesperado se informa sin perder el trabajo. */
let lastErr = 0;
window.addEventListener('error', e => {
  console.error(e.error || e.message);
  if (Date.now() - lastErr > 4000) { lastErr = Date.now(); toast('Ocurrió un error inesperado. Tus datos están guardados; si se repite, descarga un respaldo y avísame qué estabas haciendo.', 'error', 6000); }
  try { if (dirty) saveNow(); } catch (_) { }
});
window.addEventListener('unhandledrejection', e => { console.error(e.reason); });
document.addEventListener('visibilitychange', () => { if (document.hidden && dirty) saveNow(); });
boot();

</script>
</body>
</html>

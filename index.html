<style>
:root {
  --primary: #4f46e5;
  --primary-dark: #3730a3;
  --primary-light: #eef2ff;
  --primary-ring: #c7d2fe;
  --ink: #0f172a;
  --ink-2: #334155;
  --muted: #64748b;
  --bg: #f1f5f9;
  --surface: #ffffff;
  --surface-2: #f8fafc;
  --border: #e2e8f0;
  --border-2: #cbd5e1;
  --nav: #1e293b;
  --ok: #15803d;
  --ok-bg: #dcfce7;
  --risk: #b45309;
  --risk-bg: #fef3c7;
  --bad: #b91c1c;
  --bad-bg: #fee2e2;
  --gold: #d97706;
  --radius: 14px;
  --shadow: 0 1px 2px rgba(15, 23, 42, .06), 0 1px 3px rgba(15, 23, 42, .08);
  --shadow-lg: 0 18px 40px -12px rgba(15, 23, 42, .25);
  --surface-3: #f1f5f9;
  --track: #e2e8f0;
  --track-2: #eef2f7;
  --primary-btn: #4f46e5;
  --primary-btn-h: #3730a3;
  --ok-bg-h: #bbf7d0;
  --bad-bg-h: #fecaca;
  --info: #1d4ed8;
  --info-bg: #dbeafe;
  --info-ink: #312e81;
  --warn-bg: #fffbeb; --warn-bd: #fde68a; --warn-ink: #78350f;
  --alert-bad-bg: #fef2f2; --alert-bad-bd: #fecaca; --alert-bad-ink: #7f1d1d;
  color-scheme: light;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  font-size: 15px;
  line-height: 1.45;
}
h1, h2, h3, h4 { margin: 0; line-height: 1.2; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: .8rem; }
.hidden { display: none !important; }
button { font: inherit; }

/* ---------- Iconos ---------- */
svg.i { width: 18px; height: 18px; fill: currentColor; flex: none; }
svg.i-sm { width: 15px; height: 15px; }

/* ---------- Navbar ---------- */
.navbar { background: var(--nav); color: #fff; position: sticky; top: 0; z-index: 50; box-shadow: 0 4px 10px -4px rgba(0,0,0,.25); }
.nav-inner { max-width: 1280px; margin: 0 auto; padding: .65rem 1rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
.brand { display: flex; align-items: center; gap: 12px; cursor: pointer; user-select: none; background: none; border: 0; color: inherit; padding: 0; text-align: left; }
.logo { width: 40px; height: 40px; border-radius: 10px; background: linear-gradient(135deg, #fcd34d, #d97706); color: #1e293b; display: grid; place-items: center; font-weight: 800; font-size: 1.45rem; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
.app-name { white-space: nowrap; font-weight: 800; font-size: 1.08rem; letter-spacing: -.3px; }
.app-sub { font-size: .63rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
.nav-actions { display: flex; align-items: center; gap: .4rem; }
.nav-btn { background: rgba(255,255,255,.08); color: #e2e8f0; border: 1px solid rgba(255,255,255,.08); border-radius: 10px; padding: .45rem .7rem; display: inline-flex; align-items: center; gap: .4rem; cursor: pointer; font-size: .82rem; font-weight: 600; }
.nav-btn:hover { background: rgba(255,255,255,.16); }
.save-state { font-size: .72rem; font-weight: 700; padding: .3rem .65rem; border-radius: 99px; display: inline-flex; align-items: center; gap: 6px; text-transform: uppercase; letter-spacing: .4px; }
.save-state::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.save-ok { background: rgba(34,197,94,.15); color: #86efac; }
.save-pending { background: rgba(251,191,36,.15); color: #fcd34d; }
.save-err { background: rgba(239,68,68,.2); color: #fca5a5; }

/* ---------- Layout ---------- */
.main { max-width: 1280px; width: 100%; margin: 0 auto; padding: 1.4rem 1rem 3rem; flex: 1; }
.footer { background: var(--surface); border-top: 1px solid var(--border); color: var(--muted); font-size: .78rem; }
.footer-inner { max-width: 1280px; margin: 0 auto; padding: 1rem; display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
.card-pad { padding: 1.15rem 1.25rem; }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin: 1.6rem 0 1rem; flex-wrap: wrap; }
.section-head h2 { font-size: 1.2rem; }
.row { display: flex; align-items: center; gap: .5rem; }
.row-wrap { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
.spacer { flex: 1; }

/* ---------- Botones ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .45rem; padding: .55rem 1rem; border-radius: 10px; border: 1px solid transparent; font-weight: 600; font-size: .88rem; cursor: pointer; transition: background .15s, border-color .15s, transform .1s; white-space: nowrap; text-decoration: none; }
.btn:active { transform: scale(.97); }
.btn:focus-visible, .nav-btn:focus-visible, .chip:focus-visible, .tab:focus-visible { outline: 3px solid var(--primary-ring); outline-offset: 1px; }
.btn-primary { background: var(--primary-btn); color: #fff; box-shadow: 0 4px 10px -4px rgba(79,70,229,.6); }
.btn-primary:hover { background: var(--primary-btn-h); }
.btn-secondary { background: var(--surface); color: var(--ink); border-color: var(--border); }
.btn-secondary:hover { background: var(--surface-2); border-color: var(--border-2); }
.btn-ghost { background: transparent; color: var(--ink-2); }
.btn-ghost:hover { background: var(--track); }
.btn-danger { background: var(--bad-bg); color: var(--bad); }
.btn-danger:hover { background: var(--bad-bg-h); }
.btn-ok { background: var(--ok-bg); color: var(--ok); }
.btn-ok:hover { background: var(--ok-bg-h); }
.btn-warn { background: #f59e0b; color: #1f2937; }
.btn-sm { padding: .38rem .7rem; font-size: .8rem; border-radius: 8px; }
.btn-icon { width: 34px; height: 34px; padding: 0; border-radius: 9px; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.link { background: none; border: 0; padding: 0; color: var(--ink); font-weight: 600; cursor: pointer; text-align: left; }
.link:hover { color: var(--primary); text-decoration: underline; }

/* ---------- Formularios ---------- */
input[type=text], input[type=number], input[type=search], input[type=date], input[type=time], input[type=email], input[type=password], select, textarea {
  font: inherit; font-size: 16px; color: var(--ink);
  border: 1px solid var(--border-2); border-radius: 9px; background: var(--surface);
  padding: .5rem .65rem; outline: none; transition: border-color .15s, box-shadow .15s; width: 100%;
}
input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-ring); }
textarea { resize: vertical; min-height: 80px; }
label.field, div.field { display: flex; flex-direction: column; gap: .3rem; font-size: .78rem; font-weight: 700; color: var(--ink-2); }
label.field small, div.field small { font-weight: 500; color: var(--muted); }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: .85rem; }
.check { display: flex; align-items: center; gap: .5rem; font-size: .88rem; cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--primary); }
.search { position: relative; flex: 1; min-width: 200px; max-width: 360px; }
.search input { padding-left: 2.2rem; }
.search svg { position: absolute; left: .7rem; top: 50%; transform: translateY(-50%); color: var(--muted); }

/* ---------- Alertas ---------- */
.alert { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .8rem 1rem; border-radius: 12px; margin: 1rem 0; font-size: .88rem; flex-wrap: wrap; border: 1px solid; }
.alert-warn { background: var(--warn-bg); border-color: var(--warn-bd); color: var(--warn-ink); }
.alert-bad { background: var(--alert-bad-bg); border-color: var(--alert-bad-bd); color: var(--alert-bad-ink); }
.alert-info { background: var(--primary-light); border-color: var(--primary-ring); color: var(--info-ink); }

/* ---------- Inicio ---------- */
.hero { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; padding: 1.3rem 1.4rem; border-left: 5px solid var(--primary); }
.hero h1 { font-size: 1.55rem; }
.hero p { margin-top: .25rem; }
.hero-stats { display: flex; gap: 1.6rem; }
.hero-stats div { text-align: center; }
.hero-stats b { display: block; font-size: 1.6rem; color: var(--primary); line-height: 1; }
.hero-stats span { font-size: .68rem; text-transform: uppercase; font-weight: 700; color: var(--muted); letter-spacing: .5px; }

.mod-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 1.1rem; }
.mod-card { padding: 1.1rem 1.15rem; cursor: pointer; transition: transform .15s, box-shadow .15s, border-color .15s; display: flex; flex-direction: column; gap: .7rem; }
.mod-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); border-color: var(--primary-ring); }
.mod-top { display: flex; justify-content: space-between; align-items: flex-start; }
.mod-avatar { width: 46px; height: 46px; border-radius: 11px; background: var(--primary-light); color: var(--primary); display: grid; place-items: center; font-weight: 800; font-size: 1rem; letter-spacing: -.5px; }
.mod-card h3 { font-size: 1.08rem; }
.mod-metrics { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: .5rem; }
.metric { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: .45rem .55rem; }
.metric b { display: block; font-size: 1.05rem; }
.metric span { font-size: .64rem; color: var(--muted); text-transform: uppercase; font-weight: 700; letter-spacing: .4px; }
.progress { height: 6px; background: var(--track); border-radius: 99px; overflow: hidden; }
.progress > div { height: 100%; background: var(--primary); border-radius: 99px; }
.progress-label { display: flex; justify-content: space-between; font-size: .7rem; color: var(--muted); font-weight: 600; margin-bottom: .25rem; }
.empty { text-align: center; padding: 3.5rem 1rem; border: 2px dashed var(--border-2); border-radius: var(--radius); color: var(--muted); }
.empty .big { font-size: 2.6rem; margin-bottom: .6rem; }
.empty p + p { margin-top: .3rem; }

/* ---------- Módulo ---------- */
.mod-head { display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; }
.mod-head h1 { font-size: 1.35rem; }
.tabs { display: flex; gap: .25rem; margin: 1.1rem 0 1.2rem; border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; }
.tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: .65rem .9rem; font-weight: 700; color: var(--muted); cursor: pointer; display: inline-flex; gap: .4rem; align-items: center; white-space: nowrap; font-size: .9rem; }
.tab:hover { color: var(--ink); }
.tab.active { color: var(--primary); border-bottom-color: var(--primary); }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: .8rem; margin-bottom: 1rem; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: .8rem 1rem; box-shadow: var(--shadow); }
.stat span { font-size: .68rem; text-transform: uppercase; font-weight: 700; color: var(--muted); letter-spacing: .5px; }
.stat b { display: block; font-size: 1.55rem; line-height: 1.15; margin-top: .15rem; }
.stat.ok b { color: var(--ok); } .stat.risk b { color: var(--risk); } .stat.bad b { color: var(--bad); } .stat.pri b { color: var(--primary); }

.toolbar { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; padding: .8rem; border-bottom: 1px solid var(--border); background: var(--surface-2); border-radius: var(--radius) var(--radius) 0 0; }

/* ---------- Tablas ---------- */
.table-wrap { overflow: auto; max-width: 100%; }
table { border-collapse: separate; border-spacing: 0; width: 100%; }
.tbl th { background: var(--surface-2); color: var(--muted); font-size: .7rem; text-transform: uppercase; letter-spacing: .4px; font-weight: 800; text-align: left; padding: .6rem .7rem; border-bottom: 1px solid var(--border); white-space: nowrap; position: sticky; top: 0; z-index: 2; }
.tbl td { padding: .5rem .7rem; border-bottom: 1px solid var(--border); font-size: .88rem; white-space: nowrap; }
.tbl tbody tr:hover td { background: var(--surface-2); }
.tbl tr:last-child td { border-bottom: 0; }
.c { text-align: center !important; }
.r { text-align: right !important; }
.num-col { width: 46px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tabnum { font-variant-numeric: tabular-nums; }
.pill { display: inline-block; padding: .15rem .55rem; border-radius: 6px; font-weight: 800; font-variant-numeric: tabular-nums; min-width: 52px; text-align: center; }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.risk { background: var(--risk-bg); color: var(--risk); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.badge { display: inline-flex; align-items: center; gap: .3rem; font-size: .7rem; font-weight: 800; text-transform: uppercase; letter-spacing: .3px; padding: .2rem .5rem; border-radius: 99px; }
.badge.ok { background: var(--ok-bg); color: var(--ok); }
.badge.risk { background: var(--risk-bg); color: var(--risk); }
.badge.bad { background: var(--bad-bg); color: var(--bad); }
.badge.neutral { background: var(--track); color: var(--ink-2); }

/* Celdas editables */
input.cell { width: 52px; text-align: center; padding: .32rem .2rem; font-weight: 700; font-size: 15px; border-radius: 7px; border: 1px solid var(--border); background: var(--surface); font-variant-numeric: tabular-nums; }
input.cell:hover { border-color: var(--border-2); }
input.cell:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-ring); background: var(--surface); }
input.cell.bad { border-color: var(--bad) !important; background: var(--bad-bg) !important; color: var(--bad); }
input.cell.wide { width: 64px; }
input.cell.filled { background: var(--surface-2); }

/* Registro por RA (grid) */
.chips { display: flex; gap: .4rem; flex-wrap: wrap; margin-bottom: 1rem; }
.chip { border: 1px solid var(--border); background: var(--surface); border-radius: 99px; padding: .4rem .8rem; font-weight: 700; font-size: .82rem; cursor: pointer; color: var(--ink-2); display: inline-flex; align-items: center; gap: .35rem; }
.chip small { color: var(--muted); font-weight: 600; }
.chip:hover { border-color: var(--primary-ring); }
.chip.active { background: var(--primary-btn); color: #fff; border-color: var(--primary-btn); }
.chip.active small { color: #c7d2fe; }

.grid-wrap { overflow: auto; max-height: calc(100vh - 250px); min-height: 220px; border-radius: 0 0 var(--radius) var(--radius); }
.grid { border-collapse: separate; border-spacing: 0; }
.grid th, .grid td { border-bottom: 1px solid var(--border); border-right: 1px solid var(--surface-3); padding: .3rem .25rem; text-align: center; white-space: nowrap; background: var(--surface); }
.grid thead th { position: sticky; z-index: 3; font-size: .68rem; text-transform: uppercase; font-weight: 800; color: var(--ink-2); letter-spacing: .3px; }
.grid thead tr:first-child th { top: 0; height: 34px; }
.grid thead tr:nth-child(2) th { top: 34px; }
.grid .sticky-num { position: sticky; left: 0; z-index: 4; min-width: 42px; color: var(--muted); font-variant-numeric: tabular-nums; }
.grid .sticky-name { position: sticky; left: 42px; z-index: 4; text-align: left; min-width: 190px; max-width: 240px; overflow: hidden; text-overflow: ellipsis; padding-left: .6rem; padding-right: .6rem; box-shadow: 2px 0 0 var(--border); font-weight: 600; font-size: .88rem; }
.grid thead .sticky-num, .grid thead .sticky-name { z-index: 6; background: var(--surface-2); }
.grid tbody tr:hover td { background: var(--surface-2); }
.grid .item-h { cursor: pointer; min-width: 58px; user-select: none; }
.grid .item-h:hover { filter: brightness(.95); }
.grid .item-h small { display: block; font-weight: 600; color: var(--muted); text-transform: none; font-size: .65rem; }
.grid .out { font-weight: 700; font-variant-numeric: tabular-nums; font-size: .86rem; min-width: 70px; padding: 0 .6rem; }
.grid .out-h { background: var(--surface-2); }

/* Colores de criterios */
.cat-violet { --c: #6d28d9; --cb: #f3e8ff; }
.cat-green  { --c: #15803d; --cb: #dcfce7; }
.cat-orange { --c: #c2410c; --cb: #ffedd5; }
.cat-blue   { --c: #1d4ed8; --cb: #dbeafe; }
.cat-red    { --c: #b91c1c; --cb: #fee2e2; }
.cat-teal   { --c: #0f766e; --cb: #ccfbf1; }
.cat-pink   { --c: #be185d; --cb: #fce7f3; }
.cat-amber  { --c: #b45309; --cb: #fef3c7; }
th.cat-h, th.item-h { background: var(--cb) !important; color: var(--c) !important; }
.cat-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); display: inline-block; flex: none; }
.cat-tag { background: var(--cb); color: var(--c); font-weight: 800; font-size: .7rem; text-transform: uppercase; letter-spacing: .3px; padding: .25rem .55rem; border-radius: 6px; display: inline-flex; align-items: center; gap: .35rem; }

/* Vista por estudiante */
.stu-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; padding: 1rem 1.2rem; position: sticky; top: 64px; z-index: 20; margin-bottom: 1rem; }
.stu-total { text-align: right; }
.stu-total span { font-size: .68rem; text-transform: uppercase; font-weight: 800; color: var(--muted); }
.stu-total b { display: block; font-size: 1.9rem; line-height: 1; }
.ra-card { margin-bottom: 1rem; overflow: hidden; }
.ra-card-head { display: flex; align-items: center; gap: .7rem; padding: .7rem 1rem; background: var(--primary-light); border-bottom: 1px solid var(--primary-ring); flex-wrap: wrap; }
.ra-num { font-weight: 800; color: var(--primary); }
.ra-title { font-weight: 700; flex: 1; min-width: 140px; }
.ra-weight { background: var(--surface); border: 1px solid var(--primary-ring); color: var(--primary-dark); font-weight: 800; font-size: .78rem; padding: .2rem .55rem; border-radius: 7px; }
.ra-res { font-weight: 800; color: var(--primary-dark); font-variant-numeric: tabular-nums; }
.ra-body { padding: .8rem 1rem; display: flex; flex-direction: column; gap: .6rem; }
.cat-row { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; }
.cat-row .cat-tag { min-width: 130px; }
.cat-items { display: flex; gap: .3rem; flex-wrap: wrap; }
.cat-items label { display: flex; flex-direction: column; align-items: center; font-size: .6rem; font-weight: 700; color: var(--muted); gap: 2px; }
.cat-sum { margin-left: auto; font-size: .78rem; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }

.final-card { background: linear-gradient(145deg, #1e293b, #0f172a); color: #fff; border: 0; padding: 1rem 1.2rem; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; }
.final-card .tag { background: var(--gold); color: #0f172a; border-radius: 6px; padding: 2px 8px; font-weight: 800; font-size: .8rem; }
.final-card input.cell { width: 90px; font-size: 1.3rem; background: rgba(255,255,255,.1); color: #fff; border-color: rgba(255,255,255,.25); }
.final-card input.cell:focus { background: rgba(255,255,255,.15); }
.final-card .big { font-size: 2rem; font-weight: 800; color: #fbbf24; line-height: 1; }

/* Configuración */
.cfg-ra { margin-bottom: 1rem; overflow: hidden; }
.cfg-ra-head { display: grid; grid-template-columns: auto 1fr 104px 104px auto; gap: .6rem; align-items: center; padding: .75rem 1rem; background: var(--surface-2); border-bottom: 1px solid var(--border); }
.cfg-ra-head .w-input { position: relative; }
.cfg-ra-head .w-input input { padding-right: 1.6rem; text-align: right; font-weight: 800; }
.cfg-ra-head .w-input span { position: absolute; right: .6rem; top: 50%; transform: translateY(-50%); color: var(--muted); font-weight: 700; font-size: .85rem; }
.cfg-cats td { padding: .4rem .5rem; }

/* Barras de promedio por RA */

.modal-foot { display: flex; justify-content: flex-end; gap: .5rem; padding: .9rem 1.2rem; border-top: 1px solid var(--border); flex-wrap: wrap; }

.menu-list .btn { justify-content: flex-start; }
.snap-row { display: flex; align-items: center; justify-content: space-between; gap: .8rem; padding: .6rem .7rem; border: 1px solid var(--border); border-radius: 10px; }

.snap-row span { display: block; font-size: .75rem; color: var(--muted); }

/* ---------- Toast ---------- */

/* Logro de RA */

.ra-reasons { display: flex; flex-wrap: wrap; gap: .3rem 1rem; padding: .5rem 1rem; font-size: .78rem; border-bottom: 1px solid var(--border); background: var(--surface); color: var(--bad); font-weight: 600; }

.bar-row { grid-template-columns: 70px 1fr 54px 100px; }

.act-list { display: flex; flex-direction: column; gap: .45rem; }
.act-row { display: grid; grid-template-columns: 70px 1fr 150px; gap: .5rem; align-items: center; }

@media (max-width: 640px) { .act-row { grid-template-columns: 56px 1fr; } .act-row input[type=date] { grid-column: 2; } }

/* ---------- Panel (dashboards) ---------- */
.viz-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(440px, 1fr)); gap: 1rem; }
.viz-card { padding: 1rem 1.15rem 1.1rem; min-width: 0; }
.viz-wide { grid-column: 1 / -1; }
.viz-head { margin-bottom: .6rem; list-style: none; cursor: default; }
.viz-head::-webkit-details-marker { display: none; }
details > summary.viz-head { cursor: pointer; }
.viz-head h3 { font-size: 1rem; }
.viz-head p { font-size: .8rem; color: var(--muted); margin-top: .2rem; }

.ref-key { width: 14px; border-top: 2px dashed var(--ink); display: inline-block; }

.stack { display: flex; gap: 2px; height: 24px; border-radius: 6px; overflow: hidden; min-width: 0; }

.ov-list { display: flex; flex-direction: column; gap: .35rem; }

.ra-rows { display: flex; flex-direction: column; gap: .5rem; }

#vizTip { position: fixed; z-index: 3000; pointer-events: none; background: #0f172a; color: #fff; font-size: .78rem; font-weight: 600; line-height: 1.35; padding: .45rem .65rem; border-radius: 8px; max-width: 320px; box-shadow: var(--shadow-lg); opacity: 0; transition: opacity .1s; }

.row-wrap { min-width: 0; max-width: 100%; }

/* =========================================================
   Componentes nuevos: copiar, agenda, calendario, asistencia, anecdotario
   ========================================================= */

/* =========================================================
   Modo oscuro
   ========================================================= */
:root[data-theme="dark"] {
  color-scheme: dark;
  --primary: #818cf8; --primary-dark: #a5b4fc; --primary-light: #21294d; --primary-ring: rgba(129, 140, 248, .42);
  --primary-btn: #6366f1; --primary-btn-h: #4f46e5;
  --ink: #e6e9ef; --ink-2: #c4cad6; --muted: #8e99ab;
  --bg: #0c1222; --surface: #151d2e; --surface-2: #1a2336; --surface-3: #1f2a3f;
  --border: #273249; --border-2: #364365; --track: #263149; --track-2: #222c42;
  --nav: #080d19;
  --ok: #4ade80; --ok-bg: rgba(34, 197, 94, .15); --ok-bg-h: rgba(34, 197, 94, .25);
  --risk: #fbbf24; --risk-bg: rgba(245, 158, 11, .15);
  --bad: #f87171; --bad-bg: rgba(239, 68, 68, .15); --bad-bg-h: rgba(239, 68, 68, .26);
  --info: #93c5fd; --info-bg: rgba(59, 130, 246, .17); --info-ink: #c7d2fe;
  --warn-bg: rgba(245, 158, 11, .09); --warn-bd: rgba(245, 158, 11, .35); --warn-ink: #fcd34d;
  --alert-bad-bg: rgba(239, 68, 68, .09); --alert-bad-bd: rgba(239, 68, 68, .35); --alert-bad-ink: #fca5a5;
  --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 1px 3px rgba(0, 0, 0, .25);
  --shadow-lg: 0 18px 40px -12px rgba(0, 0, 0, .65);
}
:root[data-theme="dark"] .cat-violet { --c: #c4b5fd; --cb: #2a2852; }
:root[data-theme="dark"] .cat-green  { --c: #86efac; --cb: #173635; }
:root[data-theme="dark"] .cat-orange { --c: #fdba74; --cb: #392b2a; }
:root[data-theme="dark"] .cat-blue   { --c: #93c5fd; --cb: #1b2e50; }
:root[data-theme="dark"] .cat-red    { --c: #fca5a5; --cb: #382332; }
:root[data-theme="dark"] .cat-teal   { --c: #5eead4; --cb: #153641; }
:root[data-theme="dark"] .cat-pink   { --c: #f9a8d4; --cb: #37243f; }
:root[data-theme="dark"] .cat-amber  { --c: #fcd34d; --cb: #393228; }
:root[data-theme="dark"] .final-card { border: 1px solid var(--border); background: linear-gradient(145deg, #1b2438, #0e1424); }
:root[data-theme="dark"] .modal-overlay { background: rgba(2, 6, 23, .7); }
:root[data-theme="dark"] .logo { box-shadow: 0 2px 8px rgba(0, 0, 0, .5); }
:root[data-theme="dark"] #vizTip, :root[data-theme="dark"] .toast { box-shadow: 0 0 0 1px var(--border-2), var(--shadow-lg); }
:root[data-theme="dark"] .toast { background: #1f2a3f; }
:root[data-theme="dark"] .toast-ok { background: #166534; } :root[data-theme="dark"] .toast-warn { background: #92400e; } :root[data-theme="dark"] .toast-error { background: #991b1b; }
:root[data-theme="dark"] .btn-warn { background: #f59e0b; color: #111827; }
:root[data-theme="dark"] .grid .item-h:hover { filter: brightness(1.15); }
:root[data-theme="dark"] input[type=date]::-webkit-calendar-picker-indicator, :root[data-theme="dark"] input[type=time]::-webkit-calendar-picker-indicator { filter: invert(.8); }
html, body { transition: background-color .2s; }
@media print { :root[data-theme="dark"] body { background: #fff; color: #000; } }

/* =========================================================
   Animaciones y transiciones
   ========================================================= */
:root { --ease: cubic-bezier(.22, .8, .24, 1); --ease-spring: cubic-bezier(.34, 1.4, .5, 1); }
@keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@keyframes popIn { from { opacity: 0; transform: translateY(8px) scale(.97); } to { opacity: 1; transform: none; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideL { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
@keyframes slideR { from { opacity: 0; transform: translateX(-28px); } to { opacity: 1; transform: none; } }
@keyframes growX { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes navDown { from { opacity: 0; transform: translateY(-100%); } to { opacity: 1; transform: none; } }
@keyframes ringPulse { 0% { box-shadow: 0 0 0 0 var(--primary-ring); } 100% { box-shadow: 0 0 0 9px transparent; } }
@keyframes shimmer { from { background-position: -200% 0; } to { background-position: 200% 0; } }

.a-in { animation: fadeUp .42s var(--ease) backwards; animation-delay: calc(var(--i, 0) * 40ms); }
.a-pop { animation: popIn .45s var(--ease) backwards; animation-delay: calc(80ms + var(--i, 0) * 45ms); }
.a-fade { animation: fadeIn .3s ease backwards; }
.slide-l { animation: slideL .34s var(--ease) backwards; }
.slide-r { animation: slideR .34s var(--ease) backwards; }
/* Barras de progreso y de rendimiento crecen al entrar */
.a-in .progress > div, .a-pop .progress > div, .a-in .track > .fill, .a-in .stack > div { transform-origin: left center; animation: growX .8s var(--ease) backwards; animation-delay: .15s; }
/* Barra superior al abrir el programa */
.navbar { animation: navDown .5s var(--ease) backwards; }
.logo { transition: transform .35s var(--ease-spring); }
.logo:hover { transform: rotate(-8deg) scale(1.08); }
.nav-btn { transition: background .2s, transform .15s, color .2s; }
.nav-btn:hover { transform: translateY(-1px); }
.nav-btn:active { transform: scale(.96); }
/* Pestañas con subrayado animado */
.tab { position: relative; transition: color .2s, background .2s; border-radius: 8px 8px 0 0; }
.tab:hover { background: var(--surface-2); }
.tab.active { border-bottom-color: transparent; }
.tab::after { content: ''; position: absolute; left: .55rem; right: .55rem; bottom: -3px; height: 3px; border-radius: 3px 3px 0 0; background: var(--primary); transform: scaleX(0); transition: transform .25s var(--ease); }
.tab.active::after { transform: scaleX(1); }
.tabs.tab-anim .tab.active::after { animation: growX .35s var(--ease) backwards; }
/* Botones y tarjetas */
.btn { transition: background .18s, border-color .18s, box-shadow .2s, transform .12s, color .18s; }
.btn-primary:hover { box-shadow: 0 6px 16px -6px var(--primary-ring); }
.btn:active { transform: scale(.96); }
.card { transition: box-shadow .25s, border-color .25s, background-color .25s; }
.stat { transition: transform .2s var(--ease), box-shadow .2s; }
.stat:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.mod-card { transition: transform .25s var(--ease), box-shadow .25s, border-color .25s; }
.mod-card:hover { transform: translateY(-4px); }
.mod-card .mod-avatar { transition: transform .3s var(--ease-spring); }
.mod-card:hover .mod-avatar { transform: scale(1.06); }
.ag-item { transition: background .15s, transform .15s; }
.ag-item:hover { transform: translateX(2px); }
.cal-cell { transition: background .15s, box-shadow .15s; }
.cal-cell:not(.cal-out):hover { box-shadow: inset 0 0 0 2px var(--primary-ring); }
.cal-today .cal-dn span { animation: ringPulse 1.6s ease-out 2; }
.ev-chip { transition: filter .15s, transform .15s; }
.ev-chip:hover { transform: translateX(1px); }
input, select, textarea { transition: border-color .18s, box-shadow .18s, background-color .18s; }
/* Ventanas emergentes y avisos más fluidos */
.modal-overlay { transition: opacity .22s ease; }
.modal { transition: transform .32s var(--ease-spring), opacity .22s; opacity: .6; transform: translateY(14px) scale(.96); }
.modal-overlay.open .modal { opacity: 1; transform: none; }
.toast { transition: opacity .3s, transform .35s var(--ease-spring); transform: translateY(14px) scale(.96); }
.toast.show { transform: none; }
/* Cambio de tema con fundido suave */
::view-transition-old(root), ::view-transition-new(root) { animation-duration: .35s; }
/* Sin animaciones: preferencia del sistema o desactivadas en Ajustes */
:root[data-motion-off] *, :root[data-motion-off] *::before, :root[data-motion-off] *::after { animation: none !important; transition: none !important; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
@media print { *, *::before, *::after { animation: none !important; transition: none !important; } }

function normalizeDB(d) {

/** Migra datos de Praxis Pro 7.x (clave sysTecDb) al formato 8.0 */
function migrateV1(old) {
  if (!old || !Array.isArray(old.modules)) throw new Error('El archivo no contiene módulos reconocibles.');
  const out = defaultDB();
  const labels = ['Exposición', 'Participación', 'Práctica', 'Tarea', 'Examen'];
  const colors = ['violet', 'green', 'orange', 'blue', 'red'];
  old.modules.forEach(m => {
    const students = Array.isArray(m.students) ? m.students : [];
    const g = Array.isArray(m.globalRas) ? m.globalRas : [];
    const n = Math.max(g.length, ...students.map(s => (Array.isArray(s.ras) ? s.ras.length : 0)), 0);
    const ras = [];
    for (let i = 0; i < n; i++) {
      const tpl = g[i] || ((students.find(s => s.ras && s.ras[i]) || {}).ras || [])[i] || {};
      ras.push({
        id: uid(), name: tpl.name || `RA ${i + 1}`, w: parseFloat(tpl.w) || 0,
        cats: labels.map((l, ci) => ({ id: uid(), label: l, count: 1, max: (tpl.crit && parseFloat(tpl.crit[ci] && tpl.crit[ci].m)) || 20, color: colors[ci] }))
      });
    }
    const nm = { id: uid(), name: m.name || 'Módulo', course: '', finalWeight: 30, finalLabel: 'Examen final / Proyecto', blankMode: 'ignore', ras, students: [] };
    students.forEach((s, si) => {
      const fin = parseFloat(s.final);
      const st = { id: uid(), num: si + 1, name: String(s.name || ''), final: isFinite(fin) && fin > 0 ? fin : '', g: {}, obs: '' };
      (s.ras || []).forEach((r, ri) => {
        if (!ras[ri] || !r || !Array.isArray(r.crit)) return;
        r.crit.forEach((c, ci) => {
          if (!c || c.v === '' || c.v === null || c.v === undefined) return;
          const v = parseFloat(c.v);
          if (!isFinite(v)) return;
          const cat = ras[ri].cats[ci];
          if (!cat) return;
          st.g[ras[ri].id] = st.g[ras[ri].id] || {};
          st.g[ras[ri].id][cat.id] = [v];
        });
      });
      nm.students.push(st);
    });
    out.modules.push(normalizeModule(nm));
  });
  return out;
}

function snapshot(reason) {

  while (list.length > MAX_SNAPS) list.pop();

    catch (e) { list.pop(); }

}

/* ---------- Cálculo (una sola fuente para todas las pantallas y reportes) ---------- */
/* Estados de un RA:
   ok   = Logrado     → alcanza el logro mínimo y cumple las actividades mínimas de cada criterio
   proc = En proceso  → aún no cumple, pero quedan actividades por calificar (solo en modo progreso)
   no   = No logrado  → no cumple y ya no quedan actividades pendientes (o el modo es definitivo)
   pend = Sin evaluar → todavía no tiene ninguna nota (solo en modo progreso)
   rec  = Recuperado  → no lo logró, pero aprobó la actividad de recuperación (cuenta como logrado)   */
const RA_STATUS = {
  ok: { cls: 'ok', label: 'Logrado', icon: '✓' },
  rec: { cls: 'ok', label: 'Recuperado', icon: '↺' },
  proc: { cls: 'risk', label: 'En proceso', icon: '…' },
  no: { cls: 'bad', label: 'No logrado', icon: '✗' },
  pend: { cls: 'neutral', label: 'Sin evaluar', icon: '—' }
};
/** Logro mínimo (%) que se exige en un RA: el propio del RA o, si no tiene, el del módulo. */
const raMin = (m, ra) => isNum(ra.minPct) ? ra.minPct : m.raPass;
/** Una actividad cuenta como «realizada» si tiene una nota mayor que 0. */
function calcRA(m, s, ra) {
  let obt = 0, max = 0, filled = 0, total = 0;
  const g = s.g[ra.id] || {};
  const missing = [];
  ra.cats.forEach(c => {
    const a = g[c.id] || [];
    let done = 0;
    for (let i = 0; i < c.count; i++) {
      total++;
      if (isNum(a[i])) { obt += a[i]; max += c.max; filled++; if (a[i] > 0) done++; }
      else if (m.blankMode === 'zero') max += c.max;
    }
    if (c.minDone > 0 && done < c.minDone) missing.push({ cat: c, done, need: c.minDone });
  });
  const pct = max > 0 ? obt / max : 0;
  const min = raMin(m, ra);
  const pctOk = pct * 100 >= min - 1e-9;
  let status;
  if (filled === 0) status = m.blankMode === 'zero' ? 'no' : 'pend';
  else if (pctOk && !missing.length) status = 'ok';
  else if (m.blankMode === 'ignore' && filled < total) status = 'proc';
  else status = 'no';
  const x = { obt, max, pct, pts: pct * (ra.w || 0), filled, total, status, pctOk, min, missing, origPct: pct, rec: null };
  // Recuperación: si el RA no estaba logrado y el estudiante hizo la recuperación
  const rec = s.rec && s.rec[ra.id];
  if (rec && isNum(rec.score) && status !== 'ok') {
    const cap = m.recCap === 'none' ? 100 : min;
    const recPct = Math.min(rec.score, cap) / 100;
    x.rec = rec;
    if (recPct > x.pct) { x.pct = recPct; x.pts = recPct * (ra.w || 0); }
    x.status = rec.score >= min - 1e-9 ? 'rec' : 'no';
  }
  return x;
}
const raAchieved = x => x.status === 'ok' || x.status === 'rec';

/** Explica por qué un RA no está logrado (para pantallas y boletines). */
function raReasons(x) {
  const out = [];
  if (x.status === 'pend') return ['Sin notas todavía'];
  if (x.status === 'rec') return [`Recuperado con ${fmtN(x.rec.score)} (logro original ${Math.round(x.origPct * 100)}%)`];
  if (x.rec) out.push(`Recuperación: ${fmtN(x.rec.score)} (mínimo ${fmtN(x.min)})`);
  if (!x.pctOk) out.push(`Logro ${Math.round(x.origPct * 100)}% (mínimo ${fmtN(x.min)}%)`);
  x.missing.forEach(f => out.push(`${f.cat.label}: ${f.done} de ${f.need} realizadas`));
  return out;
}
function calcCat(s, ra, c) {
  const a = (s.g[ra.id] && s.g[ra.id][c.id]) || [];
  let obt = 0, filled = 0;
  for (let i = 0; i < c.count; i++) if (isNum(a[i])) { obt += a[i]; filled++; }
  return { obt, filled, max: c.count * c.max };
}
function calcStudent(m, s) {
  let acc = 0, filled = 0, slots = 0;
  const ras = m.ras.map(ra => { const x = calcRA(m, s, ra); acc += x.pts; filled += x.filled; slots += x.total; return x; });
  const finalSet = isNum(s.final);
  const fin = finalSet ? s.final : 0;
  const raOk = ras.filter(raAchieved).length;
  const raBlock = !!m.requireAllRA && m.ras.length > 0 && raOk < m.ras.length;
  return { ras, acc, fin, finalSet, total: acc + fin, filled: filled + (finalSet ? 1 : 0), slots: slots + 1, raOk, raBlock };
}
/** Condición final. Acepta el resultado de calcStudent (aplica la regla «todos los RA logrados») o solo un número. */
function statusOf(r) {
  const st = db.settings;
  const total = typeof r === 'number' ? r : r.total;
  if (total >= st.pass) {
    if (typeof r === 'object' && r.raBlock) return { cls: 'risk', label: 'RA pendientes' };
    return { cls: 'ok', label: 'Aprobado' };
  }
  if (total >= st.risk) return { cls: 'risk', label: 'En riesgo' };
  return { cls: 'bad', label: 'Reprobado' };
}
const fmtTotal = t => db.settings.roundTotal ? String(Math.round(t)) : fmt(t);

function moduleStats(m) {
  const res = m.students.map(s => calcStudent(m, s));
  const n = res.length;
  let ap = 0, rk = 0, rp = 0, filled = 0, slots = 0, sum = 0;
  res.forEach(r => {
    sum += r.total;
    const st = statusOf(r).cls;
    if (st === 'ok') ap++; else if (st === 'risk') rk++; else rp++;
    filled += r.filled; slots += r.slots;
  });
  const raAvg = m.ras.map((ra, i) => n ? res.reduce((a, r) => a + r.ras[i].pct, 0) / n : 0);
  const raOkCount = m.ras.map((ra, i) => res.filter(r => raAchieved(r.ras[i])).length);
  return { res, n, avg: n ? sum / n : 0, ap, rk, rp, progress: slots ? filled / slots : 0, raAvg, raOkCount };
}
function weightIssue(m) {
  const sum = m.ras.reduce((a, r) => a + (+r.w || 0), 0);
  const exp = 100 - m.finalWeight;
  return Math.abs(sum - exp) > 0.05 ? { sum: r2(sum), exp: r2(exp) } : null;
}
/** Estado de la suma de valores de los RA frente a lo que deben sumar (100 − cierre). */
function weightStatus(m) {
  const sum = r2(m.ras.reduce((a, r) => a + (+r.w || 0), 0));
  const exp = r2(100 - m.finalWeight);
  const diff = r2(sum - exp);
  return { sum, exp, diff, ok: Math.abs(diff) <= 0.05 };
}
/** Ajusta todos los valores en la misma proporción para que sumen exacto, respetando la importancia relativa que dio el docente. */
function scaleWeights(m) {
  const { sum, exp } = weightStatus(m);
  if (!m.ras.length) return;
  if (sum <= 0) return distributeWeights(m);
  m.ras.forEach(r => { r.w = Math.round((+r.w || 0) * exp / sum * 100) / 100; });
  const s2 = m.ras.reduce((a, r) => a + r.w, 0);
  const big = m.ras.reduce((a, r) => (r.w > a.w ? r : a), m.ras[0]);
  big.w = r2(big.w + (exp - s2));
}
/** Si el RA conserva el nombre automático «RA n», lo renumera según su posición. */
function renumberDefaultNames(m) { m.ras.forEach((r, i) => { if (/^RA \d+$/.test(String(r.name).trim())) r.name = `RA ${i + 1}`; }); }
/** Reparte (100 − cierre) entre los RA; el último absorbe el redondeo para que sume exacto. */
function distributeWeights(m) {
  const n = m.ras.length; if (!n) return;
  const total = 100 - m.finalWeight;
  const base = Math.floor((total / n) * 100) / 100;
  m.ras.forEach((r, i) => { r.w = i === n - 1 ? r2(total - base * (n - 1)) : base; });
}

const ymShort = ym => MONTHS_S[+ym.slice(5, 7) - 1];
function addDays(iso, n) { const d = new Date(+iso.slice(0, 4), +iso.slice(5, 7) - 1, +iso.slice(8, 10)); d.setDate(d.getDate() + n); return ymd(d); }
function longDate(iso) {
  if (!isoDate(iso)) return '';
  const d = new Date(+iso.slice(0, 4), +iso.slice(5, 7) - 1, +iso.slice(8, 10));
  return `${WDAYS[d.getDay()].toLowerCase()} ${d.getDate()} de ${MONTHS[d.getMonth()].toLowerCase()}`;
}
const cap = s => String(s).charAt(0).toUpperCase() + String(s).slice(1);
function fmtTime12(h) {
  if (!isoTime(h)) return '';
  let [H, M] = h.split(':').map(Number); const ap = H >= 12 ? 'p. m.' : 'a. m.'; H = H % 12 || 12;
  return `${H}:${pad2(M)} ${ap}`;
}

/** Año escolar: agosto → junio. Se toma de Ajustes («2026-2027») o de la fecha actual. */
function schoolStartYear() {
  const m = String(db.settings.year || '').match(/(\d{4})/);
  if (m) return +m[1];
  const d = new Date(); return d.getMonth() >= 7 ? d.getFullYear() : d.getFullYear() - 1;
}
function schoolMonths() {
  const y = schoolStartYear(), out = [];
  for (let i = 0; i < 11; i++) { const mo = (7 + i) % 12, yr = y + (7 + i >= 12 ? 1 : 0); out.push(`${yr}-${pad2(mo + 1)}`); }
  return out;
}
function defaultMonth() { const cur = ymOf(todayISO()), ms = schoolMonths(); return ms.includes(cur) ? cur : ms[0]; }

/* ---------- Estudiantes únicos ----------
   Los módulos del mismo curso comparten el mismo grupo de estudiantes:
   se cuentan una sola vez (por curso + nombre). */
const groupKey = m => m.course ? 'c:' + norm(m.course) : 'm:' + m.id;
/**
 * Clave de una persona a partir de su nombre: no distingue mayúsculas, tildes, puntos, comas,
 * espacios de más ni el orden de las palabras.
 * «Ana María Pérez», «ANA MARIA PEREZ» y «Pérez, Ana María» son la misma persona.
 */
function personKey(name) {
  return norm(name).replace(/[.,;:'"()\-_/]+/g, ' ').split(' ').filter(Boolean).sort().join(' ');
}
function uniqueStudentCount() {
  const set = new Set();
  db.modules.forEach(m => m.students.forEach(s => set.add(groupKey(m) + '|' + personKey(s.name))));
  return set.size;
}
function groupCount() { return new Set(db.modules.filter(m => m.students.length).map(groupKey)).size; }
function enrollmentCount() { return db.modules.reduce((a, m) => a + m.students.length, 0); }

/* ---------- Asistencia ----------
   m.classDays = { 'AAAA-MM': [días de clase] }
   s.att       = { 'AAAA-MM': '31 caracteres' }  (P presente · A ausente · T tardanza · E excusa · . sin marcar) */
const ATT_CODES = ['P', 'A', 'T', 'E'];
const ATT_INFO = {
  P: { label: 'Presente', cls: 'ok' },
  A: { label: 'Ausente', cls: 'bad' },
  T: { label: 'Tardanza', cls: 'risk' },
  E: { label: 'Excusa', cls: 'info' }
};
function normClassDays(cd) {
  const out = {};
  if (!cd || typeof cd !== 'object') return out;
  Object.keys(cd).forEach(ym => {
    if (!/^\d{4}-\d{2}$/.test(ym) || !Array.isArray(cd[ym])) return;
    const max = daysInMonth(ym);
    const days = [...new Set(cd[ym].map(Number).filter(d => d >= 1 && d <= max))].sort((a, b) => a - b);
    if (days.length) out[ym] = days;
  });
  return out;
}
function normAtt(att) {
  const out = {};
  if (!att || typeof att !== 'object') return out;
  Object.keys(att).forEach(ym => {
    if (!/^\d{4}-\d{2}$/.test(ym)) return;
    const s = String(att[ym] || '').toUpperCase().replace(/[^PATE.]/g, '.').padEnd(31, '.').slice(0, 31);
    if (/[PATE]/.test(s)) out[ym] = s;
  });
  return out;
}
const classDays = (m, ym) => (m.classDays && m.classDays[ym]) || [];
function getAtt(s, ym, d) { const c = ((s.att && s.att[ym]) || '')[d - 1]; return c && c !== '.' ? c : ''; }
function setAtt(s, ym, d, code) {
  if (!s.att || typeof s.att !== 'object') s.att = {};
  const cur = (s.att[ym] || '').padEnd(31, '.');
  const next = cur.slice(0, d - 1) + (ATT_CODES.includes(code) ? code : '.') + cur.slice(d);
  if (/[PATE]/.test(next)) s.att[ym] = next; else delete s.att[ym];
}
function addClassDay(m, iso) {
  if (!m.classDays || typeof m.classDays !== 'object') m.classDays = {};
  const ym = ymOf(iso), d = +iso.slice(8, 10);
  const list = m.classDays[ym] || [];
  if (list.includes(d)) return false;
  m.classDays[ym] = [...list, d].sort((a, b) => a - b);
  return true;
}
function removeClassDay(m, ym, d) {
  if (!m.classDays) m.classDays = {};
  m.classDays[ym] = classDays(m, ym).filter(x => x !== d);
  if (!m.classDays[ym].length) delete m.classDays[ym];
  m.students.forEach(s => setAtt(s, ym, d, ''));
}
/** Totales de un estudiante en uno o varios meses (solo días de clase). */
function attStats(m, s, yms) {
  const r = { P: 0, A: 0, T: 0, E: 0, days: 0, marked: 0 };
  yms.forEach(ym => classDays(m, ym).forEach(d => {
    r.days++;
    const c = getAtt(s, ym, d);
    if (c) { r[c]++; r.marked++; }
  }));
  r.attended = r.P + r.T;
  r.missed = r.A + r.E;
  r.pct = r.marked ? r.attended / r.marked : null;
  return r;
}
function attCourseStats(m, yms) {
  const t = { P: 0, A: 0, T: 0, E: 0, days: 0, marked: 0 };
  yms.forEach(ym => { t.days += classDays(m, ym).length; });
  m.students.forEach(s => { const r = attStats(m, s, yms); ATT_CODES.forEach(k => t[k] += r[k]); t.marked += r.marked; });
  t.pct = t.marked ? (t.P + t.T) / t.marked : null;
  return t;
}

/* ---------- Cuaderno anecdótico ---------- */
const ANEC_KINDS = {
  neg: { label: 'Conducta a mejorar', short: 'A mejorar', cls: 'bad', icon: '⚠' },
  pos: { label: 'Conducta positiva', short: 'Positiva', cls: 'ok', icon: '★' },
  obs: { label: 'Observación', short: 'Observación', cls: 'info', icon: '✎' }
};
const ANEC_CATS = {
  neg: ['Indisciplina en clase', 'No trabaja en clase', 'Uso del celular', 'Falta de respeto', 'Agresión verbal', 'Agresión física', 'Llegada tarde', 'Salida sin permiso', 'No trae materiales', 'Incumplimiento de tareas', 'Copia o deshonestidad', 'Daño a equipos o materiales', 'Otra'],
  pos: ['Participación destacada', 'Ayuda a sus compañeros', 'Liderazgo', 'Responsabilidad', 'Creatividad', 'Mejora notable', 'Buen comportamiento', 'Otra'],
  obs: ['Observación general', 'Salud', 'Situación familiar', 'Rendimiento académico', 'Otra']
};
const ANEC_SEV = { leve: 'Leve', moderada: 'Moderada', grave: 'Grave' };
const ANEC_ACTIONS = ['Ninguna', 'Llamada de atención verbal', 'Diálogo con el estudiante', 'Cambio de lugar', 'Comunicación a padres o tutores', 'Citación a padres o tutores', 'Referido a orientación', 'Referido a coordinación o dirección', 'Reconocimiento', 'Otra'];
function normAnec(e) {
  if (!e || typeof e !== 'object' || !e.sid) return null;
  const kind = ANEC_KINDS[e.kind] ? e.kind : 'obs';
  return {
    id: String(e.id || uid()), sid: String(e.sid), date: isoDate(e.date) || todayISO(), time: isoTime(e.time),
    kind, cat: String(e.cat || ANEC_CATS[kind][0]), sev: kind === 'neg' && ANEC_SEV[e.sev] ? e.sev : '',
    desc: String(e.desc || ''), action: String(e.action || ''), follow: String(e.follow || ''), parents: !!e.parents
  };
}
const anecSort = (a, b) => (b.date + (b.time || '')).localeCompare(a.date + (a.time || ''));
function anecByStudent(m) {
  const map = new Map();
  m.students.forEach(s => map.set(s.id, { s, neg: 0, pos: 0, obs: 0, grave: 0, moderada: 0, leve: 0, last: '', cats: {} }));
  m.anec.forEach(e => {
    const r = map.get(e.sid); if (!r) return;
    r[e.kind]++;
    if (e.kind === 'neg') { if (e.sev) r[e.sev]++; r.cats[e.cat] = (r.cats[e.cat] || 0) + 1; }
    if (e.date > r.last) r.last = e.date;
  });
  return [...map.values()];
}
/** Puntaje para ordenar a quienes requieren más atención: grave 3, moderada 2, leve/sin gravedad 1. */
const anecScore = r => r.grave * 3 + r.moderada * 2 + (r.neg - r.grave - r.moderada);

/* ---------- Recuperación de RA ----------
   s.rec = { [raId]: { score: 0–100, date, act, note } } */
function normRec(rec) {
  const out = {};
  if (!rec || typeof rec !== 'object') return out;
  Object.keys(rec).forEach(k => {
    const r = rec[k]; if (!r || typeof r !== 'object') return;
    const score = parseFloat(r.score);
    out[String(k)] = { score: isFinite(score) ? Math.min(100, Math.max(0, r2(score))) : '', date: isoDate(r.date), act: String(r.act || '').slice(0, 200), note: String(r.note || '').slice(0, 300) };
    if (r.ex) out[String(k)].ex = true;   // excluido de la lista de recuperación
  });
  return out;
}
function setRec(s, raId, data) {
  if (!s.rec || typeof s.rec !== 'object') s.rec = {};
  const cur = s.rec[raId] || { score: '', date: '', act: '', note: '' };
  const next = Object.assign({}, cur, data);
  if (!next.ex) delete next.ex;
  if (!isNum(next.score) && !next.act && !next.note && !next.date && !next.ex) delete s.rec[raId];
  else s.rec[raId] = next;
}

/* ---------- Grupos de trabajo ----------
   m.groups = [{ id, name, type, date, actKey, groups: [{ name, members: [sid] }] }] */
function normGroupSet(g) {

  return {
    id: String(g.id || uid()), name: String(g.name || 'Grupos').slice(0, 80), type: String(g.type || 'Exposición'),
    date: isoDate(g.date) || todayISO(), actKey: g.actKey ? String(g.actKey) : '',
    groups: g.groups.map((x, i) => ({ name: String((x && x.name) || `Grupo ${i + 1}`).slice(0, 40), members: Array.isArray(x && x.members) ? x.members.map(String) : [] }))
  };
}

/* ---------- Agenda / calendario ---------- */
const EV_TYPES = {
  'Tarea': 'blue', 'Práctica': 'orange', 'Exposición': 'violet', 'Examen': 'red',
  'Proyecto': 'teal', 'Participación': 'green', 'Reunión': 'pink', 'Otro': 'amber'
};
function normAgenda(e) {
  if (!e || typeof e !== 'object' || !isoDate(e.date)) return null;
  return {
    id: String(e.id || uid()), title: String(e.title || 'Evento').slice(0, 120), date: e.date, time: isoTime(e.time),
    type: EV_TYPES[e.type] ? e.type : 'Otro', modId: e.modId ? String(e.modId) : '', notes: String(e.notes || ''), done: !!e.done
  };
}
/** Tipo de evento a partir del nombre de un criterio (Práctica, Examen, …). */
function typeFromCat(label) {
  const n = norm(label);
  if (n.includes('pract')) return 'Práctica';
  if (n.includes('expo')) return 'Exposición';
  if (n.includes('exam') || n.includes('prueba')) return 'Examen';
  if (n.includes('proyect')) return 'Proyecto';
  if (n.includes('particip')) return 'Participación';
  if (n.includes('tarea') || n.includes('cuaderno')) return 'Tarea';
  return 'Otro';
}
/** Todas las actividades con fecha (del registro de notas) y los eventos de la agenda. */
function allEvents(filterMod) {
  const out = [];
  db.modules.forEach(m => {
    if (filterMod && m.id !== filterMod) return;
    m.ras.forEach((ra, ri) => ra.cats.forEach(c => {
      for (let i = 0; i < c.count; i++) {
        const a = actOf(c, i); if (!a.d) continue;
        let graded = 0;
        m.students.forEach(s => { if (isNum(getGrade(s, ra.id, c.id, i))) graded++; });
        out.push({
          src: 'act', key: `${m.id}|${ra.id}|${c.id}|${i}`, date: a.d, time: a.h || '', type: typeFromCat(c.label),
          title: `${c.count > 1 ? c.label + ' ' + (i + 1) : c.label}${a.n ? ': ' + a.n : ''}`, sub: `RA ${ri + 1}`,
          modId: m.id, mod: m, graded, total: m.students.length, done: m.students.length > 0 && graded >= m.students.length
        });
      }
    }));
  });
  db.agenda.forEach(e => {
    if (filterMod && e.modId !== filterMod) return;
    out.push({ src: 'ev', key: e.id, date: e.date, time: e.time, type: e.type, title: e.title, sub: '', modId: e.modId, mod: findMod(e.modId), done: e.done, notes: e.notes });
  });
  return out.sort((a, b) => (a.date + (a.time || '99')).localeCompare(b.date + (b.time || '99')));
}
/** Actividades ya pasadas que todavía tienen estudiantes sin nota. */
function pendingToGrade(filterMod) {
  const t = todayISO();
  return allEvents(filterMod).filter(e => e.src === 'act' && e.date <= t && !e.done && e.total > 0);
}
function agendaAlerts() {
  const t = todayISO(), tm = addDays(t, 1), evs = allEvents();
  const open = e => !(e.src === 'ev' && e.done);
  return {
    today: evs.filter(e => e.date === t && open(e)),
    tomorrow: evs.filter(e => e.date === tm && open(e)),
    week: evs.filter(e => e.date > tm && e.date <= addDays(t, 7) && open(e)),
    overdue: evs.filter(e => e.src === 'ev' && !e.done && e.date < t),
    pending: pendingToGrade()
  };
}

/* ---------- Copiar al portapapeles ---------- */
function copyText(text, msg) {
  const done = () => toast(msg || 'Copiado.', 'ok', 1800);
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (e) { toast('No se pudo copiar.', 'error'); }
    ta.remove();
  };
  try {
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, fallback);
    else fallback();
  } catch (e) { fallback(); }
}

/* ---------- Tema claro / oscuro ---------- */
const THEME_KEY = 'praxisTheme';
function getThemePref() { try { return localStorage.getItem(THEME_KEY) || 'light'; } catch (e) { return 'light'; } }
function isDark() { return document.documentElement.getAttribute('data-theme') === 'dark'; }
function applyTheme(pref) {
  const p = pref || getThemePref();
  const dark = p === 'dark' || (p === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  const b = document.querySelector('[data-act="theme"]');
  if (b) { b.innerHTML = dark ? ICON.sun : ICON.moon; b.title = dark ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'; }
}
function setThemePref(p) { try { localStorage.setItem(THEME_KEY, p); } catch (e) { } applyTheme(p); }
if (window.matchMedia) {
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (getThemePref() === 'auto') { applyTheme(); if (typeof render === 'function') render(); } }); } catch (e) { }
}

/* ---------- Avisos ---------- */
function toast(msg, type = 'info', ms = 2600) {
  const box = $('#toasts'); if (!box) return;
  const t = document.createElement('div');
  t.className = 'toast toast-' + type; t.textContent = msg;
  box.appendChild(t);
  while (box.children.length > 3) box.firstElementChild.remove();
  requestAnimationFrame(() => t.classList.add('show'));
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, ms);
}

/* ---------- Ventanas modales ---------- */
function openModal({ title, sub = '', icon = '•', body = '', actions = [], wide = false, onOpen }) {
  const ov = document.createElement('div');
  ov.className = 'modal-overlay';
  ov.innerHTML = `<div class="modal ${wide ? 'modal-wide' : ''}" role="dialog" aria-modal="true">
    <div class="modal-head"><div class="modal-icon">${icon}</div><div><h3>${esc(title)}</h3>${sub ? `<p>${esc(sub)}</p>` : ''}</div>
    <button class="modal-x" data-close aria-label="Cerrar">✕</button></div>
    <div class="modal-body">${body}</div><div class="modal-foot"></div></div>`;
  const foot = ov.querySelector('.modal-foot');
  const close = () => { ov.classList.remove('open'); document.removeEventListener('keydown', onKey, true); setTimeout(() => ov.remove(), 180); };
  actions.forEach(a => {
    const b = document.createElement('button');
    b.className = 'btn ' + (a.cls || 'btn-secondary');
    b.textContent = a.label;
    b.onclick = () => {
      if (a.onClick && a.onClick(ov, close) === false) return;
      close();
    };
    foot.appendChild(b);
  });
  if (!actions.length) foot.remove();
  ov.addEventListener('mousedown', e => { if (e.target === ov) { if (ov._onCancel) ov._onCancel(); close(); } });
  ov.querySelector('[data-close]').onclick = () => { if (ov._onCancel) ov._onCancel(); close(); };
  function onKey(e) {
    const top = $$('.modal-overlay').pop();
    if (top !== ov) return;
    if (e.key === 'Escape') { e.stopPropagation(); if (ov._onCancel) ov._onCancel(); close(); }
    else if (e.key === 'Enter' && e.target.tagName === 'INPUT' && ov.contains(e.target)) {
      const p = foot.querySelector('.btn-primary, .btn-danger');
      if (p) { e.preventDefault(); e.stopPropagation(); p.click(); }
    }
  }
  document.addEventListener('keydown', onKey, true);
  document.body.appendChild(ov);
  requestAnimationFrame(() => ov.classList.add('open'));
  if (onOpen) onOpen(ov, close);
  const first = ov.querySelector('input:not([type=checkbox]):not([type=file]), textarea, select');
  if (first) setTimeout(() => { first.focus(); if (first.select) first.select(); }, 60);
  return { el: ov, close };
}
function confirmBox(title, msg, okLabel, onOk, { danger = true, onCancel } = {}) {
  const md = openModal({
    title, icon: danger ? '⚠️' : '❔', body: `<p class="modal-msg">${esc(msg)}</p>`,
    actions: [
      { label: 'Cancelar', onClick: () => { if (onCancel) onCancel(); } },
      { label: okLabel, cls: danger ? 'btn-danger' : 'btn-primary', onClick: () => { onOk(); } }
    ]
  });
  md.el._onCancel = onCancel;
}
function promptBox(title, label, value, onOk, { icon = '✎', placeholder = '', inputmode = 'text' } = {}) {
  openModal({
    title, icon,
    body: `<label class="field">${esc(label)}<input type="text" id="pbInput" value="${esc(value)}" placeholder="${esc(placeholder)}" inputmode="${inputmode}" autocomplete="off"></label>`,
    actions: [{ label: 'Cancelar' }, { label: 'Aceptar', cls: 'btn-primary', onClick: ov => onOk(ov.querySelector('#pbInput').value.trim()) }]
  });
}

const curMod = () => findMod(state.modId);

function render() {
  const ae = document.activeElement;
  const key = ae && ae.dataset ? ae.dataset.key : null;
  let s0 = null, s1 = null;
  try { s0 = ae.selectionStart; s1 = ae.selectionEnd; } catch (e) { }
  const scroller = $('.grid-wrap'); const gScroll = scroller ? [scroller.scrollLeft, scroller.scrollTop] : null;

  const app = $('#app');
  try {
    ensureShape();
    if (state.view === 'module' && curMod()) app.innerHTML = renderModule(curMod());
    else if (state.view === 'calendar') app.innerHTML = renderCalendar();
    else if (state.view === 'semana') app.innerHTML = renderMiSemana();
    else { state.view = 'home'; state.modId = null; app.innerHTML = renderHome(); }
  } catch (err) {
    console.error(err);
    app.innerHTML = `<div class="empty"><div class="big">🛠️</div><p><strong>Esta pantalla no se pudo mostrar.</strong></p><p class="small">Tus datos están a salvo. Detalle técnico: ${esc(err && err.message || err)}</p><p style="margin-top:1rem"><button class="btn btn-primary" data-act="go-home">Volver al inicio</button></p></div>`;
  }
  $$('.nav-btn[data-view]').forEach(b => b.classList.toggle('active', b.dataset.view === state.view));

  const sc = $('.grid-wrap'); if (sc && gScroll) { sc.scrollLeft = gScroll[0]; sc.scrollTop = gScroll[1]; }
  try { afterRender(); } catch (e) { console.error(e); }
  if (key) {
    const el = document.querySelector(`[data-key="${CSS.escape(key)}"]`);
    if (el) { el.focus({ preventScroll: true }); try { if (s0 !== null) el.setSelectionRange(s0, s1); } catch (e) { } }
  }
}

function queueRender() { if (renderQueued) return; renderQueued = true; setTimeout(() => { renderQueued = false; render(); }, 0); }

function weightAlert(m) {
  const ws = weightStatus(m);
  if (ws.ok) return '';
  const how = ws.diff > 0 ? `sobra ${fmtN(ws.diff)}%` : `falta ${fmtN(-ws.diff)}%`;
  return `<div class="alert alert-bad"><div><strong>Los valores de los RA suman ${fmtN(ws.sum)}% y deben sumar ${fmtN(ws.exp)}% (${how}).</strong> Las notas finales no serán correctas hasta corregirlo.</div>
  <div class="row-wrap"><button class="btn btn-sm btn-secondary" data-act="tab" data-id="config">Corregir en Configuración</button><button class="btn btn-sm btn-danger" data-act="cfg-scale" title="Mantiene la importancia que le diste a cada RA">Ajustar proporcionalmente</button></div></div>`;
}
/** Recuadro de la suma de los RA en Configuración (se actualiza mientras escribes). */
function sumBox(m) {
  const ws = weightStatus(m);
  const exp = fmtN(ws.exp);
  let msg, cls;
  if (ws.ok) { cls = 'ok'; msg = `✓ Los RA suman ${fmtN(ws.sum)}% de ${exp}% · Cierre ${fmtN(m.finalWeight)}% · Total ${fmtN(r2(ws.sum + m.finalWeight))}%. Correcto.`; }
  else if (ws.diff > 0) { cls = 'bad'; msg = `⚠ Los RA suman ${fmtN(ws.sum)}%: sobra ${fmtN(ws.diff)}%. Baja ${fmtN(ws.diff)}% en uno o varios RA.`; }
  else { cls = 'bad'; msg = `⚠ Los RA suman ${fmtN(ws.sum)}%: falta ${fmtN(-ws.diff)}%. Súbele ${fmtN(-ws.diff)}% a uno o varios RA.`; }
  return `<div class="sum-box ${cls}" id="sumBox" style="margin-bottom:1rem">
    <div style="flex:1;min-width:240px"><div>${msg}</div><div class="small" style="font-weight:500;opacity:.85;margin-top:.2rem">Tú decides el valor de cada RA según su importancia; solo deben sumar ${exp}% entre todos (más el ${fmtN(m.finalWeight)}% del cierre = 100%).</div></div>
    ${ws.ok ? '' : `<button class="btn btn-sm btn-primary" data-act="cfg-scale" title="Sube o baja todos en la misma proporción, manteniendo la importancia que le diste a cada uno">Ajustar proporcionalmente a ${exp}%</button>`}
    <button class="btn btn-sm btn-secondary" data-act="cfg-distribute" title="Pone el mismo valor a todos los RA">Repartir ${exp}% en partes iguales</button>
  </div>`;
}
function blankModeNote(m) {

/** Todos los estudiantes ordenados por número de lista (sin aplicar la búsqueda). */
function allStudents(m) { return m.students.slice().sort((a, b) => (a.num - b.num) || a.name.localeCompare(b.name, 'es')); }
function visibleStudents(m, sortKey) {
  const q = norm(state.search).replace(/^#/, '');
  let list = m.students.slice();
  if (q) list = list.filter(s => norm(s.name).includes(q) || String(s.num) === q);
  const sort = sortKey || state.sort;
  if (sort === 'name') list.sort((a, b) => a.name.localeCompare(b.name, 'es', { sensitivity: 'base' }));
  else if (sort === 'total') { const c = new Map(list.map(s => [s.id, calcStudent(m, s).total])); list.sort((a, b) => c.get(b.id) - c.get(a.id)); }
  else list.sort((a, b) => (a.num - b.num) || a.name.localeCompare(b.name, 'es'));
  return list;
}
function searchBox(ph) {
  return `<div class="search">${ICON.search}<input type="search" id="search" data-key="search" placeholder="${ph}" value="${esc(state.search)}" autocomplete="off"></div>`;
}

/* ----- Estado de logro de un RA ----- */
function raBadge(x) {
  const st = RA_STATUS[x.status];
  const why = x.status === 'ok' ? '' : raReasons(x).join(' · ');
  return `<span class="badge ${st.cls}" title="${esc(why)}">${st.icon} ${st.label}</span>`;
}
function raIcon(x) {
  const st = RA_STATUS[x.status];
  const why = x.status === 'ok' ? st.label : st.label + ': ' + raReasons(x).join(' · ');
  return `<span class="ra-ic ${st.cls}" title="${esc(why)}">${st.icon}</span>`;
}
function raRequirements(m, ra) {
  const parts = [`logro mínimo ${fmtN(raMin(m, ra))}%`];
  ra.cats.forEach(c => { if (c.minDone > 0) parts.push(`${c.label}: al menos ${c.minDone} de ${c.count} realizadas`); });
  return parts.join(' · ');
}
function raReasonLine(x) {
  if (x.status === 'ok') return '<span style="color:var(--ok)">✓ Cumple todos los requisitos</span>';
  if (x.status === 'rec') return `<span style="color:var(--ok)">↺ ${esc(raReasons(x)[0])}</span>`;
  if (x.status === 'pend') return '<span class="muted">Aún sin notas</span>';
  return raReasons(x).map(r => `<span>• ${esc(r)}</span>`).join(' ');
}

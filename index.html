<style>
:root {
  --primary: #4f46e5;
  --primary-dark: #3730a3;
  --primary-light: #eef2ff;
  --primary-ring: #c7d2fe;
  --ink: #0f172a;
  --ink-2: #334155;
  --muted: #64748b;
  --bg: #f1f5f9;
  --surface: #ffffff;
  --surface-2: #f8fafc;
  --border: #e2e8f0;
  --border-2: #cbd5e1;
  --nav: #1e293b;
  --ok: #15803d;
  --ok-bg: #dcfce7;
  --risk: #b45309;
  --risk-bg: #fef3c7;
  --bad: #b91c1c;
  --bad-bg: #fee2e2;
  --gold: #d97706;
  --radius: 14px;
  --shadow: 0 1px 2px rgba(15, 23, 42, .06), 0 1px 3px rgba(15, 23, 42, .08);
  --shadow-lg: 0 18px 40px -12px rgba(15, 23, 42, .25);
  --surface-3: #f1f5f9;
  --track: #e2e8f0;
  --track-2: #eef2f7;
  --primary-btn: #4f46e5;
  --primary-btn-h: #3730a3;
  --ok-bg-h: #bbf7d0;
  --bad-bg-h: #fecaca;
  --info: #1d4ed8;
  --info-bg: #dbeafe;
  --info-ink: #312e81;
  --warn-bg: #fffbeb; --warn-bd: #fde68a; --warn-ink: #78350f;
  --alert-bad-bg: #fef2f2; --alert-bad-bd: #fecaca; --alert-bad-ink: #7f1d1d;
  color-scheme: light;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  font-size: 15px;
  line-height: 1.45;
}
h1, h2, h3, h4 { margin: 0; line-height: 1.2; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: .8rem; }
.hidden { display: none !important; }
button { font: inherit; }

/* ---------- Iconos ---------- */
svg.i { width: 18px; height: 18px; fill: currentColor; flex: none; }
svg.i-sm { width: 15px; height: 15px; }

/* ---------- Navbar ---------- */
.navbar { background: var(--nav); color: #fff; position: sticky; top: 0; z-index: 50; box-shadow: 0 4px 10px -4px rgba(0,0,0,.25); }
.nav-inner { max-width: 1280px; margin: 0 auto; padding: .65rem 1rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
.brand { display: flex; align-items: center; gap: 12px; cursor: pointer; user-select: none; background: none; border: 0; color: inherit; padding: 0; text-align: left; }
.logo { width: 40px; height: 40px; border-radius: 10px; background: linear-gradient(135deg, #fcd34d, #d97706); color: #1e293b; display: grid; place-items: center; font-weight: 800; font-size: 1.45rem; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
.app-name { white-space: nowrap; font-weight: 800; font-size: 1.08rem; letter-spacing: -.3px; }
.app-sub { font-size: .63rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
.nav-actions { display: flex; align-items: center; gap: .4rem; }
.nav-btn { background: rgba(255,255,255,.08); color: #e2e8f0; border: 1px solid rgba(255,255,255,.08); border-radius: 10px; padding: .45rem .7rem; display: inline-flex; align-items: center; gap: .4rem; cursor: pointer; font-size: .82rem; font-weight: 600; }
.nav-btn:hover { background: rgba(255,255,255,.16); }
.save-state { font-size: .72rem; font-weight: 700; padding: .3rem .65rem; border-radius: 99px; display: inline-flex; align-items: center; gap: 6px; text-transform: uppercase; letter-spacing: .4px; }
.save-state::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.save-ok { background: rgba(34,197,94,.15); color: #86efac; }
.save-pending { background: rgba(251,191,36,.15); color: #fcd34d; }
.save-err { background: rgba(239,68,68,.2); color: #fca5a5; }

/* ---------- Layout ---------- */
.main { max-width: 1280px; width: 100%; margin: 0 auto; padding: 1.4rem 1rem 3rem; flex: 1; }
.footer { background: var(--surface); border-top: 1px solid var(--border); color: var(--muted); font-size: .78rem; }
.footer-inner { max-width: 1280px; margin: 0 auto; padding: 1rem; display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
.card-pad { padding: 1.15rem 1.25rem; }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin: 1.6rem 0 1rem; flex-wrap: wrap; }
.section-head h2 { font-size: 1.2rem; }
.row { display: flex; align-items: center; gap: .5rem; }
.row-wrap { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
.spacer { flex: 1; }

/* ---------- Botones ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .45rem; padding: .55rem 1rem; border-radius: 10px; border: 1px solid transparent; font-weight: 600; font-size: .88rem; cursor: pointer; transition: background .15s, border-color .15s, transform .1s; white-space: nowrap; text-decoration: none; }
.btn:active { transform: scale(.97); }
.btn:focus-visible, .nav-btn:focus-visible, .chip:focus-visible, .tab:focus-visible { outline: 3px solid var(--primary-ring); outline-offset: 1px; }
.btn-primary { background: var(--primary-btn); color: #fff; box-shadow: 0 4px 10px -4px rgba(79,70,229,.6); }
.btn-primary:hover { background: var(--primary-btn-h); }
.btn-secondary { background: var(--surface); color: var(--ink); border-color: var(--border); }
.btn-secondary:hover { background: var(--surface-2); border-color: var(--border-2); }
.btn-ghost { background: transparent; color: var(--ink-2); }
.btn-ghost:hover { background: var(--track); }
.btn-danger { background: var(--bad-bg); color: var(--bad); }
.btn-danger:hover { background: var(--bad-bg-h); }
.btn-ok { background: var(--ok-bg); color: var(--ok); }
.btn-ok:hover { background: var(--ok-bg-h); }
.btn-warn { background: #f59e0b; color: #1f2937; }
.btn-sm { padding: .38rem .7rem; font-size: .8rem; border-radius: 8px; }
.btn-icon { width: 34px; height: 34px; padding: 0; border-radius: 9px; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.link { background: none; border: 0; padding: 0; color: var(--ink); font-weight: 600; cursor: pointer; text-align: left; }
.link:hover { color: var(--primary); text-decoration: underline; }

/* ---------- Formularios ---------- */
input[type=text], input[type=number], input[type=search], input[type=date], input[type=time], input[type=email], input[type=password], select, textarea {
  font: inherit; font-size: 16px; color: var(--ink);
  border: 1px solid var(--border-2); border-radius: 9px; background: var(--surface);
  padding: .5rem .65rem; outline: none; transition: border-color .15s, box-shadow .15s; width: 100%;
}
input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-ring); }
textarea { resize: vertical; min-height: 80px; }
label.field, div.field { display: flex; flex-direction: column; gap: .3rem; font-size: .78rem; font-weight: 700; color: var(--ink-2); }
label.field small, div.field small { font-weight: 500; color: var(--muted); }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: .85rem; }
.check { display: flex; align-items: center; gap: .5rem; font-size: .88rem; cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--primary); }
.search { position: relative; flex: 1; min-width: 200px; max-width: 360px; }
.search input { padding-left: 2.2rem; }
.search svg { position: absolute; left: .7rem; top: 50%; transform: translateY(-50%); color: var(--muted); }

/* ---------- Alertas ---------- */
.alert { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .8rem 1rem; border-radius: 12px; margin: 1rem 0; font-size: .88rem; flex-wrap: wrap; border: 1px solid; }
.alert-warn { background: var(--warn-bg); border-color: var(--warn-bd); color: var(--warn-ink); }
.alert-bad { background: var(--alert-bad-bg); border-color: var(--alert-bad-bd); color: var(--alert-bad-ink); }
.alert-info { background: var(--primary-light); border-color: var(--primary-ring); color: var(--info-ink); }

/* ---------- Inicio ---------- */
.hero { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; padding: 1.3rem 1.4rem; border-left: 5px solid var(--primary); }
.hero h1 { font-size: 1.55rem; }
.hero p { margin-top: .25rem; }
.hero-stats { display: flex; gap: 1.6rem; }
.hero-stats div { text-align: center; }
.hero-stats b { display: block; font-size: 1.6rem; color: var(--primary); line-height: 1; }
.hero-stats span { font-size: .68rem; text-transform: uppercase; font-weight: 700; color: var(--muted); letter-spacing: .5px; }

.mod-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 1.1rem; }
.mod-card { padding: 1.1rem 1.15rem; cursor: pointer; transition: transform .15s, box-shadow .15s, border-color .15s; display: flex; flex-direction: column; gap: .7rem; }
.mod-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); border-color: var(--primary-ring); }
.mod-top { display: flex; justify-content: space-between; align-items: flex-start; }
.mod-avatar { width: 46px; height: 46px; border-radius: 11px; background: var(--primary-light); color: var(--primary); display: grid; place-items: center; font-weight: 800; font-size: 1rem; letter-spacing: -.5px; }
.mod-card h3 { font-size: 1.08rem; }
.mod-metrics { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: .5rem; }
.metric { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: .45rem .55rem; }
.metric b { display: block; font-size: 1.05rem; }
.metric span { font-size: .64rem; color: var(--muted); text-transform: uppercase; font-weight: 700; letter-spacing: .4px; }
.progress { height: 6px; background: var(--track); border-radius: 99px; overflow: hidden; }
.progress > div { height: 100%; background: var(--primary); border-radius: 99px; }
.progress-label { display: flex; justify-content: space-between; font-size: .7rem; color: var(--muted); font-weight: 600; margin-bottom: .25rem; }
.empty { text-align: center; padding: 3.5rem 1rem; border: 2px dashed var(--border-2); border-radius: var(--radius); color: var(--muted); }
.empty .big { font-size: 2.6rem; margin-bottom: .6rem; }
.empty p + p { margin-top: .3rem; }

/* ---------- Módulo ---------- */
.mod-head { display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; }
.mod-head h1 { font-size: 1.35rem; }
.tabs { display: flex; gap: .25rem; margin: 1.1rem 0 1.2rem; border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; }
.tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: .65rem .9rem; font-weight: 700; color: var(--muted); cursor: pointer; display: inline-flex; gap: .4rem; align-items: center; white-space: nowrap; font-size: .9rem; }
.tab:hover { color: var(--ink); }
.tab.active { color: var(--primary); border-bottom-color: var(--primary); }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: .8rem; margin-bottom: 1rem; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: .8rem 1rem; box-shadow: var(--shadow); }
.stat span { font-size: .68rem; text-transform: uppercase; font-weight: 700; color: var(--muted); letter-spacing: .5px; }
.stat b { display: block; font-size: 1.55rem; line-height: 1.15; margin-top: .15rem; }
.stat.ok b { color: var(--ok); } .stat.risk b { color: var(--risk); } .stat.bad b { color: var(--bad); } .stat.pri b { color: var(--primary); }

.toolbar { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; padding: .8rem; border-bottom: 1px solid var(--border); background: var(--surface-2); border-radius: var(--radius) var(--radius) 0 0; }

/* ---------- Tablas ---------- */
.table-wrap { overflow: auto; max-width: 100%; }
table { border-collapse: separate; border-spacing: 0; width: 100%; }
.tbl th { background: var(--surface-2); color: var(--muted); font-size: .7rem; text-transform: uppercase; letter-spacing: .4px; font-weight: 800; text-align: left; padding: .6rem .7rem; border-bottom: 1px solid var(--border); white-space: nowrap; position: sticky; top: 0; z-index: 2; }
.tbl td { padding: .5rem .7rem; border-bottom: 1px solid var(--border); font-size: .88rem; white-space: nowrap; }
.tbl tbody tr:hover td { background: var(--surface-2); }
.tbl tr:last-child td { border-bottom: 0; }
.c { text-align: center !important; }
.r { text-align: right !important; }
.num-col { width: 46px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tabnum { font-variant-numeric: tabular-nums; }
.pill { display: inline-block; padding: .15rem .55rem; border-radius: 6px; font-weight: 800; font-variant-numeric: tabular-nums; min-width: 52px; text-align: center; }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.risk { background: var(--risk-bg); color: var(--risk); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.badge { display: inline-flex; align-items: center; gap: .3rem; font-size: .7rem; font-weight: 800; text-transform: uppercase; letter-spacing: .3px; padding: .2rem .5rem; border-radius: 99px; }
.badge.ok { background: var(--ok-bg); color: var(--ok); }
.badge.risk { background: var(--risk-bg); color: var(--risk); }
.badge.bad { background: var(--bad-bg); color: var(--bad); }
.badge.neutral { background: var(--track); color: var(--ink-2); }

/* Celdas editables */
input.cell { width: 52px; text-align: center; padding: .32rem .2rem; font-weight: 700; font-size: 15px; border-radius: 7px; border: 1px solid var(--border); background: var(--surface); font-variant-numeric: tabular-nums; }
input.cell:hover { border-color: var(--border-2); }
input.cell:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-ring); background: var(--surface); }
input.cell.bad { border-color: var(--bad) !important; background: var(--bad-bg) !important; color: var(--bad); }
input.cell.wide { width: 64px; }
input.cell.filled { background: var(--surface-2); }

/* Registro por RA (grid) */
.chips { display: flex; gap: .4rem; flex-wrap: wrap; margin-bottom: 1rem; }
.chip { border: 1px solid var(--border); background: var(--surface); border-radius: 99px; padding: .4rem .8rem; font-weight: 700; font-size: .82rem; cursor: pointer; color: var(--ink-2); display: inline-flex; align-items: center; gap: .35rem; }
.chip small { color: var(--muted); font-weight: 600; }
.chip:hover { border-color: var(--primary-ring); }
.chip.active { background: var(--primary-btn); color: #fff; border-color: var(--primary-btn); }
.chip.active small { color: #c7d2fe; }

.grid-wrap { overflow: auto; max-height: calc(100vh - 250px); min-height: 220px; border-radius: 0 0 var(--radius) var(--radius); }
.grid { border-collapse: separate; border-spacing: 0; }
.grid th, .grid td { border-bottom: 1px solid var(--border); border-right: 1px solid var(--surface-3); padding: .3rem .25rem; text-align: center; white-space: nowrap; background: var(--surface); }
.grid thead th { position: sticky; z-index: 3; font-size: .68rem; text-transform: uppercase; font-weight: 800; color: var(--ink-2); letter-spacing: .3px; }
.grid thead tr:first-child th { top: 0; height: 34px; }
.grid thead tr:nth-child(2) th { top: 34px; }
.grid .sticky-num { position: sticky; left: 0; z-index: 4; min-width: 42px; color: var(--muted); font-variant-numeric: tabular-nums; }
.grid .sticky-name { position: sticky; left: 42px; z-index: 4; text-align: left; min-width: 190px; max-width: 240px; overflow: hidden; text-overflow: ellipsis; padding-left: .6rem; padding-right: .6rem; box-shadow: 2px 0 0 var(--border); font-weight: 600; font-size: .88rem; }
.grid thead .sticky-num, .grid thead .sticky-name { z-index: 6; background: var(--surface-2); }
.grid tbody tr:hover td { background: var(--surface-2); }
.grid .item-h { cursor: pointer; min-width: 58px; user-select: none; }
.grid .item-h:hover { filter: brightness(.95); }
.grid .item-h small { display: block; font-weight: 600; color: var(--muted); text-transform: none; font-size: .65rem; }
.grid .out { font-weight: 700; font-variant-numeric: tabular-nums; font-size: .86rem; min-width: 70px; padding: 0 .6rem; }
.grid .out-h { background: var(--surface-2); }

/* Colores de criterios */
.cat-violet { --c: #6d28d9; --cb: #f3e8ff; }
.cat-green  { --c: #15803d; --cb: #dcfce7; }
.cat-orange { --c: #c2410c; --cb: #ffedd5; }
.cat-blue   { --c: #1d4ed8; --cb: #dbeafe; }
.cat-red    { --c: #b91c1c; --cb: #fee2e2; }
.cat-teal   { --c: #0f766e; --cb: #ccfbf1; }
.cat-pink   { --c: #be185d; --cb: #fce7f3; }
.cat-amber  { --c: #b45309; --cb: #fef3c7; }
th.cat-h, th.item-h { background: var(--cb) !important; color: var(--c) !important; }
.cat-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); display: inline-block; flex: none; }
.cat-tag { background: var(--cb); color: var(--c); font-weight: 800; font-size: .7rem; text-transform: uppercase; letter-spacing: .3px; padding: .25rem .55rem; border-radius: 6px; display: inline-flex; align-items: center; gap: .35rem; }

/* Vista por estudiante */
.stu-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; padding: 1rem 1.2rem; position: sticky; top: 64px; z-index: 20; margin-bottom: 1rem; }
.stu-total { text-align: right; }
.stu-total span { font-size: .68rem; text-transform: uppercase; font-weight: 800; color: var(--muted); }
.stu-total b { display: block; font-size: 1.9rem; line-height: 1; }
.ra-card { margin-bottom: 1rem; overflow: hidden; }
.ra-card-head { display: flex; align-items: center; gap: .7rem; padding: .7rem 1rem; background: var(--primary-light); border-bottom: 1px solid var(--primary-ring); flex-wrap: wrap; }
.ra-num { font-weight: 800; color: var(--primary); }
.ra-title { font-weight: 700; flex: 1; min-width: 140px; }
.ra-weight { background: var(--surface); border: 1px solid var(--primary-ring); color: var(--primary-dark); font-weight: 800; font-size: .78rem; padding: .2rem .55rem; border-radius: 7px; }
.ra-res { font-weight: 800; color: var(--primary-dark); font-variant-numeric: tabular-nums; }
.ra-body { padding: .8rem 1rem; display: flex; flex-direction: column; gap: .6rem; }
/* Fila de cada criterio: etiqueta (ancho fijo) · casillas · total. Todas las casillas quedan a la misma altura. */
.cat-row { display: grid; grid-template-columns: 200px minmax(0, 1fr) auto; align-items: end; gap: .3rem .8rem; }
.cat-row .cat-tag { justify-self: start; max-width: 100%; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cat-items { display: flex; gap: .35rem; flex-wrap: wrap; }
.cat-items .ci { display: flex; flex-direction: column; align-items: stretch; gap: 3px; }
.ci-h { height: 14px; line-height: 14px; display: flex; justify-content: center; gap: 4px; font-size: .62rem; font-weight: 700; color: var(--muted); white-space: nowrap; overflow: hidden; }
.ci-h em { font-style: normal; color: var(--primary-dark); font-weight: 800; }
.cat-sum { font-size: .78rem; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; line-height: 1; margin-bottom: 11px; white-space: nowrap; text-align: right; min-width: 64px; }
@media (max-width: 640px) {
  .cat-row { grid-template-columns: minmax(0, 1fr) auto; }
  .cat-row .cat-tag { grid-column: 1; margin-bottom: 0; align-self: center; }

.final-card { background: linear-gradient(145deg, #1e293b, #0f172a); color: #fff; border: 0; padding: 1rem 1.2rem; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; }

/* Configuración */

/* Barras de promedio por RA */

/* Reportes */
.rep-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 1rem; }
.rep-card { padding: 1.1rem 1.2rem; display: flex; flex-direction: column; gap: .7rem; }
.rep-card h3 { font-size: 1rem; display: flex; align-items: center; gap: .5rem; }
.rep-card p { font-size: .85rem; color: var(--muted); flex: 1; }

/* ---------- Modal ---------- */
.modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,.55); backdrop-filter: blur(4px); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 1rem; opacity: 0; transition: opacity .18s; }
.modal-overlay.open { opacity: 1; }
.modal { background: var(--surface); width: 100%; max-width: 440px; border-radius: 18px; box-shadow: 0 25px 50px -12px rgba(0,0,0,.35); max-height: calc(100vh - 2rem); display: flex; flex-direction: column; transform: translateY(8px) scale(.98); transition: transform .2s; }

.modal-wide { max-width: 680px; }
.modal-head { display: flex; align-items: center; gap: .8rem; padding: 1.1rem 1.2rem; border-bottom: 1px solid var(--border); }
.modal-head h3 { font-size: 1.08rem; }
.modal-head p { font-size: .8rem; color: var(--muted); margin-top: 2px; }
.modal-icon { width: 40px; height: 40px; border-radius: 11px; background: var(--primary-light); color: var(--primary); display: grid; place-items: center; font-size: 1.2rem; flex: none; }
.modal-x { margin-left: auto; background: none; border: 0; font-size: 1.1rem; color: var(--muted); cursor: pointer; width: 32px; height: 32px; border-radius: 8px; }
.modal-x:hover { background: var(--surface-3); }
.modal-body { padding: 1.1rem 1.2rem; overflow: auto; display: flex; flex-direction: column; gap: .85rem; }
.modal-foot { display: flex; justify-content: flex-end; gap: .5rem; padding: .9rem 1.2rem; border-top: 1px solid var(--border); flex-wrap: wrap; }
.modal-msg { color: var(--ink-2); font-size: .92rem; }
.menu-list { display: flex; flex-direction: column; gap: .4rem; }
.menu-list .btn { justify-content: flex-start; }
.snap-row { display: flex; align-items: center; justify-content: space-between; gap: .8rem; padding: .6rem .7rem; border: 1px solid var(--border); border-radius: 10px; }
.snap-row b { font-size: .88rem; }
.snap-row span { display: block; font-size: .75rem; color: var(--muted); }

/* ---------- Toast ---------- */
#toasts { position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%); z-index: 2000; display: flex; flex-direction: column; gap: .5rem; align-items: center; pointer-events: none; width: calc(100% - 2rem); max-width: 460px; }
.toast { background: #0f172a; color: #fff; padding: .7rem 1rem; border-radius: 12px; font-size: .88rem; font-weight: 600; box-shadow: var(--shadow-lg); opacity: 0; transform: translateY(10px); transition: all .25s; text-align: center; }

/* Logro de RA */
label.mini { display: flex; flex-direction: column; gap: 2px; font-size: .62rem; font-weight: 800; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); }
.ra-ic { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; font-size: .68rem; font-weight: 900; vertical-align: middle; cursor: help; }
.ra-ic.ok { background: var(--ok-bg); color: var(--ok); }
.ra-ic.risk { background: var(--risk-bg); color: var(--risk); }
.ra-ic.bad { background: var(--bad-bg); color: var(--bad); }

.ra-reasons { display: flex; flex-wrap: wrap; gap: .3rem 1rem; padding: .5rem 1rem; font-size: .78rem; border-bottom: 1px solid var(--border); background: var(--surface); color: var(--bad); font-weight: 600; }
.ra-reasons > span:first-child { font-weight: 600; }
.ra-reasons span span { margin-right: .7rem; }
.bar-row { grid-template-columns: 70px 1fr 54px 100px; }
@media (max-width: 640px) { .cfg-ra-head { grid-template-columns: auto 1fr 1fr; } .cfg-ra-head > input { grid-column: 2 / -1; } .cfg-ra-head .row { grid-column: 1 / -1; } .bar-row { grid-template-columns: 50px 1fr 40px; } .bar-row > span:last-child { display: none; } }

/* Actividades y descripción del RA */
.grid .item-h .act-n { max-width: 84px; margin: 1px auto 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--c) !important; font-weight: 700 !important; }
.act-d { font-size: .58rem; color: var(--primary-dark); font-weight: 700; }
.ra-desc { font-size: .8rem; color: var(--ink-2); font-style: italic; white-space: pre-wrap; margin-top: .2rem; }
.ra-desc-edit { padding: .6rem 1rem; border-bottom: 1px solid var(--border); }
.ra-desc-edit textarea { min-height: 44px; font-size: 14px; }
.act-list { display: flex; flex-direction: column; gap: .45rem; }
.act-row { display: grid; grid-template-columns: 70px 1fr 150px; gap: .5rem; align-items: center; }
.act-row b { font-size: .8rem; color: var(--ink-2); }
@media (max-width: 640px) { .act-row { grid-template-columns: 56px 1fr; } .act-row input[type=date] { grid-column: 2; } }

/* ---------- Panel (dashboards) ---------- */
.viz-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(440px, 1fr)); gap: 1rem; }
.viz-card { padding: 1rem 1.15rem 1.1rem; min-width: 0; }
.viz-wide { grid-column: 1 / -1; }
.viz-head { margin-bottom: .6rem; list-style: none; cursor: default; }
.viz-head::-webkit-details-marker { display: none; }
details > summary.viz-head { cursor: pointer; }
.viz-head h3 { font-size: 1rem; }
.viz-head p { font-size: .8rem; color: var(--muted); margin-top: .2rem; }
.viz-legend { display: flex; flex-wrap: wrap; gap: .35rem 1rem; font-size: .76rem; color: var(--ink-2); margin-bottom: .7rem; align-items: center; }
.viz-legend span { display: inline-flex; align-items: center; gap: .35rem; }
.viz-legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.viz-svg { width: 100%; height: auto; display: block; overflow: visible; }
.viz-svg .grid-l { stroke: var(--track); stroke-width: 1; }
.viz-svg .ax { font-size: 11px; fill: var(--muted); }
.viz-svg .val { font-size: 11px; font-weight: 700; fill: var(--ink-2); }
.viz-svg .ref-l { stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 4 3; }

.viz-svg [data-tip]:focus { outline: none; }
.viz-empty { padding: 1.2rem; background: var(--surface-2); border-radius: 10px; }
.viz-note { font-size: .74rem; color: var(--muted); margin-top: .6rem; display: flex; align-items: center; gap: .4rem; }
.ref-key { width: 14px; border-top: 2px dashed var(--ink); display: inline-block; }

.stack { display: flex; gap: 2px; height: 24px; border-radius: 6px; overflow: hidden; min-width: 0; }
.stack > div { display: flex; align-items: center; justify-content: center; min-width: 3px; font-size: .74rem; font-weight: 800; transition: filter .15s; }

.ov-list { display: flex; flex-direction: column; gap: .35rem; }

.ov-row:hover, .ov-row:focus-visible { background: var(--surface-2); outline: none; }
.ov-name { display: flex; flex-direction: column; min-width: 0; }
.ov-name b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ov-name span, .ov-num span { font-size: .7rem; color: var(--muted); }
.ov-num { text-align: right; display: flex; flex-direction: column; }

.ra-rows { display: flex; flex-direction: column; gap: .5rem; }
.ra-row { display: grid; grid-template-columns: 130px 1fr 46px; gap: .7rem; align-items: center; }
.ra-lbl { display: flex; flex-direction: column; min-width: 0; font-size: .8rem; }
.ra-lbl span { color: var(--muted); font-size: .72rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ra-avg { font-weight: 800; font-size: .85rem; text-align: right; font-variant-numeric: tabular-nums; }

.hb-list { display: flex; flex-direction: column; gap: .55rem; }

table.hm { border-collapse: separate; border-spacing: 2px; width: 100%; }

.hm-bar div { height: 100%; border-radius: 0 4px 4px 0; }

#vizTip { position: fixed; z-index: 3000; pointer-events: none; background: #0f172a; color: #fff; font-size: .78rem; font-weight: 600; line-height: 1.35; padding: .45rem .65rem; border-radius: 8px; max-width: 320px; box-shadow: var(--shadow-lg); opacity: 0; transition: opacity .1s; }

@media (max-width: 640px) {

@media (max-width: 640px) {

}
.row-wrap { min-width: 0; max-width: 100%; }
select { max-width: 100%; text-overflow: ellipsis; }

/* =========================================================
   Componentes nuevos: copiar, agenda, calendario, asistencia, anecdotario
   ========================================================= */
.nav-btn.active { background: rgba(255,255,255,.2); color: #fff; }

/* Cabecera del estudiante */

.att-T { background: var(--risk-bg); color: var(--risk); border-color: transparent; }
.att-E { background: var(--info-bg); color: var(--info); border-color: transparent; }
.grid th.att-dh { min-width: 36px; cursor: pointer; line-height: 1.1; }

.grid th.att-dh:hover { background: var(--surface-3); }
.grid th.att-today { background: var(--primary-light) !important; color: var(--primary) !important; }
.att-tot-P { color: var(--ok); } .att-tot-A { color: var(--bad); } .att-tot-T { color: var(--risk); } .att-tot-E { color: var(--info); }

@media (max-width: 1000px) { .cal-layout { grid-template-columns: 1fr; } }

/* =========================================================
   Modo oscuro
   ========================================================= */
:root[data-theme="dark"] {
  color-scheme: dark;
  --primary: #818cf8; --primary-dark: #a5b4fc; --primary-light: #21294d; --primary-ring: rgba(129, 140, 248, .42);
  --primary-btn: #6366f1; --primary-btn-h: #4f46e5;
  --ink: #e6e9ef; --ink-2: #c4cad6; --muted: #8e99ab;
  --bg: #0c1222; --surface: #151d2e; --surface-2: #1a2336; --surface-3: #1f2a3f;
  --border: #273249; --border-2: #364365; --track: #263149; --track-2: #222c42;
  --nav: #080d19;
  --ok: #4ade80; --ok-bg: rgba(34, 197, 94, .15); --ok-bg-h: rgba(34, 197, 94, .25);
  --risk: #fbbf24; --risk-bg: rgba(245, 158, 11, .15);
  --bad: #f87171; --bad-bg: rgba(239, 68, 68, .15); --bad-bg-h: rgba(239, 68, 68, .26);
  --info: #93c5fd; --info-bg: rgba(59, 130, 246, .17); --info-ink: #c7d2fe;
  --warn-bg: rgba(245, 158, 11, .09); --warn-bd: rgba(245, 158, 11, .35); --warn-ink: #fcd34d;
  --alert-bad-bg: rgba(239, 68, 68, .09); --alert-bad-bd: rgba(239, 68, 68, .35); --alert-bad-ink: #fca5a5;
  --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 1px 3px rgba(0, 0, 0, .25);
  --shadow-lg: 0 18px 40px -12px rgba(0, 0, 0, .65);
}
:root[data-theme="dark"] .cat-violet { --c: #c4b5fd; --cb: #2a2852; }
:root[data-theme="dark"] .cat-green  { --c: #86efac; --cb: #173635; }
:root[data-theme="dark"] .cat-orange { --c: #fdba74; --cb: #392b2a; }
:root[data-theme="dark"] .cat-blue   { --c: #93c5fd; --cb: #1b2e50; }
:root[data-theme="dark"] .cat-red    { --c: #fca5a5; --cb: #382332; }
:root[data-theme="dark"] .cat-teal   { --c: #5eead4; --cb: #153641; }
:root[data-theme="dark"] .cat-pink   { --c: #f9a8d4; --cb: #37243f; }
:root[data-theme="dark"] .cat-amber  { --c: #fcd34d; --cb: #393228; }
:root[data-theme="dark"] .final-card { border: 1px solid var(--border); background: linear-gradient(145deg, #1b2438, #0e1424); }
:root[data-theme="dark"] .modal-overlay { background: rgba(2, 6, 23, .7); }
:root[data-theme="dark"] .logo { box-shadow: 0 2px 8px rgba(0, 0, 0, .5); }
:root[data-theme="dark"] #vizTip, :root[data-theme="dark"] .toast { box-shadow: 0 0 0 1px var(--border-2), var(--shadow-lg); }
:root[data-theme="dark"] .toast { background: #1f2a3f; }
:root[data-theme="dark"] .toast-ok { background: #166534; } :root[data-theme="dark"] .toast-warn { background: #92400e; } :root[data-theme="dark"] .toast-error { background: #991b1b; }
:root[data-theme="dark"] .btn-warn { background: #f59e0b; color: #111827; }
:root[data-theme="dark"] .grid .item-h:hover { filter: brightness(1.15); }
:root[data-theme="dark"] input[type=date]::-webkit-calendar-picker-indicator, :root[data-theme="dark"] input[type=time]::-webkit-calendar-picker-indicator { filter: invert(.8); }
html, body { transition: background-color .2s; }
@media print { :root[data-theme="dark"] body { background: #fff; color: #000; } }

/* =========================================================
   Animaciones y transiciones
   ========================================================= */
:root { --ease: cubic-bezier(.22, .8, .24, 1); --ease-spring: cubic-bezier(.34, 1.4, .5, 1); }
@keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@keyframes popIn { from { opacity: 0; transform: translateY(8px) scale(.97); } to { opacity: 1; transform: none; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideL { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
@keyframes slideR { from { opacity: 0; transform: translateX(-28px); } to { opacity: 1; transform: none; } }
@keyframes growX { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes navDown { from { opacity: 0; transform: translateY(-100%); } to { opacity: 1; transform: none; } }
@keyframes ringPulse { 0% { box-shadow: 0 0 0 0 var(--primary-ring); } 100% { box-shadow: 0 0 0 9px transparent; } }
@keyframes shimmer { from { background-position: -200% 0; } to { background-position: 200% 0; } }

.a-in { animation: fadeUp .42s var(--ease) backwards; animation-delay: calc(var(--i, 0) * 40ms); }
.a-pop { animation: popIn .45s var(--ease) backwards; animation-delay: calc(80ms + var(--i, 0) * 45ms); }
.a-fade { animation: fadeIn .3s ease backwards; }
.slide-l { animation: slideL .34s var(--ease) backwards; }
.slide-r { animation: slideR .34s var(--ease) backwards; }
/* Barras de progreso y de rendimiento crecen al entrar */
.a-in .progress > div, .a-pop .progress > div, .a-in .track > .fill, .a-in .stack > div { transform-origin: left center; animation: growX .8s var(--ease) backwards; animation-delay: .15s; }
/* Barra superior al abrir el programa */
.navbar { animation: navDown .5s var(--ease) backwards; }
.logo { transition: transform .35s var(--ease-spring); }
.logo:hover { transform: rotate(-8deg) scale(1.08); }
.nav-btn { transition: background .2s, transform .15s, color .2s; }
.nav-btn:hover { transform: translateY(-1px); }
.nav-btn:active { transform: scale(.96); }
/* Pestañas con subrayado animado */
.tab { position: relative; transition: color .2s, background .2s; border-radius: 8px 8px 0 0; }
.tab:hover { background: var(--surface-2); }
.tab.active { border-bottom-color: transparent; }
.tab::after { content: ''; position: absolute; left: .55rem; right: .55rem; bottom: -3px; height: 3px; border-radius: 3px 3px 0 0; background: var(--primary); transform: scaleX(0); transition: transform .25s var(--ease); }
.tab.active::after { transform: scaleX(1); }
.tabs.tab-anim .tab.active::after { animation: growX .35s var(--ease) backwards; }
/* Botones y tarjetas */
.btn { transition: background .18s, border-color .18s, box-shadow .2s, transform .12s, color .18s; }
.btn-primary:hover { box-shadow: 0 6px 16px -6px var(--primary-ring); }
.btn:active { transform: scale(.96); }
.card { transition: box-shadow .25s, border-color .25s, background-color .25s; }
.stat { transition: transform .2s var(--ease), box-shadow .2s; }
.stat:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.mod-card { transition: transform .25s var(--ease), box-shadow .25s, border-color .25s; }
.mod-card:hover { transform: translateY(-4px); }
.mod-card .mod-avatar { transition: transform .3s var(--ease-spring); }
.mod-card:hover .mod-avatar { transform: scale(1.06); }
.ag-item { transition: background .15s, transform .15s; }
.ag-item:hover { transform: translateX(2px); }
.cal-cell { transition: background .15s, box-shadow .15s; }
.cal-cell:not(.cal-out):hover { box-shadow: inset 0 0 0 2px var(--primary-ring); }
.cal-today .cal-dn span { animation: ringPulse 1.6s ease-out 2; }
.ev-chip { transition: filter .15s, transform .15s; }
.ev-chip:hover { transform: translateX(1px); }
input, select, textarea { transition: border-color .18s, box-shadow .18s, background-color .18s; }
/* Ventanas emergentes y avisos más fluidos */
.modal-overlay { transition: opacity .22s ease; }
.modal { transition: transform .32s var(--ease-spring), opacity .22s; opacity: .6; transform: translateY(14px) scale(.96); }
.modal-overlay.open .modal { opacity: 1; transform: none; }
.toast { transition: opacity .3s, transform .35s var(--ease-spring); transform: translateY(14px) scale(.96); }
.toast.show { transform: none; }
/* Cambio de tema con fundido suave */
::view-transition-old(root), ::view-transition-new(root) { animation-duration: .35s; }
/* Sin animaciones: preferencia del sistema o desactivadas en Ajustes */
:root[data-motion-off] *, :root[data-motion-off] *::before, :root[data-motion-off] *::after { animation: none !important; transition: none !important; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
@media print { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* =========================================================
   Cuenta en la nube: acceso y estado
   ========================================================= */
.cloud-state { font: inherit; font-size: .72rem; font-weight: 700; padding: .3rem .65rem; border-radius: 99px; border: 0; cursor: pointer; letter-spacing: .3px; white-space: nowrap; transition: background .2s, color .2s; }
.cloud-state[hidden] { display: none; }
.cloud-ok { background: rgba(56,189,248,.16); color: #7dd3fc; }
.cloud-up { background: rgba(251,191,36,.15); color: #fcd34d; }
.cloud-off { background: rgba(148,163,184,.2); color: #cbd5e1; }
.cloud-err { background: rgba(239,68,68,.2); color: #fca5a5; }
body.auth-open .navbar, body.auth-open #app, body.auth-open .footer { visibility: hidden; }
body.auth-wait #app::before { content: ''; display: block; width: 36px; height: 36px; margin: 22vh auto; border-radius: 50%; border: 3px solid var(--track); border-top-color: var(--primary); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#authScreen { position: fixed; inset: 0; z-index: 900; overflow: auto; background: var(--bg); display: grid; place-items: center; padding: 1.2rem; transition: opacity .5s ease, transform .5s var(--ease, ease); }
#authScreen.au-out { opacity: 0; transform: scale(1.04); pointer-events: none; }
.au-bg { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
.au-blob { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .55; animation: auFloat 18s ease-in-out infinite alternate; }
.au-blob.b1 { width: 520px; height: 520px; background: #6366f1; top: -160px; left: -140px; }
.au-blob.b2 { width: 440px; height: 440px; background: #f59e0b; bottom: -170px; right: -120px; opacity: .35; animation-duration: 22s; animation-direction: alternate-reverse; }
.au-blob.b3 { width: 340px; height: 340px; background: #06b6d4; top: 40%; left: 55%; opacity: .25; animation-duration: 26s; }
.au-grid { position: absolute; inset: 0; background-image: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px); background-size: 44px 44px; mask-image: radial-gradient(ellipse at center, #000 20%, transparent 70%); -webkit-mask-image: radial-gradient(ellipse at center, #000 20%, transparent 70%); opacity: .5; }
@keyframes auFloat { 0% { transform: translate(0, 0) scale(1); } 50% { transform: translate(60px, 40px) scale(1.08); } 100% { transform: translate(-30px, 70px) scale(.95); } }
.au-shell { position: relative; width: 100%; max-width: 940px; display: grid; grid-template-columns: 1.05fr 1fr; border-radius: 28px; overflow: hidden; box-shadow: 0 40px 90px -30px rgba(15,23,42,.55), 0 0 0 1px rgba(255,255,255,.06); animation: auIn .7s cubic-bezier(.22,.8,.24,1) both; background: var(--surface); }
@keyframes auIn { from { opacity: 0; transform: translateY(26px) scale(.97); } to { opacity: 1; transform: none; } }
.au-hero { position: relative; color: #e0e7ff; padding: 2.6rem 2.3rem; display: flex; flex-direction: column; gap: .9rem; background: linear-gradient(150deg, #312e81 0%, #4338ca 45%, #6d28d9 100%); overflow: hidden; }
.au-hero::before { content: ''; position: absolute; width: 380px; height: 380px; border-radius: 50%; border: 1px solid rgba(255,255,255,.12); right: -150px; top: -120px; box-shadow: 0 0 0 40px rgba(255,255,255,.03), 0 0 0 90px rgba(255,255,255,.02); animation: auSpin 40s linear infinite; }
.au-hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.08) 50%, transparent 70%); background-size: 250% 100%; animation: auShine 7s ease-in-out infinite; }
@keyframes auSpin { to { transform: rotate(360deg); } }
@keyframes auShine { 0%, 60% { background-position: 150% 0; } 100% { background-position: -100% 0; } }
.au-logo { width: 62px; height: 62px; border-radius: 18px; background: linear-gradient(135deg, #fcd34d, #d97706); display: grid; place-items: center; box-shadow: 0 12px 28px -8px rgba(217,119,6,.7), inset 0 1px 0 rgba(255,255,255,.5); animation: auPop .8s .25s cubic-bezier(.34,1.56,.64,1) both, auBob 5s 1.2s ease-in-out infinite; position: relative; z-index: 1; }
.au-logo span { font-size: 2rem; font-weight: 800; color: #1e293b; }
.au-logo.sm { width: 40px; height: 40px; border-radius: 12px; animation: auPop .7s .1s cubic-bezier(.34,1.56,.64,1) both; }
.au-logo.sm span { font-size: 1.3rem; }
@keyframes auPop { from { opacity: 0; transform: scale(.4) rotate(-20deg); } to { opacity: 1; transform: none; } }
@keyframes auBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
.au-hero h1 { font-size: 2.1rem; color: #fff; letter-spacing: -.5px; margin-top: .4rem; position: relative; z-index: 1; animation: auUp .6s .35s both; }
.au-tag { text-transform: uppercase; letter-spacing: 1.4px; font-size: .74rem; font-weight: 700; color: #c7d2fe; position: relative; z-index: 1; animation: auUp .6s .45s both; }
.au-feats { list-style: none; padding: 0; margin: 1rem 0 0; display: flex; flex-direction: column; gap: .75rem; position: relative; z-index: 1; }
.au-feats li { display: flex; gap: .8rem; align-items: center; font-size: .92rem; color: #e0e7ff; animation: auUp .55s calc(.5s + var(--d) * .1s) both; }
.au-feats b { width: 38px; height: 38px; flex: none; display: grid; place-items: center; border-radius: 11px; background: rgba(255,255,255,.12); backdrop-filter: blur(4px); font-size: 1.1rem; box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); }
.au-sign { margin-top: auto; padding-top: 1.4rem; font-size: .74rem; color: #a5b4fc; position: relative; z-index: 1; animation: auUp .6s 1s both; }
@keyframes auUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.au-card { padding: 2.6rem 2.4rem 2rem; display: flex; flex-direction: column; justify-content: center; background: var(--surface); }
.au-card.au-shake { animation: auShake .45s cubic-bezier(.36,.07,.19,.97); }
@keyframes auShake { 10%, 90% { transform: translateX(-2px); } 20%, 80% { transform: translateX(4px); } 30%, 50%, 70% { transform: translateX(-7px); } 40%, 60% { transform: translateX(7px); } }
.au-pane { display: flex; flex-direction: column; gap: .75rem; }
.au-pane.au-first > * { animation: auUp .55s cubic-bezier(.22,.8,.24,1) both; }
.au-pane.au-first > *:nth-child(2) { animation-delay: .4s; } .au-pane.au-first > *:nth-child(3) { animation-delay: .47s; } .au-pane.au-first > *:nth-child(4) { animation-delay: .54s; } .au-pane.au-first > *:nth-child(5) { animation-delay: .62s; } .au-pane.au-first > *:nth-child(6) { animation-delay: .7s; } .au-pane.au-first > *:nth-child(7) { animation-delay: .78s; }
.au-pane.au-swap { animation: auSwap .38s cubic-bezier(.22,.8,.24,1) both; }
@keyframes auSwap { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: none; } }
.au-mob-brand { display: none; align-items: center; gap: .6rem; margin-bottom: .4rem; }
.au-mob-brand b { font-size: 1.15rem; }
.au-card h2 { font-size: 1.6rem; letter-spacing: -.3px; }
.au-sub { color: var(--muted); font-size: .9rem; margin-top: -.3rem; }
#authForm { display: flex; flex-direction: column; gap: .85rem; margin-top: .4rem; }
.au-field { display: flex; flex-direction: column; gap: .35rem; }
.au-lbl { font-size: .78rem; font-weight: 700; color: var(--ink-2); }
.au-inp { position: relative; display: flex; align-items: center; }
.au-inp input { width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: var(--surface-2); border: 1.5px solid var(--border); border-radius: 13px; padding: .78rem 2.8rem .78rem 2.75rem; outline: none; transition: border-color .2s, box-shadow .25s, background-color .2s; }
.au-inp input::placeholder { color: var(--muted); opacity: .7; }
.au-inp input:hover { border-color: var(--border-2); }
.au-inp input:focus { border-color: var(--primary); background: var(--surface); box-shadow: 0 0 0 4px var(--primary-ring); }
.au-ic { position: absolute; left: .9rem; width: 18px; height: 18px; color: var(--muted); display: grid; place-items: center; transition: color .2s, transform .25s; pointer-events: none; }
.au-ic svg, .au-eye svg { width: 18px; height: 18px; fill: currentColor; }
.au-inp:focus-within .au-ic { color: var(--primary); transform: scale(1.1); }
.au-eye { position: absolute; right: .55rem; width: 34px; height: 34px; border: 0; background: none; color: var(--muted); border-radius: 9px; cursor: pointer; display: grid; place-items: center; transition: background .15s, color .15s; }
.au-eye:hover { background: var(--surface-3); color: var(--ink); }
.au-caps { font-size: .78rem; font-weight: 700; color: #b45309; background: #fef3c7; border-radius: 9px; padding: .35rem .6rem; animation: auUp .25s both; }
.au-go { position: relative; overflow: hidden; margin-top: .3rem; border: 0; border-radius: 13px; padding: .9rem 1rem; font: inherit; font-size: 1rem; font-weight: 700; color: #fff; cursor: pointer; background: linear-gradient(135deg, #6366f1, #4f46e5 50%, #7c3aed); background-size: 200% 100%; box-shadow: 0 12px 26px -10px rgba(79,70,229,.75); transition: transform .15s, box-shadow .25s, background-position .5s; display: flex; align-items: center; justify-content: center; gap: .5rem; }
.au-go:hover { background-position: 100% 0; box-shadow: 0 16px 30px -10px rgba(79,70,229,.85); transform: translateY(-1px); }
.au-go:active { transform: scale(.98); }
.au-go::after { content: ''; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 35%, rgba(255,255,255,.28) 50%, transparent 65%); transform: translateX(-120%); }
.au-go:hover::after { transition: transform .8s ease; transform: translateX(120%); }
.au-go-t { display: inline-flex; align-items: center; gap: .4rem; transition: opacity .2s; }
.au-go-t svg { width: 20px; height: 20px; fill: #fff; }
.au-spin { position: absolute; width: 22px; height: 22px; border-radius: 50%; border: 2.5px solid rgba(255,255,255,.35); border-top-color: #fff; opacity: 0; animation: spin .7s linear infinite; transition: opacity .2s; }
.au-go.busy { cursor: wait; } .au-go.busy .au-go-t { opacity: 0; } .au-go.busy .au-spin { opacity: 1; }
.au-go.done { background: linear-gradient(135deg, #16a34a, #15803d); box-shadow: 0 12px 26px -10px rgba(22,163,74,.7); animation: auPop .45s cubic-bezier(.34,1.56,.64,1); }
.au-links { display: flex; justify-content: space-between; flex-wrap: wrap; gap: .5rem; margin-top: .1rem; }
.au-link { background: none; border: 0; color: var(--primary); font: inherit; font-size: .86rem; font-weight: 600; cursor: pointer; padding: .25rem 0; position: relative; }
.au-link::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 1.5px; background: currentColor; transform: scaleX(0); transform-origin: left; transition: transform .25s; }
.au-link:hover::after { transform: scaleX(1); }
.au-msg { background: var(--bad-bg); color: var(--bad); border-radius: 11px; padding: .6rem .8rem; font-size: .86rem; font-weight: 600; animation: auUp .3s both; }
.au-msg.ok { background: var(--ok-bg); color: var(--ok); }
.au-foot { display: flex; align-items: center; gap: .5rem; font-size: .74rem; color: var(--muted); border-top: 1px solid var(--border); padding-top: .9rem; margin-top: .4rem; }
.au-dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; flex: none; box-shadow: 0 0 0 0 rgba(34,197,94,.6); animation: auPulse 2s infinite; }
@keyframes auPulse { 0% { box-shadow: 0 0 0 0 rgba(34,197,94,.55); } 70% { box-shadow: 0 0 0 8px rgba(34,197,94,0); } 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); } }
:root[data-theme="dark"] .au-shell { box-shadow: 0 40px 90px -30px rgba(0,0,0,.8), 0 0 0 1px var(--border); }
:root[data-theme="dark"] .au-caps { background: rgba(245,158,11,.15); color: #fcd34d; }
/* Entrada al programa después de iniciar sesión */
body.auth-enter .navbar { animation: navDown .55s cubic-bezier(.22,.8,.24,1) both; }
body.auth-enter #app { animation: auUp .6s .1s cubic-bezier(.22,.8,.24,1) both; }
@media (max-width: 800px) {
  #authScreen { padding: 0; place-items: stretch; }
  .au-shell { grid-template-columns: 1fr; border-radius: 0; min-height: 100%; box-shadow: none; }
  .au-hero { display: none; }
  .au-card { padding: 2.2rem 1.4rem 1.6rem; justify-content: center; background: transparent; }
  .au-mob-brand { display: flex; }
  .au-shell { background: color-mix(in srgb, var(--surface) 82%, transparent); backdrop-filter: blur(14px); }
}
@media (prefers-reduced-motion: reduce) { .au-blob, .au-hero::before, .au-hero::after, .au-logo, .au-dot { animation: none !important; } }
:root[data-motion-off] .au-blob { animation: none !important; }
.acct-box { display: flex; align-items: center; justify-content: space-between; gap: .8rem; flex-wrap: wrap; background: var(--primary-light); border-radius: 12px; padding: .75rem .9rem; margin-bottom: .2rem; }
.acct-box b { display: block; color: var(--primary); }
.acct-box span { display: block; font-weight: 600; font-size: .9rem; }
.acct-box small { color: var(--muted); font-size: .75rem; }
@media (max-width: 640px) { .cloud-state { font-size: 0; padding: .38rem; } .cloud-state::first-letter { font-size: .85rem; } }
.notif-box { border: 1px solid var(--border); background: var(--surface-2); border-radius: 14px; padding: .85rem 1rem; display: flex; flex-direction: column; gap: .6rem; margin-top: .3rem; }

/* =========================================================
   Mi horario de clases
   ========================================================= */
.hor-top { display: grid; grid-template-columns: minmax(280px, 360px) 1fr; gap: 1rem; margin: 1rem 0; align-items: start; }
.hor-mods { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: .75rem; }
.hor-mod { border-radius: 14px; overflow: hidden; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); display: flex; flex-direction: column; transition: transform .2s var(--ease), box-shadow .2s; }
.hor-mod:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.hor-mod header { background: var(--c); color: #fff; font-weight: 800; padding: .55rem .8rem; letter-spacing: .3px; }
:root[data-theme="dark"] .hor-mod header { color: #0b1220; }
.hor-mod p { padding: .6rem .8rem .3rem; font-size: .8rem; font-weight: 600; color: var(--ink-2); flex: 1; line-height: 1.3; }
.hor-mod-c { background: var(--cb); color: var(--c); font-weight: 800; text-align: center; padding: .3rem; font-size: .85rem; }
.hor-mod footer { padding: .45rem .8rem .55rem; font-size: .78rem; color: var(--ink-2); display: flex; flex-wrap: wrap; align-items: baseline; gap: .25rem .4rem; }
.hor-mod footer b { font-size: 1.05rem; color: var(--c); }
.hor-mod footer small { width: 100%; color: var(--muted); font-size: .7rem; }
.hor-warn { font-size: .68rem; font-weight: 800; color: var(--risk); background: var(--risk-bg); border-radius: 6px; padding: 0 .35rem; }
.hor-card { overflow: hidden; }
.hor-card.editing { box-shadow: 0 0 0 2px var(--primary-ring), var(--shadow); }
.hor-wrap { overflow-x: auto; }
.hor-table { width: 100%; border-collapse: separate; border-spacing: 0; min-width: 760px; }
.hor-table th, .hor-table td { border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); text-align: center; padding: 0; }
.hor-table thead th { background: var(--nav); color: #e2e8f0; font-size: .78rem; padding: .45rem .3rem; font-weight: 800; }
.hor-table thead th small { display: block; font-weight: 600; font-size: .64rem; color: #94a3b8; margin-top: 1px; }
.hor-dh, .hor-day { position: sticky; left: 0; z-index: 2; text-align: left !important; padding: .55rem .8rem !important; min-width: 104px; }
.hor-day { background: var(--nav); color: #f1f5f9; font-weight: 800; font-size: .86rem; }
tr.today .hor-day { background: var(--primary-btn); }
tr.today .hor-day::after { content: ' · hoy'; font-weight: 600; font-size: .7rem; opacity: .85; }
.hor-c { height: 58px; min-width: 78px; background: var(--cb); color: var(--c); cursor: default; transition: filter .15s, transform .15s, box-shadow .15s; position: relative; }
.hor-c[data-act] { cursor: pointer; }
.hor-c[data-act]:hover { filter: brightness(.96); box-shadow: inset 0 0 0 2px var(--c); }
.hor-c b { display: block; font-size: .86rem; letter-spacing: .3px; }
.hor-c small { display: block; font-size: .66rem; opacity: .85; font-weight: 600; }
.hor-c:not([class*="cat-"]) { background: var(--surface-2); }
.hor-free { color: var(--muted); font-size: .78rem; font-weight: 700; opacity: .7; }
.hor-other { background: repeating-linear-gradient(135deg, var(--surface-2) 0 6px, var(--surface-3) 6px 8px) !important; }
.hor-txt { color: var(--ink-2); font-size: .76rem !important; }
.hor-c.now { box-shadow: inset 0 0 0 3px var(--primary); }
.hor-c.now::after { content: 'Ahora'; position: absolute; top: 3px; right: 4px; font-size: .55rem; font-weight: 800; background: var(--primary-btn); color: #fff; border-radius: 4px; padding: 0 4px; animation: ringPulse 1.6s ease-out infinite; }
.hor-brk { width: 22px; min-width: 22px; background: repeating-linear-gradient(0deg, var(--surface-2) 0 4px, var(--surface) 4px 8px) !important; }
.hor-table thead .hor-brk { background: var(--nav) !important; padding: .2rem 0 !important; }
.hor-table thead .hor-brk span { writing-mode: vertical-rl; transform: rotate(180deg); font-size: .6rem; font-weight: 700; color: #94a3b8; }
.hor-th { width: 48px; font-size: .86rem; background: var(--surface-2); }
.hor-table thead .hor-th { background: var(--nav); }
.hor-table tfoot th, .hor-table tfoot td { background: var(--surface-2); padding: .5rem .8rem; font-size: .8rem; font-weight: 700; color: var(--ink-2); }
.hor-table tfoot td.l { text-align: left; }
.editing .hor-c { cursor: crosshair; }
.editing .hor-c:hover { box-shadow: inset 0 0 0 2px var(--primary); }
.hor-pal { position: sticky; top: 64px; z-index: 20; margin-top: 1rem; border: 2px solid var(--primary-ring); }
.hor-pal-h { font-size: .86rem; color: var(--ink-2); margin-bottom: .6rem; }
.hor-pal-list { display: flex; flex-wrap: wrap; gap: .45rem; }
.hor-brush { border: 2px solid transparent; background: var(--cb, var(--surface-2)); color: var(--c, var(--ink-2)); border-radius: 11px; padding: .4rem .7rem; font: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: flex-start; line-height: 1.15; transition: transform .15s, border-color .15s, box-shadow .15s; }
.hor-brush b { font-size: .85rem; } .hor-brush small { font-size: .66rem; opacity: .8; font-weight: 600; }
.hor-brush:hover { transform: translateY(-1px); }
.hor-brush.on { border-color: var(--c, var(--primary)); box-shadow: 0 0 0 3px var(--primary-ring); }
.hor-brush.free { background: var(--surface-2); color: var(--muted); }
.hor-brush.other { background: repeating-linear-gradient(135deg, var(--surface-2) 0 6px, var(--surface-3) 6px 8px); color: var(--ink-2); }
.hor-today h3 { font-size: .98rem; }
.hor-tl { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .45rem; }
.hor-tl-i { display: grid; grid-template-columns: 74px 1fr auto; gap: .6rem; align-items: center; padding: .5rem .6rem; border-radius: 11px; background: var(--cb, var(--surface-2)); border-left: 4px solid var(--c, var(--border-2)); transition: transform .15s, opacity .2s; }
.hor-tl-i[data-act] { cursor: pointer; } .hor-tl-i[data-act]:hover { transform: translateX(2px); }
.hor-tl-i.done { opacity: .55; }
.hor-tl-i.now { box-shadow: 0 0 0 2px var(--c); }
.hor-tl-t { white-space: nowrap; font-weight: 800; font-size: .82rem; color: var(--c, var(--ink)); line-height: 1.1; }
.hor-tl-t small { display: block; font-weight: 600; font-size: .68rem; color: var(--muted); }
.hor-tl-b b { display: block; font-size: .88rem; color: var(--c, var(--ink)); }
.hor-tl-b small { color: var(--ink-2); font-size: .72rem; }
.hor-tl-i em { font-style: normal; font-size: .68rem; font-weight: 800; color: var(--c); }
.hor-bydays { display: none; }
.hor-dcard { padding: .7rem .8rem; } .hor-dcard h4 { font-size: .9rem; margin-bottom: .45rem; }
.hor-dcard.today { box-shadow: 0 0 0 2px var(--primary-ring); }
.hor-dline { display: grid; grid-template-columns: 1fr auto; gap: 0 .5rem; padding: .4rem .55rem; border-radius: 9px; background: var(--cb, var(--surface-2)); color: var(--c, var(--ink)); margin-bottom: .35rem; border-left: 3px solid var(--c, var(--border)); }
.hor-dline span { grid-column: 1 / -1; font-size: .7rem; font-weight: 700; color: var(--muted); }
.hor-dline small { font-size: .7rem; align-self: center; }
.hor-sum { margin-top: 1rem; }
.mini-table { width: 100%; border-collapse: collapse; font-size: .84rem; }
.mini-table th, .mini-table td { border-bottom: 1px solid var(--border); padding: .5rem .55rem; text-align: center; }
.mini-table th { font-size: .7rem; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); font-weight: 800; }
.mini-table .l { text-align: left; } .mini-table tr.tot td { background: var(--surface-2); }
.ht-prev { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: .35rem; }
.ht-table { display: flex; flex-direction: column; gap: .35rem; }
.ht-row { display: grid; grid-template-columns: 80px 1fr 1fr 60px; align-items: end; gap: .6rem; padding: .4rem .6rem; border: 1px solid var(--border); border-radius: 10px; font-size: .84rem; }
.ht-row > b { align-self: center; color: var(--primary); }
.ht-row input[type=time] { width: 100%; }
.ht-row > span.small { align-self: center; text-align: right; }
.ht-row.brk { background: repeating-linear-gradient(135deg, var(--surface-2) 0 6px, var(--surface) 6px 12px); align-items: center; }
.ht-row.brk input { padding: .3rem .5rem; font-size: .84rem; }
.ht-row.brk > span:not(.small) { font-weight: 600; color: var(--ink-2); }

.ae-stus { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: .3rem; max-height: 240px; overflow: auto; padding: .1rem; }

.aq-head { display: flex; justify-content: space-between; align-items: baseline; }
.aq-list { display: flex; flex-direction: column; gap: .8rem; }
.aq { border: 1px solid var(--border); border-left: 4px solid var(--primary); border-radius: 12px; padding: .8rem; background: var(--surface-2); display: flex; flex-direction: column; gap: .55rem; }
.aq.aq-tf { border-left-color: #0d9488; } .aq.aq-short { border-left-color: #d97706; } .aq.aq-open { border-left-color: #db2777; }
.aq-h { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
.aq-h select { width: auto; flex: 1; min-width: 170px; }
.aq-n { width: 28px; height: 28px; border-radius: 9px; background: var(--primary); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: .85rem; flex: none; }

/* Claves */
.pin-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: .35rem; max-height: 55vh; overflow: auto; }

.qr-box { background: #fff; border-radius: 16px; padding: .5rem; aspect-ratio: 1; display: grid; place-items: center; border: 1px solid var(--border); }
.qr-box svg { width: 100%; height: 100%; display: block; }
.code-lbl { font-size: .72rem; font-weight: 800; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }
.aula-code { font-family: ui-monospace, Menlo, monospace; font-size: 2.2rem; font-weight: 800; letter-spacing: .18em; color: var(--primary); margin: .1rem 0 .6rem; }
.aula-share.big .aula-code { font-size: 4rem; }
.share-steps { margin: .6rem 0; padding-left: 1.2rem; font-size: 1.1rem; line-height: 1.8; font-weight: 600; }
/* Revisión */
.ar-sum { display: flex; gap: 1.2rem; flex-wrap: wrap; align-items: center; background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: .6rem .9rem; margin-bottom: .6rem; }

.ar-list { display: flex; flex-direction: column; gap: .6rem; margin-top: .4rem; }
.ar-q { border: 1px solid var(--border); border-left: 4px solid var(--border-2); border-radius: 10px; padding: .65rem .8rem; display: flex; flex-direction: column; gap: .3rem; }
.ar-q.ok { border-left-color: var(--ok); } .ar-q.bad { border-left-color: var(--bad); } .ar-q.half { border-left-color: var(--gold); } .ar-q.pend { border-left-color: var(--primary); background: var(--primary-light); }

.ar-p input { width: 80px; }
.ar-p input.err { border-color: var(--bad); }
.ar-conf { margin: .4rem 0 0 1.2rem; line-height: 1.7; }
/* Impresión del examen */
.rx-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; border-bottom: 2px solid #111; padding-bottom: 6px; margin: 6px 0 8px; }

.rx-fields div { flex: 3; display: flex; gap: 6px; } .rx-fields div.sm { flex: 1; }
.rx-fields span { flex: 1; border-bottom: 1px solid #555; }
.rx-instr { font-size: 11.5px; background: #f3f4f6; border-radius: 6px; padding: 6px 8px; margin-bottom: 8px; }
.rx-qs { columns: 1; }
.rx-q { break-inside: avoid; margin: 0 0 10px; font-size: 12.5px; }
.rx-qh { display: flex; gap: 8px; align-items: flex-start; }
.rx-num { flex: none; width: 20px; height: 20px; border-radius: 50%; background: #111; color: #fff; display: grid; place-items: center; font-size: 10.5px; font-weight: 800; }
.rx-txt { flex: 1; white-space: pre-wrap; font-weight: 600; }
.rx-pts { font-size: 10px; color: #555; white-space: nowrap; }
.rx-opts { list-style: none; margin: 4px 0 0 28px; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 3px 16px; }
.rx-opts li { display: flex; gap: 6px; align-items: flex-start; }
.rx-b { flex: none; width: 15px; height: 15px; border: 1.2px solid #333; border-radius: 50%; display: grid; place-items: center; font-size: 9px; font-weight: 700; }
.rx-ok { font-weight: 800; color: #15803d; } .rx-ok .rx-b { background: #15803d; border-color: #15803d; color: #fff; }
.rx-tf { margin: 4px 0 0 28px; display: flex; gap: 24px; }
.rx-tf i { display: inline-block; width: 13px; height: 13px; border: 1.2px solid #333; border-radius: 3px; vertical-align: -2px; margin-right: 4px; }
.rx-tf .rx-ok i { background: #15803d; border-color: #15803d; }
.rx-line { margin: 14px 0 0 28px; border-bottom: 1px solid #777; width: 60%; }
.rx-box { margin: 6px 0 0 28px; border: 1px solid #999; border-radius: 6px; height: 90px; }
.rx-key { margin: 4px 0 0 28px; font-size: 11.5px; }
.rx-sheet { margin: 4px 0 12px; font-size: 11px; }
.rx-sheet td, .rx-sheet th { text-align: center; }
.rx-pins { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; }
.rx-pin { border: 1px dashed #888; padding: 10px 12px; break-inside: avoid; font-size: 11px; }
.rx-pin-h { font-size: 9px; text-transform: uppercase; letter-spacing: .5px; color: #4f46e5; font-weight: 800; }
.rx-pin-n { font-weight: 700; margin: 3px 0; }
.rx-pin-k b { font-family: ui-monospace, monospace; font-size: 20px; letter-spacing: .25em; }
.rx-pin-f { font-size: 8.5px; color: #666; margin-top: 3px; }
.ac-date { display: block; font-weight: 500; color: var(--muted); font-size: .78rem; margin-top: .15rem; }
.ax-when { font-size: .8rem; color: var(--ink-2); margin-top: .35rem; font-weight: 600; }
.ar-btns { display: flex; gap: .3rem; align-items: center; }
.aq-dist { display: flex; align-items: center; gap: .45rem; flex-wrap: wrap; background: var(--surface-2); border: 1px dashed var(--border-2); border-radius: 12px; padding: .55rem .7rem; margin-bottom: .8rem; font-size: .86rem; font-weight: 700; color: var(--ink-2); }
.aq-dist input { width: 80px; }
.aq-dist small { flex-basis: 100%; font-weight: 500; }
/* Entregas (dona) */
.aula-kpis { grid-template-columns: minmax(280px, 1.6fr) repeat(3, minmax(130px, 1fr)); }
.kpi-donut { flex-direction: row; align-items: center; gap: 1.1rem; padding: .7rem 1rem; }
.donut { width: 112px; height: 112px; flex: none; }
.donut circle { transition: stroke-dasharray .6s var(--ease, ease); }
.donut .d-big { font-size: 19px; font-weight: 800; fill: var(--ink); }
.donut .d-sm { font-size: 8.5px; font-weight: 700; fill: var(--muted); }
.d-leg { display: flex; flex-direction: column; gap: .3rem; font-size: .84rem; min-width: 0; }

.d-leg span { display: flex; align-items: center; gap: .45rem; color: var(--ink-2); }
.d-leg i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.d-leg em { font-style: normal; font-weight: 800; color: var(--ink); margin-left: auto; padding-left: .8rem; }
/* Bandeja de archivados */
.aula-tray { display: flex; flex-direction: column; gap: .6rem; }
.tray-item { display: grid; grid-template-columns: 64px 1fr auto auto; gap: 1rem; align-items: center; padding: .8rem 1rem; cursor: pointer; position: relative; overflow: hidden; transition: transform .15s, box-shadow .15s; }

.ti-date span { font-size: .68rem; font-weight: 800; text-transform: uppercase; }
.ti-num { text-align: center; min-width: 74px; }

.ti-num span { font-size: .66rem; font-weight: 800; text-transform: uppercase; color: var(--muted); letter-spacing: .4px; }

.arch-kpis div { flex: 1; text-align: center; background: var(--primary-light); border-radius: 12px; padding: .5rem; }
.arch-kpis b { display: block; font-size: 1.3rem; color: var(--primary); }
.arch-kpis span { font-size: .68rem; font-weight: 800; text-transform: uppercase; color: var(--muted); }
.arch-tbl { max-height: 42vh; border: 1px solid var(--border); border-radius: 12px; }
/* Reportes del Aula (impresión) */
.rx-big { font-size: 17px; margin: 8px 0; }
.rx-info { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px 10px; font-size: 10.5px; margin-bottom: 8px; }
.rx-info div { border-bottom: 1px solid #ddd; padding: 2px 0; }
.rx-info span { display: block; color: #666; font-size: 9px; text-transform: uppercase; letter-spacing: .3px; }
.rx-kpis { display: flex; gap: 6px; margin: 6px 0 10px; }
.rx-kpis div { flex: 1; border: 1px solid #ccc; border-radius: 8px; text-align: center; padding: 5px; }
.rx-kpis b { display: block; font-size: 15px; } .rx-kpis span { font-size: 9px; color: #555; text-transform: uppercase; }
.rx-res td, .rx-res th { font-size: 10.5px; text-align: center; padding: 3px 5px; }
.rx-res .l { text-align: left; }
.rx-res tr.rx-none td { color: #888; }
.rx-c { font-size: 9px; font-weight: 800; text-transform: uppercase; padding: 1px 6px; border-radius: 99px; }
.rx-c.ok { background: #dcfce7; color: #15803d; } .rx-c.mid { background: #fef3c7; color: #b45309; } .rx-c.bad { background: #fee2e2; color: #b91c1c; } .rx-c.none { color: #888; }
.rx-qbars { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 16px; font-size: 10px; }
.rx-qbars div { display: grid; grid-template-columns: 26px 70px 30px 1fr; gap: 5px; align-items: center; }
.rx-qbars i { height: 7px; background: #e5e7eb; border-radius: 9px; overflow: hidden; display: block; }
.rx-qbars em { display: block; height: 100%; }
.rx-qbars small { color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rx-stu { display: grid; grid-template-columns: 1.3fr 1.5fr auto auto; gap: 8px; align-items: stretch; margin: 8px 0 12px; }
.rx-stu > div { border: 1px solid #ccc; border-radius: 8px; padding: 6px 9px; }
.rx-stu span { display: block; font-size: 9px; text-transform: uppercase; color: #666; letter-spacing: .3px; }
.rx-stu b { font-size: 13px; } .rx-stu small { display: block; font-size: 9.5px; color: #555; }
.rx-score2 { text-align: center; } .rx-score2 b { font-size: 16px; }
.rx-score2.main { border: 2px solid #111 !important; }
.rx-got { font-size: 10.5px; font-weight: 800; white-space: nowrap; padding: 1px 7px; border-radius: 99px; background: #f3f4f6; }
.rx-q-ok .rx-got { background: #dcfce7; color: #15803d; } .rx-q-bad .rx-got { background: #fee2e2; color: #b91c1c; } .rx-q-half .rx-got { background: #fef3c7; color: #b45309; }
.rx-q-ok .rx-num { background: #15803d; } .rx-q-bad .rx-num { background: #b91c1c; } .rx-q-half .rx-num { background: #d97706; }
.rx-opts1 { grid-template-columns: 1fr; }
.rx-opts li em { font-style: normal; font-size: 10px; color: #4f46e5; font-weight: 700; }

.rx-open { margin: 4px 0 0 28px; font-size: 11.5px; border: 1px solid #ccc; border-radius: 6px; padding: 6px 8px; white-space: pre-wrap; min-height: 40px; }

@media (max-width: 640px) {
  .tray-item { grid-template-columns: 54px 1fr; } .ti-num { display: none; }
  .aula-hero { padding: 1.15rem 1.1rem; border-radius: 16px; }

  .imp-step { gap: .5rem; } .imp-n { width: 28px; height: 28px; }
}

/* ---------- Pulido general (9.4) ---------- */
body { background: radial-gradient(1100px 420px at 0% -8%, rgba(99,102,241,.08), transparent 70%), radial-gradient(900px 380px at 100% 0%, rgba(124,58,237,.06), transparent 70%), var(--bg); background-attachment: fixed; }
h1, h2, h3 { letter-spacing: -.01em; }
.nav-btn { white-space: nowrap; }
@media (min-width: 641px) and (max-width: 1420px) { .nav-btn { padding: .42rem .55rem; font-size: .79rem; gap: .3rem; } }
.tabs { gap: .15rem; }
.tab { padding: .55rem .6rem; font-size: .86rem; }
.tab.active { background: var(--primary-light); }
.mod-head h1 { letter-spacing: -.02em; }
.card:hover { border-color: var(--border-2); }
.stat, .metric { border-radius: 14px; }
.modal { border-radius: 20px; }
.modal-head { background: linear-gradient(180deg, var(--surface-2), transparent); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 99px; border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background-color: var(--muted); }
::-webkit-scrollbar-track { background: transparent; }
::selection { background: var(--primary-ring); }
@media print { body { background: #fff !important; } }

/* ---------- Aula: acabado profesional (iconos de línea, paleta sobria) ---------- */
svg.ai { width: 1.05em; height: 1.05em; flex: none; vertical-align: -.16em; }

.aula-hero { background: #0f172a; box-shadow: 0 20px 40px -24px rgba(15,23,42,.65); border: 1px solid rgba(255,255,255,.06); }
.aula-hero::before { width: auto; height: auto; inset: 0; right: 0; top: 0; border-radius: 0; background: radial-gradient(520px 260px at 92% -30%, rgba(99,102,241,.42), transparent 70%), radial-gradient(420px 220px at 0% 130%, rgba(14,165,233,.16), transparent 70%); }
.aula-hero::after { width: auto; height: auto; inset: 0; right: 0; bottom: 0; border-radius: 0; background: radial-gradient(rgba(255,255,255,.06) 1px, transparent 1px) 0 0 / 18px 18px; -webkit-mask-image: linear-gradient(90deg, transparent, #000 60%); mask-image: linear-gradient(90deg, transparent, #000 60%); }
.ah-eyebrow { display: inline-flex; align-items: center; gap: .45rem; color: #a5b4fc; opacity: 1; letter-spacing: .9px; }
.ah-eyebrow svg { width: 15px; height: 15px; }
.aula-hero h2 { font-weight: 800; }
.aula-hero h2 span { color: #94a3b8; opacity: 1; }
.aula-hero p { color: #94a3b8; opacity: 1; }
.ah-stats { gap: 0; }
.ah-stats div { padding-right: 1.4rem; margin-right: 1.4rem; border-right: 1px solid rgba(255,255,255,.1); }
.ah-stats div:last-child { border: 0; }
.ah-stats span { color: #94a3b8; opacity: 1; }
.ah-main { background: #6366f1; color: #fff; box-shadow: 0 10px 22px -12px rgba(99,102,241,.9); }

.aula-chip { border-radius: 10px; }

.ac-kind { display: inline-flex; align-items: center; gap: .35rem; letter-spacing: .4px; }
.ac-kind svg { width: 13px; height: 13px; }
.ac-meta span { display: inline-flex; align-items: center; gap: .3rem; }
.ac-meta svg { width: 13px; height: 13px; color: var(--muted); }
.ac-to, .ac-dest, .ac-date, .ax-when { display: flex; align-items: center; gap: .4rem; }

.ae-art { color: var(--primary); }

/** Convierte texto a nota. Devuelve '' (vacío), null (inválido) o un número. Acepta coma decimal. */
function parseNum(str) {
  if (str === null || str === undefined) return '';

}

function normalizeDB(d) {
  if (!d || typeof d !== 'object') throw new Error('El archivo no tiene un formato válido.');
  if (d.app && d.data) d = d.data;                 // respaldo con envoltura
  if (!d.version || d.version < 2) return migrateV1(d);
  if (!Array.isArray(d.modules)) throw new Error('El archivo no contiene módulos.');
  const out = defaultDB();
  out.settings = Object.assign(out.settings, d.settings || {});
  out.modules = d.modules.map(normalizeModule);
  out.agenda = (Array.isArray(d.agenda) ? d.agenda : []).map(normAgenda).filter(Boolean);
  out.cal = d.cal ? normCal(d.cal) : null;
  return out;
}

/** Migra datos de Praxis Pro 7.x (clave sysTecDb) al formato 8.0 */
function migrateV1(old) {
  if (!old || !Array.isArray(old.modules)) throw new Error('El archivo no contiene módulos reconocibles.');
  const out = defaultDB();
  const labels = ['Exposición', 'Participación', 'Práctica', 'Tarea', 'Examen'];
  const colors = ['violet', 'green', 'orange', 'blue', 'red'];
  old.modules.forEach(m => {
    const students = Array.isArray(m.students) ? m.students : [];
    const g = Array.isArray(m.globalRas) ? m.globalRas : [];
    const n = Math.max(g.length, ...students.map(s => (Array.isArray(s.ras) ? s.ras.length : 0)), 0);
    const ras = [];
    for (let i = 0; i < n; i++) {
      const tpl = g[i] || ((students.find(s => s.ras && s.ras[i]) || {}).ras || [])[i] || {};
      ras.push({
        id: uid(), name: tpl.name || `RA ${i + 1}`, w: parseFloat(tpl.w) || 0,
        cats: labels.map((l, ci) => ({ id: uid(), label: l, count: 1, max: (tpl.crit && parseFloat(tpl.crit[ci] && tpl.crit[ci].m)) || 20, color: colors[ci] }))
      });
    }
    const nm = { id: uid(), name: m.name || 'Módulo', course: '', finalWeight: 30, finalLabel: 'Examen final / Proyecto', blankMode: 'ignore', ras, students: [] };
    students.forEach((s, si) => {
      const fin = parseFloat(s.final);
      const st = { id: uid(), num: si + 1, name: String(s.name || ''), final: isFinite(fin) && fin > 0 ? fin : '', g: {}, obs: '' };
      (s.ras || []).forEach((r, ri) => {
        if (!ras[ri] || !r || !Array.isArray(r.crit)) return;
        r.crit.forEach((c, ci) => {
          if (!c || c.v === '' || c.v === null || c.v === undefined) return;
          const v = parseFloat(c.v);
          if (!isFinite(v)) return;
          const cat = ras[ri].cats[ci];
          if (!cat) return;
          st.g[ras[ri].id] = st.g[ras[ri].id] || {};
          st.g[ras[ri].id][cat.id] = [v];
        });
      });
      nm.students.push(st);
    });
    out.modules.push(normalizeModule(nm));
  });
  return out;
}

function loadDB() {
  let raw = null;
  try { raw = localStorage.getItem(STORE_KEY); } catch (e) { return 'blocked'; }
  if (raw) {
    try { db = normalizeDB(JSON.parse(raw)); return 'ok'; }
    catch (e) {
      try { localStorage.setItem('praxisPro_danado_' + Date.now(), raw); } catch (_) { }
      db = defaultDB(); return 'corrupt';
    }
  }
  let legacy = null;
  try { legacy = localStorage.getItem(LEGACY_KEY); } catch (e) { }
  if (legacy) {
    try { db = migrateV1(JSON.parse(legacy)); saveNow(); return 'migrated'; }
    catch (e) { db = defaultDB(); return 'corrupt'; }
  }
  return 'new';
}

/* ---------- Puntos de restauración ---------- */
function getSnaps() { try { return JSON.parse(localStorage.getItem(SNAP_KEY) || '[]'); } catch (e) { return []; } }
function snapshot(reason) {
  if (!db.modules.length) return;
  const list = getSnaps();
  list.unshift({ t: Date.now(), reason, data: JSON.stringify(db) });
  while (list.length > MAX_SNAPS) list.pop();
  // Presupuesto: los puntos de restauración no deben ocupar más de ~1.8 MB.
  let total = 0;
  for (let i = 0; i < list.length; i++) { total += list[i].data.length; if (total > 1.8e6 && i > 0) { list.length = i; break; } }
  while (list.length) {
    try { localStorage.setItem(SNAP_KEY, JSON.stringify(list)); return; }
    catch (e) { list.pop(); }
  }
}

/* ---------- Tooltip único para todos los gráficos ---------- */
(function initTooltip() {
  const t = document.createElement('div');
  t.id = 'vizTip'; t.setAttribute('role', 'tooltip');
  document.body.appendChild(t);
  let cur = null;
  const place = (x, y) => {
    const r = t.getBoundingClientRect();
    let left = x + 14, top = y + 14;
    if (left + r.width > window.innerWidth - 8) left = x - r.width - 14;
    if (top + r.height > window.innerHeight - 8) top = y - r.height - 14;
    t.style.left = Math.max(8, left) + 'px'; t.style.top = Math.max(8, top) + 'px';
  };
  const show = (el, x, y) => { cur = el; t.textContent = el.getAttribute('data-tip'); t.classList.add('on'); place(x, y); };
  const hide = () => { cur = null; t.classList.remove('on'); };
  document.addEventListener('pointermove', e => {
    const el = e.target.closest ? e.target.closest('[data-tip]') : null;
    if (!el) { if (cur) hide(); return; }
    if (el !== cur) show(el, e.clientX, e.clientY); else place(e.clientX, e.clientY);
  });
  document.addEventListener('focusin', e => {
    const el = e.target.closest && e.target.closest('[data-tip]');
    if (el) { const r = el.getBoundingClientRect(); show(el, r.left + r.width / 2, r.bottom); }
  });
  document.addEventListener('focusout', hide);
  window.addEventListener('scroll', hide, true);
})();

/* =========================================================
   Calendario y agenda
   ========================================================= */
function renderCalendar() {
  if (!state.calYM) state.calYM = ymOf(todayISO());
  const ym = state.calYM, t = todayISO();
  const evs = allEvents(state.calMod);
  const byDay = {};
  evs.forEach(e => { (byDay[e.date] = byDay[e.date] || []).push(e); });

  // Cuadrícula de lunes a domingo
  const first = dateOf(ym, 1), offset = (first.getDay() + 6) % 7, nDays = daysInMonth(ym);
  const cells = [];
  for (let i = 0; i < offset; i++) cells.push('<div class="cal-cell cal-out"></div>');
  for (let d = 1; d <= nDays; d++) {
    const iso = `${ym}-${pad2(d)}`, list = byDay[iso] || [];
    const wd = dateOf(ym, d).getDay();
    const fl = festOf(iso), we = wd === 0 || wd === 6;
    const hol = fl.some(x => x.k === 'fer' || x.off), brk = !we && fl.some(x => x.brk);
    const fshow = fl.filter(x => !x.brk || x.first || wd === 1 || d === 1).filter(x => !(x.ent && !x.first && wd !== 1 && d !== 1));
    const fvis = fshow.slice(0, 2), maxEv = fvis.length ? 2 : 3;
    cells.push(`<div class="cal-cell${iso === t ? ' cal-today' : ''}${we ? ' cal-we' : ''}${hol ? ' cal-hol' : ''}${brk ? ' cal-brk' : ''}" data-act="cal-day" data-date="${iso}" title="${fl.length ? esc(fl.map(festLabel).join(' · ')) + ' — ' : ''}Agendar el ${esc(longDate(iso))}">
      <div class="cal-dn"><span>${d}</span>${list.length ? `<small>${list.length}</small>` : ''}</div>
      ${fvis.map(it => festChip(it, iso)).join('')}${fshow.length > 2 ? `<button class="cal-more" data-act="cal-fest" data-date="${iso}">+${fshow.length - 2} fechas</button>` : ''}
      ${list.slice(0, maxEv).map(evChip).join('')}
      ${list.length > maxEv ? `<button class="cal-more" data-act="cal-dayview" data-date="${iso}">+${list.length - maxEv} más</button>` : ''}
    </div>`);
  }
  while (cells.length % 7) cells.push('<div class="cal-cell cal-out"></div>');

  const prevYM = ymOf(addDays(`${ym}-01`, -1)), nextYM = ymOf(addDays(`${ym}-${pad2(nDays)}`, 1));
  const upcoming = evs.filter(e => e.date >= t && e.date <= addDays(t, 14) && !(e.src === 'ev' && e.done));
  const pending = pendingToGrade(state.calMod);
  const overdue = evs.filter(e => e.src === 'ev' && !e.done && e.date < t);
  const monthEvs = evs.filter(e => ymOf(e.date) === ym);
  const typeCount = Object.keys(EV_TYPES).map(k => [k, monthEvs.filter(e => e.type === k).length]).filter(x => x[1]);

  const listItem = (e, extra = '') => `<li class="ag-item" data-act="cal-open-ev" data-src="${e.src}" data-key="${esc(e.key)}">
      <span class="cat-dot cat-${EV_TYPES[e.type]}"></span>
      <span class="ag-date">${fmtDate(e.date)}${e.time ? ' ' + e.time : ''}</span>
      <span class="ag-title">${esc(e.title)}</span>
      <span class="ag-meta">${e.mod ? esc(modShort(e.mod)) + (e.mod.course ? ' ' + esc(e.mod.course) : '') : 'General'}${e.sub ? ' · ' + e.sub : ''}${extra}</span></li>`;

  let notifBtn = '';
  if ('Notification' in window) {
    const p = Notification.permission;
    notifBtn = p === 'granted' ? `<span class="badge ok" title="Recibirás avisos de tu agenda y de las alertas tempranas">${ICON.bell} Avisos activos</span>`
      : p === 'denied' ? `<span class="badge neutral" title="El navegador bloqueó los avisos">${ICON.bell} Avisos bloqueados</span>`
        : `<button class="btn btn-sm btn-secondary" data-act="cal-notif">${ICON.bell} Activar avisos</button>`;
  }

  return `
  <div class="mod-head">
    <button class="btn btn-secondary btn-icon" data-act="go-home" title="Volver al panel">${ICON.back}</button>
    <div><h1>Calendario</h1><p class="muted small">Tu agenda, las actividades del registro, los feriados, las efemérides y el calendario escolar</p></div>
    <span class="spacer"></span>
    ${notifBtn}
    <button class="btn btn-primary" data-act="cal-new">${ICON.plus} Agendar</button>
  </div>
  <div class="cal-layout">
    <section class="card cal-main">
      <div class="toolbar">
        <button class="btn btn-secondary btn-icon" data-act="cal-month" data-ym="${prevYM}" title="Mes anterior">‹</button>
        <h2 class="cal-title">${ymLabel(ym)}</h2>
        <button class="btn btn-secondary btn-icon" data-act="cal-month" data-ym="${nextYM}" title="Mes siguiente">›</button>
        <button class="btn btn-sm btn-ghost" data-act="cal-month" data-ym="${ymOf(t)}">Hoy</button>
        <span class="spacer"></span>
        <select id="calMod" style="width:auto" title="Filtrar por módulo">
          <option value="">Todos los módulos</option>
          ${db.modules.map(m => `<option value="${m.id}" ${state.calMod === m.id ? 'selected' : ''}>${esc(modShort(m))}${m.course ? ' · ' + esc(m.course) : ''}</option>`).join('')}
        </select>
      </div>
      <div class="cal-grid">
        ${['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'].map(d => `<div class="cal-wd">${d}</div>`).join('')}
        ${cells.join('')}
      </div>
      <div class="fest-bar">${festToggles()}</div>
      <div class="viz-legend" style="padding:.5rem 1rem 0;margin:0">${Object.entries(EV_TYPES).map(([k, c]) => `<span><i class="cat-${c}" style="background:var(--c)"></i>${k}${typeCount.find(x => x[0] === k) ? ` (${typeCount.find(x => x[0] === k)[1]})` : ''}</span>`).join('')}</div>
      <p class="muted small" style="padding:.4rem 1rem .9rem">Haz clic en un día para agendar y en una fecha especial para ver de qué trata. Las actividades del registro (prácticas, exámenes…) aparecen aquí cuando les pones fecha. Los feriados se calculan con la Ley 139-97; el calendario escolar sale de Planificación › Calendario.</p>
    </section>
    <aside class="cal-side">
      <div class="card card-pad">
        <h3 class="side-h">Próximos 14 días</h3>
        ${upcoming.length ? `<ul class="ag-list">${upcoming.map(e => listItem(e)).join('')}</ul>` : '<p class="small muted">No hay nada agendado en los próximos 14 días.</p>'}
      </div>
      <div class="card card-pad">
        <h3 class="side-h">Pendientes de calificar <span class="badge ${pending.length ? 'risk' : 'ok'}">${pending.length}</span></h3>
        ${pending.length ? `<ul class="ag-list">${pending.map(e => listItem(e, ` · <b>${e.graded}/${e.total}</b> con nota`)).join('')}</ul>` : '<p class="small muted">Todas las actividades pasadas están calificadas.</p>'}
      </div>
      ${festMonthCard(ym)}
      ${overdue.length ? `<div class="card card-pad"><h3 class="side-h">Vencidos sin completar <span class="badge bad">${overdue.length}</span></h3><ul class="ag-list">${overdue.map(e => listItem(e)).join('')}</ul></div>` : ''}
    </aside>
  </div>`;
}
function evChip(e) {
  const st = e.src === 'act' ? (e.done ? ' ev-done' : (e.date < todayISO() ? ' ev-pend' : '')) : (e.done ? ' ev-done' : '');
  const mod = e.mod ? modShort(e.mod) + (e.mod.course ? ' ' + e.mod.course : '') : '';
  return `<button class="ev-chip cat-${EV_TYPES[e.type]}${st}" data-act="cal-open-ev" data-src="${e.src}" data-key="${esc(e.key)}" title="${esc(e.title + (mod ? ' · ' + mod : '') + (e.time ? ' · ' + fmtTime12(e.time) : '') + (e.src === 'act' ? ` · ${e.graded}/${e.total} con nota` : ''))}">${e.time ? `<b>${e.time}</b> ` : ''}${esc(mod ? mod + ': ' : '')}${esc(e.title)}</button>`;
}

/* ---------- Diálogo de evento ---------- */
/** Lista de actividades de un módulo para vincular («RA 1 · Práctica 2»). */
function actSlots(m) {
  const out = [];
  m.ras.forEach((ra, ri) => ra.cats.forEach(c => {
    for (let i = 0; i < c.count; i++) {
      const a = actOf(c, i);

}
/** Opciones del selector de actividades, ordenadas y agrupadas por RA (segmentos). */

/* ---------- Edición ---------- */
const ATT_CYCLE = ['', 'P', 'A', 'T', 'E'];
function setAttCell(sid, d, code, moveDown) {
  const m = curMod(), s = findStu(m, sid); if (!s) return;
  setAtt(s, state.attYM, d, code); persist();
  const btn = document.activeElement;
  const r = btn && btn.dataset ? +btn.dataset.r : null, c = btn && btn.dataset ? +btn.dataset.c : null;
  render();
  if (moveDown && r !== null) {
    const next = document.querySelector(`.att-grid .att-cell[data-r="${r + 1}"][data-c="${c}"]`);
    if (next) { next.focus(); next.scrollIntoView({ block: 'nearest', inline: 'nearest' }); }
  }
}
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('.att-cell[data-att]'); if (!b) return;
  const m = curMod(); if (!m) return;
  const [sid, d] = b.dataset.att.split('|'), s = findStu(m, sid); if (!s) return;
  const next = ATT_CYCLE[(ATT_CYCLE.indexOf(getAtt(s, state.attYM, +d)) + 1) % ATT_CYCLE.length];
  b.focus(); setAttCell(sid, +d, next, false);
});
document.addEventListener('keydown', e => {
  const t = e.target;
  if (!t.classList || !t.classList.contains('att-cell') || !t.dataset.att) return;
  const [sid, d] = t.dataset.att.split('|');
  const k = e.key.toUpperCase();
  const r = +t.dataset.r, c = +t.dataset.c;
  const at = (rr, cc) => document.querySelector(`.att-grid .att-cell[data-r="${rr}"][data-c="${cc}"]`);
  let target = null;
  if (ATT_CODES.includes(k) && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); return setAttCell(sid, +d, k, true); }
  if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); return setAttCell(sid, +d, '', false); }
  if (e.key === 'Enter' || e.key === 'ArrowDown') target = at(r + 1, c);
  else if (e.key === 'ArrowUp') target = at(r - 1, c);
  else if (e.key === 'ArrowRight') target = at(r, c + 1);
  else if (e.key === 'ArrowLeft') target = at(r, c - 1);
  else return;
  e.preventDefault();
  if (target) { target.focus(); target.scrollIntoView({ block: 'nearest', inline: 'nearest' }); }
});

/** Limpiar asistencia: marcas del mes, días sin marcas, días del mes, un estudiante o todo el año. */
function attClearDialog() {
  const m = curMod(), ym = state.attYM, days = classDays(m, ym), lbl = ymLabel(ym);
  const markedDays = days.filter(d => m.students.some(s => getAtt(s, ym, d)));
  const emptyDays = days.length - markedDays.length;
  const yearMarks = m.students.reduce((a, s) => a + Object.values(s.att || {}).reduce((b, v) => b + (String(v).match(/[PATE]/g) || []).length, 0), 0);
  const yearDays = Object.values(m.classDays || {}).reduce((a, l) => a + l.length, 0);
  const md = openModal({
    title: 'Limpiar asistencia', icon: '🧹', wide: true, sub: `${esc(cap(lbl))} · ${days.length} días de clase · ${markedDays.length} con marcas`,
    body: `<div class="menu-list">
      <button class="btn btn-secondary" data-c="marks" ${markedDays.length ? '' : 'disabled'}>Vaciar las marcas de ${esc(lbl)} <small class="muted">(se quedan los días)</small></button>
      <button class="btn btn-secondary" data-c="empty" ${emptyDays ? '' : 'disabled'}>Quitar los ${emptyDays} días de ${esc(lbl)} que no tienen marcas</button>
      <button class="btn btn-secondary" data-c="month" ${days.length ? '' : 'disabled'}>Quitar todos los días de clase de ${esc(lbl)} (y sus marcas)</button>

        <div class="row" style="gap:.4rem"><select id="acStu" style="flex:1"><option value="">— Elegir estudiante —</option>${allStudents(m).map(s => `<option value="${s.id}">${s.num}. ${esc(s.name)}</option>`).join('')}</select><button class="btn btn-secondary" data-c="stu">Vaciar</button></div></div>
      <button class="btn btn-danger" data-c="all" ${yearMarks || yearDays ? '' : 'disabled'}>Borrar toda la asistencia del año de este módulo (${yearDays} días · ${yearMarks} marcas)</button>
    </div><p class="small muted" style="margin-top:.6rem">Antes de cada limpieza se guarda una copia de seguridad (Respaldo › Copias automáticas).</p>`,
  });
  md.el.querySelectorAll('[data-c]').forEach(b => b.onclick = () => {
    const c = b.dataset.c;
    const done = msg => { persist(); render(); toast(msg, 'ok', 2800); };
    if (c === 'stu') {
      const s = findStu(m, md.el.querySelector('#acStu').value); if (!s) return toast('Elige un estudiante.', 'error');
      md.close(); snapshot('Antes de vaciar la asistencia de un estudiante'); days.forEach(d => setAtt(s, ym, d, '')); return done(`Asistencia de ${s.name} vaciada en ${lbl}.`);
    }
    md.close();
    if (c === 'marks') { snapshot('Antes de vaciar la asistencia del mes'); m.students.forEach(s => days.forEach(d => setAtt(s, ym, d, ''))); return done(`Marcas de ${lbl} vaciadas.`); }
    if (c === 'empty') { snapshot('Antes de quitar días sin marcas'); days.filter(d => !markedDays.includes(d)).forEach(d => removeClassDay(m, ym, d)); return done(`${emptyDays} días sin marcas quitados.`); }
    if (c === 'month') confirmBox('Quitar los días del mes', `Se quitarán los ${days.length} días de clase de ${lbl}${markedDays.length ? ` y las marcas de ${markedDays.length} días` : ''}.`, 'Quitar', () => {
      snapshot('Antes de quitar los días del mes'); m.students.forEach(s => days.forEach(d => setAtt(s, ym, d, ''))); delete m.classDays[ym]; done(`Días de ${lbl} quitados.`);
    });
    if (c === 'all') confirmBox('Borrar toda la asistencia', `Se borrarán los ${yearDays} días de clase y las ${yearMarks} marcas de asistencia de este módulo. Las notas no cambian.`, 'Borrar todo', () => {
      snapshot('Antes de borrar toda la asistencia'); m.students.forEach(s => { s.att = {}; }); m.classDays = {}; done('Asistencia del módulo borrada.');
    });
  });
}

        const added = addClassDay(m, iso); state.attYM = ymOf(iso);

function attAutoDialog() {
  const m = curMod(), ym = state.attYM;
  const wd = m.weekdays.length ? m.weekdays : [];
  openModal({
    title: 'Días de clase automáticos', icon: '🗓️', sub: 'Marca los días de la semana en que das este módulo.',
    body: `<div class="wd-picks">${[1, 2, 3, 4, 5, 6].map(d => `<label class="wd-pick"><input type="checkbox" value="${d}" ${wd.includes(d) ? 'checked' : ''}><span>${WDAYS[d]}</span></label>`).join('')}</div>
      <label class="field">Aplicar a

      </label>
      <p class="muted small">Se agregan los días que falten; los que ya existen se conservan. Después puedes quitar feriados o días sin clase desde el encabezado de cada día.</p>`,
    actions: [{ label: 'Cancelar' }, {
      label: 'Crear días', cls: 'btn-primary', onClick: ov => {
        const sel = [...ov.querySelectorAll('.wd-pick input:checked')].map(i => +i.value);

        let n = 0;
        target.forEach(x => { for (let d = 1; d <= daysInMonth(x); d++) if (sel.includes(dateOf(x, d).getDay()) && addClassDay(m, `${x}-${pad2(d)}`)) n++; });
        persist(); render(); toast(n ? `${n} días de clase creados.` : 'No hacía falta crear días nuevos.', 'ok', 3000);
      }

}
function attToday(force) {
  const m = curMod(), t = todayISO();
  if (!schoolMonths().includes(ymOf(t))) return toast('Hoy está fuera del año escolar configurado en Ajustes.', 'error', 4000);
  const wd = new Date().getDay();
  if (!force && (wd === 0 || wd === 6) && !classDays(m, ymOf(t)).includes(+t.slice(8, 10)))
    return confirmBox('Hoy es fin de semana', `Hoy es ${longDate(t)}. ¿Quieres agregarlo como día de clase de todos modos?`, 'Sí, agregar', () => attToday(true), { danger: false });
  const added = addClassDay(m, t); state.attYM = ymOf(t);
  if (added) persist();
  render();
  const col = classDays(m, state.attYM).indexOf(+t.slice(8, 10));
  const first = document.querySelector(`.att-grid .att-cell[data-r="0"][data-c="${col}"]`);
  if (first) { first.focus(); first.scrollIntoView({ block: 'nearest', inline: 'center' }); }
  toast(added ? 'Hoy quedó como día de clase. Usa el encabezado del día para marcar a todos presentes.' : 'Listo para pasar lista de hoy.', 'ok', 3200);
}

/* ---------- Reportes de asistencia ---------- */
function printAttMonth(m, ym) {
  const days = classDays(m, ym);
  if (!days.length) return toast(`${ymLabel(ym)} no tiene días de clase.`, 'error');
  const head = days.map(d => `<th>${WDAYS_S[dateOf(ym, d).getDay()]}<br>${pad2(d)}</th>`).join('');
  const rows = allStudents(m).map(s => {
    const st = attStats(m, s, [ym]);
    return `<tr><td>${s.num}</td><td class="l">${esc(s.name)}</td>${days.map(d => { const v = getAtt(s, ym, d); return `<td class="${v === 'A' ? 'low' : ''}">${v}</td>`; }).join('')}
      <td>${st.P}</td><td class="${st.A ? 'low' : ''}">${st.A}</td><td>${st.T}</td><td>${st.E}</td><td class="tot">${st.attended}/${st.marked}</td><td class="tot">${st.pct === null ? '—' : Math.round(st.pct * 100) + '%'}</td></tr>`;
  }).join('');

    <table class="rp-table rp-att"><thead><tr><th>No.</th><th class="l">Estudiante</th>${head}<th>P</th><th>A</th><th>T</th><th>E</th><th>Asistió</th><th>%</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="rp-foot"><div>P = Presente · A = Ausente · T = Tardanza · E = Excusa · Asistió = P + T</div><div style="white-space:nowrap">Días de clase: <b>${days.length}</b> · Asistencia del curso: <b>${cs.pct === null ? '—' : Math.round(cs.pct * 100) + '%'}</b> · Ausencias: <b>${cs.A}</b> · Tardanzas: <b>${cs.T}</b> · Excusas: <b>${cs.E}</b></div></div>
    ${signLine()}</section>`, 'landscape');
}
function printAttYear(m) {
  const months = schoolMonths().filter(ym => classDays(m, ym).length);
  if (!months.length) return toast('Todavía no hay días de clase registrados.', 'error');
  const rows = allStudents(m).map(s => {
    const tot = attStats(m, s, months);

    return `<tr><td>${s.num}</td><td class="l">${esc(s.name)}</td>${cells}<td>${tot.P}</td><td class="${tot.A ? 'low' : ''}">${tot.A}</td><td>${tot.T}</td><td>${tot.E}</td><td class="tot">${tot.attended}/${tot.marked}</td><td class="tot">${tot.pct === null ? '—' : Math.round(tot.pct * 100) + '%'}</td></tr>`;
  }).join('');

    <table class="rp-table"><thead><tr><th>No.</th><th class="l">Estudiante</th>${months.map(ym => `<th>${ymShort(ym)}<br>(${classDays(m, ym).length} d)</th>`).join('')}<th>P</th><th>A</th><th>T</th><th>E</th><th>Asistió</th><th>%</th></tr></thead><tbody>${rows}</tbody></table>

}
function printAttRanking(m, scope) {
  const months = scope === 'year' ? schoolMonths() : [scope];
  const list = allStudents(m).map(s => ({ s, r: attStats(m, s, months) })).filter(x => x.r.A + x.r.E > 0)
    .sort((a, b) => (b.r.A + b.r.E) - (a.r.A + a.r.E) || b.r.A - a.r.A || a.s.num - b.s.num);
  const label = scope === 'year' ? 'en el año escolar' : 'en ' + ymLabel(scope);
  if (!list.length) return toast(`Nadie tiene ausencias ni excusas ${label}.`, 'ok');
  const alertN = db.settings.attAlert || 3;
  const rows = list.map(({ s, r }, i) => `<tr><td>${i + 1}</td><td>${s.num}</td><td class="l">${esc(s.name)}</td><td class="${r.A >= alertN ? 'low' : ''}">${r.A}</td><td>${r.E}</td><td class="tot">${r.A + r.E}</td><td>${r.T}</td><td>${r.attended}/${r.marked}</td><td class="tot">${r.pct === null ? '—' : Math.round(r.pct * 100) + '%'}</td></tr>`).join('');
  printHTML(`<section class="rp-page">${reportHead(m, `Estudiantes con más ausencias y excusas ${label}`)}
    <table class="rp-table"><thead><tr><th>#</th><th>No.</th><th class="l">Estudiante</th><th>Ausencias</th><th>Excusas</th><th>Total faltas</th><th>Tardanzas</th><th>Asistió</th><th>%</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="rp-foot"><div>Ordenado por total de faltas (ausencias + excusas). En rojo: ${alertN} o más ausencias.</div></div>
    <div class="rp-box"><b>Acciones a tomar:</b></div>${signLine()}</section>`, 'portrait');
}
function exportAttCSV(m) {
  const months = schoolMonths().filter(ym => classDays(m, ym).length);
  if (!months.length) return toast('Todavía no hay días de clase registrados.', 'error');
  const head = ['No.', 'Estudiante'];
  months.forEach(ym => classDays(m, ym).forEach(d => head.push(`${ym}-${pad2(d)}`)));
  head.push('P', 'A', 'T', 'E', 'Asistió', 'Días marcados', '%');
  const lines = [head];
  allStudents(m).forEach(s => {
    const row = [s.num, s.name];
    months.forEach(ym => classDays(m, ym).forEach(d => row.push(getAtt(s, ym, d))));
    const r = attStats(m, s, months);
    row.push(r.P, r.A, r.T, r.E, r.attended, r.marked, r.pct === null ? '' : Math.round(r.pct * 100));
    lines.push(row);
  });
  downloadFile(`${safeName(modShort(m))}${m.course ? '_' + safeName(m.course) : ''}_asistencia_${fileDate()}.csv`, '﻿' + lines.map(r => r.map(csvCell).join(',')).join('\r\n'), 'text/csv;charset=utf-8');
  toast('Asistencia exportada. Ábrela con Excel.', 'ok');
}

/* =========================================================
   Cuaderno anecdótico
   ========================================================= */
function anecFiltered(m) {
  const f = state.anec, q = norm(f.q);
  return m.anec.filter(e => {
    if (f.sid && e.sid !== f.sid) return false;
    if (f.kind && e.kind !== f.kind) return false;
    if (f.cat && e.cat !== f.cat) return false;
    if (q) {
      const s = findStu(m, e.sid);
      if (!norm([s ? s.name : '', e.cat, e.desc, e.action, e.follow].join(' ')).includes(q)) return false;
    }
    return true;
  }).sort(anecSort);
}
function renderAnecdotario(m) {
  if (!m.students.length) return `<div class="empty"><div class="big">👥</div><p><strong>No hay estudiantes.</strong></p><p style="margin-top:1rem"><button class="btn btn-primary" data-act="import-stu">${ICON.upload} Importar lista</button></p></div>`;
  const f = state.anec;
  if (f.sid && !findStu(m, f.sid)) f.sid = '';
  const all = m.anec, list = anecFiltered(m);
  const per = anecByStudent(m);
  const attention = per.filter(r => r.neg > 0).sort((a, b) => anecScore(b) - anecScore(a) || b.neg - a.neg || b.last.localeCompare(a.last));
  const neg = all.filter(e => e.kind === 'neg').length, pos = all.filter(e => e.kind === 'pos').length, graves = all.filter(e => e.sev === 'grave').length;
  const cats = [...new Set(all.map(e => e.cat))].sort();

  const rank = attention.length ? `<div class="card card-pad" style="margin-bottom:1rem">
      <div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:.5rem;margin-bottom:.6rem"><h3 style="font-size:1rem">Estudiantes que requieren atención</h3><span class="muted small">Ordenados por gravedad: grave = 3 · moderada = 2 · leve = 1</span></div>
      <div class="an-rank">${attention.slice(0, 8).map(r => {
        const top = Object.entries(r.cats).sort((a, b) => b[1] - a[1]).slice(0, 2).map(x => `${esc(x[0])} (${x[1]})`).join(', ');
        return `<button class="an-rank-item${f.sid === r.s.id ? ' active' : ''}" data-act="anec-filter-stu" data-sid="${r.s.id}">
          <span class="an-rank-n">${r.s.num}</span>
          <span class="an-rank-name"><b>${esc(r.s.name)}</b><small>${top}</small></span>
          <span class="an-rank-c">${r.grave ? `<span class="badge bad">${r.grave} grave${r.grave > 1 ? 's' : ''}</span>` : ''}<span class="badge neutral">${r.neg} a mejorar</span>${r.pos ? `<span class="badge ok">${r.pos} ★</span>` : ''}</span>
        </button>`;
      }).join('')}</div></div>` : '';

  const cards = list.map(e => {
    const s = findStu(m, e.sid), k = ANEC_KINDS[e.kind];
    return `<article class="an-card an-${e.kind}">
      <div class="an-head">
        <span class="an-date">${esc(cap(longDate(e.date)))}${e.time ? ' · ' + fmtTime12(e.time) : ''}</span>
        <span class="an-stu"><button class="link" data-act="anec-filter-stu" data-sid="${e.sid}">${s ? s.num + '. ' + esc(s.name) : 'Estudiante eliminado'}</button>${s ? copyBtn(s.name) : ''}</span>
        <span class="spacer"></span>
        <span class="badge ${k.cls}">${k.icon} ${k.short}</span>
        <span class="badge neutral">${esc(e.cat)}</span>
        ${e.sev ? `<span class="badge ${e.sev === 'grave' ? 'bad' : e.sev === 'moderada' ? 'risk' : 'neutral'}">${ANEC_SEV[e.sev]}</span>` : ''}
        ${e.parents ? '<span class="badge info">Padres informados</span>' : ''}
        <button class="btn btn-ghost btn-icon" data-act="anec-edit" data-id="${e.id}" title="Editar">${ICON.edit}</button>
        <button class="btn btn-ghost btn-icon" style="color:var(--bad)" data-act="anec-del" data-id="${e.id}" title="Eliminar">${ICON.trash}</button>
      </div>
      <div class="an-body">
        <p><b>Hecho observado:</b> ${esc(e.desc).replace(/\n/g, '<br>')}</p>
        ${e.action && e.action !== 'Ninguna' ? `<p><b>Acción tomada:</b> ${esc(e.action)}</p>` : ''}
        ${e.follow ? `<p><b>Seguimiento / compromiso:</b> ${esc(e.follow).replace(/\n/g, '<br>')}</p>` : ''}
      </div>
    </article>`;
  }).join('');

  const filtered = f.sid || f.kind || f.cat || f.q;
  return `
  <div class="stats">
    <div class="stat pri"><span>Anotaciones</span><b>${all.length}</b></div>
    <div class="stat bad"><span>Conductas a mejorar</span><b>${neg}</b></div>
    <div class="stat ok"><span>Conductas positivas</span><b>${pos}</b></div>
    <div class="stat risk"><span>Faltas graves</span><b>${graves}</b></div>
    <div class="stat"><span>Estudiantes con incidencias</span><b>${attention.length}</b></div>
  </div>
  ${rank}
  <div class="card">
    <div class="toolbar">
      <div class="search">${ICON.search}<input type="search" id="anecQ" data-key="anecQ" placeholder="Buscar en las anotaciones…" value="${esc(f.q)}" autocomplete="off"></div>
      <select id="anecSid" style="width:auto;max-width:220px"><option value="">Todos los estudiantes</option>${allStudents(m).map(s => `<option value="${s.id}" ${f.sid === s.id ? 'selected' : ''}>${s.num}. ${esc(s.name)}</option>`).join('')}</select>
      <select id="anecKind" style="width:auto"><option value="">Todos los tipos</option>${Object.entries(ANEC_KINDS).map(([k, v]) => `<option value="${k}" ${f.kind === k ? 'selected' : ''}>${v.label}</option>`).join('')}</select>
      ${cats.length ? `<select id="anecCat" style="width:auto;max-width:200px"><option value="">Todas las categorías</option>${cats.map(c => `<option ${f.cat === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>` : ''}
      ${filtered ? '<button class="btn btn-sm btn-ghost" data-act="anec-clear">Quitar filtros</button>' : ''}
      <span class="spacer"></span>
      <button class="btn btn-secondary" data-act="anec-print" title="Imprimir la ficha anecdótica">${ICON.print} Imprimir</button>
      <button class="btn btn-primary" data-act="anec-new" data-sid="${f.sid}">${ICON.plus} Nueva anotación</button>
    </div>
    <div class="an-list">${cards || `<div class="empty" style="border-width:1px"><div class="big">📒</div><p><strong>${all.length ? 'Ninguna anotación coincide con los filtros.' : 'El cuaderno anecdótico está vacío.'}</strong></p><p class="small">Registra hechos concretos y objetivos: qué pasó, cuándo y qué se hizo.</p></div>`}</div>
  </div>`;
}

/* ---------- Diálogo de anotación ---------- */
function anecDialog({ id, sid } = {}) {
  const m = curMod(); if (!m) return;
  const e = id ? m.anec.find(x => x.id === id) : null;
  const v = e || { sid: sid || '', date: todayISO(), time: nowHM(), kind: 'neg', cat: ANEC_CATS.neg[0], sev: 'leve', desc: '', action: 'Llamada de atención verbal', follow: '', parents: false };
  const studs = allStudents(m);
  const stuPicker = e
    ? `<label class="field">Estudiante<select id="anStu">${studs.map(s => `<option value="${s.id}" ${s.id === v.sid ? 'selected' : ''}>${s.num}. ${esc(s.name)}</option>`).join('')}</select></label>`
    : `<div class="field"><span>Estudiante(s) <small>— puedes marcar varios si el hecho fue en grupo</small></span>
        <input type="search" id="anStuQ" placeholder="Filtrar por nombre o número…" autocomplete="off">
        <div class="an-picks" id="anPicks">${studs.map(s => `<label class="an-pick" data-n="${esc(norm(s.name))}" data-num="${s.num}"><input type="checkbox" value="${s.id}" ${s.id === v.sid ? 'checked' : ''}><span>${s.num}. ${esc(s.name)}</span></label>`).join('')}</div>
        <small id="anCount"></small></div>`;
  const md = openModal({
    title: e ? 'Editar anotación' : 'Nueva anotación', icon: '📒', wide: true,
    sub: 'Describe el hecho de forma objetiva: lo que viste o escuchaste, sin juicios.',
    body: `${stuPicker}
      <div class="form-grid">
        <label class="field">Fecha<input type="date" id="anDate" value="${esc(v.date)}"></label>
        <label class="field">Hora<input type="time" id="anTime" value="${esc(v.time)}"></label>
      </div>
      <div class="an-kinds">${Object.entries(ANEC_KINDS).map(([k, x]) => `<label class="an-kind an-k-${k}"><input type="radio" name="anKind" value="${k}" ${v.kind === k ? 'checked' : ''}><span>${x.icon} ${x.label}</span></label>`).join('')}</div>
      <div class="form-grid">
        <label class="field">Categoría<select id="anCat"></select></label>
        <label class="field" id="anSevWrap">Gravedad<select id="anSev">${Object.entries(ANEC_SEV).map(([k, l]) => `<option value="${k}" ${v.sev === k ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
      </div>
      <label class="field">Hecho observado<textarea id="anDesc" rows="3" placeholder="Ej.: Durante la práctica de redes estuvo usando el celular y no realizó la actividad, aun después de dos llamados de atención.">${esc(v.desc)}</textarea></label>
      <div class="form-grid">
        <label class="field">Acción tomada<select id="anAct">${ANEC_ACTIONS.map(a => `<option ${v.action === a ? 'selected' : ''}>${esc(a)}</option>`).join('')}</select></label>
        <label class="check" style="align-self:end;padding-bottom:.5rem"><input type="checkbox" id="anPar" ${v.parents ? 'checked' : ''}> Se informó a los padres o tutores</label>
      </div>
      <label class="field">Seguimiento / compromiso (opcional)<textarea id="anFol" rows="2" placeholder="Ej.: Se comprometió a entregar la práctica el lunes. Revisar en la próxima clase.">${esc(v.follow)}</textarea></label>`,
    actions: [{ label: 'Cancelar' }, {
      label: e ? 'Guardar' : 'Guardar anotación', cls: 'btn-primary', onClick: ov => {
        const ids = e ? [ov.querySelector('#anStu').value] : [...ov.querySelectorAll('#anPicks input:checked')].map(i => i.value);
        if (!ids.length) { toast('Elige al menos un estudiante.', 'error'); return false; }
        const desc = ov.querySelector('#anDesc').value.trim();
        if (!desc) { toast('Describe el hecho observado.', 'error'); ov.querySelector('#anDesc').focus(); return false; }
        const kind = ov.querySelector('input[name=anKind]:checked').value;
        const base = {
          date: isoDate(ov.querySelector('#anDate').value) || todayISO(), time: isoTime(ov.querySelector('#anTime').value),
          kind, cat: ov.querySelector('#anCat').value, sev: kind === 'neg' ? ov.querySelector('#anSev').value : '',
          desc, action: ov.querySelector('#anAct').value, follow: ov.querySelector('#anFol').value.trim(), parents: ov.querySelector('#anPar').checked
        };
        if (e) Object.assign(e, normAnec({ ...e, ...base, sid: ids[0] }));
        else ids.forEach(sid => m.anec.push(normAnec({ id: uid(), sid, ...base })));
        persist(); render();
        toast(e ? 'Anotación actualizada.' : ids.length > 1 ? `Anotación registrada para ${ids.length} estudiantes.` : 'Anotación registrada.', 'ok');
      }
    }],
    onOpen: ov => {
      const catSel = ov.querySelector('#anCat'), sevWrap = ov.querySelector('#anSevWrap');
      const fillCats = keep => {
        const k = ov.querySelector('input[name=anKind]:checked').value;
        catSel.innerHTML = ANEC_CATS[k].map(c => `<option>${esc(c)}</option>`).join('');
        if (keep && ANEC_CATS[k].includes(keep)) catSel.value = keep;
        sevWrap.style.visibility = k === 'neg' ? 'visible' : 'hidden';
        const act = ov.querySelector('#anAct');
        if (!e) act.value = k === 'pos' ? 'Reconocimiento' : k === 'obs' ? 'Ninguna' : 'Llamada de atención verbal';
      };
      ov.querySelectorAll('input[name=anKind]').forEach(r => r.addEventListener('change', () => fillCats()));
      fillCats(v.cat);
      if (e) { ov.querySelector('#anAct').value = v.action || 'Ninguna'; return; }
      const q = ov.querySelector('#anStuQ'), count = ov.querySelector('#anCount');
      const upd = () => { const n = ov.querySelectorAll('#anPicks input:checked').length; count.textContent = n ? `${n} seleccionado${n > 1 ? 's' : ''}` : ''; };
      q.addEventListener('input', () => {
        const t = norm(q.value).replace(/^#/, '');
        ov.querySelectorAll('.an-pick').forEach(l => { l.style.display = !t || l.dataset.n.includes(t) || l.dataset.num === t ? '' : 'none'; });
      });
      ov.querySelector('#anPicks').addEventListener('change', upd); upd();
      if (v.sid) setTimeout(() => ov.querySelector('#anDesc').focus(), 80);
    }
  });
  return md;
}

/* ---------- Reportes del anecdotario ---------- */
function anecRowsHTML(m, entries) {
  return entries.map(e => `<tr><td>${fmtDate(e.date)}/${e.date.slice(2, 4)}${e.time ? '<br>' + e.time : ''}</td><td>${ANEC_KINDS[e.kind].short}</td><td class="l">${esc(e.cat)}${e.sev ? '<br><b>' + ANEC_SEV[e.sev] + '</b>' : ''}</td>
    <td class="l">${esc(e.desc).replace(/\n/g, '<br>')}</td><td class="l">${esc(e.action || '')}${e.parents ? '<br><i>Padres informados</i>' : ''}</td><td class="l">${esc(e.follow || '')}</td></tr>`).join('');
}
function printAnecStudents(m, sid) {
  const studs = sid ? [findStu(m, sid)].filter(Boolean) : allStudents(m).filter(s => m.anec.some(e => e.sid === s.id));
  if (!studs.length) return toast('No hay anotaciones para imprimir.', 'error');
  const pages = studs.map(s => {
    const entries = m.anec.filter(e => e.sid === s.id).sort((a, b) => anecSort(b, a));
    const n = k => entries.filter(e => e.kind === k).length;
    return `<section class="rp-page">${reportHead(m, 'Ficha del cuaderno anecdótico')}
      <div class="rp-student"><div>Estudiante: <b>${esc(s.name)}</b></div><div>No. de lista: <b>${s.num}</b></div></div>
      <p style="font-size:9pt;margin:0 0 6px">Anotaciones: <b>${entries.length}</b> · Conductas a mejorar: <b>${n('neg')}</b> (graves: ${entries.filter(e => e.sev === 'grave').length}) · Positivas: <b>${n('pos')}</b> · Observaciones: <b>${n('obs')}</b></p>
      ${entries.length ? `<table class="rp-table rp-anec"><thead><tr><th>Fecha</th><th>Tipo</th><th class="l">Categoría</th><th class="l">Hecho observado</th><th class="l">Acción tomada</th><th class="l">Seguimiento</th></tr></thead><tbody>${anecRowsHTML(m, entries)}</tbody></table>` : '<p>Sin anotaciones.</p>'}
      <div class="rp-sign"><div>Firma del docente</div><div>Firma del estudiante</div><div>Firma del padre, madre o tutor</div></div></section>`;
  }).join('');
  printHTML(pages, 'portrait');
}
function printAnecSummary(m) {
  const per = anecByStudent(m).filter(r => r.neg + r.pos + r.obs > 0).sort((a, b) => anecScore(b) - anecScore(a) || b.neg - a.neg || a.s.num - b.s.num);
  if (!per.length) return toast('No hay anotaciones para resumir.', 'error');
  const catTot = {};
  m.anec.filter(e => e.kind === 'neg').forEach(e => { catTot[e.cat] = (catTot[e.cat] || 0) + 1; });
  const rows = per.map((r, i) => {
    const top = Object.entries(r.cats).sort((a, b) => b[1] - a[1]).slice(0, 3).map(x => `${esc(x[0])} (${x[1]})`).join(', ');
    return `<tr><td>${i + 1}</td><td>${r.s.num}</td><td class="l">${esc(r.s.name)}</td><td class="${r.neg ? 'low' : ''}">${r.neg}</td><td>${r.grave}</td><td>${r.moderada}</td><td>${r.leve}</td><td>${r.pos}</td><td>${r.obs}</td><td class="l">${top}</td><td>${r.last ? fmtDate(r.last) : ''}</td></tr>`;
  }).join('');
  printHTML(`<section class="rp-page">${reportHead(m, 'Reporte de conducta del curso')}
    <table class="rp-table"><thead><tr><th>#</th><th>No.</th><th class="l">Estudiante</th><th>A mejorar</th><th>Graves</th><th>Moderadas</th><th>Leves</th><th>Positivas</th><th>Observ.</th><th class="l">Conductas más frecuentes</th><th>Última</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="rp-foot"><div><b>Conductas a mejorar por categoría:</b> ${Object.entries(catTot).sort((a, b) => b[1] - a[1]).map(x => `${esc(x[0])}: ${x[1]}`).join(' · ') || 'ninguna'}</div></div>
    <div class="rp-box"><b>Observaciones y acuerdos:</b></div>${signLine()}</section>`, 'landscape');
}

/* =========================================================
   Recuperación de RA
   ========================================================= */
/** Filas estudiante × RA que necesitan (o ya tuvieron) recuperación. */
function recRows(m, mode) {
  const rows = [];
  allStudents(m).forEach(s => {
    const c = calcStudent(m, s);
    m.ras.forEach((ra, i) => {
      const x = c.ras[i];
      const ex = !!(s.rec && s.rec[ra.id] && s.rec[ra.id].ex);
      if (mode === 'excl') { if (ex) rows.push({ s, ra, ri: i, x, c, ex }); return; }
      if (ex) return;
      const show = mode === 'all' ? (x.status === 'no' || x.status === 'rec' || x.status === 'proc' || x.rec)
        : mode === 'done' ? !!x.rec
          : (x.status === 'no' || x.status === 'rec' || !!x.rec);
      if (show) rows.push({ s, ra, ri: i, x, c });
    });
  });
  return rows;
}
function renderRecuperacion(m) {
  if (!m.students.length || !m.ras.length) return `<div class="empty"><div class="big">↺</div><p><strong>${!m.ras.length ? 'Este módulo no tiene RA.' : 'No hay estudiantes.'}</strong></p></div>`;
  const mode = state.recMode || 'pend';
  const q = norm(state.search).replace(/^#/, '');
  let rows = recRows(m, mode);
  if (q) rows = rows.filter(r => norm(r.s.name).includes(q) || String(r.s.num) === q);
  if (state.recRa) rows = rows.filter(r => r.ra.id === state.recRa);
  const allRows = recRows(m, 'pend');
  const pending = allRows.filter(r => r.x.status === 'no' && !r.x.rec).length;
  const recovered = allRows.filter(r => r.x.status === 'rec').length;
  const failed = allRows.filter(r => r.x.status === 'no' && r.x.rec).length;
  const proc = recRows(m, 'all').filter(r => r.x.status === 'proc' && !r.x.rec).length;
  const excl = recRows(m, 'excl').length;

  const body = rows.map((r, k) => {
    const rec = r.x.rec || (r.s.rec && r.s.rec[r.ra.id]) || {};
    const st = RA_STATUS[r.x.status];
    const why = r.x.status === 'rec' ? '' : raReasons(r.x).filter(t => !t.startsWith('Recuperación')).join(' · ');
    const key = `${r.s.id}|${r.ra.id}`;
    return `<tr>
      <td class="num-col tabnum">${r.s.num}</td>
      <td><div class="name-cell"><b>${esc(r.s.name)}</b>${copyBtn(r.s.name)}</div></td>
      <td title="${esc(r.ra.name)}"><b>RA ${r.ri + 1}</b> <span class="muted small rec-ra">${esc(r.ra.name)}</span></td>
      <td class="c tabnum">${Math.round(r.x.origPct * 100)}%</td>
      <td class="small rec-why">${esc(why)}</td>
      <td><input type="text" class="rec-in" data-rec="${key}|act" data-key="rec|${key}|act" value="${esc(rec.act || '')}" placeholder="Ej.: Práctica de recuperación" maxlength="200"></td>
      <td><input type="date" class="rec-in rec-date" data-rec="${key}|date" data-key="rec|${key}|date" value="${esc(rec.date || '')}"></td>
      <td class="c"><input class="cell" data-rec="${key}|score" data-key="rec|${key}|score" data-r="${k}" data-c="0" value="${fmtN(rec.score)}" inputmode="decimal" autocomplete="off" title="Nota de la recuperación (0 a 100)"></td>
      <td class="c"><span class="badge ${st.cls}">${st.icon} ${st.label}</span></td>
      <td class="c tabnum"><b>${fmt(r.x.pts, 2)}</b><span class="muted small">/${fmtN(r.ra.w)}</span></td>
      <td class="c">${r.ex ? `<button class="btn btn-sm btn-secondary" data-act="rec-back" data-sid="${r.s.id}" data-ra="${r.ra.id}" title="Volver a ponerlo en la lista de recuperación">↩ Devolver</button>` : `<button class="btn btn-ghost btn-icon" style="color:var(--bad)" data-act="rec-remove" data-sid="${r.s.id}" data-ra="${r.ra.id}" title="Quitar de la lista de recuperación">${ICON.trash}</button>`}</td>
    </tr>`;
  }).join('');

  return `${weightAlert(m)}
  <div class="stats">
    <div class="stat bad"><span>Pendientes de recuperar</span><b>${pending}</b></div>
    <div class="stat ok"><span>RA recuperados</span><b>${recovered}</b></div>
    <div class="stat risk"><span>Recuperación no aprobada</span><b>${failed}</b></div>
    <div class="stat"><span>RA aún en proceso</span><b>${proc}</b></div>
  </div>
  <div class="alert alert-info"><div>Escribe la nota de la recuperación sobre <b>100</b>. Si llega al logro mínimo del RA (${fmtN(m.raPass)} por defecto), el RA queda <b>Recuperado</b> y cuenta como logrado.
    ${m.recCap === 'none' ? 'El RA toma la nota de la recuperación (sin tope).' : `El logro del RA recuperado se toma <b>hasta el mínimo</b> (${fmtN(m.raPass)}%), para no superar a quien lo logró a tiempo.`}</div>
    <button class="btn btn-sm btn-secondary" data-act="tab" data-id="config">Cambiar la regla</button></div>
  <div class="card">
    <div class="toolbar">
      ${searchBox('Filtrar estudiante…')}
      <select id="recMode" style="width:auto">
        <option value="pend" ${mode === 'pend' ? 'selected' : ''}>RA no logrados y recuperaciones</option>
        <option value="all" ${mode === 'all' ? 'selected' : ''}>Incluir RA en proceso</option>
        <option value="done" ${mode === 'done' ? 'selected' : ''}>Solo con recuperación registrada</option>
        <option value="excl" ${mode === 'excl' ? 'selected' : ''}>Quitados de la lista (${excl})</option>
      </select>
      <select id="recRa" style="width:auto;max-width:200px"><option value="">Todos los RA</option>${m.ras.map((ra, i) => `<option value="${ra.id}" ${state.recRa === ra.id ? 'selected' : ''}>RA ${i + 1}</option>`).join('')}</select>
      <span class="spacer"></span>
      ${rows.length ? (mode === 'excl' ? `<button class="btn btn-secondary" data-act="rec-back-all">↩ Devolver todos (${rows.length})</button>` : `<button class="btn btn-danger" data-act="rec-remove-all" title="Quita de la lista a todos los que se ven ahora (respeta el filtro de RA y la búsqueda)">${ICON.trash} Quitar todos (${rows.length})</button>`) : ''}
      <button class="btn btn-secondary" data-act="rec-bulk" title="Asigna la misma actividad y fecha a todos los pendientes de un RA">Misma actividad para todos</button>
      <button class="btn btn-secondary" data-act="print-rec-list">${ICON.print} Lista para recuperar</button>
      <button class="btn btn-secondary" data-act="print-rec-res">${ICON.print} Resultados</button>
    </div>
    ${rows.length ? `<div class="table-wrap"><table class="tbl rec-tbl" data-grid="grid">
      <thead><tr><th class="num-col">No.</th><th>Estudiante</th><th>RA</th><th class="c">Logro<br>original</th><th>Motivo</th><th>Actividad de recuperación</th><th>Fecha</th><th class="c">Nota<br>/100</th><th class="c">Estado</th><th class="c">Aporte</th><th class="c">Quitar</th></tr></thead>
      <tbody>${body}</tbody></table></div>`
      : `<div class="empty" style="margin:1rem;border-width:1px"><div class="big">🎉</div><p><strong>${mode === 'excl' ? 'No has quitado a nadie de la lista.' : mode === 'done' ? 'Todavía no hay recuperaciones registradas.' : 'No hay RA pendientes de recuperar.'}</strong></p><p class="small">${m.blankMode === 'ignore' ? 'En modo progreso, los RA con actividades sin calificar aparecen como «En proceso». Usa «Incluir RA en proceso» para verlos.' : ''}</p></div>`}
  </div>`;
}

/* ---------- Edición ---------- */
function onRecChange(t) {
  const m = curMod(); if (!m) return;
  const [sid, raId, field] = t.dataset.rec.split('|');
  const s = findStu(m, sid); if (!s || !findRa(m, raId)) return;
  if (field === 'score') {
    const v = parseNum(t.value);
    if (v === null || (isNum(v) && (v < 0 || v > 100))) {
      t.value = fmtN(s.rec[raId] && s.rec[raId].score);
      return toast('La nota de recuperación va de 0 a 100.', 'error');
    }
    setRec(s, raId, { score: v === '' ? '' : r2(v), date: (s.rec[raId] && s.rec[raId].date) || (v === '' ? '' : todayISO()) });
  } else if (field === 'date') setRec(s, raId, { date: isoDate(t.value) });
  else if (field === 'act') setRec(s, raId, { act: t.value.trim().slice(0, 200) });
  persist(); queueRender();
}
/** Diálogo de recuperación desde la vista «Por estudiante». */
function recDialog(sid, raId) {
  const m = curMod(), s = findStu(m, sid), ra = findRa(m, raId); if (!s || !ra) return;
  const x = calcRA(m, s, ra), rec = (s.rec && s.rec[raId]) || {};
  openModal({
    title: `Recuperación · RA ${m.ras.indexOf(ra) + 1}`, icon: '↺', sub: `${s.name} · logro original ${Math.round(x.origPct * 100)}% (mínimo ${fmtN(x.min)}%)`,
    body: `<label class="field">Actividad de recuperación<input type="text" id="rcAct" value="${esc(rec.act || '')}" maxlength="200" placeholder="Ej.: Práctica de recuperación, examen, trabajo"></label>
      <div class="form-grid"><label class="field">Fecha<input type="date" id="rcDate" value="${esc(rec.date || todayISO())}"></label>
      <label class="field">Nota (0 a 100)<input type="text" id="rcScore" inputmode="decimal" value="${fmtN(rec.score)}"></label></div>
      <label class="field">Observación (opcional)<input type="text" id="rcNote" value="${esc(rec.note || '')}" maxlength="300"></label>`,
    actions: [{ label: 'Cancelar' }, ...(s.rec && s.rec[raId] ? [{ label: 'Quitar recuperación', cls: 'btn-danger', onClick: () => { delete s.rec[raId]; persist(); render(); toast('Recuperación quitada.', 'ok'); } }] : []), {
      label: 'Guardar', cls: 'btn-primary', onClick: ov => {
        const v = parseNum(ov.querySelector('#rcScore').value);

        setRec(s, raId, { score: v === '' ? '' : r2(v), date: isoDate(ov.querySelector('#rcDate').value), act: ov.querySelector('#rcAct').value.trim(), note: ov.querySelector('#rcNote').value.trim() });
        persist(); render();
        const y = calcRA(m, s, ra);
        toast(y.status === 'rec' ? `RA ${m.ras.indexOf(ra) + 1} recuperado.` : isNum(v) ? 'Recuperación registrada, pero no alcanza el mínimo.' : 'Recuperación guardada.', y.status === 'rec' ? 'ok' : 'info', 3000);
      }
    }]
  });
}
function recBulkDialog() {

      <label class="field">Actividad de recuperación<input type="text" id="rbAct" maxlength="200" placeholder="Ej.: Examen de recuperación del RA"></label>

    actions: [{ label: 'Cancelar' }, {
      label: 'Asignar', cls: 'btn-primary', onClick: ov => {

        persist(); render(); toast(targets.length ? `Asignada a ${targets.length} estudiantes.` : 'No había pendientes sin actividad en ese RA.', targets.length ? 'ok' : 'info');

/* =========================================================
   Herramientas de clase: participación al azar y grupos equilibrados
   ========================================================= */
function toolState(m) {
  if (!state.tool || state.tool.modId !== m.id) state.tool = { modId: m.id, raId: '', catId: '', pick: '', used: [], onlyPresent: true, showList: false, savedOpen: true, preview: null, swap: '', opts: { type: 'Exposición', mode: 'count', n: 5, balance: 'perf', present: true, conduct: true, norepeat: true, topic: '' } };
  const t = state.tool;
  if (!findRa(m, t.raId)) t.raId = (findRa(m, state.raId) || m.ras[0] || {}).id || '';
  const ra = findRa(m, t.raId);
  if (ra && !findCat(ra, t.catId)) t.catId = (ra.cats.find(c => norm(c.label).includes('particip')) || ra.cats[0] || {}).id || '';
  return t;
}
/** Ausente o con excusa hoy (según la asistencia del día, si ya se pasó). */
function absentToday(m, s) {
  const t = todayISO(), ym = ymOf(t), d = +t.slice(8, 10);
  const c = classDays(m, ym).includes(d) ? getAtt(s, ym, d) : '';
  return c === 'A' || c === 'E';
}
/** Rendimiento de 0 a 1: promedio del logro de los RA que ya tienen notas. */
function perfOf(m, s) {
  const c = calcStudent(m, s);
  const xs = c.ras.filter(x => x.filled > 0 || x.rec);
  return xs.length ? xs.reduce((a, x) => a + x.pct, 0) / xs.length : null;
}

function renderHerramientas(m) {
  if (!m.students.length) return `<div class="empty"><div class="big">👥</div><p><strong>No hay estudiantes.</strong></p><p style="margin-top:1rem"><button class="btn btn-primary" data-act="import-stu">${ICON.upload} Importar lista</button></p></div>`;
  const t = toolState(m);
  const busy = t.pick || t.used.length || t.preview || t.showList || t.savedOpen;
  return `<div class="tools-bar">
      <p class="muted small">Las notas que anotes aquí ya quedan guardadas en el registro. «Limpiar» solo despeja la pantalla.</p>
      <button class="btn btn-sm btn-secondary" data-act="tools-clear" ${busy ? '' : 'disabled'}>🧹 Limpiar todo</button>
    </div>
    <div class="tools-grid${t.preview ? ' has-groups' : ''}">${renderPartTool(m, t)}${renderGroupTool(m, t)}</div>${renderSavedGroups(m, t)}`;
}
/** Limpia la pantalla de herramientas (no borra notas ni grupos guardados). */
function toolsClear(what) {
  const t = toolState(curMod());
  if (what !== 'grp') { t.pick = ''; t.used = []; t.showList = false; }
  if (what !== 'part') { t.preview = null; t.swap = ''; }
  if (!what) t.savedOpen = false;
  render();
  toast(what === 'part' ? 'Participación limpia: empieza una ronda nueva.' : what === 'grp' ? 'Grupos descartados.' : 'Pantalla limpia.', 'ok', 1800);
}

/* ---------- Participación ---------- */
function renderPartTool(m, t) {
  const ra = findRa(m, t.raId), cat = ra && findCat(ra, t.catId);
  const studs = allStudents(m);
  const present = studs.filter(s => !t.onlyPresent || !absentToday(m, s));

/** Días de clase del módulo desde una fecha (horario → días de asistencia → lunes a viernes; respeta feriados y recesos). */
function modClassDates(m, from, count) {
  const wds = typeof horHas === 'function' && horHas(m) ? horModDays(m) : (m.weekdays && m.weekdays.length ? m.weekdays : [1, 2, 3, 4, 5]);
  const out = []; let d = from, g = 0;
  const inCal = iso => db.cal && db.cal.periods.length && iso >= db.cal.periods[0].start && iso <= db.cal.periods[db.cal.periods.length - 1].end;
  while (out.length < count && g++ < 400) {
    if (wds.includes(wdOf(d)) && (!inCal(d) || isClassDay(d))) out.push(d);
    d = addDays(d, 1);
  }
  return out;
}
/** Hora de inicio de la clase del módulo ese día (según el horario). */
function modClassTime(m, iso) { if (typeof horBlocks !== 'function') return ''; const b = horBlocks(wdOf(iso)).find(x => x.mod === m); return b ? m2hm(b.start) : ''; }
/** Crea, actualiza o quita los eventos del calendario de un conjunto de grupos. */
function syncGroupEvents(m, gs) {
  const type = EV_TYPES[gs.type] ? gs.type : (norm(gs.type).includes('debat') ? 'Exposición' : 'Otro');
  let n = 0;
  gs.groups.forEach(g => {
    const ev = g.evId ? db.agenda.find(e => e.id === g.evId) : null;
    if (!gs.cal || !g.date) { if (ev) db.agenda = db.agenda.filter(e => e.id !== ev.id); g.evId = ''; return; }
    const members = g.members.map(id => { const s = findStu(m, id); return s ? `${s.num}. ${s.name}` : ''; }).filter(Boolean);
    const data = normAgenda({ id: ev ? ev.id : uid(), title: `${gs.type} ${g.name}${g.tema ? ': ' + g.tema : gs.topic ? ': ' + gs.topic : ''}`, date: g.date, time: g.time, type, modId: m.id, done: ev ? ev.done : false,
      notes: [gs.topic ? `Tema central: ${gs.topic}` : '', g.tema ? `Tema: ${g.tema}` : '', g.subs.length ? 'Subtemas:\n' + g.subs.map(x => '• ' + x).join('\n') : '', 'Integrantes:\n' + members.join('\n')].filter(Boolean).join('\n\n') });
    if (ev) Object.assign(ev, data); else db.agenda.push(data);
    g.evId = data.id; n++;
  });
  return n;
}

/* =========================================================
   Alertas tempranas
   1) Faltas seguidas (ausencias consecutivas hasta el último día con lista)
   2) No entregó las dos últimas actividades calificadas
   3) Bajó su rendimiento: las últimas 3 actividades frente a su promedio anterior
   ========================================================= */
/** Actividades «recogidas» (con al menos una nota), en orden cronológico. */
function collectedActs(m) {
  const list = [];
  m.ras.forEach((ra, ri) => ra.cats.forEach((c, ci) => {
    for (let i = 0; i < c.count; i++) {
      let graded = 0;
      m.students.forEach(s => { if (isNum(getGrade(s, ra.id, c.id, i))) graded++; });
      if (!graded) continue;
      const a = actOf(c, i);
      list.push({ ra, c, i, ri, d: a.d || '', order: ri * 10000 + ci * 100 + i, graded, label: `RA ${ri + 1} · ${c.count > 1 ? c.label + ' ' + (i + 1) : c.label}${a.n ? ' (' + a.n + ')' : ''}` });
    }
  }));
  // Con fecha: por fecha; sin fecha: en el orden del registro, después de las fechadas
  return list.sort((a, b) => (a.d && b.d) ? a.d.localeCompare(b.d) || a.order - b.order : a.d ? -1 : b.d ? 1 : a.order - b.order);
}
/** Días de clase pasados en los que ya se pasó lista (alguien tiene marca), en orden. */
function takenDays(m) {
  const t = todayISO(), out = [];
  schoolMonths().forEach(ym => classDays(m, ym).forEach(d => {
    const iso = `${ym}-${pad2(d)}`;
    if (iso <= t && m.students.some(s => getAtt(s, ym, d))) out.push({ ym, d, iso });
  }));
  return out;
}
function computeAlerts(m) {
  const S = db.settings, consecN = S.consecAlert || 3, dropN = S.dropAlert || 15;
  const out = { absent: [], missing: [], drop: [] };
  // 1) Faltas seguidas
  const days = takenDays(m);
  m.students.forEach(s => {
    let streak = 0, last = '';
    for (let k = days.length - 1; k >= 0; k--) {
      const c = getAtt(s, days[k].ym, days[k].d);
      if (c === 'A') { streak++; if (!last) last = days[k].iso; }
      else if (c === '') continue;            // ese día no se marcó a este estudiante
      else break;
    }
    if (streak >= consecN) out.absent.push({ s, n: streak, last });
  });
  // 2) y 3) según las actividades recogidas
  const acts = collectedActs(m), half = Math.max(1, Math.ceil(m.students.length / 2));
  const val = (s, a) => getGrade(s, a.ra.id, a.c.id, a.i);
  const lastTwo = acts.slice(-2);
  if (lastTwo.length === 2) m.students.forEach(s => {
    const miss = lastTwo.filter(a => { const v = val(s, a); return v === 0 || (v === '' && a.graded >= half); });
    if (miss.length === 2) out.missing.push({ s, acts: lastTwo });
  });
  if (acts.length >= 5) m.students.forEach(s => {
    const pts = acts.map(a => { const v = val(s, a); return isNum(v) ? v / a.c.max : null; }).filter(x => x !== null);
    if (pts.length < 5) return;
    const recent = pts.slice(-3), before = pts.slice(0, -3);
    const avgR = recent.reduce((a, b) => a + b, 0) / recent.length, avgB = before.reduce((a, b) => a + b, 0) / before.length;
    const diff = Math.round((avgB - avgR) * 100);
    if (diff >= dropN) out.drop.push({ s, before: Math.round(avgB * 100), recent: Math.round(avgR * 100), diff });
  });
  out.drop.sort((a, b) => b.diff - a.diff);
  out.absent.sort((a, b) => b.n - a.n);
  out.total = out.absent.length + out.missing.length + out.drop.length;
  return out;
}
function renderHomeAlerts() {
  const mods = db.modules.filter(m => m.students.length);
  if (!mods.length) return '';
  const all = mods.map(m => ({ m, a: computeAlerts(m) })).filter(x => x.a.total);
  const S = db.settings;
  const modLabel = m => esc(modShort(m)) + (m.course ? ' ' + esc(m.course) : '');
  const item = (m, s, detail, tab) => `<li class="al-item" data-act="alert-open" data-mod="${m.id}" data-sid="${s.id}" data-tab="${tab}"><b>${esc(s.name)}</b><span>${modLabel(m)} · ${detail}</span></li>`;
  const col = (title, icon, list, empty) => `<div class="al-col"><h4>${icon} ${title} <span class="badge ${list.length ? 'bad' : 'ok'}">${list.length}</span></h4>${list.length ? `<ul>${list.slice(0, 6).join('')}</ul>${list.length > 6 ? `<p class="small muted">y ${list.length - 6} más…</p>` : ''}` : `<p class="small muted">${empty}</p>`}</div>`;
  const absent = [], missing = [], drop = [];
  all.forEach(({ m, a }) => {
    a.absent.forEach(x => absent.push(item(m, x.s, `${x.n} ausencias seguidas (última: ${fmtDate(x.last)})`, 'asistencia')));
    a.missing.forEach(x => missing.push(item(m, x.s, `no entregó: ${x.acts.map(y => esc(y.label)).join(' y ')}`, 'estudiante')));
    a.drop.forEach(x => drop.push(item(m, x.s, `de ${x.before}% a ${x.recent}% en las últimas 3 actividades`, 'estudiante')));
  });
  const total = absent.length + missing.length + drop.length;
  return `<section class="card card-pad al-card">
    <div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:.5rem;margin-bottom:.6rem">
      <h3 style="font-size:1rem">⚠️ Alertas tempranas ${total ? `<span class="badge bad">${total}</span>` : '<span class="badge ok">Todo en orden</span>'}</h3>
      <span class="muted small">Faltas seguidas desde ${S.consecAlert || 3} · bajada desde ${S.dropAlert || 15} puntos · cámbialo en Ajustes</span>
    </div>
    <div class="ag-cols">

/* ---------- Actualización en vivo (sin redibujar la pantalla) ---------- */
function refreshComputed() {
  const m = curMod(); if (!m) return;
  const cache = new Map();
  const calc = sid => { if (!cache.has(sid)) { const s = findStu(m, sid); cache.set(sid, s ? calcStudent(m, s) : null); } return cache.get(sid); };
  $$('[data-out]').forEach(el => {
    const [k, sid, raId, catId] = el.dataset.out.split(':');
    const r = calc(sid); if (!r) return;
    const i = raId ? m.ras.findIndex(x => x.id === raId) : -1;
    const stt = statusOf(r);
    switch (k) {
      case 'acc': el.textContent = fmt(r.acc); break;
      case 'total': el.textContent = fmtTotal(r.total); el.className = 'pill ' + stt.cls; break;
      case 'total-big': el.textContent = fmtTotal(r.total); el.style.color = `var(--${stt.cls})`; break;
      case 'status': el.innerHTML = `<span class="badge ${stt.cls}">${stt.label}</span>`; break;
      case 'ra': if (i >= 0) el.textContent = el.closest('.grid, .ra-card') ? fmt(r.ras[i].pts, 2) : fmt(r.ras[i].pts); break;
      case 'rapct': if (i >= 0) el.textContent = Math.round(r.ras[i].pct * 100) + '%'; break;
      case 'raobt': if (i >= 0) el.textContent = `${fmtN(r.ras[i].obt)}/${fmtN(r.ras[i].max)}`; break;
      case 'raic': if (i >= 0) el.innerHTML = raIcon(r.ras[i]); break;
      case 'rabadge': if (i >= 0) el.innerHTML = raBadge(r.ras[i]); break;
      case 'rareason': if (i >= 0) el.innerHTML = raReasonLine(r.ras[i]); break;
      case 'raok': el.textContent = `${r.raOk}/${m.ras.length}`; break;
      case 'raok-badge': el.textContent = `RA logrados: ${r.raOk}/${m.ras.length}`; break;
      case 'cat': {
        const ra = m.ras[i], cat = ra && findCat(ra, catId);
        if (cat) { const cs = calcCat(findStu(m, sid), ra, cat); el.textContent = `${fmtN(cs.obt)} / ${fmtN(cs.max)}`; }
        break;
      }
    }
  });
  const tiles = $('#statsTiles'); if (tiles) tiles.outerHTML = statsTiles(m);
}

/* ---------- Captura de notas ---------- */
/** Valida y guarda una casilla. Devuelve 'ok' | 'clamped' | 'invalid' | 'pending' */
function commitCell(t, final) {
  const m = curMod(); if (!m) return 'invalid';
  let max, getV, setV;
  if (t.dataset.g) {
    const [sid, raId, catId, idx] = t.dataset.g.split('|');
    const s = findStu(m, sid), ra = findRa(m, raId), cat = ra && findCat(ra, catId);
    if (!s || !cat) return 'invalid';
    max = cat.max;
    getV = () => getGrade(s, raId, catId, +idx);
    setV = v => setGrade(s, raId, catId, +idx, v);
  } else if (t.dataset.final) {
    const s = findStu(m, t.dataset.final); if (!s) return 'invalid';
    max = m.finalWeight;
    getV = () => s.final;
    setV = v => { s.final = isNum(v) ? r2(v) : ''; };
  } else return 'invalid';

  const v = parseNum(t.value);
  if (v === null) {
    t.classList.add('bad');
    if (!final) return 'pending';
    t.value = fmtN(getV()); t.classList.remove('bad');
    return 'invalid';
  }
  if (v !== '' && (v < 0 || v > max)) {
    t.classList.add('bad');
    if (!final) return 'pending';
    const c = Math.min(max, Math.max(0, v));
    setV(c); t.value = fmtN(c); t.classList.remove('bad'); t.classList.add('filled');
    persist(); return 'clamped';
  }
  t.classList.remove('bad');
  const before = getV();
  if (before !== v) { setV(v); persist(); }
  t.classList.toggle('filled', v !== '');
  if (final) t.value = fmtN(v);
  return 'ok';
}
function maxOfCell(t) {
  const m = curMod();
  if (t.dataset.final) return m.finalWeight;
  const [, raId, catId] = t.dataset.g.split('|');
  const ra = findRa(m, raId); return ra ? findCat(ra, catId).max : '';
}

/* Navegación tipo hoja de cálculo */
document.addEventListener('keydown', e => {
  const t = e.target;
  if (!t.classList || !t.classList.contains('cell')) return;
  const grid = t.closest('[data-grid]'); if (!grid) return;
  let target = null;
  const atEnd = () => t.selectionEnd === t.value.length;
  const atStart = () => t.selectionStart === 0;
  if (grid.dataset.grid === 'linear') {
    const cells = $$('input.cell', grid), i = cells.indexOf(t);
    if (e.key === 'Enter') { e.preventDefault(); target = cells[i + (e.shiftKey ? -1 : 1)]; }
    else if (e.key === 'ArrowDown') { e.preventDefault(); target = cells[i + 1]; }
    else if (e.key === 'ArrowUp') { e.preventDefault(); target = cells[i - 1]; }
    else if (e.key === 'ArrowRight' && atEnd()) target = cells[i + 1];
    else if (e.key === 'ArrowLeft' && atStart()) target = cells[i - 1];
  } else {
    const r = +t.dataset.r, c = +t.dataset.c;
    const at = (rr, cc) => grid.querySelector(`input.cell[data-r="${rr}"][data-c="${cc}"]`);
    if (e.key === 'Enter') {
      e.preventDefault();
      target = at(r + (e.shiftKey ? -1 : 1), c);
      if (!target && !e.shiftKey) { target = at(0, c + 1); if (target) toast('Columna completa → siguiente actividad', 'ok', 1400); }
    }
    else if (e.key === 'ArrowDown') { e.preventDefault(); target = at(r + 1, c); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); target = at(r - 1, c); }
    else if (e.key === 'ArrowRight' && atEnd()) target = at(r, c + 1);
    else if (e.key === 'ArrowLeft' && atStart()) target = at(r, c - 1);
  }
  if (target) { e.preventDefault(); target.focus(); target.select(); target.scrollIntoView({ block: 'nearest', inline: 'nearest' }); }
});

/* Pegar bloques copiados de Excel / Notion / Google Sheets */
document.addEventListener('paste', e => {
  const t = e.target;
  if (!t.classList || !t.classList.contains('cell')) return;
  const txt = (e.clipboardData || window.clipboardData).getData('text') || '';
  if (!/[\t\n]/.test(txt.replace(/[\r\n]+$/, ''))) return;     // un solo valor: pegado normal
  e.preventDefault();
  const grid = t.closest('[data-grid]'); if (!grid) return;
  const rows = txt.replace(/\r/g, '').replace(/\n+$/, '').split('\n').map(l => l.split('\t'));
  snapshot('Antes de pegar notas');
  let ok = 0, clamped = 0, bad = 0;
  const put = (cell, val) => { if (!cell) return; cell.value = val.trim(); const r = commitCell(cell, true); if (r === 'ok') ok++; else if (r === 'clamped') clamped++; else bad++; };
  if (grid.dataset.grid === 'linear') {
    const cells = $$('input.cell', grid); let i = cells.indexOf(t);
    rows.flat().forEach(v => put(cells[i++], v));
  } else {
    const r0 = +t.dataset.r, c0 = +t.dataset.c;
    rows.forEach((line, i) => line.forEach((v, j) => put(grid.querySelector(`input.cell[data-r="${r0 + i}"][data-c="${c0 + j}"]`), v)));
  }
  refreshComputed();
  toast(`Pegadas ${ok + clamped} notas${clamped ? ` (${clamped} ajustadas al máximo)` : ''}${bad ? ` · ${bad} valores no válidos ignorados` : ''}.`, bad ? 'warn' : 'ok', 3500);
});

});

/* ---------- Rellenado masivo ---------- */
function fillGrades(m, { stuIds, raIds, catId = null, idx = null, mode, value, onlyEmpty = true }) {
  let n = 0;
  const S = new Set(stuIds), R = new Set(raIds);
  m.students.forEach(s => {
    if (!S.has(s.id)) return;
    m.ras.forEach(ra => {
      if (!R.has(ra.id)) return;
      ra.cats.forEach(c => {
        if (catId && c.id !== catId) return;
        for (let i = 0; i < c.count; i++) {
          if (idx !== null && i !== idx) continue;
          const cur = getGrade(s, ra.id, c.id, i);
          if (mode === 'clear') { if (cur !== '') { setGrade(s, ra.id, c.id, i, ''); n++; } continue; }
          if (onlyEmpty && isNum(cur)) continue;
          const v = mode === 'max' ? c.max : mode === 'zero' ? 0 : Math.min(c.max, Math.max(0, value));
          if (cur !== v) { setGrade(s, ra.id, c.id, i, v); n++; }
        }
      });
    });
  });
  return n;
}
function doFill(m, opts, label) {
  snapshot(label);
  const n = fillGrades(m, opts);
  persist(); render();
  toast(n ? `${n} casillas actualizadas.` : 'No había casillas para cambiar.', n ? 'ok' : 'info');
}

/* ---------- Estructura: copiar criterios / módulos ---------- */
/** Reemplaza criterios de todos los RA, conservando notas de criterios con el mismo nombre. */
function applyCatsToAll(m, srcCats, skipRaId) {
  m.ras.forEach(ra => {
    if (ra.id === skipRaId) return;
    const old = ra.cats;
    ra.cats = srcCats.map((c, i) => {
      const match = old.find(o => norm(o.label) === norm(c.label));
      return { id: match ? match.id : uid(), label: c.label, count: c.count, max: c.max, color: c.color || CAT_COLORS[i % CAT_COLORS.length], minDone: Math.min(c.count, c.minDone || 0), acts: normActs(match ? match.acts : [], c.count) };
    });
    const keep = new Set(ra.cats.map(c => c.id));
    m.students.forEach(s => {
      const g = s.g[ra.id]; if (!g) return;
      Object.keys(g).forEach(k => { if (!keep.has(k)) delete g[k]; });
      ra.cats.forEach(c => { if (g[c.id]) { g[c.id] = g[c.id].slice(0, c.count).map(v => isNum(v) ? Math.min(v, c.max) : ''); } });
    });
  });
}
function copyStructure(src, m) {
  const oldRas = m.ras;
  m.ras = src.ras.map((r, i) => {
    const prev = oldRas[i];
    return {
      id: prev ? prev.id : uid(), name: r.name, desc: r.desc || '', w: r.w, minPct: isNum(r.minPct) ? r.minPct : null,
      cats: r.cats.map((c, k) => {
        const match = prev && prev.cats.find(o => norm(o.label) === norm(c.label));
        return { id: match ? match.id : uid(), label: c.label, count: c.count, max: c.max, color: c.color || CAT_COLORS[k % CAT_COLORS.length], minDone: Math.min(c.count, c.minDone || 0), acts: normActs((c.acts || []).map(a => ({ n: a.n, d: '' })), c.count) };
      })
    };
  });
  m.finalWeight = src.finalWeight; m.finalLabel = src.finalLabel; m.raPass = src.raPass; m.requireAllRA = src.requireAllRA;
  const valid = new Map(m.ras.map(r => [r.id, new Map(r.cats.map(c => [c.id, c]))]));
  m.students.forEach(s => {
    Object.keys(s.g).forEach(rid => {
      const cats = valid.get(rid);
      if (!cats) { delete s.g[rid]; return; }
      Object.keys(s.g[rid]).forEach(cid => {
        const c = cats.get(cid);
        if (!c) delete s.g[rid][cid];
        else s.g[rid][cid] = s.g[rid][cid].slice(0, c.count).map(v => isNum(v) ? Math.min(v, c.max) : '');
      });
    });
  });
}

/* ---------- Configuración: cambios en campos ---------- */
function onCfgMod(t) {
  const m = curMod(), f = t.dataset.cfgMod;
  if (f === 'name') {
    const v = t.value.trim(); if (!v) { t.value = modFull(m); return toast('El nombre no puede quedar vacío.', 'error'); }
    if (m.name.includes(' · ') && !m.abbr) m.abbr = modShort(m);   // conserva la abreviatura que estaba en el nombre
    m.name = v;
  }
  else if (f === 'abbr') { const v = t.value.trim().slice(0, 20); if (m.name.includes(' · ')) { m.name = modFull(m); } m.abbr = v || autoAbbr(m.name); t.value = m.abbr; }
  else if (f === 'course') m.course = t.value.trim();
  else if (f === 'finalLabel') m.finalLabel = t.value.trim() || 'Cierre';
  else if (f === 'blankMode') m.blankMode = t.value;
  else if (f === 'requireAllRA') m.requireAllRA = t.checked;
  else if (f === 'recCap') m.recCap = t.value === 'none' ? 'none' : 'min';
  else if (f === 'raPass') {
    const v = parseNum(t.value);
    if (!isNum(v) || v < 0 || v > 100) { t.value = fmtN(m.raPass); return toast('El logro mínimo debe estar entre 0 y 100.', 'error'); }
    m.raPass = r2(v);
  }
  else if (f === 'finalWeight') {
    const v = parseNum(t.value);
    if (!isNum(v) || v < 0 || v > 100) { t.value = fmtN(m.finalWeight); return toast('El cierre debe estar entre 0 y 100.', 'error'); }
    const over = m.students.filter(s => isNum(s.final) && s.final > v);
    const apply = () => {
      m.finalWeight = r2(v);
      over.forEach(s => { s.final = m.finalWeight; });
      persist(); queueRender();
      if (weightIssue(m)) toast(`Ahora los RA deben sumar ${fmtN(100 - m.finalWeight)}%. Ajusta los valores de los RA o usa «Ajustar proporcionalmente».`, 'warn', 4000);
    };
    if (over.length) {
      confirmBox('Notas del cierre mayores al nuevo valor', `${over.length} estudiantes tienen una nota de cierre mayor que ${fmtN(v)}. ¿Ajustarlas a ${fmtN(v)}?`, 'Ajustar', () => { snapshot('Antes de cambiar el valor del cierre'); apply(); }, { danger: false, onCancel: () => { t.value = fmtN(m.finalWeight); } });
      return;
    }
    return apply();
  }
  persist(); queueRender();
}
function onCfgRa(t) {
  const m = curMod(), [raId, f] = t.dataset.cfgRa.split('|'), ra = findRa(m, raId); if (!ra) return;
  if (f === 'name') ra.name = t.value.trim() || `RA ${m.ras.indexOf(ra) + 1}`;
  else if (f === 'desc') { ra.desc = t.value.trim(); persist(); return; }
  else if (f === 'w') {
    const v = parseNum(t.value);
    if (!isNum(v) || v < 0 || v > 100) { t.value = fmtN(ra.w); return toast('El valor del RA debe estar entre 0 y 100.', 'error'); }
    ra.w = r2(v);
  }
  else if (f === 'minPct') {
    const v = parseNum(t.value);
    if (v === '') ra.minPct = null;
    else if (!isNum(v) || v < 0 || v > 100) { t.value = isNum(ra.minPct) ? fmtN(ra.minPct) : ''; return toast('El logro mínimo debe estar entre 0 y 100 (o vacío para usar el del módulo).', 'error'); }
    else ra.minPct = r2(v);
  }
  persist(); queueRender();
}
function onCfgCat(t) {
  const m = curMod(), [raId, catId, f] = t.dataset.cfgCat.split('|');
  const ra = findRa(m, raId), cat = ra && findCat(ra, catId); if (!cat) return;
  if (f === 'label') { cat.label = t.value.trim() || 'Criterio'; }
  else if (f === 'color') { cat.color = t.value; }
  else if (f === 'minDone') {
    const v = t.value.trim() === '' ? 0 : parseInt(t.value, 10);
    if (!(v >= 0 && v <= cat.count) || String(v) !== String(parseInt(v, 10))) { t.value = cat.minDone || ''; return toast(`El mínimo debe estar entre 0 y ${cat.count} (las actividades de «${cat.label}»).`, 'error'); }
    cat.minDone = v;
  }
  else if (f === 'count') {
    const v = parseInt(t.value, 10);
    if (!(v >= 1 && v <= 50)) { t.value = cat.count; return toast('La cantidad de actividades debe estar entre 1 y 50.', 'error'); }
    if (v < cat.count) {
      const lost = m.students.filter(s => { const a = (s.g[raId] || {})[catId] || []; return a.slice(v).some(isNum); }).length;
      if (lost) {
        confirmBox('Reducir actividades', `${lost} estudiantes tienen notas en las actividades ${v + 1} a ${cat.count} de «${cat.label}». Esas notas se borrarán.`, 'Reducir', () => {
          snapshot('Antes de reducir actividades');
          cat.count = v; cat.minDone = Math.min(cat.minDone || 0, v); cat.acts = normActs(cat.acts, v); m.students.forEach(s => { const a = (s.g[raId] || {})[catId]; if (a) s.g[raId][catId] = a.slice(0, v); });
          persist(); queueRender();
        }, { onCancel: () => { t.value = cat.count; } });
        return;
      }
      m.students.forEach(s => { const a = (s.g[raId] || {})[catId]; if (a) s.g[raId][catId] = a.slice(0, v); });
    }
    cat.count = v;
    cat.minDone = Math.min(cat.minDone || 0, v);
    cat.acts = normActs(cat.acts, v);
  }
  else if (f === 'max') {
    const v = parseNum(t.value);
    if (!isNum(v) || v <= 0 || v > 1000) { t.value = fmtN(cat.max); return toast('El máximo debe ser mayor que 0.', 'error'); }
    const over = m.students.filter(s => ((s.g[raId] || {})[catId] || []).some(x => isNum(x) && x > v)).length;
    if (over) {
      confirmBox('Notas mayores al nuevo máximo', `${over} estudiantes tienen notas mayores que ${fmtN(v)} en «${cat.label}». ¿Ajustarlas a ${fmtN(v)}?`, 'Ajustar', () => {
        snapshot('Antes de cambiar el máximo');
        cat.max = r2(v);
        m.students.forEach(s => { const a = (s.g[raId] || {})[catId]; if (a) s.g[raId][catId] = a.map(x => isNum(x) ? Math.min(x, cat.max) : ''); });
        persist(); queueRender();
      }, { danger: false, onCancel: () => { t.value = fmtN(cat.max); } });
      return;
    }
    cat.max = r2(v);
  }
  persist(); queueRender();
}

      <label class="field">Abreviatura o acrónimo<input type="text" id="nmAbbr" maxlength="20" placeholder="Ej.: D.A.S"><small>Se sugiere sola; puedes cambiarla.</small></label>
      <label class="field">Curso / sección<input type="text" id="nmCourse" placeholder="Ej.: 4to A"></label>
      <label class="field">Cantidad de RA<input type="text" id="nmRas" inputmode="numeric" value="5"></label>
      <label class="field">Valor del cierre (%)<input type="text" id="nmFinal" inputmode="decimal" value="30"></label>
    </div>
    <label class="field">Criterios de cada RA
      <select id="nmTpl">${Object.entries(TEMPLATES).map(([k, t]) => `<option value="tpl:${k}">${esc(t.label)}</option>`).join('')}
      ${others.map(m => `<option value="mod:${m.id}">Copiar estructura de: ${esc(m.name)}${m.course ? ' (' + esc(m.course) + ')' : ''}</option>`).join('')}</select>
      <small>Luego puedes cambiar criterios, cantidad de actividades y máximos en Configuración.</small>
    </label>`,
    onOpen: ov => {
      const n = ov.querySelector('#nmName'), a = ov.querySelector('#nmAbbr'); let touched = false;
      a.addEventListener('input', () => { touched = !!a.value.trim(); });
      n.addEventListener('input', () => { if (!touched) a.value = n.value.trim().length > 14 ? autoAbbr(n.value) : ''; });
    },
    actions: [{ label: 'Cancelar' }, {
      label: 'Crear módulo', cls: 'btn-primary', onClick: ov => {
        const name = ov.querySelector('#nmName').value.trim();
        if (!name) { toast('Escribe el nombre del módulo.', 'error'); ov.querySelector('#nmName').focus(); return false; }
        const nRas = parseInt(ov.querySelector('#nmRas').value, 10);
        const fin = parseNum(ov.querySelector('#nmFinal').value);
        const tpl = ov.querySelector('#nmTpl').value;
        if (!(nRas >= 0 && nRas <= 30)) { toast('La cantidad de RA debe estar entre 0 y 30.', 'error'); return false; }

        const abbr = ov.querySelector('#nmAbbr').value.trim() || autoAbbr(name);
        const m = normalizeModule({ name, abbr, course: ov.querySelector('#nmCourse').value.trim(), finalWeight: fin, ras: [], students: [] });
        if (tpl.startsWith('mod:')) { const src = findMod(tpl.slice(4)); copyStructure(src, m); }
        else {
          for (let i = 0; i < nRas; i++) m.ras.push({ id: uid(), name: `RA ${i + 1}`, w: 0, cats: catsFromTemplate(tpl.slice(4)) });
          distributeWeights(m);
        }
        db.modules.push(m); persist();
        state.view = 'module'; state.modId = m.id; state.tab = 'resumen'; state.search = '';
        render(); toast('Módulo creado. Ahora importa la lista de estudiantes.', 'ok', 3200);
      }
    }]
  });
}

    if (!name) return;
    const m = normalizeModule({ name, abbr: src.abbr, course: src.course, blankMode: src.blankMode, ras: [], students: [] });

    db.modules.push(m); persist(); render(); toast('Módulo duplicado.', 'ok');
  }, { icon: '📋' });

function parseNames(txt) {
  return String(txt || '').split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(l => {
    const cols = l.split('\t').map(x => x.trim()).filter(Boolean);
    let num = null, name = l;
    if (cols.length >= 2 && /^\d+$/.test(cols[0])) { num = parseInt(cols[0], 10); name = cols.slice(1).join(' '); }
    else {
      const mt = l.match(/^(\d{1,3})\s*[.\-)\]:]?\s+(.+)$/);
      if (mt) { num = parseInt(mt[1], 10); name = mt[2]; }
    }
    name = name.replace(/\s+/g, ' ').trim();
    return { num, name };
  }).filter(p => p.name && !/^\d+$/.test(p.name));
}
function renumberAZ(m) {
  m.students.sort((a, b) => a.name.localeCompare(b.name, 'es', { sensitivity: 'base' }));
  m.students.forEach((s, i) => { s.num = i + 1; });
}

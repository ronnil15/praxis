function activitiesDialog(raId, catId) {
  const m = curMod(), ra = findRa(m, raId), cat = ra && findCat(ra, catId); if (!cat) return;
  cat.acts = normActs(cat.acts, cat.count);
  // Copia de trabajo: o = posición original (null = actividad nueva)
  let work = cat.acts.map((a, i) => ({ o: i, n: a.n, d: a.d, h: a.h }));
  let confirmLost = 0;
  const gradesAt = i => m.students.filter(s => isNum(getGrade(s, ra.id, cat.id, i))).length;
  const graded = cat.acts.map((_, i) => gradesAt(i));
  const lbl = (k, total) => total > 1 ? `${abbr(cat.label)} ${k + 1}` : abbr(cat.label);
  const rowsHTML = () => work.map((w, k) => {
    const g = w.o === null ? 0 : graded[w.o];
    return `<div class="act-row act-row-x"><b>${esc(lbl(k, work.length))}${w.o === null ? ' <span class="badge info">nueva</span>' : ''}</b>
      <input type="text" data-an="${k}" value="${esc(w.n)}" placeholder="Nombre o tema" maxlength="80">
      <input type="date" data-ad="${k}" value="${esc(w.d)}">
      <button type="button" class="btn btn-ghost btn-icon act-del" data-k="${k}" ${work.length <= 1 ? 'disabled' : ''} title="${work.length <= 1 ? 'Debe quedar al menos una actividad. Para quitarlas todas, quita el criterio.' : 'Quitar esta actividad' + (g ? ` (tiene ${g} notas)` : '')}" aria-label="Quitar actividad ${k + 1}">${ICON.trash}</button>
      ${g ? `<small class="act-g">${g} ${g === 1 ? 'nota' : 'notas'}</small>` : ''}</div>`;
  }).join('');
  const md = openModal({
    title: `Actividades de «${cat.label}»`, icon: '📝', wide: true,
    sub: `RA ${m.ras.indexOf(ra) + 1}: ${ra.name} · actividades de ${fmtN(cat.max)} puntos`,
    body: `<p class="muted small">El nombre y la fecha aparecen en el registro, en los reportes y en Excel. Puedes dejar en blanco las que aún no planificas. Con ${ICON.trash.replace('class="i"', 'class="i i-sm" style="vertical-align:-2px"')} quitas una actividad (y sus notas); las demás se renumeran.</p>
      <div class="act-list" id="actList"></div>
      <div class="row-wrap" style="margin-top:.7rem"><button type="button" class="btn btn-sm btn-secondary" id="actAdd">＋ Agregar actividad</button><span class="muted small" id="actCount"></span></div>
      <div id="actWarn"></div>`,
    actions: [{ label: 'Cancelar' }, {
      label: 'Guardar', cls: 'btn-primary', onClick: ov => {
        sync(ov);
        const keep = new Set(work.filter(w => w.o !== null).map(w => w.o));
        const removed = cat.acts.map((_, i) => i).filter(i => !keep.has(i));
        const lostStu = m.students.filter(s => removed.some(i => isNum(getGrade(s, ra.id, cat.id, i)))).length;
        const lostN = removed.reduce((a, i) => a + graded[i], 0);
        if (lostN && confirmLost !== lostN) {
          confirmLost = lostN;
          ov.querySelector('#actWarn').innerHTML = `<div class="alert alert-bad" style="margin-top:.7rem"><div><strong>${lostN === 1 ? 'Se borrará 1 nota' : `Se borrarán ${lostN} notas`}</strong> de ${lostStu} ${lostStu === 1 ? 'estudiante' : 'estudiantes'} en las actividades que quitaste. Pulsa <b>Guardar</b> otra vez para confirmar. (Se guarda una copia de seguridad antes.)</div></div>`;
          return false;
        }
        const changedShape = removed.length || work.length !== cat.count || work.some((w, k) => w.o !== k);
        if (changedShape) {
          snapshot(`Antes de cambiar las actividades de ${cat.label}`);
          m.students.forEach(s => {
            const old = (s.g[ra.id] || {})[cat.id];
            if (!old) return;
            s.g[ra.id][cat.id] = work.map(w => w.o !== null && isNum(old[w.o]) ? old[w.o] : '');
          });
          // Grupos vinculados a una actividad: se renumeran o se desvinculan
          const pre = `${m.id}|${ra.id}|${cat.id}|`;
          m.groups.forEach(gs => {
            if (!gs.actKey || !gs.actKey.startsWith(pre)) return;
            const k = work.findIndex(w => w.o === +gs.actKey.slice(pre.length));
            gs.actKey = k < 0 ? '' : pre + k;
          });
          cat.count = work.length;
          cat.minDone = Math.min(cat.minDone || 0, cat.count);
        }
        cat.acts = work.map(w => { const d = isoDate(w.d); return { n: String(w.n || '').trim().slice(0, 80), d, h: d ? (w.h || '') : '' }; });
        persist(); render();
        toast(removed.length ? `Actividades guardadas. ${removed.length === 1 ? 'Se quitó 1 actividad' : 'Se quitaron ' + removed.length + ' actividades'}.` : 'Actividades guardadas.', 'ok');
      }
    }]
  });
  const ov = md.el;
  function sync(o) {
    work.forEach((w, k) => {
      const n = o.querySelector(`[data-an="${k}"]`), d = o.querySelector(`[data-ad="${k}"]`);
      if (n) w.n = n.value; if (d) w.d = d.value;
    });
  }
  function draw() {
    ov.querySelector('#actList').innerHTML = rowsHTML();
    ov.querySelector('#actCount').textContent = `${work.length} ${work.length === 1 ? 'actividad' : 'actividades'} · ${fmtN(r2(work.length * cat.max))} puntos posibles`;
    ov.querySelector('#actAdd').disabled = work.length >= 50;
    ov.querySelectorAll('.act-del').forEach(b => b.onclick = () => {
      sync(ov); work.splice(+b.dataset.k, 1); confirmLost = 0; ov.querySelector('#actWarn').innerHTML = ''; draw();
    });
  }
  ov.querySelector('#actAdd').onclick = () => {
    sync(ov); if (work.length >= 50) return;
    work.push({ o: null, n: '', d: '', h: '' }); draw();
    const last = ov.querySelector(`[data-an="${work.length - 1}"]`); if (last) last.focus();
  };
  draw();
  return md;
}

function downloadFile(name, content, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

  saveNow(); render(); toast('Respaldo descargado. Guárdalo en una memoria USB o en la nube.', 'ok', 3500);

function restoreFromFile(file) {

    const replaceAll = () => {
      snapshot('Antes de restaurar un respaldo');
      const lb = db.settings.lastBackup;
      db = nd; if (!db.settings.lastBackup) db.settings.lastBackup = lb;

    };
    const addModules = () => {
      snapshot('Antes de agregar módulos desde un archivo');
      const used = new Set(db.modules.map(m => m.id));
      nd.modules.forEach(m => { if (used.has(m.id)) m.id = uid(); db.modules.push(m); });
      saveNow(); state.view = 'home'; state.modId = null; render();
      toast(`${nd.modules.length} módulos agregados. Tus módulos anteriores siguen igual.`, 'ok', 4000);
    };
    if (!db.modules.length) return replaceAll();
    openModal({
      title: 'Cargar archivo', icon: '💾',

      </aside>
    </div>`;
}
function saveDay(m, iso, patch) {
  const P = m.plan, { day } = dayPlan(m, P, iso);
  P.daily[iso] = normDay(Object.assign({}, day, patch));
  persist();
}

/* ---------- Calendario escolar (editor) ---------- */

      <button class="btn btn-sm btn-secondary" data-act="cal-next" title="Copia las semanas al año siguiente y recalcula los feriados de RD (Semana Santa, Corpus Christi y traslados de la Ley 139-97)">Crear borrador del año siguiente</button>
      <button class="btn btn-sm btn-ghost" data-act="cal-load">Volver al calendario ${esc(PLAN_LIB.calendar.year)}</button></div>
    <div class="table-wrap"><table class="tbl pl-cal"><thead><tr><th>Periodo</th><th>Inicio</th><th>Fin</th><th>Entrega de calif. (días)</th><th>Días de clase</th>${COMP_KEYS.map(([k, l]) => `<th title="${esc(l)}">${k}</th>`).join('')}<th>Total</th><th></th></tr></thead><tbody>

        <td><input type="date" data-cal="periods.${i}.start" value="${p.start}"></td><td><input type="date" data-cal="periods.${i}.end" value="${p.end}"></td>
        <td><input type="text" inputmode="numeric" class="pl-cin" data-cal="periods.${i}.entrega" value="${p.entrega}" style="width:48px"></td>
        <td><b>${pd}</b></td>
        ${COMP_KEYS.map(([k]) => `<td><input type="text" inputmode="numeric" class="pl-cin" data-cal="comp.${p.id}.${k}" value="${dist[k] || 0}" style="width:42px"></td>`).join('')}
        <td><b class="${sum + p.entrega === pd ? '' : 'txt-warn'}" title="Días por competencia + entrega de calificaciones">${sum + p.entrega}</b></td>
        <td><button class="btn btn-ghost btn-icon" style="color:var(--bad)" data-act="cal-del" data-k="periods" data-i="${i}" title="Quitar periodo">${ICON.trash}</button></td></tr>`; }).join('')}
    </tbody></table></div>

      <div class="pl-list">${C.breaks.map((b, i) => `<div class="pl-li pl-li3"><input type="text" data-cal="breaks.${i}.name" value="${esc(b.name)}"><input type="date" data-cal="breaks.${i}.start" value="${b.start}"><input type="date" data-cal="breaks.${i}.end" value="${b.end}"><button class="btn btn-ghost btn-icon" style="color:var(--bad)" data-act="cal-del" data-k="breaks" data-i="${i}">${ICON.trash}</button></div>`).join('') || '<p class="muted small">Sin recesos.</p>'}</div>

/** Inicio: clases de hoy según la planificación. */
function renderHomePlan() {
  const mods = db.modules.filter(m => m.plan); if (!mods.length || !db.cal) return '';
  const t = todayISO(); if (!isClassDay(t)) return '';
  const W = calWeeks(), wi = weekIndexOf(t), w = W[wi];
  const twd = wdOf(t), blocks = typeof horBlocks === 'function' ? horBlocks(twd) : [];
  const items = mods.filter(m => modDaysOfWeek(m, w).includes(t)).map(m => { const at = planWeekAt(m.plan, wi); const sv = m.plan.daily[t]; const bs = blocks.filter(b => b.mod === m); return { m, at, sv, bs, k: bs.length ? bs[0].start : 9999 }; }).sort((a, b) => a.k - b.k);
  if (!items.length) return '';
  return `<section class="card card-pad pl-home"><div class="section-head" style="margin-top:0"><h3>📘 Clases de hoy según tu planificación</h3><button class="btn btn-sm btn-ghost" data-act="go-week">Mi semana →</button></div>
    <div class="pl-home-list">${items.map(({ m, at, sv, bs }) => `<button class="pl-home-item" data-act="pl-open-day-mod" data-mod="${m.id}" data-date="${t}"><b>${bs.length ? `<span class="pl-home-t">${bs.map(b => m2h12(b.start)).join(' · ')}</span> ` : ''}${esc(modShort(m))} ${esc(m.course || '')}</b><span>${at ? `${esc(at.ra.code)} · ${esc((at.week.rows.find(r => r.m === 'Desarrollo') || at.week.rows[0] || {}).act || '').slice(0, 120)}` : 'Sin semana planificada'}</span>${sv && sv.status === 'done' ? '<em class="badge ok">Impartida</em>' : ''}</button>`).join('')}</div></section>`;
}

function onPlanChange(t) {

  if (t.dataset.cal !== undefined) return onCalChange(t), true;

  if (t.dataset.plWce) { const [ri, k] = t.dataset.plWce.split('|').map(Number); P.ras[ri].seq[k].ce = t.value.split(/[,;]\s*/).map(x => x.trim()).filter(Boolean); persist(); return true; }

  if (t.dataset.pdMin !== undefined) { const v = parseInt(t.value, 10); const { day } = dayPlan(m, P, plState().date); const mom = day.mom.map(x => Object.assign({}, x)); if (v >= 0 && v <= 600) { mom[+t.dataset.pdMin].min = v; saveDay(m, plState().date, { mom }); render(); } return true; }

  return false;
}
function setRaWeeks(m, ri, n) {

  if (n > r.seq.length) { while (r.seq.length < n) r.seq.push(normWeek({})); persist(); render(); return; }
  const lost = r.seq.slice(n).filter(w => w.rows.some(x => x.act.trim())).length;
  const apply = () => { snapshot('Antes de quitar semanas de la planificación'); r.seq = r.seq.slice(0, n); persist(); render(); };
  if (lost) confirmBox('Quitar semanas', `Las últimas ${r.seq.length - n} semanas del ${r.code} se borrarán (${lost} tienen actividades escritas).`, 'Quitar', apply, { onCancel: render });
  else apply();
}

  if (/^periods\.\d+\.id$/.test(path)) { const i = +path.split('.')[1], old = C.periods[i].id; v = String(v).trim().slice(0, 8) || old; if (old !== v) { C.comp[v] = C.comp[old] || {}; delete C.comp[old]; } }

}

/* =========================================================
   Mi horario de clases
   - Tabla de días × horas pedagógicas con el módulo (y curso) de cada hora.
   - Horas pedagógicas ajustables: entrada, duración, recesos, días.
   - La planificación usa el horario: días de clase de cada módulo y minutos
     de cada clase repartidos en Inicio / Desarrollo / Cierre.
   db.settings.horario = { start, n, min, dur[], breaks[{after,name,min}], days[], cells{'wd-n': {m}|{t}}, colors{modId}, split[3], lead }
   ========================================================= */
const HOR_DAYS = { 1: 'Lunes', 2: 'Martes', 3: 'Miércoles', 4: 'Jueves', 5: 'Viernes', 6: 'Sábado' };
const HOR_DS = { 1: 'Lun', 2: 'Mar', 3: 'Mié', 4: 'Jue', 5: 'Vie', 6: 'Sáb' };
const HOR_PAL = ['blue', 'violet', 'green', 'orange', 'teal', 'pink', 'amber', 'red'];

/** Fecha de una regla en un año. */
function festDate(rule, y) {
  if (/^\d\d-\d\d$/.test(rule)) return `${y}-${rule}`;
  if (rule[0] === 'E') return addDays(easter(y), +rule.slice(1));
  if (rule === 'D256') return addDays(`${y}-01-01`, 255);
  let mt = rule.match(/^TH(\d)-(\d\d)$/); // n-ésimo jueves del mes
  if (mt) { const f = `${y}-${mt[2]}-01`; return addDays(f, ((4 - wdOf(f) + 7) % 7) + 7 * (+mt[1] - 1)); }
  mt = rule.match(/^SU-L-(\d\d)$/); // último domingo del mes
  if (mt) { const l = `${y}-${mt[1]}-${pad2(daysInMonth(`${y}-${mt[1]}`))}`; return addDays(l, -wdOf(l)); }
  return '';
}

function feriadosRD(y) {
  return FERIADOS_RD.map(([r, n, mov, d]) => {
    const orig = festDate(r, y); let obs = orig;
    if (mov && !(r === '08-16' && y % 4 === 0)) obs = rdMove(orig);
    return { orig, date: obs, n, d, moved: obs !== orig };

}

  if (snap && snap.exists) {

    let mods = null;
    try { mods = await ref.collection('modules').get(); } catch (e) { try { mods = await ref.collection('modules').get({ source: 'cache' }); } catch (_) { } }

  const byId = {};

/** Escucha cambios hechos desde otros equipos. */
function cloudListen() {
  Cloud.unsub.forEach(f => f()); Cloud.unsub = [];
  const ref = teacherRef();
  Cloud.unsub.push(ref.onSnapshot(s => {
    if (!s.exists || s.metadata.hasPendingWrites) return;
    const d = s.data(); if (d.meta === Cloud.sent.meta || d.dev === Cloud.dev) { Cloud.sent.meta = d.meta; return; }
    if (dirty || cloudMeta() !== Cloud.sent.meta) return; // hay cambios propios sin subir: ganan los nuestros
    try {
      const M = JSON.parse(d.meta); Cloud.sent.meta = d.meta;
      const keepH = typeof horNewer === 'function' ? horNewer(db.settings.horario, M.settings && M.settings.horario) : null;
      db.settings = Object.assign(db.settings, M.settings); if (keepH) db.settings.horario = keepH; db.agenda = M.agenda || []; db.cal = M.cal; db = normalizeDB(db); Cloud.sent.meta = keepH ? '' : cloudMeta();
      if (keepH) setTimeout(() => cloudPush(false), 300);
      if (Array.isArray(M.order)) db.modules.sort((a, b) => M.order.indexOf(a.id) - M.order.indexOf(b.id));
      if (typeof calRev !== 'undefined') calRev++;
      saveLocalOnly(); render(); toast('Se actualizaron tus datos desde otro equipo.', 'ok');
    } catch (e) { }
  }, () => { }));
  Cloud.unsub.push(ref.collection('modules').onSnapshot(qs => {
    if (qs.metadata.hasPendingWrites) return;
    let changed = 0; const ids = [];
    qs.docChanges().forEach(ch => {
      const id = ch.doc.id, key = 'm:' + id, d = ch.doc.data();
      if (ch.type === 'removed') {
        if (Cloud.sent[key] !== undefined && findMod(id)) { db.modules = db.modules.filter(m => m.id !== id); changed++; }
        delete Cloud.sent[key]; return;
      }
      if (d.data === Cloud.sent[key]) return;
      const cur = findMod(id);
      if (cur && JSON.stringify(cur) !== Cloud.sent[key]) return; // este equipo tiene cambios sin subir en ese módulo
      try {
        const m = JSON.parse(d.data); Cloud.sent[key] = d.data;
        if (cur) db.modules[db.modules.indexOf(cur)] = m; else db.modules.push(m);
        changed++; ids.push(id);
      } catch (e) { }
    });
    if (changed) { db = normalizeDB(db); ids.forEach(id => { const m = findMod(id); if (m) Cloud.sent['m:' + id] = JSON.stringify(m); }); saveLocalOnly(); render(); if (Cloud.ready) toast('Se actualizaron tus módulos desde otro equipo.', 'ok'); }
  }, () => { }));
}
/** Sube solo lo que cambió (después de cada guardado local). */
function cloudQueue() { if (!Cloud.on || !Cloud.user || Cloud._quiet) return; clearTimeout(Cloud.timer); Cloud.timer = setTimeout(() => cloudPush(false), 1200); }
function cloudPush(force) {
  if (!Cloud.user) return;
  const ref = teacherRef(), batch = Cloud.fs.batch(); let n = 0;
  const ts = firebase.firestore.FieldValue.serverTimestamp();
  const meta = cloudMeta();
  if (force || meta !== Cloud.sent.meta) { batch.set(ref, { meta, dev: Cloud.dev, at: ts, email: Cloud.user.email || '' }); Cloud.sent.meta = meta; n++; }
  const live = new Set();
  db.modules.forEach(m => {
    const key = 'm:' + m.id, s = JSON.stringify(m); live.add(key);
    if (s.length > 950000) { toast(`El módulo ${modShort(m)} es demasiado grande para la nube; se guarda solo en este equipo.`, 'warn', 6000); return; }
    if (force || s !== Cloud.sent[key]) { batch.set(ref.collection('modules').doc(m.id), { data: s, dev: Cloud.dev, at: ts }); Cloud.sent[key] = s; n++; }
  });
  Object.keys(Cloud.sent).filter(k => k.startsWith('m:') && !live.has(k)).forEach(k => { batch.delete(ref.collection('modules').doc(k.slice(2))); delete Cloud.sent[k]; n++; });
  if (!n) return;
  cloudSetStatus(navigator.onLine ? 'up' : 'off');
  batch.commit().catch(e => { console.error(e); cloudSetStatus('err'); toast('No se pudo subir a la nube: ' + (e.code || e.message) + '. Tus datos siguen en este equipo.', 'error', 6000); });

  Cloud.fs.waitForPendingWrites().then(() => { if (navigator.onLine) cloudSetStatus('sync'); }).catch(() => { });
}

/** Al volver a habilitar: quita los cierres y bloqueos por estudiante (si no, no podrían volver a entrar).

async function aulaReopenPrep(m, ex, ids) {

    const b = Math.max(+(live[n] && live[n].b) || 0, +ex.lockSent[n] || 0);
    if (!ex.resp[n] && !out[n] && (b > (+ex.unlockAt[n] || 0) || ex.lockSent[n] !== undefined)) out[n] = 'unlock';

    const n = i + 1;
    if (tp === 'mc' && ok === null) warns.push(`Pregunta ${n}: no trae la respuesta correcta marcada.`);
    if (tp === 'tf' && ok === null) warns.push(`Pregunta ${n}: falta si es Verdadero o Falso.`);
    if (tp === 'short' && !acc.length) warns.push(`Pregunta ${n}: falta la respuesta aceptada.`);
    return normAulaQ({ t: tp, text: pick(q, 'text', 'texto', 'enunciado', 'pregunta', 'question', 'titulo') || '', pts: pick(q, 'pts', 'puntos', 'points', 'valor') || 1, opts, ok, acc });
  }).filter(Boolean);
  const kRaw = String(pick(src, 'kind', 'tipo', 'type') || '');
  const kind = Object.keys(AULA_KINDS).find(k => aulaFold(k) === aulaFold(kRaw)) || 'Examen';
  return { ex: { title: String(pick(src, 'title', 'titulo', 'nombre') || 'Examen importado'), kind, dur: parseInt(pick(src, 'dur', 'tiempo', 'duracion', 'minutos'), 10) || 30, instr: String(pick(src, 'instr', 'instrucciones', 'instructions') || ''), qs }, warns };
}

/* ---------- Fechas legibles ---------- */
function aulaWhen(iso) {
  const d = new Date(iso); if (isNaN(d)) return '';
  const wd = d.toLocaleDateString('es-DO', { weekday: 'short' }).replace('.', '');
  return `${wd} ${fmtDateY(isoLocal(d))} · ${d.toLocaleTimeString('es-DO', { hour: 'numeric', minute: '2-digit' })}`;
}

/* ---------- Repartir puntos ---------- */
function aulaDistribute(qs, V, mode) {
  const W = { mc: 1, tf: 1, short: 1.5, open: 3 };
  const w = qs.map(q => mode === 'type' ? W[q.t] : 1), sw = w.reduce((a, b) => a + b, 0);
  qs.forEach((q, i) => { q.pts = Math.max(0.25, Math.round(V * w[i] / sw * 4) / 4); });
  let diff = Math.round((V - qs.reduce((a, q) => a + q.pts, 0)) * 4) / 4;
  // Ajuste fino para que la suma sea exacta (de a 0.25 en las de más peso)
  const order = qs.map((q, i) => i).sort((a, b) => w[b] - w[a]);
  for (let k = 0; Math.abs(diff) >= 0.25 && k < 400; k++) { const q = qs[order[k % order.length]]; const step = diff > 0 ? 0.25 : -0.25; if (q.pts + step >= 0.25) { q.pts = r2(q.pts + step); diff = r2(diff - step); } }
}

/* ---------- Resumen del examen (para reportes y la bandeja) ---------- */
function aulaCond(pct) { return pct >= 70 ? { cls: 'ok', label: 'Logrado' } : pct >= 60 ? { cls: 'mid', label: 'En proceso' } : { cls: 'bad', label: 'No logrado' }; }
function aulaSummary(m, ex) {
  const t = aulaTarget(m, ex), asg = aulaAssigned(m, ex), seen = new Set();
  const nums = Object.keys(ex.resp);
  const row = (s, num) => {
    const r = num !== undefined ? ex.resp[num] : null;
    if (!r) return { num: s.num, name: s.name, sent: false };
    const sc = aulaScore(ex, num), pct = sc.total ? r2(sc.got / sc.total * 100) : 0;
    return { num: s ? s.num : +num, name: s ? s.name : r.name, typed: r.name, sent: true, got: sc.got, total: sc.total, pending: sc.pending, pct, grade: !sc.pending && t ? aulaScaled(m, ex, sc) : null, blurs: aulaOutN(ex, num), late: aulaLate(ex, r), min: r.sentAt && r.startedAt ? Math.max(0, Math.round((r.sentAt - r.startedAt) / 60000)) : null, at: r.sentAt || 0 };
  };
  const rows = asg.map(s => { const num = nums.find(k => { const x = aulaStudent(m, ex, k); return x && x.id === s.id; }); if (num !== undefined) seen.add(num); return row(s, num); });
  nums.filter(k => !seen.has(k)).forEach(k => rows.push(row(aulaStudent(m, ex, k), k)));
  const done = rows.filter(r => r.sent && !r.pending);
  const avg = done.length ? r2(done.reduce((a, r) => a + r.pct, 0) / done.length) : null;
  const qstats = ex.qs.map((q, i) => {
    if (q.t === 'open' || !nums.length) return { n: i + 1, text: q.text, t: q.t, pct: null };
    const ok = nums.filter(k => { const p = aulaScore(ex, k).per[q.id]; return p && p.pts >= q.pts; }).length;
    return { n: i + 1, text: q.text, t: q.t, pct: Math.round(ok / nums.length * 100) };
  });
  return {
    id: ex.id, title: ex.title, kind: ex.kind, mod: modShort(m), modName: modFull(m), course: m.course || '', to: aulaToLabel(m, ex),
    target: t ? aulaTargetLabel(m, t) : '', max: t ? t.c.max : null, openedAt: ex.openedAt || '', closedAt: ex.closedAt || (ex.status !== 'draft' && !aulaIsOpen(ex) ? ex.until : ''),
    file: aulaIsFile(ex), nq: ex.qs.length, pts: aulaTotal(ex), dur: ex.dur, assigned: asg.length, delivered: nums.length, graded: done.length, avg,
    best: done.length ? Math.max(...done.map(r => r.pct)) : null, worst: done.length ? Math.min(...done.map(r => r.pct)) : null,
    ok: done.filter(r => r.pct >= 70).length, rows: rows.map(r => r.sent ? r : { num: r.num, name: r.name, sent: false }), qstats
  };
}

    <table class="rp-table rx-res"><thead><tr><th>Nº</th><th class="l">Estudiante</th><th>Puntos</th><th>%</th>${S.max ? `<th>Nota /${fmtN(S.max)}</th>` : ''}<th>Condición</th>${S.file ? '<th>Entregó</th>' : '<th>Salidas</th><th>Tiempo</th>'}</tr></thead><tbody>${rows}</tbody></table>
    ${qs.length ? `<h3 class="rp-h3">Aciertos por pregunta</h3><div class="rx-qbars">${qs.map(q => `<div><span>P${q.n}</span><i><em style="width:${q.pct}%;background:${q.pct >= 70 ? '#15803d' : q.pct >= 50 ? '#d97706' : '#b91c1c'}"></em></i><b>${q.pct}%</b><small>${esc(q.text.slice(0, 70))}</small></div>`).join('')}</div>` : ''}

/* ---------- Examen detallado de cada estudiante (PDF) ---------- */
function aulaStudentPDF(m, ex, nums) {
  const t = aulaTarget(m, ex), L = 'ABCDEFGH';
  const pages = nums.map(num => {
    const r = ex.resp[num]; if (!r) return '';
    const s = aulaStudent(m, ex, num), sc = aulaScore(ex, num), pct = sc.total ? sc.got / sc.total * 100 : 0, c = aulaCond(pct);
    const v = t && !sc.pending ? aulaScaled(m, ex, sc) : null;
    const qs = ex.qs.map((q, i) => {
      const a = (r.answers || {})[q.id], p = sc.per[q.id] || {}, empty = a === undefined || a === null || a === '';
      const st = p.pts === null ? 'pend' : p.pts >= q.pts ? 'ok' : p.pts > 0 ? 'half' : 'bad';
      let body = '';
      if (q.t === 'mc') body = `<ol class="rx-opts rx-opts1">${q.opts.map((o, j) => `<li class="${j === q.ok ? 'rx-ok' : ''} ${!empty && +a === j && j !== q.ok ? 'rx-wrong' : ''}"><span class="rx-b">${L[j].toLowerCase()}</span>${esc(o)}${!empty && +a === j ? ' <em>← su respuesta</em>' : ''}${j === q.ok ? ' ✓' : ''}</li>`).join('')}</ol>`;
      else if (q.t === 'tf') body = `<div class="rx-ans">Respondió: <b>${empty ? '(sin responder)' : (a === true || a === 'true') ? 'Verdadero' : 'Falso'}</b> · Correcta: <b>${q.ok ? 'Verdadero' : 'Falso'}</b></div>`;
      else if (q.t === 'short') body = `<div class="rx-ans">Respondió: <b>${empty ? '(sin responder)' : esc(a)}</b>${q.acc.length ? ` · Aceptadas: ${esc(q.acc.join(' · '))}` : ''}</div>`;
      else body = aulaIsFile(ex) ? '' : `<div class="rx-open">${empty ? '<i>(sin responder)</i>' : esc(a)}</div>`;
      return `<div class="rx-q rx-q-${st}"><div class="rx-qh"><span class="rx-num">${i + 1}</span><div class="rx-txt">${esc(q.text)}</div><span class="rx-got">${p.pts === null ? '?' : fmtN(p.pts)} / ${fmtN(q.pts)}</span></div>${body}</div>`;
    }).join('');
    return `<section class="rp-page rx">${reportHead(m, 'Examen del estudiante')}
      <div class="rx-stu"><div><span>Estudiante</span><b>${s ? s.num + '. ' + esc(s.name) : esc(r.name)}</b>${s && !aulaNameOk(s, r) ? `<small>Escribió: ${esc(r.name)}</small>` : ''}</div>
        <div><span>${esc(ex.kind)}</span><b>${esc(ex.title)}</b><small>${r.sentAt ? 'Entregado ' + esc(aulaWhen(new Date(r.sentAt).toISOString())) : ''}${r.sentAt && r.startedAt ? ' · ' + Math.max(0, Math.round((r.sentAt - r.startedAt) / 60000)) + ' min' : ''}${r.blurs ? ' · salió ' + r.blurs + ' ' + (r.blurs === 1 ? 'vez' : 'veces') : ''}</small></div>
        <div class="rx-score2"><span>Puntos</span><b>${fmtN(sc.got)} / ${fmtN(sc.total)}</b><small>${Math.round(pct)}% · ${c.label}</small></div>
        ${t ? `<div class="rx-score2 main"><span>Nota · ${esc(aulaTargetLabel(m, t))}</span><b>${v === null ? '—' : fmtN(v)} / ${fmtN(t.c.max)}</b></div>` : ''}</div>
      ${aulaIsFile(ex) ? `<p class="rx-files"><b>Archivos entregados:</b> ${(r.files || []).map(f => esc(f.nm) + ' (' + aulaSize(f.sz) + ')').join(' · ') || '—'}${aulaLate(ex, r) ? ' · <b>entregado tarde</b>' : ''}</p>` : ''}
      <div class="rx-qs">${qs}</div>
      ${aulaIsFile(ex) && ex.notes[num] ? `<div class="rx-open"><b>Comentario del docente:</b> ${esc(ex.notes[num])}</div>` : ''}
      <div class="rp-sign"><div>Firma del docente</div><div>Firma del estudiante</div></div></section>`;
  }).join('');

  toast('En la ventana de impresión elige «Guardar como PDF» si lo quieres en PDF.', 'info', 4500);
}

/* ---------- Gráfico de entregas ---------- */
function aulaDonutKPI(done, pend, total) {
  const R = 40, C = 2 * Math.PI * R, rest = Math.max(0, total - done - pend);
  const seg = (n, off, col) => { if (!(n > 0 && total)) return ''; const da = `${Math.max(0, n / total * C - (n === total ? 0 : 2)).toFixed(2)} ${C.toFixed(2)}`; return `<circle r="${R}" cx="50" cy="50" fill="none" stroke="${col}" stroke-width="13" stroke-linecap="${n === total ? 'butt' : 'round'}" stroke-dasharray="${da}" data-to="${da}" stroke-dashoffset="${(-off / total * C).toFixed(2)}" transform="rotate(-90 50 50)"/>`; };
  const pct = total ? Math.round((done + pend) / total * 100) : 0;
  return `<div class="kpi kpi-donut">
    <svg viewBox="0 0 100 100" class="donut" role="img" aria-label="${done + pend} de ${total} entregaron"><circle r="${R}" cx="50" cy="50" fill="none" stroke="var(--track)" stroke-width="13"/>${seg(done, 0, 'var(--ok)')}${seg(pend, done, 'var(--gold)')}
      <text x="50" y="49" text-anchor="middle" class="d-big">${pct}%</text><text x="50" y="63" text-anchor="middle" class="d-sm">${done + pend} de ${total}</text></svg>
    <div class="d-leg"><b>Entregas</b>
      <span><i style="background:var(--ok)"></i>Corregidas <em>${done}</em></span>
      <span><i style="background:var(--gold)"></i>Por corregir <em>${pend}</em></span>
      <span><i style="background:var(--track)"></i>Sin entregar <em>${rest}</em></span></div>
  </div>`;
}

/* ---------- Acciones sobre un estudiante o todo el curso ----------
   reset   → borra su entrega y su progreso; empieza de cero (su celular se reinicia solo)
   delete  → borra la entrega y la nota que pasó al registro (no se bloquea)
   collect → recoge lo que lleva respondido (se entrega solo)
   block / unblock → no puede entrar ni entregar / vuelve a poder
   ------------------------------------------------------------------ */
const AULA_OPS = {
  reset: { t: 'Reiniciar su examen', b: 'Se borran su entrega y lo que lleva respondido. En su celular el examen empieza de cero (con otro número de lista no se mezcla). La nota del registro no se toca.', ok: 'Reiniciar' },
  delete: { t: 'Eliminar la entrega', b: 'Se borra su entrega y, si la nota del Aula está en el registro, también esa nota. Podrá volver a hacerlo mientras el examen esté abierto.', ok: 'Eliminar' },
  collect: { t: 'Recoger lo que lleva', b: 'En unos segundos su examen se entrega solo con lo que haya respondido y ya no puede seguir.', ok: 'Recoger' },
  block: { t: 'Bloquear', b: 'No puede entrar ni entregar. Lo que respondió se queda en su celular. Puedes desbloquearlo cuando quieras.', ok: 'Bloquear' },
  unblock: { t: 'Desbloquear', b: '', ok: 'Desbloquear' },
  permit: { t: 'Permitir continuar', b: '', ok: 'Permitir' }
};
function aulaStuAct(id, num, op) {
  const m = curMod(), ex = aulaFind(m, id); if (!ex) return;
  const s = aulaStudent(m, ex, num), who = s ? `${s.num}. ${s.name}` : 'Nº ' + num, O = AULA_OPS[op];
  aulaCloseMenus();
  if (op === 'unassign') return aulaSetAssigned(m, ex, aulaAssigned(m, ex).filter(x => !s || x.id !== s.id).map(x => x.id), `${who} ya no está en este examen.`);
  const run = () => aulaApplyOp(m, ex, [String(num)], op).then(() => toast(`${who}: ${O.t.toLowerCase()} listo.`, 'ok', 3500)).catch(e => toast(aulaErr(e), 'error', 5000));
  if (op === 'unblock' || op === 'permit') return run();
  confirmBox(`${O.t} · ${who}`, O.b, O.ok, run, { danger: op !== 'collect' });
}
/** Aplica una acción a varios números de lista a la vez (un estudiante o todo el curso). */
async function aulaApplyOp(m, ex, nums, op) {
  if (!aulaCloudOK() || !ex.pub) throw new Error('Necesitas la versión web con tu cuenta e internet.');
  const ref = aulaRef(ex), nonce = aulaRand(6);
  if (op === 'delete') snapshot('Aula: eliminar entregas de ' + ex.title);
  const t = aulaTarget(m, ex);
  for (const num of nums) {
    const st = aulaStudent(m, ex, num), sid = st && st.id;
    if (op === 'reset' || op === 'delete') {
      await withTimeout(ref.collection(aulaColl(ex)).doc(num).delete(), 12000);
      if (aulaIsFile(ex)) { await aulaFreeFiles(ex, [num]).catch(() => { }); delete ex.notes[num]; delete ex.seen[num]; }
      await ref.collection('live').doc(num).delete().catch(() => { });
      const rp = ex.resPushed[num]; if (rp && rp.tok) await ref.collection('res').doc(rp.tok).delete().catch(() => { });
      await ref.collection('x').doc(num).set({ m: 'reset', n: nonce });
      if (op === 'delete' && t && st && isNum(ex.applied[sid]) && getGrade(st, t.ra.id, t.c.id, t.i) === ex.applied[sid]) setGrade(st, t.ra.id, t.c.id, t.i, '');
      delete ex.resp[num]; delete ex.marks[num]; delete ex.map[num]; delete ex.resPushed[num]; delete ex.outBase[num]; delete ex.unlockAt[num]; delete ex.lockSent[num]; if (sid) { delete ex.blocked[sid]; if (op === 'delete') delete ex.applied[sid]; }
      delete AulaLive.live[num];
    } else if (op === 'collect' || op === 'block') {
      await withTimeout(ref.collection('x').doc(num).set({ m: op }), 12000);
      if (sid) ex.blocked[sid] = op;
    } else if (op === 'permit') {
      await withTimeout(ref.collection('x').doc(num).set({ m: 'unlock', n: nonce }), 12000);
      const lv = AulaLive.live[num]; ex.unlockAt[num] = lv ? lv.b || 0 : 0; delete ex.lockSent[num];
    } else if (op === 'unblock') {
      await withTimeout(ref.collection('x').doc(num).delete(), 12000);
      if (sid) delete ex.blocked[sid];
    }
  }
  if (op === 'block' || op === 'unblock' || op === 'reset' || op === 'delete') await aulaPublish(m, ex);
  persist(); render();
}
/** Cambia a quién está asignado el examen (desde la tabla o desde «Elegir quién lo toma»). */
function aulaSetAssigned(m, ex, ids, okMsg) {
  if (!ids.length) return toast('Debe quedar al menos un estudiante en el examen.', 'error');
  const all = m.students.length === ids.length;
  ex.to = all ? { mode: 'all', gs: '', gi: 0, ids: [] } : { mode: 'some', gs: '', gi: 0, ids };
  persist(); render();
  const done = () => toast(okMsg || 'Lista del examen actualizada.', 'ok', 3000);
  if (ex.pub && ex.status !== 'draft' && aulaCloudOK()) aulaPublish(m, ex).then(() => { persist(); done(); }).catch(e => toast('Guardado aquí, pero no se pudo publicar: ' + aulaErr(e), 'warn', 5000));
  else done();
}
/** Lista de estudiantes con casillas (se usa al habilitar y en «Elegir quién lo toma»). */
function aulaPicker(m, on) {
  const studs = m.students.slice().sort((a, b) => a.num - b.num);
  return {
    html: `<div class="ae-stus-h"><span class="muted small" data-pk-n></span><button type="button" class="btn btn-sm btn-ghost" data-pk="all">Todos</button><button type="button" class="btn btn-sm btn-ghost" data-pk="none">Ninguno</button></div>
      <div class="ae-stus ae-stus-tall">${studs.map(s => `<label class="ae-stu"><input type="checkbox" value="${s.id}" data-pk-s><span>${s.num}</span>${esc(s.name)}</label>`).join('')}</div>`,
    bind(root) {
      const draw = () => {
        root.querySelector('[data-pk-n]').textContent = `${on.size} de ${studs.length} elegido${on.size === 1 ? '' : 's'}`;
        root.querySelectorAll('[data-pk-s]').forEach(c => { c.checked = on.has(c.value); c.parentElement.classList.toggle('on', c.checked); });
      };
      root.querySelectorAll('[data-pk-s]').forEach(c => c.onchange = () => { if (c.checked) on.add(c.value); else on.delete(c.value); draw(); });
      root.querySelectorAll('[data-pk]').forEach(b => b.onclick = () => { on.clear(); if (b.dataset.pk === 'all') studs.forEach(s => on.add(s.id)); draw(); });
      draw();
    }
  };
}
/** Guarda la lista elegida en el examen; si no cambió, conserva el modo (grupo, todos…). */
function aulaPickTo(m, ex, on) {
  const cur = aulaAssigned(m, ex).map(s => s.id);
  if (cur.length === on.size && cur.every(id => on.has(id))) return;
  ex.to = on.size === m.students.length ? { mode: 'all', gs: '', gi: 0, ids: [] } : { mode: 'some', gs: '', gi: 0, ids: [...on] };
}
function aulaAssignDialog(id) {
  const m = curMod(), ex = aulaFind(m, id); if (!ex) return;
  const on = new Set(aulaAssigned(m, ex).map(s => s.id)), pk = aulaPicker(m, on);
  openModal({
    title: 'Elegir quién lo toma', icon: AI.users, wide: true, sub: `${ex.title} · marca a los que deben aparecer en la lista y poder entrar`,
    body: pk.html + (Object.keys(ex.resp).length ? '<p class="muted small">Quien ya entregó sigue apareciendo en la tabla aunque lo desmarques.</p>' : ''),
    actions: [{ label: 'Cancelar' }, { label: 'Guardar', cls: 'btn-primary', onClick: () => { if (!on.size) { toast('Marca al menos un estudiante.', 'error'); return false; } aulaSetAssigned(m, ex, [...on]); } }],
    onOpen: ov => pk.bind(ov)
  });
}
/** Reiniciar o eliminar las entregas de todo el curso. */
function aulaResetAll(id) {
  aulaCloseMenus();
  const m = curMod(), ex = aulaFind(m, id); if (!ex) return;
  const nums = [...new Set([...Object.keys(ex.resp), ...(AulaLive.xid === ex.id ? Object.keys(AulaLive.live) : [])])];
  if (!nums.length) return toast('Todavía nadie ha entrado a este examen.', 'info');
  openModal({
    title: 'Reiniciar para todo el curso', icon: AI.refresh, sub: `${ex.title} · ${nums.length} estudiante${nums.length === 1 ? '' : 's'} con entrega o respondiendo`,
    body: `<div class="blk-opts">
      <label class="blk-opt"><input type="radio" name="rall" value="reset" checked><span class="blk-ic">${AI.refresh}</span><div><b>Reiniciar</b><small>Se borran todas las entregas y lo que llevan. Todos empiezan de cero. Las notas del registro no se tocan.</small></div></label>
      <label class="blk-opt"><input type="radio" name="rall" value="delete"><span class="blk-ic bad">${AI.trash}</span><div><b>Reiniciar y quitar las notas</b><small>Además se borran del registro las notas que puso el Aula (las que escribiste tú a mano se quedan).</small></div></label></div>`,
    actions: [{ label: 'Cancelar' }, {
      label: 'Reiniciar para todos', cls: 'btn-danger', onClick: (ov, close) => {
        const op = ov.querySelector('[name=rall]:checked').value, btn = ov.querySelector('.modal-foot .btn-danger');
        btn.disabled = true; btn.textContent = 'Reiniciando…';
        aulaApplyOp(m, ex, nums, op).then(() => { close(); toast(`Listo: ${nums.length} reiniciados.`, 'ok', 3500); }).catch(e => { btn.disabled = false; btn.textContent = 'Reiniciar para todos'; toast(aulaErr(e), 'error', 5000); });
        return false;
      }
    }]
  });
}
/** Pone en cero los contadores de salidas (lo que ya contó no se borra de la entrega). */
function aulaOutClear(id) {
  const m = curMod(), ex = aulaFind(m, id); if (!ex) return;
  const nums = new Set(Object.keys(ex.resp)); if (AulaLive.xid === ex.id) Object.keys(AulaLive.live).forEach(k => nums.add(k));
  nums.forEach(k => { ex.outBase[k] = aulaOutRaw(ex, k); });
  persist(); render(); toast('Contadores de salidas en cero.', 'ok');
}

/* ---------- Resultado para el estudiante ---------- */
function aulaResultFor(m, ex, num, detail) {
  const r = ex.resp[num], sc = aulaScore(ex, num), t = aulaTarget(m, ex), L = 'ABCDEFGH';
  const pct = sc.total ? r2(sc.got / sc.total * 100) : 0;
  const out = { t: ex.title, k: ex.kind, got: sc.got, total: sc.total, pct, grade: t ? aulaScaled(m, ex, sc) : null, max: t ? t.c.max : null, cond: aulaCond(pct).label };
  if (aulaIsFile(ex)) { out.mode = 'file'; if (detail && ex.notes[num]) out.com = ex.notes[num]; }
  if (detail) out.det = ex.qs.map((q, i) => {
    const a = (r.answers || {})[q.id], p = sc.per[q.id] || {}, empty = a === undefined || a === null || a === '';
    const ans = empty ? '' : q.t === 'mc' ? `${L[+a] || '?'}) ${q.opts[+a] ?? ''}` : q.t === 'tf' ? ((a === true || a === 'true') ? 'Verdadero' : 'Falso') : String(a).slice(0, 300);
    const cor = q.t === 'mc' ? (q.ok !== null ? `${L[q.ok]}) ${q.opts[q.ok]}` : '') : q.t === 'tf' ? (q.ok ? 'Verdadero' : 'Falso') : q.t === 'short' ? q.acc.join(' · ') : '';
    return { n: i + 1, q: q.text.slice(0, 300), st: p.pts === null ? 'pend' : p.pts >= q.pts ? 'ok' : p.pts > 0 ? 'half' : 'bad', got: p.pts, pts: q.pts, ans, cor };
  });
  return out;
}
/** Publica (o actualiza) el resultado de cada entrega corregida según la opción del examen. */
function aulaPushResults(m, ex) {
  if (!aulaCloudOK() || !ex.pub || ex.res === 'off') return;
  const closed = ex.status === 'closed' || (ex.status === 'open' && !aulaIsOpen(ex));
  if (ex.res === 'close' && !closed) return;
  const detail = ex.resDetail && (closed || aulaIsFile(ex));
  Object.keys(ex.resp).forEach(num => {
    const r = ex.resp[num]; if (!r || !r.tok) return;
    const sc = aulaScore(ex, num); if (sc.pending) return;
    const data = aulaResultFor(m, ex, num, detail), h = aulaHash(JSON.stringify(data), 32);
    const prev = ex.resPushed[num]; if (prev && prev.h === h && prev.tok === r.tok) return;
    ex.resPushed[num] = { tok: r.tok, h };
    aulaRef(ex).collection('res').doc(r.tok).set(data).catch(() => { delete ex.resPushed[num]; });
  });
  persist();
}

/* ---------- Animaciones de los gráficos del Aula ---------- */
const _aulaAnimPrev = {};
function aulaAnimate() {
  if (typeof motionOn === 'function' && !motionOn()) return;
  const app = document.getElementById('app'); if (!app) return;
  // Dona de entregas: crece desde el valor anterior (o desde cero la primera vez)
  app.querySelectorAll('svg.donut [data-to]').forEach((c, i) => {
    const key = (state.aulaSel || '') + ':' + i, to = c.getAttribute('data-to'), from = _aulaAnimPrev[key] || '0 999';
    if (from === to) return;
    c.style.transition = 'none'; c.setAttribute('stroke-dasharray', from);
    requestAnimationFrame(() => requestAnimationFrame(() => { c.style.transition = ''; c.setAttribute('stroke-dasharray', to); }));
    _aulaAnimPrev[key] = to;
  });
  // Barras y números
  app.querySelectorAll('.ac-bar > div, .aq-stat .progress > div').forEach((b, i) => {
    const key = 'bar:' + (state.aulaSel || 'list') + ':' + i + ':' + b.style.width;
    if (_aulaAnimPrev[key]) return; _aulaAnimPrev[key] = 1;
    const w = b.style.width; b.style.transition = 'none'; b.style.width = '0';
    requestAnimationFrame(() => requestAnimationFrame(() => { b.style.transition = 'width .8s cubic-bezier(.2,.8,.2,1)'; b.style.width = w; }));
  });
  const scr = 'num:' + (state.modId || '') + ':' + (state.aulaSel || 'list');
  if (!_aulaAnimPrev[scr]) {
    _aulaAnimPrev[scr] = 1;
    app.querySelectorAll('.ah-stats b, .kpi > b, .ti-num b').forEach(el => {
      const txt = el.textContent.trim(), mt = txt.match(/^(\d{1,4})(%?)$/); if (!mt || el.children.length) return;
      const end = +mt[1]; if (!end) return; const t0 = performance.now();
      const step = now => { if (!el.isConnected) return; const k = Math.min(1, (now - t0) / 700), e = 1 - Math.pow(1 - k, 3); el.textContent = Math.round(end * e) + mt[2]; if (k < 1) requestAnimationFrame(step); else el.textContent = txt; };
      el.textContent = '0' + mt[2]; requestAnimationFrame(step);
    });
  }
}

/* =====================================================================
   Portal de estudiantes «Mi aula» (etapa 1)
   - Cuentas de estudiante (usuario + contraseña; las administra el docente)
   - Qué ve cada estudiante: notas por RA (nada / total / detallado), acumulado, actividades ocultas
   - Pendientes del Aula, avisos y documentos (enlaces)
   Nube: portal/{pid} (avisos y documentos del módulo), portal/{pid}/s/{uid} (lo que ve ese estudiante),
         pstu/{uid} (a qué portales pertenece). Solo se publica lo que el docente permite.
   ===================================================================== */
const PORTAL_DOMAIN = typeof CLOUD_CONFIG === 'object' && CLOUD_CONFIG.projectId ? `alumnos.${CLOUD_CONFIG.projectId}.firebaseapp.com` : 'alumnos.praxis.invalid';
const PORTAL_DOC_KINDS = { pdf: 'PDF', doc: 'Word', ppt: 'Presentación', xls: 'Excel', video: 'Video', link: 'Enlace' };

function normPortal(p) {
  const o = p && typeof p === 'object' ? p : {};
  const vis = v => { const x = v && typeof v === 'object' ? v : {}; return { v: ['off', 'total', 'detail', 'on'].includes(x.v) ? x.v : 'off', to: x.to === 'some' ? 'some' : 'all', ids: Array.isArray(x.ids) ? x.ids.map(String) : [] }; };
  const ras = {}; if (o.ras && typeof o.ras === 'object') Object.entries(o.ras).forEach(([k, v]) => { ras[k] = vis(v); });
  const accts = {}; if (o.accts && typeof o.accts === 'object') Object.entries(o.accts).forEach(([k, a]) => { if (a && a.u) accts[k] = { u: String(a.u), uid: String(a.uid || ''), pw: String(a.pw || ''), at: String(a.at || '') }; });
  const arr = (a, n) => (Array.isArray(a) ? a : []).filter(x => x && typeof x === 'object' && x.id).slice(-n);
  return { on: !!o.on, pid: String(o.pid || ''), accts, ras, tot: vis(o.tot), hide: o.hide && typeof o.hide === 'object' ? o.hide : {}, news: arr(o.news, 50), docs: arr(o.docs, 200), pushed: o.pushed && typeof o.pushed === 'object' ? o.pushed : {}, metaH: String(o.metaH || ''), lastSync: String(o.lastSync || '') };
}

/* ---------- Utilidades ---------- */
function portalSlug(s) { return aulaFold(s).replace(/[^a-z0-9]+/g, ''); }
function portalUserDefault(m, s) { return `${portalSlug(m.course) || portalSlug(modShort(m)) || 'est'}-${String(s.num).padStart(2, '0')}`; }
function portalUserOk(u) { return /^[a-z0-9][a-z0-9.-]{2,39}$/.test(u); }
function portalEmail(u) { return `${u}@${PORTAL_DOMAIN}`; }
function portalPw() { const A = 'abcdefghjkmnpqrstuvwxyz23456789'; return aulaRand(4, A) + '-' + aulaRand(4, A); }
function portalUrl() { return (_aulaHostOk && AULA_HOST ? new URL('portal/', AULA_HOST) : new URL('portal/', location.href)).href; }
function portalRaTitle(ra) { let t = (ra.name || '').trim(); if (!t || /^RA\s*[\d.]+$/i.test(t)) t = (ra.desc || '').trim(); return t.length > 90 ? t.slice(0, 88) + '…' : t; }
function portalSees(v, s) { return !!v && v.v !== 'off' && (v.to === 'all' || v.ids.includes(s.id)); }
function portalVis(m, id) { const P = m.portal; return id === '_tot' ? P.tot : (P.ras[id] = P.ras[id] || { v: 'off', to: 'all', ids: [] }); }
/** Cuenta de otro módulo con el mismo usuario (el mismo estudiante en dos módulos usa una sola cuenta). */
function portalFindAcct(u, except) {
  for (const mm of db.modules) { if (mm === except || !mm.portal) continue; for (const [sid, a] of Object.entries(mm.portal.accts)) if (a.u === u && a.uid) return { m: mm, s: findStu(mm, sid), a }; }
  return null;
}
function portalUidShared(uid, except) { return db.modules.some(mm => mm !== except && mm.portal && Object.values(mm.portal.accts).some(a => a.uid === uid)); }
/** Segunda conexión, solo para crear o cambiar cuentas de estudiantes (no cierra la sesión del docente). */
async function portalAdminAuth() {
  const app = (firebase.apps || []).find(a => a.name === 'praxisAlumnos') || firebase.initializeApp(CLOUD_CONFIG, 'praxisAlumnos');
  const A = app.auth();
  try { await A.setPersistence(firebase.auth.Auth.Persistence.NONE); } catch (e) { }
  return A;
}
function portalAuthErr(e) {
  const c = String(e && e.code || e && e.message || e);
  if (c.includes('email-already-in-use')) return 'ese usuario ya existe';
  if (c.includes('too-many-requests')) return 'Google pidió esperar un rato; intenta más tarde';
  if (c.includes('operation-not-allowed')) return 'falta activar «Correo y contraseña» en Firebase Authentication';
  if (c.includes('admin-restricted')) return 'Firebase no permite crear cuentas nuevas: activa «Permitir crear cuentas» en Authentication › Configuración';
  if (c.includes('wrong-password') || c.includes('invalid-credential') || c.includes('invalid-login')) return 'la contraseña guardada no coincide';
  if (c.includes('network')) return 'sin conexión';
  return aulaErr(e);
}

/* ---------- Lo que ve cada estudiante ---------- */
function portalMeta(m) {
  const P = m.portal;
  return { owner: Cloud.user.uid, mod: modShort(m), modName: modFull(m), course: m.course || '', teacher: (db.settings && db.settings.teacher) || '', v: 1,
    news: P.news.slice(-30).map(n => ({ id: n.id, t: n.t, at: n.at })), docs: P.docs.map(d => ({ id: d.id, t: d.t, url: d.url, k: d.k, ra: d.ra, at: d.at })) };
}
function portalPayload(m, s) {
  const P = m.portal, r = calcStudent(m, s);
  const ras = m.ras.map((ra, i) => {
    const v = P.ras[ra.id];
    if (!portalSees(v, s)) return { n: i + 1, name: portalRaTitle(ra), hid: 1 };
    const x = r.ras[i], o = { n: i + 1, name: portalRaTitle(ra), w: +ra.w || 0, pts: r2(x.pts), pct: Math.round(x.pct * 100), st: x.status, stl: RA_STATUS[x.status].label };
    if (v.v === 'detail') {
      o.acts = [];
      ra.cats.forEach(c => { for (let k = 0; k < c.count; k++) {
        const key = `${m.id}|${ra.id}|${c.id}|${k}`; if (P.hide[key]) continue;
        const a = actOf(c, k), g = getGrade(s, ra.id, c.id, k);
        o.acts.push({ l: `${c.count > 1 ? c.label + ' ' + (k + 1) : c.label}${a.n ? ' · ' + a.n : ''}`, g: g === '' ? null : g, max: c.max });
      } });
    }
    return o;
  });
  const st = statusOf(r);
  const tot = portalSees(P.tot, s) ? { total: r2(r.total), acc: r2(r.acc), fin: r.finalSet ? r2(r.fin) : null, cond: st.label, cls: st.cls } : null;
  const pend = (m.aula || []).filter(ex => ex.pub && aulaIsOpen(ex) && aulaAssigned(m, ex).some(x => x.id === s.id)).map(ex => ({
    t: ex.title, k: ex.kind, file: aulaIsFile(ex) ? 1 : 0, until: ex.until || '', due: ex.due || '', url: aulaLink(ex), code: ex.withCode ? 0 : 1, dur: ex.dur || 0,
    done: Object.keys(ex.resp).some(k => { const x = aulaStudent(m, ex, k); return x && x.id === s.id; }) ? 1 : 0
  }));
  return { num: s.num, name: s.name, ras, tot, pend };
}

/* ---------- Sincronizar con la nube ---------- */
let _portalT = null, _portalBusy = false;
const _portalPersist = persist;
// Cada vez que se guarda algo (notas, Aula, ajustes), el portal se actualiza solo unos segundos después
persist = function () { _portalPersist(); if (db.modules.some(m => m.portal && m.portal.on)) portalSoon(); };
function portalSoon(ms = 12000) { clearTimeout(_portalT); _portalT = setTimeout(() => portalSyncAll().catch(() => { }), ms); }
async function portalSyncAll() {
  if (_portalBusy || !aulaCloudOK() || !navigator.onLine) return 0;
  _portalBusy = true; let n = 0;
  try { for (const m of db.modules) if (m.portal && m.portal.on && m.portal.pid) n += await portalSync(m).catch(e => { console.warn('Portal', e); return 0; }); }
  finally { _portalBusy = false; }
  return n;
}
async function portalPushMeta(m, force) {
  const data = portalMeta(m), h = aulaHash(JSON.stringify(data), 32);
  if (!force && h === m.portal.metaH) return 0;
  await withTimeout(Cloud.fs.collection('portal').doc(m.portal.pid).set({ ...data, upd: firebase.firestore.FieldValue.serverTimestamp() }), 15000);
  m.portal.metaH = h; return 1;
}
async function portalSync(m, force) {
  const P = m.portal; let n = await portalPushMeta(m, force);
  const ref = Cloud.fs.collection('portal').doc(P.pid).collection('s');
  for (const s of m.students) {
    const a = P.accts[s.id]; if (!a || !a.uid) continue;
    const data = portalPayload(m, s), h = aulaHash(JSON.stringify(data), 32);
    if (!force && P.pushed[s.id] === h) continue;
    await withTimeout(ref.doc(a.uid).set({ ...data, upd: firebase.firestore.FieldValue.serverTimestamp() }), 15000);
    P.pushed[s.id] = h; n++;
  }
  if (n) { P.lastSync = new Date().toISOString(); _portalPersist(); if (state.tab === 'portal') aulaRenderSoon(); }
  return n;
}

/* ---------- Cuentas ---------- */
async function portalCreateAccounts(m, users, onProg) {
  const P = m.portal, A = await portalAdminAuth(), out = { ok: 0, bad: [] };
  let i = 0;
  for (const [sid, u] of users) {
    const s = findStu(m, sid); if (!s) continue;
    let uidv = '', pw = '';
    const other = portalFindAcct(u, m);
    if (other) {
      if (!other.s || !aulaNameOk(s, { name: other.s.name })) { out.bad.push(`${s.num}. ${s.name}: el usuario «${u}» ya es de ${other.s ? other.s.name : 'otro estudiante'} en ${modShort(other.m)}. Cambia el usuario.`); continue; }
      uidv = other.a.uid; pw = other.a.pw; // mismo estudiante en otro módulo: misma cuenta
    } else {
      pw = portalPw();
      try { const c = await A.createUserWithEmailAndPassword(portalEmail(u), pw); uidv = c.user.uid; await A.signOut(); }
      catch (e) { const t = portalAuthErr(e); out.bad.push(`${s.num}. ${s.name}: ${t}${t === 'ese usuario ya existe' ? '. Cambia el usuario.' : ''}`); if (/too-many|operation-not-allowed|admin-restricted|network/.test(String(e && e.code))) { out.stop = 1; break; } continue; }
      await new Promise(r => setTimeout(r, 350)); // con calma: Google frena si se crean muchas de golpe
    }
    await withTimeout(Cloud.fs.collection('pstu').doc(uidv).set({ owner: Cloud.user.uid, p: { [P.pid]: { mod: modShort(m), course: m.course || '', num: s.num, name: s.name } } }, { merge: true }), 15000);
    P.accts[sid] = { u, uid: uidv, pw, at: new Date().toISOString() }; delete P.pushed[sid];
    out.ok++; _portalPersist(); if (onProg) onProg(++i, users.length);
  }
  return out;
}
async function portalChangePw(m, sid) {
  const a = m.portal.accts[sid]; if (!a) return;
  const A = await portalAdminAuth(), np = portalPw();
  const c = await A.signInWithEmailAndPassword(portalEmail(a.u), a.pw);
  await c.user.updatePassword(np); await A.signOut();
  db.modules.forEach(mm => mm.portal && Object.values(mm.portal.accts).forEach(x => { if (x.uid === a.uid) x.pw = np; }));
  _portalPersist(); return np;
}
async function portalRemoveAcct(m, sid) {
  const P = m.portal, a = P.accts[sid]; if (!a) return;
  const FV = firebase.firestore.FieldValue, shared = portalUidShared(a.uid, m);
  await Cloud.fs.collection('portal').doc(P.pid).collection('s').doc(a.uid).delete().catch(() => { });
  if (shared) await Cloud.fs.collection('pstu').doc(a.uid).update({ [`p.${P.pid}`]: FV.delete() });
  else {
    await Cloud.fs.collection('pstu').doc(a.uid).delete().catch(() => { });
    try { const A = await portalAdminAuth(); const c = await A.signInWithEmailAndPassword(portalEmail(a.u), a.pw); await c.user.delete(); await A.signOut(); } catch (e) { console.warn('Portal: cuenta', e); }
  }
  delete P.accts[sid]; delete P.pushed[sid]; _portalPersist();
}

/**
 * Imprime los reportes. La página se configura sin margen (@page margin: 0) para que el navegador
 * NO agregue su encabezado ni su pie (ruta del archivo, fecha, título). El margen real de 10 mm
 * lo pone un marco cuya cabecera y pie vacíos se repiten en cada hoja.
 */
function printHTML(html, orientation = 'landscape') {
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  tmp.querySelectorAll('section.rp-page').forEach(sec => {
    const inner = sec.innerHTML;
    sec.innerHTML = `<table class="rp-frame"><thead><tr><td><div class="rp-sp"></div></td></tr></thead><tbody><tr><td class="rp-body">${inner}</td></tr></tbody><tfoot><tr><td><div class="rp-sp"></div></td></tr></tfoot></table>`;
  });
  $('#printArea').innerHTML = tmp.innerHTML;
  $('#pageStyle').textContent = `@page { size: ${orientation}; margin: 0; }`;
  document.title = 'Praxis Pro - Reporte';
  setTimeout(() => window.print(), 60);
}
window.addEventListener('afterprint', () => { $('#printArea').innerHTML = ''; document.title = AppConfig.appName; });

function printRA(m, raId) {
  const ra = findRa(m, raId); if (!ra) return toast('Elige un RA.', 'error');

    <table class="rp-table"><thead><tr><th rowspan="2">No.</th><th rowspan="2" class="l">Estudiante</th>${h1}<th rowspan="2">Puntos</th><th rowspan="2">Logro</th><th rowspan="2">Aporte</th><th rowspan="2">Estado</th></tr><tr>${h2}</tr></thead><tbody>${rows}</tbody></table>

function printRiesgo(m) {
  const pass = db.settings.pass;
  const list = allStudents(m).map(s => ({ s, c: calcStudent(m, s) }))
    .filter(x => x.c.total < pass || x.c.ras.some(r => r.status === 'no')).sort((a, b) => a.c.total - b.c.total);
  if (!list.length) return toast(`No hay estudiantes por debajo de ${pass} ni con RA no logrados. ¡Excelente!`, 'ok');
  const rows = list.map(({ s, c }) => {
    const notOk = c.ras.map((x, i) => ({ x, i })).filter(o => o.x.status === 'no');
    const weak = notOk.length
      ? notOk.map(o => `<b>RA${o.i + 1}</b>: ${esc(raReasons(o.x).join('; '))}`).join('<br>')
      : m.ras.map((ra, i) => ({ i, pct: c.ras[i].pct })).sort((a, b) => a.pct - b.pct).slice(0, 3).map(w => `RA${w.i + 1} (${Math.round(w.pct * 100)}%)`).join(', ');
    const need = Math.max(0, pass - c.total);
    return `<tr><td>${s.num}</td><td class="l">${esc(s.name)}</td><td class="tot ${c.total < pass ? 'low' : ''}">${fmtTotal(c.total)}</td><td>${statusOf(c).label}</td><td>${fmt(need)}</td><td class="l">${weak}</td></tr>`;
  }).join('');
  printHTML(`<section class="rp-page">${reportHead(m, `Estudiantes en riesgo: nota menor que ${pass} o RA no logrados`)}
    <table class="rp-table"><thead><tr><th>No.</th><th class="l">Estudiante</th><th>Nota</th><th>Condición</th><th>Le faltan</th><th class="l">RA no logrados (o con menor logro)</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="rp-box"><b>Plan de recuperación:</b></div>${signLine()}</section>`, 'portrait');
}

/* ---------- CSV para Excel ---------- */
function csvCell(v) {
  const s = String(v ?? '');
  return /[",\n;]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}
function exportCSV(m, detail) {
  if (!m.students.length) return toast('No hay estudiantes para exportar.', 'error');
  const head = ['No.', 'Estudiante'];
  m.ras.forEach((ra, i) => {
    if (detail) ra.cats.forEach(c => { for (let k = 0; k < c.count; k++) head.push(`RA${i + 1} ${actFull(c, k)} (/${fmtN(c.max)})`); });
    head.push(`RA${i + 1} aporte (${fmtN(ra.w)}%)`, `RA${i + 1} estado`);
  });
  head.push('RA logrados', `Puntos de los RA (de ${fmtN(100 - m.finalWeight)})`, `${m.finalLabel} (${fmtN(m.finalWeight)}%)`, 'Total', 'Condición');
  if (detail) head.push('Observaciones');
  const lines = [head];
  allStudents(m).forEach(s => {
    const c = calcStudent(m, s), row = [s.num, s.name];
    m.ras.forEach((ra, i) => {
      if (detail) ra.cats.forEach(cat => { for (let k = 0; k < cat.count; k++) row.push(fmtN(getGrade(s, ra.id, cat.id, k))); });
      row.push(fmt(c.ras[i].pts, 2), RA_STATUS[c.ras[i].status].label);
    });
    row.push(`${c.raOk} de ${m.ras.length}`, fmt(c.acc, 2), c.finalSet ? fmt(c.fin, 2) : '', fmtTotal(c.total), statusOf(c).label);
    if (detail) row.push(s.obs || '');
    lines.push(row);
  });
  const csv = '﻿' + lines.map(r => r.map(csvCell).join(',')).join('\r\n');
  downloadFile(`${safeName(m.name)}${m.course ? '_' + safeName(m.course) : ''}_${detail ? 'detalle' : 'resumen'}_${fileDate()}.csv`, csv, 'text/csv;charset=utf-8');
  toast('Archivo descargado. Ábrelo con Excel.', 'ok');
}

  notifStart();
  try { if (sessionStorage.getItem('praxisUpdated')) { sessionStorage.removeItem('praxisUpdated'); setTimeout(() => toast(`✨ Praxis Pro se actualizó a la versión ${AppConfig.version}.`, 'ok', 4000), 900); } } catch (e) { }
  try { const g = decodeURIComponent((location.hash.match(/go=([^&]+)/) || [])[1] || ''); if (g) { history.replaceState(null, '', location.pathname); notifGo(g); } } catch (e) { }
  if (st === 'migrated') toast(`Tus datos de la versión anterior se pasaron al nuevo formato (${summarize(db)}).`, 'ok', 5000);
  else if (st === 'corrupt') toast('Los datos guardados estaban dañados. Se apartó una copia; restaura tu último respaldo.', 'error', 8000);
  else if (st === 'blocked') toast('El navegador no permite guardar datos (modo privado o bloqueo). Las notas no se conservarán.', 'error', 8000);
}
window.addEventListener('beforeunload', () => { if (dirty) saveNow(); });
/* Cualquier error inesperado se informa sin perder el trabajo. */
let lastErr = 0;
window.addEventListener('error', e => {
  console.error(e.error || e.message);
  if (Date.now() - lastErr > 4000) { lastErr = Date.now(); toast('Ocurrió un error inesperado. Tus datos están guardados; si se repite, descarga un respaldo y avísame qué estabas haciendo.', 'error', 6000); }
  try { if (dirty) saveNow(); } catch (_) { }
});
window.addEventListener('unhandledrejection', e => { console.error(e.reason); });
/* Al minimizar, cambiar de app o cerrar: se guarda en el equipo y se sube a la nube sin esperar. */
function flushAll() {
  try { if (dirty) saveNow(); } catch (_) { }
  try { if (typeof Cloud === 'object' && Cloud.on && Cloud.user && Cloud.timer) { clearTimeout(Cloud.timer); Cloud.timer = null; cloudPush(false); } } catch (_) { }
}
document.addEventListener('visibilitychange', () => { if (document.hidden) flushAll(); });
window.addEventListener('pagehide', flushAll);
boot();

</script>

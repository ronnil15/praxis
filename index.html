/* ---------- Cálculo (una sola fuente para todas las pantallas y reportes) ---------- */
/* Estados de un RA:
   ok   = Logrado     → alcanza el logro mínimo y cumple las actividades mínimas de cada criterio
   proc = En proceso  → aún no cumple, pero quedan actividades por calificar (solo en modo progreso)
   no   = No logrado  → no cumple y ya no quedan actividades pendientes (o el modo es definitivo)
   pend = Sin evaluar → todavía no tiene ninguna nota (solo en modo progreso)
   rec  = Recuperado  → no lo logró, pero aprobó la actividad de recuperación (cuenta como logrado)   */
const RA_STATUS = {
  ok: { cls: 'ok', label: 'Logrado', icon: '✓' },
  rec: { cls: 'ok', label: 'Recuperado', icon: '↺' },
  proc: { cls: 'risk', label: 'En proceso', icon: '…' },
  no: { cls: 'bad', label: 'No logrado', icon: '✗' },
  pend: { cls: 'neutral', label: 'Sin evaluar', icon: '—' }
};
/** Logro mínimo (%) que se exige en un RA: el propio del RA o, si no tiene, el del módulo. */
const raMin = (m, ra) => isNum(ra.minPct) ? ra.minPct : m.raPass;
/** Una actividad cuenta como «realizada» si tiene una nota mayor que 0. */
function calcRA(m, s, ra) {
  let obt = 0, max = 0, filled = 0, total = 0;
  const g = s.g[ra.id] || {};
  const missing = [];
  ra.cats.forEach(c => {
    const a = g[c.id] || [];
    let done = 0;
    for (let i = 0; i < c.count; i++) {
      total++;
      if (isNum(a[i])) { obt += a[i]; max += c.max; filled++; if (a[i] > 0) done++; }
      else if (m.blankMode === 'zero') max += c.max;
    }
    if (c.minDone > 0 && done < c.minDone) missing.push({ cat: c, done, need: c.minDone });
  });
  const pct = max > 0 ? obt / max : 0;
  const min = raMin(m, ra);
  const pctOk = pct * 100 >= min - 1e-9;
  let status;
  if (filled === 0) status = m.blankMode === 'zero' ? 'no' : 'pend';
  else if (pctOk && !missing.length) status = 'ok';
  else if (m.blankMode === 'ignore' && filled < total) status = 'proc';
  else status = 'no';
  const x = { obt, max, pct, pts: pct * (ra.w || 0), filled, total, status, pctOk, min, missing, origPct: pct, rec: null };
  // Recuperación: si el RA no estaba logrado y el estudiante hizo la recuperación
  const rec = s.rec && s.rec[ra.id];
  if (rec && isNum(rec.score) && status !== 'ok') {
    const cap = m.recCap === 'none' ? 100 : min;
    const recPct = Math.min(rec.score, cap) / 100;
    x.rec = rec;
    if (recPct > x.pct) { x.pct = recPct; x.pts = recPct * (ra.w || 0); }
    x.status = rec.score >= min - 1e-9 ? 'rec' : 'no';
  }
  return x;
}
const raAchieved = x => x.status === 'ok' || x.status === 'rec';

/** Explica por qué un RA no está logrado (para pantallas y boletines). */
function raReasons(x) {
  const out = [];
  if (x.status === 'pend') return ['Sin notas todavía'];
  if (x.status === 'rec') return [`Recuperado con ${fmtN(x.rec.score)} (logro original ${Math.round(x.origPct * 100)}%)`];
  if (x.rec) out.push(`Recuperación: ${fmtN(x.rec.score)} (mínimo ${fmtN(x.min)})`);
  if (!x.pctOk) out.push(`Logro ${Math.round(x.origPct * 100)}% (mínimo ${fmtN(x.min)}%)`);
  x.missing.forEach(f => out.push(`${f.cat.label}: ${f.done} de ${f.need} realizadas`));
  return out;
}
function calcCat(s, ra, c) {
  const a = (s.g[ra.id] && s.g[ra.id][c.id]) || [];
  let obt = 0, filled = 0;
  for (let i = 0; i < c.count; i++) if (isNum(a[i])) { obt += a[i]; filled++; }
  return { obt, filled, max: c.count * c.max };
}
function calcStudent(m, s) {
  let acc = 0, filled = 0, slots = 0;
  const ras = m.ras.map(ra => { const x = calcRA(m, s, ra); acc += x.pts; filled += x.filled; slots += x.total; return x; });
  const finalSet = isNum(s.final);
  const fin = finalSet ? s.final : 0;
  const raOk = ras.filter(raAchieved).length;
  const raBlock = !!m.requireAllRA && m.ras.length > 0 && raOk < m.ras.length;
  return { ras, acc, fin, finalSet, total: acc + fin, filled: filled + (finalSet ? 1 : 0), slots: slots + 1, raOk, raBlock };
}
/** Condición final. Acepta el resultado de calcStudent (aplica la regla «todos los RA logrados») o solo un número. */
function statusOf(r) {
  const st = db.settings;
  const total = typeof r === 'number' ? r : r.total;
  if (total >= st.pass) {
    if (typeof r === 'object' && r.raBlock) return { cls: 'risk', label: 'RA pendientes' };
    return { cls: 'ok', label: 'Aprobado' };
  }
  if (total >= st.risk) return { cls: 'risk', label: 'En riesgo' };
  return { cls: 'bad', label: 'Reprobado' };
}
const fmtTotal = t => db.settings.roundTotal ? String(Math.round(t)) : fmt(t);

function moduleStats(m) {
  const res = m.students.map(s => calcStudent(m, s));
  const n = res.length;
  let ap = 0, rk = 0, rp = 0, filled = 0, slots = 0, sum = 0;
  res.forEach(r => {
    sum += r.total;
    const st = statusOf(r).cls;
    if (st === 'ok') ap++; else if (st === 'risk') rk++; else rp++;
    filled += r.filled; slots += r.slots;
  });
  const raAvg = m.ras.map((ra, i) => n ? res.reduce((a, r) => a + r.ras[i].pct, 0) / n : 0);
  const raOkCount = m.ras.map((ra, i) => res.filter(r => raAchieved(r.ras[i])).length);
  return { res, n, avg: n ? sum / n : 0, ap, rk, rp, progress: slots ? filled / slots : 0, raAvg, raOkCount };
}
function weightIssue(m) {
  const sum = m.ras.reduce((a, r) => a + (+r.w || 0), 0);
  const exp = 100 - m.finalWeight;
  return Math.abs(sum - exp) > 0.05 ? { sum: r2(sum), exp: r2(exp) } : null;
}
/** Estado de la suma de valores de los RA frente a lo que deben sumar (100 − cierre). */
function weightStatus(m) {
  const sum = r2(m.ras.reduce((a, r) => a + (+r.w || 0), 0));
  const exp = r2(100 - m.finalWeight);
  const diff = r2(sum - exp);
  return { sum, exp, diff, ok: Math.abs(diff) <= 0.05 };
}
/** Ajusta todos los valores en la misma proporción para que sumen exacto, respetando la importancia relativa que dio el docente. */
function scaleWeights(m) {
  const { sum, exp } = weightStatus(m);
  if (!m.ras.length) return;
  if (sum <= 0) return distributeWeights(m);
  m.ras.forEach(r => { r.w = Math.round((+r.w || 0) * exp / sum * 100) / 100; });
  const s2 = m.ras.reduce((a, r) => a + r.w, 0);
  const big = m.ras.reduce((a, r) => (r.w > a.w ? r : a), m.ras[0]);
  big.w = r2(big.w + (exp - s2));
}
/** Si el RA conserva el nombre automático «RA n», lo renumera según su posición. */
function renumberDefaultNames(m) { m.ras.forEach((r, i) => { if (/^RA \d+$/.test(String(r.name).trim())) r.name = `RA ${i + 1}`; }); }
/** Reparte (100 − cierre) entre los RA; el último absorbe el redondeo para que sume exacto. */
function distributeWeights(m) {
  const n = m.ras.length; if (!n) return;
  const total = 100 - m.finalWeight;
  const base = Math.floor((total / n) * 100) / 100;
  m.ras.forEach((r, i) => { r.w = i === n - 1 ? r2(total - base * (n - 1)) : base; });
}

/* =========================================================
   Datos y cálculos de: estudiantes únicos, año escolar,
   asistencia, cuaderno anecdótico y agenda
   ========================================================= */

/* ---------- Fechas ---------- */
const MONTHS = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
const MONTHS_S = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
const WDAYS = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
const WDAYS_S = ['Do', 'Lu', 'Ma', 'Mi', 'Ju', 'Vi', 'Sá'];
const pad2 = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const todayISO = () => ymd(new Date());
const nowHM = () => { const d = new Date(); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
const ymOf = iso => String(iso).slice(0, 7);
const daysInMonth = ym => new Date(+ym.slice(0, 4), +ym.slice(5, 7), 0).getDate();
const dateOf = (ym, d) => new Date(+ym.slice(0, 4), +ym.slice(5, 7) - 1, d);
const ymLabel = ym => `${MONTHS[+ym.slice(5, 7) - 1]} ${ym.slice(0, 4)}`;
const ymShort = ym => MONTHS_S[+ym.slice(5, 7) - 1];
function addDays(iso, n) { const d = new Date(+iso.slice(0, 4), +iso.slice(5, 7) - 1, +iso.slice(8, 10)); d.setDate(d.getDate() + n); return ymd(d); }
function longDate(iso) {
  if (!isoDate(iso)) return '';
  const d = new Date(+iso.slice(0, 4), +iso.slice(5, 7) - 1, +iso.slice(8, 10));
  return `${WDAYS[d.getDay()].toLowerCase()} ${d.getDate()} de ${MONTHS[d.getMonth()].toLowerCase()}`;
}
const cap = s => String(s).charAt(0).toUpperCase() + String(s).slice(1);
function fmtTime12(h) {
  if (!isoTime(h)) return '';
  let [H, M] = h.split(':').map(Number); const ap = H >= 12 ? 'p. m.' : 'a. m.'; H = H % 12 || 12;
  return `${H}:${pad2(M)} ${ap}`;
}

/** Año escolar: agosto → junio. Se toma de Ajustes («2026-2027») o de la fecha actual. */
function schoolStartYear() {
  const m = String(db.settings.year || '').match(/(\d{4})/);
  if (m) return +m[1];
  const d = new Date(); return d.getMonth() >= 7 ? d.getFullYear() : d.getFullYear() - 1;
}
function schoolMonths() {
  const y = schoolStartYear(), out = [];
  for (let i = 0; i < 11; i++) { const mo = (7 + i) % 12, yr = y + (7 + i >= 12 ? 1 : 0); out.push(`${yr}-${pad2(mo + 1)}`); }
  return out;
}
function defaultMonth() { const cur = ymOf(todayISO()), ms = schoolMonths(); return ms.includes(cur) ? cur : ms[0]; }

/* ---------- Estudiantes únicos ----------
   Los módulos del mismo curso comparten el mismo grupo de estudiantes:
   se cuentan una sola vez (por curso + nombre). */
const groupKey = m => m.course ? 'c:' + norm(m.course) : 'm:' + m.id;
/**
 * Clave de una persona a partir de su nombre: no distingue mayúsculas, tildes, puntos, comas,
 * espacios de más ni el orden de las palabras.
 * «Ana María Pérez», «ANA MARIA PEREZ» y «Pérez, Ana María» son la misma persona.
 */
function personKey(name) {
  return norm(name).replace(/[.,;:'"()\-_/]+/g, ' ').split(' ').filter(Boolean).sort().join(' ');
}
/** Distancia de edición (para detectar el mismo nombre escrito un poco distinto). */
function editDist(a, b) {
  if (a === b) return 0; if (Math.abs(a.length - b.length) > 3) return 9;
  let prev = Array.from({ length: b.length + 1 }, (_, j) => j);
  for (let i = 1; i <= a.length; i++) { const cur = [i]; for (let j = 1; j <= b.length; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = cur; }
  return prev[b.length];
}
/** ¿Dos nombres del mismo curso son la misma persona? (mismo nombre, uno incluye al otro, o difiere en 1–2 letras) */
function samePerson(k1, k2) {
  if (k1 === k2) return true;
  const a = k1.split(' '), b = k2.split(' ');
  const [sm, lg] = a.length <= b.length ? [a, b] : [b, a];
  if (sm.length >= 2 && sm.every(w => lg.includes(w))) return true;
  return k1.length >= 8 && editDist(k1, k2) <= Math.min(2, Math.floor(Math.min(k1.length, k2.length) / 8));
}
/** Personas distintas por curso: [{ g, name, items: [{ m, s }] }] */
let _upCache = { sig: '', val: [] };
function uniquePeople() {
  const sig = db.modules.map(m => m.id + ':' + m.course + ':' + m.students.map(s => s.name).join(',')).join('|');
  if (_upCache.sig === sig) return _upCache.val;
  const people = [];
  db.modules.forEach(m => m.students.forEach(s => {
    const g = groupKey(m), k = personKey(s.name);
    let p = people.find(x => x.g === g && x.keys.some(y => y === k));
    if (!p) p = people.find(x => x.g === g && !x.mods.has(m.id) && x.keys.some(y => samePerson(y, k)));
    if (!p) { p = { g, course: m.course || modShort(m), name: s.name, keys: [], mods: new Set(), items: [] }; people.push(p); }
    if (!p.keys.includes(k)) p.keys.push(k);
    p.mods.add(m.id); p.items.push({ m, s });
  }));
  _upCache = { sig, val: people }; return people;
}
function uniqueStudentCount() { return uniquePeople().length; }
function groupCount() { return new Set(db.modules.filter(m => m.students.length).map(groupKey)).size; }
function enrollmentCount() { return db.modules.reduce((a, m) => a + m.students.length, 0); }

/* ---------- Asistencia ----------
   m.classDays = { 'AAAA-MM': [días de clase] }
   s.att       = { 'AAAA-MM': '31 caracteres' }  (P presente · A ausente · T tardanza · E excusa · . sin marcar) */
const ATT_CODES = ['P', 'A', 'T', 'E'];
const ATT_INFO = {
  P: { label: 'Presente', cls: 'ok' },
  A: { label: 'Ausente', cls: 'bad' },
  T: { label: 'Tardanza', cls: 'risk' },
  E: { label: 'Excusa', cls: 'info' }
};
function normClassDays(cd) {
  const out = {};
  if (!cd || typeof cd !== 'object') return out;
  Object.keys(cd).forEach(ym => {
    if (!/^\d{4}-\d{2}$/.test(ym) || !Array.isArray(cd[ym])) return;
    const max = daysInMonth(ym);
    const days = [...new Set(cd[ym].map(Number).filter(d => d >= 1 && d <= max))].sort((a, b) => a - b);
    if (days.length) out[ym] = days;
  });
  return out;
}
function normAtt(att) {
  const out = {};
  if (!att || typeof att !== 'object') return out;
  Object.keys(att).forEach(ym => {
    if (!/^\d{4}-\d{2}$/.test(ym)) return;
    const s = String(att[ym] || '').toUpperCase().replace(/[^PATE.]/g, '.').padEnd(31, '.').slice(0, 31);
    if (/[PATE]/.test(s)) out[ym] = s;
  });
  return out;
}
const classDays = (m, ym) => (m.classDays && m.classDays[ym]) || [];
function getAtt(s, ym, d) { const c = ((s.att && s.att[ym]) || '')[d - 1]; return c && c !== '.' ? c : ''; }
function setAtt(s, ym, d, code) {
  if (!s.att || typeof s.att !== 'object') s.att = {};
  const cur = (s.att[ym] || '').padEnd(31, '.');
  const next = cur.slice(0, d - 1) + (ATT_CODES.includes(code) ? code : '.') + cur.slice(d);
  if (/[PATE]/.test(next)) s.att[ym] = next; else delete s.att[ym];
}
function addClassDay(m, iso) {
  if (!m.classDays || typeof m.classDays !== 'object') m.classDays = {};
  const ym = ymOf(iso), d = +iso.slice(8, 10);
  const list = m.classDays[ym] || [];
  if (list.includes(d)) return false;
  m.classDays[ym] = [...list, d].sort((a, b) => a - b);
  return true;
}
function removeClassDay(m, ym, d) {
  if (!m.classDays) m.classDays = {};
  m.classDays[ym] = classDays(m, ym).filter(x => x !== d);
  if (!m.classDays[ym].length) delete m.classDays[ym];
  m.students.forEach(s => setAtt(s, ym, d, ''));
}
/** Totales de un estudiante en uno o varios meses (solo días de clase). */
function attStats(m, s, yms) {
  const r = { P: 0, A: 0, T: 0, E: 0, days: 0, marked: 0 };
  yms.forEach(ym => classDays(m, ym).forEach(d => {
    r.days++;
    const c = getAtt(s, ym, d);
    if (c) { r[c]++; r.marked++; }
  }));
  r.attended = r.P + r.T;
  r.missed = r.A + r.E;
  r.pct = r.marked ? r.attended / r.marked : null;
  return r;
}
function attCourseStats(m, yms) {
  const t = { P: 0, A: 0, T: 0, E: 0, days: 0, marked: 0 };
  yms.forEach(ym => { t.days += classDays(m, ym).length; });
  m.students.forEach(s => { const r = attStats(m, s, yms); ATT_CODES.forEach(k => t[k] += r[k]); t.marked += r.marked; });
  t.pct = t.marked ? (t.P + t.T) / t.marked : null;
  return t;
}

/* ---------- Cuaderno anecdótico ---------- */
const ANEC_KINDS = {
  neg: { label: 'Conducta a mejorar', short: 'A mejorar', cls: 'bad', icon: '⚠' },
  pos: { label: 'Conducta positiva', short: 'Positiva', cls: 'ok', icon: '★' },

const ANEC_CATS = {
  neg: ['Indisciplina en clase', 'No trabaja en clase', 'Uso del celular', 'Falta de respeto', 'Agresión verbal', 'Agresión física', 'Llegada tarde', 'Salida sin permiso', 'No trae materiales', 'Incumplimiento de tareas', 'Copia o deshonestidad', 'Daño a equipos o materiales', 'Otra'],
  pos: ['Participación destacada', 'Ayuda a sus compañeros', 'Liderazgo', 'Responsabilidad', 'Creatividad', 'Mejora notable', 'Buen comportamiento', 'Otra'],

const ANEC_ACTIONS = ['Ninguna', 'Llamada de atención verbal', 'Diálogo con el estudiante', 'Cambio de lugar', 'Comunicación a padres o tutores', 'Citación a padres o tutores', 'Referido a orientación', 'Referido a coordinación o dirección', 'Reconocimiento', 'Otra'];
function normAnec(e) {

  return {
    id: String(e.id || uid()), sid: String(e.sid), date: isoDate(e.date) || todayISO(), time: isoTime(e.time),
    kind, cat: String(e.cat || ANEC_CATS[kind][0]), sev: kind === 'neg' && ANEC_SEV[e.sev] ? e.sev : '',
    desc: String(e.desc || ''), action: String(e.action || ''), follow: String(e.follow || ''), parents: !!e.parents
  };
}
const anecSort = (a, b) => (b.date + (b.time || '')).localeCompare(a.date + (a.time || ''));
function anecByStudent(m) {
  const map = new Map();
  m.students.forEach(s => map.set(s.id, { s, neg: 0, pos: 0, obs: 0, grave: 0, moderada: 0, leve: 0, last: '', cats: {} }));
  m.anec.forEach(e => {

    r[e.kind]++;

    if (e.date > r.last) r.last = e.date;

}
/** Puntaje para ordenar a quienes requieren más atención: grave 3, moderada 2, leve/sin gravedad 1. */
const anecScore = r => r.grave * 3 + r.moderada * 2 + (r.neg - r.grave - r.moderada);

/* ---------- Recuperación de RA ----------
   s.rec = { [raId]: { score: 0–100, date, act, note } } */
function normRec(rec) {
  const out = {};
  if (!rec || typeof rec !== 'object') return out;
  Object.keys(rec).forEach(k => {
    const r = rec[k]; if (!r || typeof r !== 'object') return;
    const score = parseFloat(r.score);
    out[String(k)] = { score: isFinite(score) ? Math.min(100, Math.max(0, r2(score))) : '', date: isoDate(r.date), act: String(r.act || '').slice(0, 200), note: String(r.note || '').slice(0, 300) };
    if (r.ex) out[String(k)].ex = true;   // excluido de la lista de recuperación
  });
  return out;
}
function setRec(s, raId, data) {
  if (!s.rec || typeof s.rec !== 'object') s.rec = {};
  const cur = s.rec[raId] || { score: '', date: '', act: '', note: '' };
  const next = Object.assign({}, cur, data);
  if (!next.ex) delete next.ex;
  if (!isNum(next.score) && !next.act && !next.note && !next.date && !next.ex) delete s.rec[raId];
  else s.rec[raId] = next;
}

/* ---------- Grupos de trabajo ----------
   m.groups = [{ id, name, type, date, actKey, topic, notes, cal, groups: [{ name, members: [sid], tema, subs: [], date, time, evId }] }] */
function normGroupSet(g) {

      date: isoDate(x && x.date) || '', time: isoTime(x && x.time), evId: x && x.evId ? String(x.evId) : ''
    }))

/* ---------- Agenda / calendario ---------- */
const EV_TYPES = {
  'Tarea': 'blue', 'Práctica': 'orange', 'Exposición': 'violet', 'Examen': 'red',
  'Proyecto': 'teal', 'Participación': 'green', 'Reunión': 'pink', 'Otro': 'amber'
};
function normAgenda(e) {
  if (!e || typeof e !== 'object' || !isoDate(e.date)) return null;
  return {
    id: String(e.id || uid()), title: String(e.title || 'Evento').slice(0, 120), date: e.date, time: isoTime(e.time),
    type: EV_TYPES[e.type] ? e.type : 'Otro', modId: e.modId ? String(e.modId) : '', notes: String(e.notes || ''), done: !!e.done
  };
}
/** Tipo de evento a partir del nombre de un criterio (Práctica, Examen, …). */
function typeFromCat(label) {
  const n = norm(label);
  if (n.includes('pract')) return 'Práctica';
  if (n.includes('expo')) return 'Exposición';
  if (n.includes('exam') || n.includes('prueba')) return 'Examen';
  if (n.includes('proyect')) return 'Proyecto';
  if (n.includes('particip')) return 'Participación';
  if (n.includes('tarea') || n.includes('cuaderno')) return 'Tarea';
  return 'Otro';
}
/** Todas las actividades con fecha (del registro de notas) y los eventos de la agenda. */
function allEvents(filterMod) {
  const out = [];
  db.modules.forEach(m => {
    if (filterMod && m.id !== filterMod) return;
    m.ras.forEach((ra, ri) => ra.cats.forEach(c => {
      for (let i = 0; i < c.count; i++) {
        const a = actOf(c, i); if (!a.d) continue;
        let graded = 0;
        m.students.forEach(s => { if (isNum(getGrade(s, ra.id, c.id, i))) graded++; });
        out.push({
          src: 'act', key: `${m.id}|${ra.id}|${c.id}|${i}`, date: a.d, time: a.h || '', type: typeFromCat(c.label),
          title: `${c.count > 1 ? c.label + ' ' + (i + 1) : c.label}${a.n ? ': ' + a.n : ''}`, sub: `RA ${ri + 1}`,
          modId: m.id, mod: m, graded, total: m.students.length, done: m.students.length > 0 && graded >= m.students.length
        });
      }
    }));
  });
  db.agenda.forEach(e => {
    if (filterMod && e.modId !== filterMod) return;
    out.push({ src: 'ev', key: e.id, date: e.date, time: e.time, type: e.type, title: e.title, sub: '', modId: e.modId, mod: findMod(e.modId), done: e.done, notes: e.notes });
  });
  return out.sort((a, b) => (a.date + (a.time || '99')).localeCompare(b.date + (b.time || '99')));
}
/** Actividades ya pasadas que todavía tienen estudiantes sin nota. */
function pendingToGrade(filterMod) {
  const t = todayISO();
  return allEvents(filterMod).filter(e => e.src === 'act' && e.date <= t && !e.done && e.total > 0);
}
function agendaAlerts() {
  const t = todayISO(), tm = addDays(t, 1), evs = allEvents();
  const open = e => !(e.src === 'ev' && e.done);
  return {
    today: evs.filter(e => e.date === t && open(e)),
    tomorrow: evs.filter(e => e.date === tm && open(e)),
    week: evs.filter(e => e.date > tm && e.date <= addDays(t, 7) && open(e)),
    overdue: evs.filter(e => e.src === 'ev' && !e.done && e.date < t),
    pending: pendingToGrade()
  };
}

/* ---------- Copiar al portapapeles ---------- */
function copyText(text, msg) {
  const done = () => toast(msg || 'Copiado.', 'ok', 1800);
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (e) { toast('No se pudo copiar.', 'error'); }
    ta.remove();
  };
  try {
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, fallback);
    else fallback();
  } catch (e) { fallback(); }
}

/* ---------- Tema claro / oscuro ---------- */
const THEME_KEY = 'praxisTheme';
function getThemePref() { try { return localStorage.getItem(THEME_KEY) || 'light'; } catch (e) { return 'light'; } }
function isDark() { return document.documentElement.getAttribute('data-theme') === 'dark'; }
function applyTheme(pref) {
  const p = pref || getThemePref();
  const dark = p === 'dark' || (p === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  const b = document.querySelector('[data-act="theme"]');
  if (b) { b.innerHTML = dark ? ICON.sun : ICON.moon; b.title = dark ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'; }
}
function setThemePref(p) { try { localStorage.setItem(THEME_KEY, p); } catch (e) { } applyTheme(p); }
if (window.matchMedia) {
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (getThemePref() === 'auto') { applyTheme(); if (typeof render === 'function') render(); } }); } catch (e) { }
}

  const modsOf = g => db.modules.filter(m => groupKey(m) === g);
  const html = Object.entries(groups).map(([g, G]) => {
    const ms = modsOf(g), variants = G.people.filter(p => new Set(p.items.map(x => x.s.name.trim())).size > 1), partial = ms.length > 1 ? G.people.filter(p => p.mods.size < ms.length) : [];
    return `<section class="sc-group"><div class="sc-head"><b>${esc(G.course)}</b><span class="badge info">${G.people.length} estudiantes</span><span class="small muted">${ms.map(m => `${esc(modShort(m))} (${m.students.length})`).join(' · ')}</span></div>
      ${variants.length ? `<div class="sc-sub">✏️ Mismo estudiante escrito distinto (se cuenta una vez):</div>${variants.map(p => { const names = [...new Set(p.items.map(x => x.s.name.trim()))]; return `<div class="sc-row"><span>${names.map(n => `<code>${esc(n)}</code>`).join(' ≈ ')}</span><span class="row">${names.map(n => `<button class="btn btn-sm btn-ghost" data-sc-uni="${esc(p.g)}" data-sc-name="${esc(n)}" data-sc-i="${people.indexOf(p)}" title="Usar este nombre en todos sus módulos">Usar «${esc(n.split(' ')[0])}…»</button>`).join('')}</span></div>`; }).join('')}` : ''}
      ${partial.length ? `<div class="sc-sub">👤 Solo en algunos módulos del curso:</div>${partial.map(p => `<div class="sc-row"><span>${esc(p.name)}</span><span class="small muted">en ${[...p.mods].map(id => esc(modShort(findMod(id)))).join(', ')} · falta en ${ms.filter(m => !p.mods.has(m.id)).map(m => esc(modShort(m))).join(', ')}</span></div>`).join('')}` : ''}
      ${!variants.length && !partial.length ? '<p class="small muted">✓ Todo coincide entre los módulos de este curso.</p>' : ''}
    </section>`;
  }).join('');
  openModal({
    title: 'Estudiantes por curso', icon: '👥', wide: true,
    sub: `${people.length} estudiantes distintos · ${enrollmentCount()} inscripciones en ${db.modules.length} módulos. Los módulos del mismo curso comparten estudiantes y cada uno se cuenta una vez.`,
    body: html || '<p class="muted">Todavía no hay estudiantes.</p>',
    actions: [{ label: 'Listo', cls: 'btn-primary' }],
    onOpen: (ov, close) => ov.querySelectorAll('[data-sc-uni]').forEach(b => b.onclick = () => {
      const p = people[+b.dataset.scI], name = b.dataset.scName; if (!p) return;
      snapshot('Antes de unificar un nombre');
      p.items.forEach(x => { x.s.name = name; });
      persist(); render(); toast(`Nombre unificado: ${name}`, 'ok'); close(); setTimeout(studentCheckDialog, 250);
    })
  });
}

/* ---------- Avisos ---------- */
function toast(msg, type = 'info', ms = 2600) {
  const box = $('#toasts'); if (!box) return;
  const t = document.createElement('div');
  t.className = 'toast toast-' + type; t.textContent = msg;
  box.appendChild(t);
  while (box.children.length > 3) box.firstElementChild.remove();
  requestAnimationFrame(() => t.classList.add('show'));
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, ms);
}

/* ---------- Ventanas modales ---------- */
function openModal({ title, sub = '', icon = '•', body = '', actions = [], wide = false, onOpen }) {
  const ov = document.createElement('div');
  ov.className = 'modal-overlay';
  ov.innerHTML = `<div class="modal ${wide ? 'modal-wide' : ''}" role="dialog" aria-modal="true">
    <div class="modal-head"><div class="modal-icon">${icon}</div><div><h3>${esc(title)}</h3>${sub ? `<p>${esc(sub)}</p>` : ''}</div>
    <button class="modal-x" data-close aria-label="Cerrar">✕</button></div>
    <div class="modal-body">${body}</div><div class="modal-foot"></div></div>`;
  const foot = ov.querySelector('.modal-foot');
  const close = () => { ov.classList.remove('open'); document.removeEventListener('keydown', onKey, true); setTimeout(() => ov.remove(), 180); };
  actions.forEach(a => {
    const b = document.createElement('button');
    b.className = 'btn ' + (a.cls || 'btn-secondary');
    b.textContent = a.label;
    b.onclick = () => {
      if (a.onClick && a.onClick(ov, close) === false) return;
      close();
    };
    foot.appendChild(b);
  });
  if (!actions.length) foot.remove();
  ov.addEventListener('mousedown', e => { if (e.target === ov) { if (ov._onCancel) ov._onCancel(); close(); } });
  ov.querySelector('[data-close]').onclick = () => { if (ov._onCancel) ov._onCancel(); close(); };
  function onKey(e) {
    const top = $$('.modal-overlay').pop();
    if (top !== ov) return;
    if (e.key === 'Escape') { e.stopPropagation(); if (ov._onCancel) ov._onCancel(); close(); }
    else if (e.key === 'Enter' && e.target.tagName === 'INPUT' && ov.contains(e.target)) {
      const p = foot.querySelector('.btn-primary, .btn-danger');
      if (p) { e.preventDefault(); e.stopPropagation(); p.click(); }
    }
  }
  document.addEventListener('keydown', onKey, true);
  document.body.appendChild(ov);
  requestAnimationFrame(() => ov.classList.add('open'));
  if (onOpen) onOpen(ov, close);
  const first = ov.querySelector('input:not([type=checkbox]):not([type=file]), textarea, select');
  if (first) setTimeout(() => { first.focus(); if (first.select) first.select(); }, 60);
  return { el: ov, close };
}
function confirmBox(title, msg, okLabel, onOk, { danger = true, onCancel } = {}) {
  const md = openModal({
    title, icon: danger ? '⚠️' : '❔', body: `<p class="modal-msg">${esc(msg)}</p>`,
    actions: [
      { label: 'Cancelar', onClick: () => { if (onCancel) onCancel(); } },
      { label: okLabel, cls: danger ? 'btn-danger' : 'btn-primary', onClick: () => { onOk(); } }
    ]
  });
  md.el._onCancel = onCancel;
}
function promptBox(title, label, value, onOk, { icon = '✎', placeholder = '', inputmode = 'text' } = {}) {
  openModal({
    title, icon,
    body: `<label class="field">${esc(label)}<input type="text" id="pbInput" value="${esc(value)}" placeholder="${esc(placeholder)}" inputmode="${inputmode}" autocomplete="off"></label>`,
    actions: [{ label: 'Cancelar' }, { label: 'Aceptar', cls: 'btn-primary', onClick: ov => onOk(ov.querySelector('#pbInput').value.trim()) }]
  });
}

const curMod = () => findMod(state.modId);

function render() {
  const ae = document.activeElement;
  const key = ae && ae.dataset ? ae.dataset.key : null;
  let s0 = null, s1 = null;
  try { s0 = ae.selectionStart; s1 = ae.selectionEnd; } catch (e) { }
  const scroller = $('.grid-wrap'); const gScroll = scroller ? [scroller.scrollLeft, scroller.scrollTop] : null;

  const app = $('#app');
  try {
    ensureShape();
    if (state.view === 'module' && curMod()) app.innerHTML = renderModule(curMod());
    else if (state.view === 'calendar') app.innerHTML = renderCalendar();
    else if (state.view === 'semana') app.innerHTML = renderMiSemana();
    else if (state.view === 'horario') app.innerHTML = renderHorario();
    else { state.view = 'home'; state.modId = null; app.innerHTML = renderHome(); }
  } catch (err) {
    console.error(err);
    app.innerHTML = `<div class="empty"><div class="big">🛠️</div><p><strong>Esta pantalla no se pudo mostrar.</strong></p><p class="small">Tus datos están a salvo. Detalle técnico: ${esc(err && err.message || err)}</p><p style="margin-top:1rem"><button class="btn btn-primary" data-act="go-home">Volver al inicio</button></p></div>`;
  }
  $$('.nav-btn[data-view]').forEach(b => b.classList.toggle('active', b.dataset.view === state.view));

  const sc = $('.grid-wrap'); if (sc && gScroll) { sc.scrollLeft = gScroll[0]; sc.scrollTop = gScroll[1]; }
  try { afterRender(); } catch (e) { console.error(e); }
  try { if (typeof aulaAfterRender === 'function') aulaAfterRender(); } catch (e) { console.error(e); }
  if (key) {
    const el = document.querySelector(`[data-key="${CSS.escape(key)}"]`);
    if (el) { el.focus({ preventScroll: true }); try { if (s0 !== null) el.setSelectionRange(s0, s1); } catch (e) { } }
  }
}
let renderQueued = false;
function queueRender() { if (renderQueued) return; renderQueued = true; setTimeout(() => { renderQueued = false; render(); }, 0); }

/* ---------- Módulo ---------- */
const TABS = [['resumen', 'Resumen'], ['panel', 'Panel'], ['registro', 'Registro por RA'], ['estudiante', 'Por estudiante'], ['recuperacion', 'Recuperación'], ['asistencia', 'Asistencia'], ['anecdotario', 'Anecdotario'], ['aula', 'Aula'], ['portal', 'Portal'], ['herramientas', 'Herramientas'], ['planificacion', 'Planificación'], ['config', 'Configuración'], ['reportes', 'Reportes']];
function renderModule(m) {
  const body = { resumen: renderResumen, panel: renderPanel, registro: renderRegistro, estudiante: renderEstudiante, recuperacion: renderRecuperacion, asistencia: renderAsistencia, anecdotario: renderAnecdotario, aula: renderAula, portal: renderPortal, herramientas: renderHerramientas, planificacion: renderPlanificacion, config: renderConfig, reportes: renderReportes }[state.tab] || renderResumen;

function weightAlert(m) {
  const ws = weightStatus(m);
  if (ws.ok) return '';
  const how = ws.diff > 0 ? `sobra ${fmtN(ws.diff)}%` : `falta ${fmtN(-ws.diff)}%`;
  return `<div class="alert alert-bad"><div><strong>Los valores de los RA suman ${fmtN(ws.sum)}% y deben sumar ${fmtN(ws.exp)}% (${how}).</strong> Las notas finales no serán correctas hasta corregirlo.</div>
  <div class="row-wrap"><button class="btn btn-sm btn-secondary" data-act="tab" data-id="config">Corregir en Configuración</button><button class="btn btn-sm btn-danger" data-act="cfg-scale" title="Mantiene la importancia que le diste a cada RA">Ajustar proporcionalmente</button></div></div>`;
}
/** Recuadro de la suma de los RA en Configuración (se actualiza mientras escribes). */
function sumBox(m) {
  const ws = weightStatus(m);
  const exp = fmtN(ws.exp);
  let msg, cls;
  if (ws.ok) { cls = 'ok'; msg = `✓ Los RA suman ${fmtN(ws.sum)}% de ${exp}% · Cierre ${fmtN(m.finalWeight)}% · Total ${fmtN(r2(ws.sum + m.finalWeight))}%. Correcto.`; }
  else if (ws.diff > 0) { cls = 'bad'; msg = `⚠ Los RA suman ${fmtN(ws.sum)}%: sobra ${fmtN(ws.diff)}%. Baja ${fmtN(ws.diff)}% en uno o varios RA.`; }
  else { cls = 'bad'; msg = `⚠ Los RA suman ${fmtN(ws.sum)}%: falta ${fmtN(-ws.diff)}%. Súbele ${fmtN(-ws.diff)}% a uno o varios RA.`; }
  return `<div class="sum-box ${cls}" id="sumBox" style="margin-bottom:1rem">
    <div style="flex:1;min-width:240px"><div>${msg}</div><div class="small" style="font-weight:500;opacity:.85;margin-top:.2rem">Tú decides el valor de cada RA según su importancia; solo deben sumar ${exp}% entre todos (más el ${fmtN(m.finalWeight)}% del cierre = 100%).</div></div>
    ${ws.ok ? '' : `<button class="btn btn-sm btn-primary" data-act="cfg-scale" title="Sube o baja todos en la misma proporción, manteniendo la importancia que le diste a cada uno">Ajustar proporcionalmente a ${exp}%</button>`}
    <button class="btn btn-sm btn-secondary" data-act="cfg-distribute" title="Pone el mismo valor a todos los RA">Repartir ${exp}% en partes iguales</button>
  </div>`;
}
function blankModeNote(m) {
  return m.blankMode === 'zero'
    ? '<span class="badge neutral" title="Cambiar en Configuración">Casillas vacías cuentan como 0</span>'
    : '<span class="badge neutral" title="Cambiar en Configuración">Modo progreso: solo cuenta lo evaluado</span>';
}
/** Todos los estudiantes ordenados por número de lista (sin aplicar la búsqueda). */
function allStudents(m) { return m.students.slice().sort((a, b) => (a.num - b.num) || a.name.localeCompare(b.name, 'es')); }
function visibleStudents(m, sortKey) {
  const q = norm(state.search).replace(/^#/, '');
  let list = m.students.slice();
  if (q) list = list.filter(s => norm(s.name).includes(q) || String(s.num) === q);
  const sort = sortKey || state.sort;
  if (sort === 'name') list.sort((a, b) => a.name.localeCompare(b.name, 'es', { sensitivity: 'base' }));
  else if (sort === 'total') { const c = new Map(list.map(s => [s.id, calcStudent(m, s).total])); list.sort((a, b) => c.get(b.id) - c.get(a.id)); }
  else list.sort((a, b) => (a.num - b.num) || a.name.localeCompare(b.name, 'es'));
  return list;
}
function searchBox(ph) {
  return `<div class="search">${ICON.search}<input type="search" id="search" data-key="search" placeholder="${ph}" value="${esc(state.search)}" autocomplete="off"></div>`;
}
function statsTiles(m) {
  const st = moduleStats(m);
  return `<div class="stats" id="statsTiles">
    <div class="stat pri"><span>Promedio del curso</span><b>${st.n ? fmt(st.avg) : '—'}</b></div>
    <div class="stat ok"><span>Aprobados (≥ ${db.settings.pass})</span><b>${st.ap}</b></div>
    <div class="stat risk"><span>En riesgo (${db.settings.risk}–${db.settings.pass - 1})</span><b>${st.rk}</b></div>
    <div class="stat bad"><span>Reprobados (&lt; ${db.settings.risk})</span><b>${st.rp}</b></div>
    <div class="stat"><span>Notas registradas</span><b>${Math.round(st.progress * 100)}%</b></div>
  </div>`;
}

/* ----- Estado de logro de un RA ----- */
function raBadge(x) {
  const st = RA_STATUS[x.status];
  const why = x.status === 'ok' ? '' : raReasons(x).join(' · ');
  return `<span class="badge ${st.cls}" title="${esc(why)}">${st.icon} ${st.label}</span>`;
}
function raIcon(x) {
  const st = RA_STATUS[x.status];
  const why = x.status === 'ok' ? st.label : st.label + ': ' + raReasons(x).join(' · ');
  return `<span class="ra-ic ${st.cls}" title="${esc(why)}">${st.icon}</span>`;
}
function raRequirements(m, ra) {
  const parts = [`logro mínimo ${fmtN(raMin(m, ra))}%`];
  ra.cats.forEach(c => { if (c.minDone > 0) parts.push(`${c.label}: al menos ${c.minDone} de ${c.count} realizadas`); });
  return parts.join(' · ');
}
function raReasonLine(x) {
  if (x.status === 'ok') return '<span style="color:var(--ok)">✓ Cumple todos los requisitos</span>';
  if (x.status === 'rec') return `<span style="color:var(--ok)">↺ ${esc(raReasons(x)[0])}</span>`;
  if (x.status === 'pend') return '<span class="muted">Aún sin notas</span>';
  return raReasons(x).map(r => `<span>• ${esc(r)}</span>`).join(' ');
}

/* ----- Pestaña Resumen ----- */
function renderResumen(m) {
  const list = visibleStudents(m);
  const st = moduleStats(m);
  const head = `<tr><th class="num-col">No.</th><th>Estudiante</th>
    ${m.ras.map((r, i) => `<th class="c" title="${esc(r.name)}">RA${i + 1}<br><span style="font-weight:600;text-transform:none">${fmtN(r.w)}%</span></th>`).join('')}
    <th class="c" title="RA logrados">RA<br><span style="font-weight:600;text-transform:none">logrados</span></th>
    <th class="c" title="Puntos que suman los RA (sobre ${fmtN(100 - m.finalWeight)})">Puntos RA<br><span style="font-weight:600">de ${fmtN(100 - m.finalWeight)}</span></th>
    <th class="c">Cierre<br><span style="font-weight:600">/${fmtN(m.finalWeight)}</span></th>
    <th class="c">Total</th><th class="c">Condición</th><th class="r">Acciones</th></tr>`;
  const rows = list.map((s, r) => {
    const c = calcStudent(m, s), stt = statusOf(c);
    return `<tr>
      <td class="num-col tabnum">${s.num}</td>
      <td><div class="name-cell"><button class="link" data-act="open-stu" data-id="${s.id}" title="Calificar a este estudiante">${esc(s.name)}</button>${copyBtn(s.name)}</div></td>
      ${m.ras.map((ra, i) => `<td class="c tabnum small"><span data-out="ra:${s.id}:${ra.id}">${fmt(c.ras[i].pts)}</span> <span data-out="raic:${s.id}:${ra.id}">${raIcon(c.ras[i])}</span></td>`).join('')}
      <td class="c tabnum"><b data-out="raok:${s.id}">${c.raOk}/${m.ras.length}</b></td>
      <td class="c tabnum"><b data-out="acc:${s.id}">${fmt(c.acc)}</b></td>
      <td class="c"><input class="cell" data-final="${s.id}" data-key="f|${s.id}" data-r="${r}" data-c="0" value="${fmtN(s.final)}" inputmode="decimal" autocomplete="off" title="Nota del cierre (0 a ${fmtN(m.finalWeight)})"></td>
      <td class="c"><span class="pill ${stt.cls}" data-out="total:${s.id}">${fmtTotal(c.total)}</span></td>
      <td class="c" data-out="status:${s.id}"><span class="badge ${stt.cls}">${stt.label}</span></td>
      <td class="r"><div class="row" style="justify-content:flex-end">
        <button class="btn btn-ghost btn-icon" data-act="edit-stu" data-id="${s.id}" title="Editar nombre o número">${ICON.edit}</button>
        <button class="btn btn-ghost btn-icon" style="color:var(--bad)" data-act="del-stu" data-id="${s.id}" title="Eliminar estudiante">${ICON.trash}</button>
      </div></td></tr>`;
  }).join('');
  const bars = m.ras.length && st.n ? `<div class="card" style="margin-top:1rem"><div class="toolbar"><strong>Rendimiento promedio por RA</strong><span class="muted small">Logro promedio del curso y cuántos estudiantes ya lograron cada RA</span></div><div class="bars">
    ${m.ras.map((ra, i) => { const p = st.raAvg[i] * 100, col = p >= db.settings.pass ? 'var(--ok)' : p >= db.settings.risk ? '#f59e0b' : 'var(--bad)';
      return `<div class="bar-row" title="${esc(ra.name)}"><span class="small" style="font-weight:700">RA ${i + 1}</span><div class="track"><div class="fill" style="width:${p.toFixed(1)}%;background:${col}"></div></div><span class="small tabnum r">${p.toFixed(0)}%</span><span class="small muted tabnum" style="white-space:nowrap">${st.raOkCount[i]}/${st.n} logrados</span></div>`; }).join('')}
  </div></div>` : '';

  return `${weightAlert(m)}${statsTiles(m)}
  <div class="card">
    <div class="toolbar">
      ${searchBox('Buscar por nombre o número…')}
      <select id="sortSel" style="width:auto" title="Ordenar">
        <option value="num" ${state.sort === 'num' ? 'selected' : ''}>Orden: número de lista</option>
        <option value="name" ${state.sort === 'name' ? 'selected' : ''}>Orden: nombre</option>
        <option value="total" ${state.sort === 'total' ? 'selected' : ''}>Orden: nota total</option>
      </select>
      <span class="spacer"></span>
      ${blankModeNote(m)}

      <button class="btn btn-secondary" data-act="import-stu">${ICON.upload} Importar lista</button>
      <button class="btn btn-primary" data-act="add-stu">${ICON.plus} Agregar</button>
    </div>
    ${m.students.length ? `<div class="table-wrap"><table class="tbl" data-grid="grid"><thead>${head}</thead><tbody>${rows || `<tr><td colspan="${m.ras.length + 8}" class="c muted" style="padding:2rem">Ningún estudiante coincide con la búsqueda.</td></tr>`}</tbody></table></div>`

}

/* ----- Pestaña Registro por RA (hoja de cálculo) ----- */
function renderRegistro(m) {
  if (!m.ras.length) return `<div class="empty"><div class="big">🧩</div><p><strong>Este módulo aún no tiene RA.</strong></p><p class="small">Créalos en la pestaña Configuración.</p><p style="margin-top:1rem"><button class="btn btn-primary" data-act="tab" data-id="config">Ir a Configuración</button></p></div>`;
  if (!m.students.length) return `<div class="empty"><div class="big">👥</div><p><strong>No hay estudiantes.</strong></p><p style="margin-top:1rem"><button class="btn btn-primary" data-act="import-stu">${ICON.upload} Importar lista</button></p></div>`;
  let ra = findRa(m, state.raId); if (!ra) { ra = m.ras[0]; state.raId = ra.id; }
  const ri = m.ras.indexOf(ra);
  const list = visibleStudents(m, 'num');
  const pts = raPoints(ra);

  const chips = m.ras.map((r, i) => `<button class="chip ${r.id === ra.id ? 'active' : ''}" data-act="ra-select" data-id="${r.id}" title="${esc(r.name)}">RA ${i + 1} <small>${fmtN(r.w)}%</small></button>`).join('');
  const h1 = ra.cats.map(c => `<th class="cat-h cat-${c.color}" colspan="${c.count}">${esc(c.label)} <span style="font-weight:600;text-transform:none">· ${c.count}×${fmtN(c.max)}</span></th>`).join('');
  let col = 0;
  const h2 = ra.cats.map(c => Array.from({ length: c.count }, (_, i) => `<th class="item-h cat-${c.color}" data-act="col-menu" data-cat="${c.id}" data-idx="${i}" title="${esc(actFull(c, i))} · clic para nombrar, poner fecha o llenar la columna">${esc(itemLabel(c, i))}<small>/${fmtN(c.max)}</small>${actOf(c, i).n ? `<small class="act-n">${esc(actOf(c, i).n)}</small>` : ''}${actOf(c, i).d ? `<small>${fmtDate(actOf(c, i).d)}</small>` : ''}</th>`).join('')).join('');
  const rows = list.map((s, r) => {
    col = 0;
    const cells = ra.cats.map(c => Array.from({ length: c.count }, (_, i) => {
      const v = getGrade(s, ra.id, c.id, i);
      const k = `${s.id}|${ra.id}|${c.id}|${i}`;
      return `<td><input class="cell${v !== '' ? ' filled' : ''}" data-g="${k}" data-key="${k}" data-r="${r}" data-c="${col++}" value="${fmtN(v)}" inputmode="decimal" autocomplete="off"></td>`;
    }).join('')).join('');
    const x = calcRA(m, s, ra);
    return `<tr><td class="sticky-num">${s.num}</td><td class="sticky-name" title="${esc(s.name)}">${esc(s.name)}</td>${cells}
      <td class="out" data-out="raobt:${s.id}:${ra.id}">${fmtN(x.obt)}/${fmtN(x.max)}</td>
      <td class="out" data-out="rapct:${s.id}:${ra.id}">${Math.round(x.pct * 100)}%</td>
      <td class="out" style="color:var(--primary)" data-out="ra:${s.id}:${ra.id}">${fmt(x.pts, 2)}</td>
      <td class="out" data-out="rabadge:${s.id}:${ra.id}">${raBadge(x)}</td></tr>`;
  }).join('');

  return `${weightAlert(m)}
  <div class="chips">${chips}</div>
  <div class="card">
    <div class="toolbar">
      <div style="min-width:200px;flex:1"><strong>RA ${ri + 1}: ${esc(ra.name)}</strong><div class="muted small">Vale ${fmtN(ra.w)}% · ${raItemCount(ra)} actividades · ${fmtN(pts)} puntos en total</div><div class="small" style="color:var(--primary-dark);font-weight:600">Para lograrlo: ${esc(raRequirements(m, ra))}</div>${ra.desc ? `<div class="ra-desc">${esc(ra.desc)}</div>` : ''}</div>
      ${searchBox('Filtrar estudiante…')}
      <button class="btn btn-sm btn-ok" data-act="fill" data-scope="ra" data-mode="max" title="Pone la nota máxima en todas las casillas vacías de este RA">${ICON.bolt} Vacías → máximo</button>
      <button class="btn btn-sm btn-secondary" data-act="fill" data-scope="ra" data-mode="zero" title="Pone 0 en todas las casillas vacías de este RA">Vacías → 0</button>
      <button class="btn btn-sm btn-danger" data-act="fill" data-scope="ra" data-mode="clear" title="Borra todas las notas de este RA">Vaciar RA</button>
    </div>
    <div class="alert alert-info" style="margin:.6rem .8rem;padding:.5rem .8rem;font-size:.8rem">
      <div><strong>Atajos:</strong> Enter baja al siguiente estudiante · flechas para moverse · pega una columna o tabla copiada de Excel/Notion y se reparte sola · clic en el encabezado de una actividad para llenarla completa.</div>
    </div>
    <div class="grid-wrap"><table class="grid" data-grid="grid">
      <thead><tr><th class="sticky-num" rowspan="2">No.</th><th class="sticky-name" rowspan="2">Estudiante</th>${h1}<th class="out-h" rowspan="2">Puntos</th><th class="out-h" rowspan="2">%</th><th class="out-h" rowspan="2">Aporte<br>/${fmtN(ra.w)}</th><th class="out-h" rowspan="2">Estado</th></tr><tr>${h2}</tr></thead>
      <tbody>${rows || `<tr><td colspan="99" class="muted" style="padding:2rem">Ningún estudiante coincide con la búsqueda.</td></tr>`}</tbody>
    </table></div>
  </div>`;
}

/* ----- Pestaña Por estudiante ----- */
function renderEstudiante(m) {
  if (!m.students.length) return `<div class="empty"><div class="big">👥</div><p><strong>No hay estudiantes.</strong></p><p style="margin-top:1rem"><button class="btn btn-primary" data-act="import-stu">${ICON.upload} Importar lista</button></p></div>`;
  const list = allStudents(m);
  let s = findStu(m, state.stuId); if (!s) { s = list[0] || m.students[0]; state.stuId = s.id; }
  const c = calcStudent(m, s), stt = statusOf(c);
  const pos = list.findIndex(x => x.id === s.id);
  const opts = allStudents(m).map(x => `<option value="${x.id}" ${x.id === s.id ? 'selected' : ''}>${x.num}. ${esc(x.name)}</option>`).join('');

  const raCards = m.ras.map((ra, i) => {
    const x = c.ras[i];
    const cats = ra.cats.map(cat => {
      const cs = calcCat(s, ra, cat);
      const items = Array.from({ length: cat.count }, (_, k) => {
        const v = getGrade(s, ra.id, cat.id, k), key = `${s.id}|${ra.id}|${cat.id}|${k}`;
        const ad = actOf(cat, k).d;
        return `<label class="ci" title="${esc(actFull(cat, k))}"><span class="ci-h">${cat.count > 1 ? `<b>${k + 1}</b>` : ''}${ad ? `<em>${fmtDate(ad)}</em>` : ''}</span><input class="cell${v !== '' ? ' filled' : ''}" data-g="${key}" data-key="${key}" value="${fmtN(v)}" inputmode="decimal" autocomplete="off" title="${esc(actFull(cat, k))} (máx. ${fmtN(cat.max)})"></label>`;
      }).join('');
      return `<div class="cat-row cat-${cat.color}"><span class="cat-tag"><span class="cat-dot"></span>${esc(cat.label)} <span style="font-weight:600;opacity:.8">/${fmtN(cat.max)}</span></span>
        <div class="cat-items">${items}</div><span class="cat-sum" data-out="cat:${s.id}:${ra.id}:${cat.id}">${fmtN(cs.obt)} / ${fmtN(cs.max)}</span></div>`;
    }).join('');
    return `<div class="card ra-card">
      <div class="ra-card-head"><span class="ra-num">RA ${i + 1}</span><span class="ra-title">${esc(ra.name)}</span><span class="ra-weight">${fmtN(ra.w)}%</span>
        <button class="btn btn-sm btn-ok" data-act="fill" data-scope="stu-ra" data-ra="${ra.id}" data-mode="max" title="Pone la nota máxima en las casillas vacías de este RA">${ICON.bolt} Máximo</button>
        <button class="btn btn-sm btn-ghost" data-act="fill" data-scope="stu-ra" data-ra="${ra.id}" data-mode="clear" title="Borra las notas de este RA para este estudiante">Vaciar</button>
        ${x.status === 'no' || x.rec ? `<button class="btn btn-sm ${x.status === 'rec' ? 'btn-ok' : 'btn-secondary'}" data-act="rec-open" data-sid="${s.id}" data-ra="${ra.id}" title="Registrar la recuperación de este RA">↺ ${x.rec ? 'Recuperación: ' + fmtN(x.rec.score) : 'Recuperación'}</button>` : ''}
        <span class="ra-res">Aporte: <span data-out="ra:${s.id}:${ra.id}">${fmt(x.pts, 2)}</span> · <span data-out="rapct:${s.id}:${ra.id}">${Math.round(x.pct * 100)}%</span></span>
        <span data-out="rabadge:${s.id}:${ra.id}">${raBadge(x)}</span>
      </div>
      ${ra.desc ? `<div class="ra-desc" style="padding:.5rem 1rem 0">${esc(ra.desc)}</div>` : ''}
      <div class="ra-reasons"><span class="muted">Para lograrlo: ${esc(raRequirements(m, ra))}</span><span data-out="rareason:${s.id}:${ra.id}">${raReasonLine(x)}</span></div>
      <div class="ra-body">${cats || '<span class="muted small">Este RA no tiene criterios. Agrégalos en Configuración.</span>'}</div>
    </div>`;
  }).join('');

  return `${weightAlert(m)}
  <div class="card stu-head">
    <div class="row-wrap">
      <span class="badge neutral" data-out="raok-badge:${s.id}">RA logrados: ${c.raOk}/${m.ras.length}</span>
      <button class="btn btn-secondary btn-sm" data-act="stu-nav" data-id="-1" ${pos <= 0 ? 'disabled' : ''}>◀ Anterior</button>
      <select id="stuSel" style="width:auto;max-width:300px;font-weight:700">${opts}</select>
      <button class="btn btn-secondary btn-sm" data-act="stu-nav" data-id="1" ${pos >= list.length - 1 ? 'disabled' : ''}>Siguiente ▶</button>
      ${copyBtn(s.name, 'btn-secondary')}
      <button class="btn btn-sm btn-secondary" data-act="anec-new" data-sid="${s.id}" title="Agregar una anotación al cuaderno anecdótico">${ICON.note.replace('class="i"', 'class="i i-sm"')} Anotación</button>
      <button class="btn btn-sm btn-ok" data-act="fill" data-scope="stu" data-mode="max" title="Llena con la nota máxima todas las casillas vacías de todos los RA">${ICON.bolt} Completar todo con máximo</button>
    </div>
    ${stuSideInfo(m, s)}
    <div class="stu-total"><span>Nota final</span><b data-out="total-big:${s.id}" style="color:var(--${stt.cls === 'ok' ? 'ok' : stt.cls === 'risk' ? 'risk' : 'bad'})">${fmtTotal(c.total)}</b><span data-out="status:${s.id}"><span class="badge ${stt.cls}">${stt.label}</span></span></div>
  </div>
  ${studentProfile(m, s, c)}
  <div id="stuGrid" data-grid="linear">
    ${m.ras.length ? raCards : `<div class="empty" style="margin-bottom:1rem"><p>Este módulo no tiene RA. Créalos en Configuración.</p></div>`}
    <div class="card final-card">
      <div class="row" style="flex:1;min-width:220px"><span class="tag">${fmtN(m.finalWeight)}%</span><strong>${esc(m.finalLabel)}</strong></div>
      <label class="row" style="gap:.5rem"><input class="cell" data-final="${s.id}" data-key="f|${s.id}" value="${fmtN(s.final)}" inputmode="decimal" autocomplete="off"><span style="opacity:.6">/ ${fmtN(m.finalWeight)}</span></label>
      <div style="text-align:right" title="Suma de lo que aporta cada RA. No se suma aparte: la nota final es esto más el ${esc(m.finalLabel)}."><span class="small" style="opacity:.7;text-transform:uppercase;font-weight:700">Puntos de los RA</span><div class="big"><span data-out="acc:${s.id}">${fmt(c.acc)}</span> <span style="font-size:.55em;opacity:.6">/ ${fmtN(100 - m.finalWeight)}</span></div></div>
    </div>
    <p class="small muted" style="margin:-.4rem 0 1rem;text-align:right">Nota final = puntos de los RA (sobre ${fmtN(100 - m.finalWeight)}) + ${esc(m.finalLabel)} (sobre ${fmtN(m.finalWeight)})</p>
  </div>
  <div class="card card-pad"><label class="field">Observaciones (aparecen en el boletín)<textarea data-obs="${s.id}" data-key="obs|${s.id}" placeholder="Comentarios sobre el desempeño, recomendaciones…">${esc(s.obs)}</textarea></label></div>`;
}

/* ----- Pestaña Configuración ----- */
function renderConfig(m) {
  const wi = weightIssue(m);
  const sum = r2(m.ras.reduce((a, r) => a + (+r.w || 0), 0));
  const otherMods = db.modules.filter(x => x.id !== m.id && x.ras.length);
  const raCards = m.ras.map((ra, i) => {
    const pts = raPoints(ra);
    const cats = ra.cats.map(c => {
      const sub = c.count * c.max;
      return `<tr>
        <td><select data-cfg-cat="${ra.id}|${c.id}|color" data-key="cc|${c.id}|color" style="width:auto" title="Color">${CAT_COLORS.map(col => `<option value="${col}" ${c.color === col ? 'selected' : ''}>${COLOR_NAMES[col]}</option>`).join('')}</select></td>
        <td><input type="text" data-cfg-cat="${ra.id}|${c.id}|label" data-key="cc|${c.id}|label" value="${esc(c.label)}"></td>
        <td><input type="text" class="n" inputmode="numeric" data-cfg-cat="${ra.id}|${c.id}|count" data-key="cc|${c.id}|count" value="${c.count}"></td>
        <td><input type="text" class="n" inputmode="decimal" data-cfg-cat="${ra.id}|${c.id}|max" data-key="cc|${c.id}|max" value="${fmtN(c.max)}"></td>
        <td><input type="text" class="n" inputmode="numeric" data-cfg-cat="${ra.id}|${c.id}|minDone" data-key="cc|${c.id}|minDone" value="${c.minDone || ''}" placeholder="—" title="Cuántas actividades de este criterio debe realizar (nota mayor que 0) para lograr el RA. Vacío = sin mínimo."></td>
        <td class="c tabnum"><b>${fmtN(sub)}</b></td>
        <td class="c tabnum muted">${pts ? Math.round(sub / pts * 100) : 0}%</td>
        <td class="r" style="white-space:nowrap"><button class="btn btn-sm btn-ghost" data-act="cfg-acts" data-ra="${ra.id}" data-id="${c.id}" title="Nombre y fecha de cada actividad">📝 Actividades${c.acts.filter(a => a.n || a.d).length ? ` (${c.acts.filter(a => a.n || a.d).length}/${c.count})` : ''}</button><button class="btn btn-ghost btn-icon" style="color:var(--bad)" data-act="cfg-del-cat" data-ra="${ra.id}" data-id="${c.id}" title="Quitar criterio">${ICON.trash}</button></td>
      </tr>`;
    }).join('');
    return `<div class="card cfg-ra">
      <div class="cfg-ra-head">
        <span class="ra-num">RA ${i + 1}</span>
        <input type="text" data-cfg-ra="${ra.id}|name" data-key="cr|${ra.id}|name" value="${esc(ra.name)}" placeholder="Nombre o descripción del RA">
        <label class="mini">Valor<div class="w-input" title="Valor del RA en la nota final"><input type="text" inputmode="decimal" data-cfg-ra="${ra.id}|w" data-key="cr|${ra.id}|w" value="${fmtN(ra.w)}"><span>%</span></div></label>
        <label class="mini">Logro mín.<div class="w-input" title="Logro mínimo para este RA. Vacío = usar el del módulo (${fmtN(m.raPass)}%)"><input type="text" inputmode="decimal" data-cfg-ra="${ra.id}|minPct" data-key="cr|${ra.id}|minPct" value="${isNum(ra.minPct) ? fmtN(ra.minPct) : ''}" placeholder="${fmtN(m.raPass)}"><span>%</span></div></label>
        <div class="row">
          <button class="btn btn-ghost btn-icon" data-act="cfg-move-ra" data-id="${ra.id}" data-dir="-1" title="Subir" ${i === 0 ? 'disabled' : ''}>${ICON.up}</button>
          <button class="btn btn-ghost btn-icon" data-act="cfg-move-ra" data-id="${ra.id}" data-dir="1" title="Bajar" ${i === m.ras.length - 1 ? 'disabled' : ''}>${ICON.down}</button>

          <button class="btn btn-ghost btn-icon" style="color:var(--bad)" data-act="cfg-del-ra" data-id="${ra.id}" title="Eliminar RA">${ICON.trash}</button>
        </div>
      </div>
      <div class="ra-desc-edit"><textarea rows="2" data-cfg-ra="${ra.id}|desc" data-key="cr|${ra.id}|desc" placeholder="Descripción del RA o indicadores de logro (opcional). Aparece en el registro y en el boletín.">${esc(ra.desc)}</textarea></div>
      <div class="table-wrap"><table class="tbl cfg-cats">
        <thead><tr><th style="width:110px">Color</th><th>Criterio</th><th class="c" style="width:90px">Actividades</th><th class="c" style="width:90px">Máx. c/u</th><th class="c" style="width:90px" title="Actividades realizadas (nota mayor que 0) que exige para lograr el RA">Mín. para lograr</th><th class="c">Puntos</th><th class="c">% del RA</th><th></th></tr></thead>

        <div class="row-wrap"><button class="btn btn-sm btn-secondary" data-act="cfg-add-cat" data-id="${ra.id}">${ICON.plus} Criterio</button>

        <span class="muted">Total del RA: <b style="color:var(--ink)">${fmtN(pts)} puntos</b> · ${raItemCount(ra)} actividades</span>
      </div>
    </div>`;
  }).join('');

  return `
  <div class="card card-pad" style="margin-bottom:1rem">
    <h3 style="font-size:1rem;margin-bottom:.9rem">Datos del módulo</h3>
    <div class="form-grid">
      <label class="field">Nombre completo del módulo<input type="text" data-cfg-mod="name" data-key="cm|name" value="${esc(modFull(m))}"></label>

      <label class="field">Curso / sección<input type="text" data-cfg-mod="course" data-key="cm|course" value="${esc(m.course)}" placeholder="Ej.: 5to B"></label>

    </div>

      <select id="tplSel" style="width:auto">

/** Avisos de la agenda en el inicio. */

  const al = agendaAlerts();
  const item = e => `<li class="ag-item" data-act="cal-open-ev" data-src="${e.src}" data-key="${esc(e.key)}">
      <span class="cat-dot cat-${EV_TYPES[e.type]}"></span>

      <span class="ag-meta">${e.mod ? esc(modShort(e.mod)) + (e.mod.course ? ' ' + esc(e.mod.course) : '') : ''}${e.time ? ' · ' + fmtTime12(e.time) : ''}${e.sub ? ' · ' + e.sub : ''}</span></li>`;

  const pend = al.pending.length ? `<div class="alert alert-warn" style="margin:.8rem 0 0"><div><strong>${al.pending.length === 1 ? '1 actividad ya pasó y tiene' : al.pending.length + ' actividades ya pasaron y tienen'} estudiantes sin nota.</strong> ${al.pending.slice(0, 3).map(e => esc(e.title) + ' (' + esc(modShort(e.mod)) + ')').join(', ')}${al.pending.length > 3 ? '…' : ''}</div><button class="btn btn-sm btn-warn" data-act="go-calendar">Ver pendientes</button></div>` : '';
  const over = al.overdue.length ? `<div class="alert alert-bad" style="margin:.8rem 0 0"><div><strong>${al.overdue.length === 1 ? '1 evento de la agenda vencido' : al.overdue.length + ' eventos de la agenda vencidos'} sin completar.</strong></div><button class="btn btn-sm btn-secondary" data-act="go-calendar">Revisar</button></div>` : '';

    <div class="ag-cols">${block('Hoy', al.today, 'Nada agendado para hoy.')}${block('Mañana', al.tomorrow, 'Nada para mañana.')}${block('Próximos 7 días', al.week, 'Sin actividades esta semana.')}</div>
    ${pend}${over}
  </section>`;
}

/* =========================================================
   Panel (dashboards) — gráficos dibujados en SVG/HTML, sin internet
   ========================================================= */
const VIZ = {
  ok: '#16a34a', risk: '#f59e0b', bad: '#dc2626', pend: '#cbd5e1',
  series: '#2a78d6', avg: '#0f172a',
  seq: ['#cde2fb', '#9ec5f4', '#6da7ec', '#3987e5', '#1c5cab']   // una sola tonalidad: más oscuro = más logro
};
/* En modo oscuro la escala se invierte: lo bajo se funde con el fondo y lo alto brilla. */
const SEQ_DARK = ['#1c3352', '#1f4a80', '#2a6bbd', '#4c8fe0', '#86b6ef'];
const seqIdx = p => p < 0.2 ? 0 : p < 0.4 ? 1 : p < 0.6 ? 2 : p < 0.8 ? 3 : 4;
const seqRamp = () => (typeof isDark === 'function' && isDark()) ? SEQ_DARK : VIZ.seq;
const seqColor = p => seqRamp()[seqIdx(p)];
const seqInk = p => (typeof isDark === 'function' && isDark()) ? (seqIdx(p) >= 3 ? '#0c1222' : '#e6e9ef') : (seqIdx(p) >= 3 ? '#fff' : '#0f172a');
const tip = t => `data-tip="${esc(t)}" tabindex="0"`;
const pct0 = p => `${Math.round(p * 100)}%`;
const RA_ST_COLOR = { ok: VIZ.ok, proc: VIZ.risk, no: VIZ.bad, get pend() { return (typeof isDark === 'function' && isDark()) ? '#475569' : VIZ.pend; } };
const statusColor = cls => cls === 'ok' ? VIZ.ok : cls === 'risk' ? VIZ.risk : VIZ.bad;

function vLegend(items) {
  return `<div class="viz-legend">${items.map(([c, l]) => `<span><i style="background:${c}"></i>${esc(l)}</span>`).join('')}</div>`;
}
function vCard(title, sub, body, wide = false) {
  return `<section class="card viz-card${wide ? ' viz-wide' : ''}"><div class="viz-head"><h3>${esc(title)}</h3>${sub ? `<p>${sub}</p>` : ''}</div>${body}</section>`;
}
/** Barra apilada horizontal (conteos). segs: [{v, c, label, ink}] */
function stackBar(segs, total) {
  if (!total) return '<div class="stack stack-empty"></div>';
  return `<div class="stack">${segs.filter(s => s.v > 0).map(s =>
    `<div style="flex:${s.v};background:${s.c}" ${tip(`${s.v} ${s.label} (${pct0(s.v / total)})`)}>${s.v / total >= 0.09 ? `<span style="color:${s.ink || '#fff'}">${s.v}</span>` : ''}</div>`).join('')}</div>`;
}

/* ---------- Panel general (inicio) ---------- */
function renderHomePanel() {
  const mods = db.modules.filter(m => m.students.length);
  if (!mods.length) return '';
  const st = db.settings;
  const rows = mods.map(m => {
    const s = moduleStats(m);
    return `<div class="ov-row" data-act="open-mod" data-id="${m.id}" role="button" tabindex="0">
      <div class="ov-name"><b>${esc(m.name)}</b><span>${m.course ? esc(m.course) + ' · ' : ''}${s.n} est.</span></div>
      ${stackBar([
        { v: s.ap, c: VIZ.ok, label: 'aprobados' },
        { v: s.rk, c: VIZ.risk, label: 'en riesgo', ink: '#0f172a' },
        { v: s.rp, c: VIZ.bad, label: 'reprobados' }], s.n)}
      <div class="ov-num" ${tip(`Promedio del curso: ${fmt(s.avg)}`)}><b>${fmt(s.avg)}</b><span>promedio</span></div>
      <div class="ov-num" ${tip(`Notas registradas: ${pct0(s.progress)}`)}><b>${pct0(s.progress)}</b><span>registrado</span></div>
    </div>`;
  }).join('');
  return vCard('Situación general de mis módulos', 'Cantidad de estudiantes por condición en cada módulo. Haz clic en un módulo para ver su panel.',
    `${vLegend([[VIZ.ok, `Aprobados (≥ ${st.pass})`], [VIZ.risk, `En riesgo (${st.risk}–${st.pass - 1})`], [VIZ.bad, `Reprobados (< ${st.risk})`]])}<div class="ov-list">${rows}</div>`, true);
}

/* ---------- Panel del módulo ---------- */
function renderPanel(m) {
  if (!m.students.length) return `<div class="empty"><div class="big">📊</div><p><strong>Todavía no hay estudiantes en este módulo.</strong></p><p class="small">El panel se llena solo a medida que registras notas.</p></div>`;
  const st = moduleStats(m);
  const res = m.students.map((s, i) => ({ s, c: st.res[i] }));
  return `${weightAlert(m)}${statsTiles(m)}
  <p class="muted small" style="margin:-.3rem 0 1rem">${m.blankMode === 'zero' ? 'Nota definitiva: las casillas vacías cuentan como 0.' : 'Modo progreso: los gráficos muestran solo lo ya evaluado.'} Pasa el cursor (o toca) cualquier barra o celda para ver el detalle.</p>
  <div class="viz-grid">
    ${vCard('Distribución de notas finales', 'Cuántos estudiantes hay en cada rango de nota.', histogram(m, res))}
    ${vCard('Logro de cada RA', `Estado de los estudiantes en cada RA y logro promedio del curso (mínimo ${fmtN(m.raPass)}%).`, raStatusChart(m, res))}
    ${vCard('Logro por tipo de actividad', 'Promedio del curso en cada criterio, sumando todos los RA. Muestra en qué tipo de actividad fallan más.', criteriaChart(m))}
    ${vCard('Evolución del curso', 'Promedio del curso en cada actividad con fecha, en orden cronológico.', evolutionChart(m))}
    ${vCard('Mapa de logro: estudiantes × RA', 'Porcentaje de logro de cada estudiante en cada RA. Más oscuro = más logro. Ordenado de mayor a menor nota. Haz clic en un nombre para calificarlo.', heatmap(m, res), true)}
  </div>`;
}

function histogram(m, res) {
  const pass = db.settings.pass, risk = db.settings.risk;
  const bins = Array.from({ length: 10 }, () => []);
  res.forEach(({ s, c }) => bins[Math.min(9, Math.max(0, Math.floor(c.total / 10)))].push(s.name));
  const W = 560, H = 230, pl = 30, pr = 8, pt = 18, pb = 30, ih = H - pt - pb;
  const bw = (W - pl - pr) / 10, max = Math.max(1, ...bins.map(b => b.length));
  const step = Math.max(1, Math.ceil(max / 4)), top = Math.ceil(max / step) * step;
  const y = v => pt + ih - (v / top) * ih;
  let g = '';
  for (let v = 0; v <= top; v += step) g += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" class="grid-l"/><text x="${pl - 6}" y="${y(v) + 4}" class="ax" text-anchor="end">${v}</text>`;
  bins.forEach((b, i) => {
    const lo = i * 10, hi = i === 9 ? 100 : lo + 9;
    const col = lo >= pass ? VIZ.ok : lo >= risk ? VIZ.risk : VIZ.bad;
    const x = pl + i * bw + 2, w = bw - 4, h = (b.length / top) * ih, yy = pt + ih - h;
    const names = b.slice(0, 8).join(', ') + (b.length > 8 ? ` y ${b.length - 8} más` : '');
    if (b.length) {
      const r = Math.min(4, w / 2, h);
      g += `<path d="M${x},${pt + ih} V${yy + r} Q${x},${yy} ${x + r},${yy} H${x + w - r} Q${x + w},${yy} ${x + w},${yy + r} V${pt + ih} Z" fill="${col}"/>`;
      g += `<text x="${x + w / 2}" y="${yy - 5}" class="val" text-anchor="middle">${b.length}</text>`;
    }
    g += `<rect x="${pl + i * bw}" y="${pt}" width="${bw}" height="${ih}" fill="transparent" ${tip(`${b.length} estudiantes con nota ${lo}–${hi}${b.length ? ': ' + names : ''}`)}/>`;
    g += `<text x="${pl + i * bw + bw / 2}" y="${H - 10}" class="ax" text-anchor="middle">${lo}–${hi}</text>`;
  });
  const px = pl + (pass / 10) * bw;
  g += `<line x1="${px}" x2="${px}" y1="${pt - 8}" y2="${pt + ih}" class="ref-l"/><text x="${px + 4}" y="${pt - 1}" class="ref-t">Aprueba ${pass}</text>`;
  return `${vLegend([[VIZ.ok, 'Aprobado'], [VIZ.risk, 'En riesgo'], [VIZ.bad, 'Reprobado']])}
    <svg viewBox="0 0 ${W} ${H}" class="viz-svg" role="img" aria-label="Histograma de notas finales">${g}</svg>`;
}

function raStatusChart(m, res) {
  if (!m.ras.length) return '<p class="muted small">Este módulo no tiene RA.</p>';
  const n = res.length;
  const rows = m.ras.map((ra, i) => {
    const cnt = { ok: 0, proc: 0, no: 0, pend: 0 };
    let sum = 0;
    res.forEach(({ c }) => { const st = c.ras[i].status === 'rec' ? 'ok' : c.ras[i].status; cnt[st]++; sum += c.ras[i].pct; });
    const avg = n ? sum / n : 0;
    return `<div class="ra-row">
      <div class="ra-lbl" title="${esc(ra.name)}"><b>RA ${i + 1}</b><span>${esc(ra.name)}</span></div>
      ${stackBar([
        { v: cnt.ok, c: RA_ST_COLOR.ok, label: 'logrado o recuperado' },
        { v: cnt.proc, c: RA_ST_COLOR.proc, label: 'en proceso', ink: '#0f172a' },
        { v: cnt.no, c: RA_ST_COLOR.no, label: 'no logrado' },
        { v: cnt.pend, c: RA_ST_COLOR.pend, label: 'sin evaluar', ink: isDark() ? '#e6e9ef' : '#334155' }], n)}
      <div class="ra-avg" ${tip(`Logro promedio del curso en el RA ${i + 1}: ${pct0(avg)}`)}>${pct0(avg)}</div>
    </div>`;
  }).join('');
  return `${vLegend([[VIZ.ok, 'Logrado o recuperado'], [VIZ.risk, 'En proceso'], [VIZ.bad, 'No logrado'], [RA_ST_COLOR.pend, 'Sin evaluar']])}<div class="ra-rows">${rows}</div>`;
}

/** Agrupa los criterios por nombre (Práctica, Examen…) en todos los RA. */
function criteriaAgg(m) {
  const agg = new Map();
  m.ras.forEach(ra => ra.cats.forEach(c => {
    const k = norm(c.label);
    if (!agg.has(k)) agg.set(k, { label: c.label, obt: 0, max: 0, n: 0 });
    const a = agg.get(k);
    m.students.forEach(s => {
      const arr = (s.g[ra.id] || {})[c.id] || [];
      for (let i = 0; i < c.count; i++) {
        if (isNum(arr[i])) { a.obt += arr[i]; a.max += c.max; a.n++; }
        else if (m.blankMode === 'zero') a.max += c.max;
      }
    });
  }));
  return [...agg.values()];
}
function criteriaChart(m) {
  const data = criteriaAgg(m).filter(d => d.max > 0);
  if (!data.length) return '<p class="muted small viz-empty">Aún no hay notas registradas.</p>';
  const min = m.raPass;
  const rows = data.map(d => {
    const p = d.obt / d.max;
    return `<div class="hb-row" ${tip(`${d.label}: ${pct0(p)} de logro · ${fmtN(d.obt)} de ${fmtN(d.max)} puntos · ${d.n} notas`)}>
      <span class="hb-lbl">${esc(d.label)}</span>
      <div class="hb-track"><div class="hb-fill" style="width:${(p * 100).toFixed(1)}%;background:${VIZ.series}"></div><div class="hb-ref" style="left:${min}%"></div></div>
      <span class="hb-val">${pct0(p)}</span></div>`;
  }).join('');
  return `<div class="hb-list">${rows}</div><p class="viz-note"><span class="ref-key"></span> Línea: logro mínimo del RA (${fmtN(min)}%)</p>`;
}

function evolutionChart(m) {
  const pts = new Map();   // fecha -> {sum, n, acts:[]}
  m.ras.forEach((ra, ri) => ra.cats.forEach(c => {
    for (let i = 0; i < c.count; i++) {
      const a = actOf(c, i); if (!a.d) continue;
      let sum = 0, n = 0;
      m.students.forEach(s => { const v = getGrade(s, ra.id, c.id, i); if (isNum(v)) { sum += v / c.max; n++; } });
      if (!n) continue;
      if (!pts.has(a.d)) pts.set(a.d, { sum: 0, n: 0, acts: [] });
      const p = pts.get(a.d); p.sum += sum; p.n += n; p.acts.push(`RA${ri + 1} ${itemLabel(c, i)}${a.n ? ' – ' + a.n : ''}`);
    }
  }));
  const data = [...pts.entries()].sort((a, b) => a[0].localeCompare(b[0])).map(([d, p]) => ({ d, v: p.sum / p.n, n: p.n, acts: p.acts }));
  if (data.length < 2) return `<p class="muted small viz-empty">Para ver la evolución, ponle fecha a las actividades (clic en el encabezado de la actividad en «Registro por RA», o el botón 📝 Actividades en Configuración) y registra sus notas. Se necesitan al menos 2 fechas con notas.</p>`;
  const W = 560, H = 220, pl = 36, pr = 14, pt = 14, pb = 30, iw = W - pl - pr, ih = H - pt - pb;
  const x = i => pl + (data.length === 1 ? iw / 2 : (i / (data.length - 1)) * iw);
  const y = v => pt + ih - v * ih;
  let g = '';
  [0, 0.25, 0.5, 0.75, 1].forEach(v => { g += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" class="grid-l"/><text x="${pl - 6}" y="${y(v) + 4}" class="ax" text-anchor="end">${v * 100}%</text>`; });
  const pass = m.raPass / 100;
  g += `<line x1="${pl}" x2="${W - pr}" y1="${y(pass)}" y2="${y(pass)}" class="ref-l"/>`;
  const refLabel = `<text x="${pl + 4}" y="${pass > 0.85 ? y(pass) + 14 : y(pass) - 6}" class="ref-t">Logro mínimo ${fmtN(m.raPass)}%</text>`;
  g += `<polyline points="${data.map((p, i) => `${x(i)},${y(p.v)}`).join(' ')}" fill="none" stroke="${VIZ.series}" stroke-width="2" stroke-linejoin="round"/>`;
  const every = Math.ceil(data.length / 8);
  data.forEach((p, i) => {
    g += `<circle cx="${x(i)}" cy="${y(p.v)}" r="4" fill="${VIZ.series}" stroke="#fff" stroke-width="2"/>`;
    g += `<rect x="${x(i) - 14}" y="${pt}" width="28" height="${ih}" fill="transparent" ${tip(`${fmtDate(p.d)}: ${pct0(p.v)} de logro promedio · ${p.acts.join(', ')} · ${p.n} notas`)}/>`;
    if (i % every === 0 || i === data.length - 1) g += `<text x="${x(i)}" y="${H - 10}" class="ax" text-anchor="middle">${fmtDate(p.d)}</text>`;
  });
  g += refLabel;   // la etiqueta de referencia va encima de la línea de datos
  return `<svg viewBox="0 0 ${W} ${H}" class="viz-svg" role="img" aria-label="Evolución del logro promedio del curso">${g}</svg>`;
}

function heatmap(m, res) {
  if (!m.ras.length) return '<p class="muted small">Este módulo no tiene RA.</p>';
  const rows = res.slice().sort((a, b) => b.c.total - a.c.total).map(({ s, c }) => {
    const stt = statusOf(c);
    const cells = c.ras.map((x, i) => {
      if (x.status === 'pend') return `<td class="hm-cell hm-pend" ${tip(`${s.name} · RA ${i + 1}: sin notas`)}>—</td>`;
      const st = RA_STATUS[x.status];
      return `<td class="hm-cell" style="background:${seqColor(x.pct)};color:${seqInk(x.pct)}" ${tip(`${s.name} · RA ${i + 1}: ${pct0(x.pct)} de logro · ${st.label}${x.status !== 'ok' ? ' (' + raReasons(x).join('; ') + ')' : ''}`)}>${Math.round(x.pct * 100)}<sup>${st.icon}</sup></td>`;
    }).join('');
    return `<tr><td class="hm-name"><button class="link" data-act="open-stu" data-id="${s.id}">${s.num}. ${esc(s.name)}</button></td>${cells}
      <td class="hm-total"><div class="hm-bar"><div style="width:${Math.min(100, c.total)}%;background:${statusColor(stt.cls)}"></div></div><b>${fmtTotal(c.total)}</b><span class="badge ${stt.cls}">${stt.label}</span></td></tr>`;
  }).join('');
  const scale = `<div class="viz-legend"><span class="muted">Logro del RA:</span>${['0–19%', '20–39%', '40–59%', '60–79%', '80–100%'].map((l, i) => `<span><i style="background:${seqRamp()[i]}"></i>${l}</span>`).join('')}<span><i style="background:#f1f5f9;border:1px dashed #94a3b8"></i>Sin notas</span><span class="muted">· ✓ logrado · … en proceso · ✗ no logrado</span></div>`;
  return `${scale}<div class="table-wrap"><table class="hm"><thead><tr><th class="hm-name">Estudiante</th>${m.ras.map((r, i) => `<th title="${esc(r.name)}">RA ${i + 1}</th>`).join('')}<th>Nota final</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function studentProfile(m, s, c) {

html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}

.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}

main{max-width:680px;margin:-46px auto 0;padding:0 16px 130px;position:relative;z-index:2}

.row{display:grid;grid-template-columns:104px 1fr;gap:10px}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:14px 18px;font-weight:600;-webkit-tap-highlight-color:transparent}
.btn{background:var(--btn);color:#fff;width:100%;font-size:16px;margin-top:18px;transition:background .15s,transform .1s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:var(--btn-h)}.btn:active{transform:scale(.985)}.btn:disabled{opacity:.6}
.btn2{background:transparent;color:var(--pri);padding:10px 0;font-weight:600;width:100%;font-size:14px}
.msg{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;margin:12px 0 0;font-size:14.5px}
.msg svg{margin-top:2px}
.msg.bad{background:var(--badb);color:var(--bad)}.msg.ok{background:var(--okb);color:var(--ok)}.msg.warn{background:var(--warnb);color:var(--warn)}

.center{text-align:center}

.small{font-size:13px;color:var(--mut)}

.res-h .big{font-size:28px;font-weight:800;letter-spacing:-.5px}
.pill{display:inline-block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:3px 10px;border-radius:99px}

      if (META.status !== 'open' || (until && until < Date.now())) { screen(box(I.lock, '', META.status === 'draft' ? 'Todavía no está abierto' : 'Ya está cerrado', 'Espera a que tu profesor lo abra y vuelve a intentar.', '<button class="btn" onclick="location.reload()">Volver a intentar</button>')); return; }
      join(until);
    }).catch(function (e) { fail(String(e && e.code || '').indexOf('unavailable') >= 0 || !navigator.onLine ? 'Sin conexión a internet. Conéctate y vuelve a intentar.' : 'No se pudo abrir el examen (' + esc(e && e.code || e) + ').', I.wifi); });
  }

  function join(until) {
    var pc = (P.get('c') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    var last = {}; try { last = JSON.parse(lsGet('praxisAulaMe') || '{}'); } catch (e) { }
    screen('<form class="card" id="jf" autocomplete="off" novalidate><h2>Antes de empezar</h2><p class="sub">Escribe tus datos tal como están en la lista del curso.</p>' +
      (pc ? '<input type="hidden" id="code" value="' + esc(pc) + '">' : '<label class="f" for="code">Código del examen</label><input type="text" id="code" class="code-in" maxlength="8" placeholder="······" autocapitalize="characters" spellcheck="false">') +
      '<div class="row"><div><label class="f" for="num">Nº de lista</label><input type="number" id="num" min="1" max="199" inputmode="numeric" value="' + esc(last.num || '') + '"></div>' +
      '<div><label class="f" for="nm">Nombre y apellido</label><input type="text" id="nm" maxlength="80" autocomplete="name" value="' + esc(last.name || '') + '"></div></div>' +
      (META.pin ? '<label class="f" for="pin">Tu clave personal</label><input type="password" id="pin" class="pin-in" maxlength="4" inputmode="numeric" pattern="[0-9]*" placeholder="····" autocomplete="off">' : '') +
      '<ul class="tips">' + (META.dur ? '<li>' + I.clock + '<span>Tendrás <b>' + META.dur + ' minutos</b> desde que toques «Comenzar».</span></li>' : '') + '<li>' + I.eye + '<span>No salgas de esta página: tu profesor verá cuántas veces saliste.</span></li><li>' + I.save + '<span>Tus respuestas se guardan en el teléfono mientras respondes.</span></li></ul>' +
      '<div id="jm"></div><button class="btn" id="jb">Comenzar</button></form>');
    $('#jf').onsubmit = function (ev) {
      ev.preventDefault();
      var code = ($('#code').value || '').toUpperCase().replace(/[^A-Z0-9]/g, ''), num = parseInt($('#num').value, 10), name = $('#nm').value.trim().replace(/\s+/g, ' ');
      var pin = META.pin ? ($('#pin').value || '').replace(/\D/g, '') : '';
      var say = function (t) { $('#jm').innerHTML = '<div class="msg bad">' + I.alert + '<div>' + t + '</div></div>'; };
      if (!code) return say('Escribe el código que te dio tu profesor.');
      if (!(num >= 1 && num <= 199)) return say('Escribe tu número de lista.');
      if (name.split(' ').length < 2) return say('Escribe tu nombre y tu apellido.');
      if (META.pin && pin.length !== 4) return say('Escribe tu clave personal de 4 números.');
      var b = $('#jb'); b.disabled = true; b.innerHTML = '<span class="spin"></span> Comprobando…';
      var reset = function () { b.disabled = false; b.textContent = 'Comenzar'; };
      ref().collection('q').doc(code).get().then(function (d) {
        if (!d.exists) throw { code: 'permission-denied' };
        var X = d.data(), ros = X.ros || {};
        if (!ros[num]) { reset(); return say('El número ' + num + ' no está en la lista de este examen. Revisa tu número.'); }
        var L = ros[num], T = toks(name).map(function (t) { return hash(EID + ':' + t); });
        var hit = T.filter(function (h) { return L.indexOf(h) >= 0; }).length;
        if (hit < Math.min(2, L.length)) { reset(); return say('Ese nombre no corresponde al número ' + num + ' de la lista. Escríbelo como está en la lista, o revisa tu número.'); }
        var prev = lsGet(DEV);
        if (X.one && prev && prev !== String(num)) { reset(); return blocked1(X, prev, function () { go(X, code, num, name, pin, until); }); }
        return Promise.all([ref().collection('k').doc(num + '-' + pin).get(), ref().collection('x').doc(String(num)).get().catch(function () { return { exists: false }; })]).then(function (rs) {
          if (rs[1].exists) { reset(); return closedForMe(rs[1].data().m); }
          if (!rs[0].exists) { reset(); return say(X.pin ? 'Clave incorrecta. Revísala con tu profesor.' : 'No tienes acceso a este examen. Pregúntale a tu profesor.'); }
          go(X, code, num, name, pin, until);
        });
      }).catch(function (e) {
        reset();
        var c = String(e && e.code || e);
        say(c.indexOf('permission') >= 0 ? 'Código incorrecto, o el examen ya cerró. Revísalo con tu profesor.' : 'Sin conexión. Revisa tu internet e inténtalo otra vez.');
      });
    };
  }
  function closedForMe(mode) { hero(); screen(box(I.ban, 'bad', 'Tu profesor cerró este examen para ti', mode === 'collect' ? 'Ya no puedes responder. Si tienes dudas, habla con tu profesor.' : 'No puedes entrar a este examen. Habla con tu profesor.', '<button class="btn2" onclick="location.reload()">Volver a intentar</button>')); }
  function blocked1(X, prev, onOk) {
    screen(box(I.phone, '', 'Este celular ya se usó', 'Aquí ya entró el número ' + esc(prev) + ' en este examen. Cada celular es para una sola entrega.', '<p class="small">Si comparten celular, pídele a tu profesor que escriba aquí su código de desbloqueo.</p><input type="text" id="ul" class="code-in" maxlength="6" placeholder="····" autocapitalize="characters"><div id="um"></div><button class="btn" id="ub">Desbloquear</button><button class="btn2" onclick="location.reload()">Volver</button>'));
    $('#ub').onclick = function () {
      var v = ($('#ul').value || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (v && hash(EID + ':' + v, 32) === X.ulk) { lsSet(DEV, ''); onOk(); }
      else $('#um').innerHTML = '<div class="msg bad">' + I.alert + '<div>Código incorrecto.</div></div>';
    };
  }
  function go(X, code, num, name, pin, until) {
    var r = seedRand(EID + ':' + num);
    var qs = (X.qs || []).map(function (q) { var o = (q.opts || []).map(function (t, i) { return { i: i, t: t }; }); return { id: q.id, t: q.t, text: q.text, pts: q.pts, opts: q.t === 'mc' && X.shuffle ? shuffle(o, r) : o }; });
    if (X.shuffle) qs = shuffle(qs, r);
    S = { num: num, name: name, code: code, pin: pin, tok: rnd(20), qs: qs, instr: X.instr || '', dur: X.dur || 0, until: until || 0, startedAt: Date.now(), answers: {}, blurs: 0, meta: { title: META.title, kind: META.kind, mod: META.mod, course: META.course, res: META.res || 'off' } };
    lsSet('praxisAulaMe', JSON.stringify({ num: num, name: name }));
    lsSet(DEV, String(num));
    save(); exam();
  }

  function answered() { var n = 0; S.qs.forEach(function (q) { var a = S.answers[q.id]; if (a !== undefined && a !== '' && a !== null) n++; }); return n; }
  function exam() {
    document.body.classList.add('exam');
    top.innerHTML = '<div class="bar"><div class="in"><div class="t"><b>' + esc(S.meta.title) + '</b><span>Nº ' + S.num + ' · ' + esc(S.name) + '</span></div>' + thmBtn() + '<div class="timer" id="tm">' + I.clock + '<span>' + (deadline() < Infinity ? '--:--' : 'Sin límite') + '</span></div></div></div><div class="prog"><div id="pg"></div></div>';
    top.style.position = 'sticky'; top.style.top = '0'; top.style.zIndex = '5';
    var h = '<div id="wb"></div>';
    if (S.instr) h += '<div class="card"><p class="small" style="margin:0;white-space:pre-wrap;display:flex;gap:8px">' + I.pin + '<span>' + esc(S.instr) + '</span></p></div>';
    S.qs.forEach(function (q, i) {
      var a = S.answers[q.id], body = '';
      if (q.t === 'mc') body = q.opts.map(function (o, j) { var on = a === o.i; return '<label class="op' + (on ? ' on' : '') + '"><input type="radio" name="' + q.id + '" value="' + o.i + '"' + (on ? ' checked' : '') + '><span class="l">' + 'ABCDEFGH'[j] + '</span><span class="t">' + esc(o.t) + '</span></label>'; }).join('');
      else if (q.t === 'tf') body = '<div class="tf">' + [[true, 'Verdadero', 'V'], [false, 'Falso', 'F']].map(function (x) { var on = a === x[0]; return '<label class="op' + (on ? ' on' : '') + '"><input type="radio" name="' + q.id + '" value="' + x[0] + '"' + (on ? ' checked' : '') + '><span class="l">' + x[2] + '</span>' + x[1] + '</label>'; }).join('') + '</div>';
      else if (q.t === 'short') body = '<input type="text" data-q="' + q.id + '" maxlength="200" value="' + esc(a || '') + '" placeholder="Tu respuesta" autocomplete="off">';
      else body = '<textarea data-q="' + q.id + '" rows="5" maxlength="1500" placeholder="Escribe tu respuesta…">' + esc(a || '') + '</textarea><div class="cnt" id="c' + q.id + '">' + String(a || '').length + '/1500</div>';
      var isDone = a !== undefined && a !== '' && a !== null;
      h += '<div class="card q' + (isDone ? ' done' : '') + '" data-qid="' + q.id + '"><div class="n"><i>' + (i + 1) + '</i>de ' + S.qs.length + '<span>' + q.pts + ' pt' + (q.pts == 1 ? '' : 's') + '</span></div><div class="tx">' + esc(q.text) + '</div>' + body + '</div>';
    });
    h += '<div class="foot"><div class="in"><span class="saved" id="sv">' + I.save + 'Guardado en este teléfono</span><button class="btn" id="send">' + I.send + 'Entregar</button></div></div>';
    screen(h);
    app.onchange = onAns; app.oninput = onAns;
    $('#send').onclick = function () { confirmSend(); };
    progress(); clock(); clearInterval(tick); tick = setInterval(clock, 1000);
    if (S.blurs) warnBlur();
    watch(); clearInterval(watchT); watchT = setInterval(watch, 20000);
  }
  // Avisa al docente que está respondiendo y revisa si el docente le cerró el examen
  // Progreso y salidas de la página en vivo (el docente los ve mientras responde)
  function pushLive() {
    if (!S || S.sent || sending || !db) return;
    var n = answered(), sig = n + ':' + (S.blurs || 0);
    if (sig === liveN) return; liveN = sig;
    ref().collection('live').doc(String(S.num)).set({ num: S.num, pin: S.pin || '', n: n, tot: S.qs.length, b: S.blurs || 0, at: firebase.firestore.FieldValue.serverTimestamp() }).catch(function () { liveN = -1; });
  }
  function watch() {
    if (!S || S.sent || sending || !navigator.onLine) return;
    pushLive();
    ref().collection('x').doc(String(S.num)).get().then(function (d) {
      if (!d.exists || S.sent) return;
      var mode = d.data().m;
      if (mode === 'collect') { var w = $('#wb'); if (w) w.innerHTML = msg('warn', I.lock, 'Tu profesor cerró tu examen. Se entrega lo que llevas respondido…'); clearInterval(watchT); send(true, true); }
      else { clearInterval(watchT); clearInterval(tick); S.blockedAt = Date.now(); save(); closedForMe('block'); }
    }).catch(function () { });
  }
  function onAns(e) {
    var t = e.target, q = t.closest('[data-qid]'); if (!q || !S || S.sent) return;
    var id = q.getAttribute('data-qid'), qq = S.qs.filter(function (x) { return x.id === id; })[0]; if (!qq) return;
    if (t.type === 'radio') {
      S.answers[id] = qq.t === 'tf' ? t.value === 'true' : parseInt(t.value, 10);
      q.querySelectorAll('.op').forEach(function (l) { l.classList.toggle('on', l.querySelector('input').checked); });
    } else if (t.getAttribute('data-q')) { S.answers[id] = t.value; var c = document.getElementById('c' + id); if (c) c.textContent = t.value.length + '/1500'; }
    var a = S.answers[id]; q.classList.toggle('done', a !== undefined && a !== '' && a !== null);
    save(); progress(); var sv = $('#sv'); if (sv) sv.innerHTML = I.check + 'Guardado ' + new Date().toLocaleTimeString('es-DO', { hour: 'numeric', minute: '2-digit', second: '2-digit' });
  }
  function progress() { var p = $('#pg'); if (p) p.style.width = (answered() / S.qs.length * 100) + '%'; }
  function clock() {
    if (!S || S.sent) return;
    var tm = $('#tm'), d = deadline(); if (!tm || d === Infinity) return;
    var left = Math.max(0, Math.round((d - Date.now()) / 1000));
    tm.querySelector('span').textContent = Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0');
    tm.classList.toggle('low', left <= 120);
    if (left <= 0 && !sending) { clearInterval(tick); send(true); }
  }
  function warnBlur() { var w = $('#wb'); if (w) w.innerHTML = msg('warn', I.alert, 'Saliste de la página del examen ' + S.blurs + ' ' + (S.blurs === 1 ? 'vez' : 'veces') + '. Tu profesor lo verá.'); }
  // Cuenta una salida cuando se oculta la página (otra app, otra pestaña) o pierde el foco (otra ventana en la PC)
  var away = false;
  function leave() { if (!S || !S.qs || S.sent || away) return; away = true; S.blurs = (S.blurs || 0) + 1; save(); pushLive(); }
  function back() { if (!S || !S.qs || S.sent || !away) return; away = false; warnBlur(); watch(); }
  document.addEventListener('visibilitychange', function () { if (document.hidden) leave(); else back(); });
  window.addEventListener('blur', function () { setTimeout(function () { if (!document.hasFocus()) leave(); }, 250); });
  window.addEventListener('focus', back);
  function confirmSend() {
    var miss = S.qs.length - answered();
    var ov = document.createElement('div'); ov.className = 'ov';
    ov.innerHTML = '<div class="card"><h2>¿Entregar ahora?</h2><p class="sub">' + (miss ? '<b>Te faltan ' + miss + ' pregunta' + (miss > 1 ? 's' : '') + ' por responder.</b> ' : 'Respondiste todas las preguntas. ') + 'Después de entregar no podrás cambiar nada.</p><div class="two"><button class="gray" id="no">Seguir respondiendo</button><button class="btn" id="yes">Entregar</button></div></div>';
    document.body.appendChild(ov);
    ov.querySelector('#no').onclick = function () { ov.remove(); };
    ov.querySelector('#yes').onclick = function () { ov.remove(); send(false); };
  }
  function send(auto, byTeacher) {
    if (sending) return;
    clearInterval(tick);
    var b = $('#send'); if (b) { b.disabled = true; b.innerHTML = '<span class="spin"></span> Enviando…'; }
    var ans = {}; Object.keys(S.answers).forEach(function (k) { var v = S.answers[k]; if (typeof v === 'string') v = v.slice(0, 1500); if (v !== '' && v !== undefined && v !== null) ans[k] = v; });
    if (!S.tok) S.tok = rnd(20);
    var doc = { num: S.num, name: S.name, code: S.code, pin: S.pin || '', tok: S.tok, answers: ans, startedAt: S.startedAt, sentAt: firebase.firestore.FieldValue.serverTimestamp(), blurs: S.blurs || 0, ua: String(navigator.userAgent || '').slice(0, 150) };
    S.sending = Date.now(); save();
    var w = $('#wb'); if (w && auto && !byTeacher) w.innerHTML = msg('warn', I.clock, 'Se acabó el tiempo. Entregando tus respuestas…');
    sending = ref().collection('resp').doc(String(S.num)).set(doc);
    var slow = setTimeout(function () { var w = $('#wb'); if (w) w.innerHTML = msg('warn', I.wifi, 'Sin conexión. Tus respuestas están guardadas en este teléfono y se enviarán solas cuando vuelva el internet. <b>No cierres esta página.</b>'); }, 6000);
    sending.then(function () { clearTimeout(slow); clearInterval(watchT); S.sent = Date.now(); save(); ref().collection('live').doc(String(S.num)).delete().catch(function () { }); done(); })
      .catch(function (e) {
        clearTimeout(slow); sending = null;
        var c = String(e && e.code || e);
        if (c.indexOf('permission') >= 0) {
          S.rejected = 1; save(); hero();
          screen(box(I.ban, 'bad', 'No se pudo entregar', 'El examen ya cerró, tu profesor lo cerró para ti, o ya hay una entrega con el número ' + S.num + '. Muéstrale esta pantalla a tu profesor: tus respuestas siguen guardadas en este teléfono.', '<button class="btn" id="again">Intentar enviar otra vez</button><button class="btn2" id="reset">Empezar de nuevo (solo si tu profesor lo autorizó)</button>'));
          $('#again').onclick = function () { exam(); send(false); };
          $('#reset').onclick = reset;
        } else {
          var w = $('#wb'); if (w) w.innerHTML = msg('warn', I.wifi, 'No se pudo enviar. Reintentando… No cierres esta página.');
          clearTimeout(retry); retry = setTimeout(function () { send(auto, byTeacher); }, 8000);
        }
      });
  }
  window.addEventListener('online', function () { if (S && S.sending && !S.sent && !sending) send(false); });
  function reset() { if (!confirm('¿Borrar tus respuestas de este teléfono y empezar otra vez?')) return; try { localStorage.removeItem(KEY); } catch (e) { } location.reload(); }
  function done() {
    clearInterval(tick); clearInterval(watchT); hero('Nº ' + S.num + ' · ' + S.name);
    var res = (META && META.res) || (S.meta && S.meta.res) || 'off';
    screen('<div class="card center"><div class="ico ok">' + I.check + '</div><h2>¡Entregado!</h2><p class="sub">Nº ' + S.num + ' · ' + esc(S.name) + '</p><p class="small">' + (S.sent ? 'Enviado a las ' + new Date(S.sent).toLocaleTimeString('es-DO', { hour: 'numeric', minute: '2-digit' }) + ' · ' : '') + 'Tu profesor ya recibió tus respuestas.</p></div>' +
      '<div id="res">' + (res !== 'off' ? '<div class="card center"><div class="ico">' + I.award + '</div><h2>Tu resultado</h2><p class="sub">' + (res === 'close' ? 'Aparecerá aquí cuando tu profesor cierre el examen.' : 'Aparecerá aquí cuando tu profesor lo corrija.') + ' Puedes dejar esta página abierta o volver a entrar con el mismo enlace.</p></div>' : '') + '</div>' +
      '<button class="btn2" id="reset">Empezar de nuevo (solo si tu profesor lo autorizó)</button>');
    $('#reset').onclick = reset;
    if (res !== 'off' && S.tok) { pollRes(); clearInterval(resT); resT = setInterval(pollRes, 20000); }
    else if (S.tok) ref().get().then(function (d) { if (d.exists && d.data().res && d.data().res !== 'off') { META = d.data(); S.meta.res = META.res; save(); done(); } }).catch(function () { });
  }
  function pollRes() {
    if (!navigator.onLine) return;
    ref().collection('res').doc(S.tok).get().then(function (d) { if (d.exists) showRes(d.data()); }).catch(function () { });
  }
  function showRes(R) {
    var el = $('#res'); if (!el) return;
    var pct = Math.round(R.pct || 0), c = pct >= 70 ? 'ok' : pct >= 60 ? 'mid' : 'bad', col = c === 'ok' ? 'var(--ok)' : c === 'mid' ? 'var(--warn)' : 'var(--bad)';
    var det = (R.det || []).map(function (q) {
      var st = q.st === 'pend' ? '' : q.st;
      return '<div class="d ' + st + '"><span class="pt">' + (q.got == null ? '?' : q.got) + ' / ' + q.pts + '</span><b>' + q.n + '. ' + esc(q.q) + '</b>' + (q.ans ? '<small>Tu respuesta: ' + esc(q.ans) + '</small>' : '<small>Sin responder</small>') + (q.cor && q.st !== 'ok' ? '<small>Correcta: ' + esc(q.cor) + '</small>' : '') + '</div>';
    }).join('');
    el.innerHTML = '<div class="card"><h2 style="margin-bottom:14px">Tu resultado</h2><div class="res-h"><div class="ring" style="--p:' + pct + ';--c:' + col + '"><b>' + pct + '%</b></div><div>' +
      (R.max ? '<div class="big">' + R.grade + ' <span class="small">/ ' + R.max + '</span></div>' : '<div class="big">' + R.got + ' <span class="small">/ ' + R.total + ' pts</span></div>') +
      '<div class="small" style="margin:2px 0 8px">' + R.got + ' de ' + R.total + ' puntos</div><span class="pill ' + c + '">' + esc(R.cond || '') + '</span></div></div>' + (det ? '<div class="det">' + det + '</div>' : '') + '</div>';
    if (R.det) clearInterval(resT); // con el detalle ya no cambia; si no, sigue revisando por si el docente corrige algo
    var rg = el.querySelector('.ring'); if (rg && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) { rg.style.setProperty('--p', 0); requestAnimationFrame(function () { requestAnimationFrame(function () { rg.style.setProperty('--p', pct); }); }); }
  }
  // Si el examen quedó a medio enviar (se cerró la página), reintenta al abrir
  if (S && S.sending && !S.sent && S.qs) setTimeout(function () { send(false); }, 800);
})();
</script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Aula</title>
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap">
<style>
:root{--btn:#4f46e5;--btn-h:#4338ca;--bg:#f4f6fb;--card:#fff;--ink:#0f172a;--ink2:#334155;--mut:#64748b;--line:#e3e8f0;--pri:#4f46e5;--pri2:#eef2ff;--ok:#15803d;--okb:#dcfce7;--bad:#b91c1c;--badb:#fee2e2;--warn:#b45309;--warnb:#fef3c7;--r:16px;--sh:0 1px 2px rgba(15,23,42,.04),0 6px 20px -10px rgba(15,23,42,.15);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--btn:#6366f1;--btn-h:#818cf8;--bg:#0a0f1c;--card:#111827;--ink:#e5e7eb;--ink2:#cbd5e1;--mut:#94a3b8;--line:#1f2a3d;--pri:#a5b4fc;--pri2:#1e1b4b;--okb:#052e16;--badb:#3f0d0d;--warnb:#3a2005;--ok:#4ade80;--bad:#f87171;--warn:#fbbf24;--sh:0 8px 24px -14px rgba(0,0,0,.7);color-scheme:dark}}
:root[data-theme=dark]{--btn:#6366f1;--btn-h:#818cf8;--bg:#0a0f1c;--card:#111827;--ink:#e5e7eb;--ink2:#cbd5e1;--mut:#94a3b8;--line:#1f2a3d;--pri:#a5b4fc;--pri2:#1e1b4b;--okb:#052e16;--badb:#3f0d0d;--warnb:#3a2005;--ok:#4ade80;--bad:#f87171;--warn:#fbbf24;--sh:0 8px 24px -14px rgba(0,0,0,.7);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
svg.i{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em}
.hero{background:#0f172a;color:#fff;padding:16px 16px 68px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(600px 240px at 85% -20%,rgba(99,102,241,.45),transparent 70%),radial-gradient(500px 220px at 0% 120%,rgba(14,165,233,.18),transparent 70%)}
.hero:after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1px);background-size:18px 18px;mask-image:linear-gradient(180deg,#000,transparent)}
.hero .in{max-width:680px;margin:0 auto;position:relative;z-index:1}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:8px;font-size:13px;color:#cbd5e1;font-weight:600;letter-spacing:.2px}
.brand i{width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,.1);display:grid;place-items:center;font-style:normal}
.kind{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:#c7d2fe}
.hero h1{font-size:25px;line-height:1.2;margin:8px 0 6px;letter-spacing:-.4px}
.hero p{margin:0;color:#94a3b8;font-size:14px}
main{max-width:680px;margin:-46px auto 0;padding:0 16px 130px;position:relative;z-index:2}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin:0 0 14px;box-shadow:var(--sh)}
h2{font-size:19px;margin:0 0 4px;letter-spacing:-.2px}
.sub{color:var(--mut);font-size:14px;margin:0}
label.f{display:block;font-weight:600;font-size:13px;margin:16px 0 6px;color:var(--ink2)}
input[type=text],input[type=number],input[type=password],textarea{width:100%;font:inherit;color:inherit;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;outline:none;transition:border-color .15s,box-shadow .15s,background .15s}
input:focus,textarea:focus{border-color:var(--btn);background:var(--card);box-shadow:0 0 0 4px var(--pri2)}
.code-in,.pin-in{text-transform:uppercase;letter-spacing:.3em;font-weight:700;font-size:21px;text-align:center;font-family:ui-monospace,Menlo,monospace}
.row{display:grid;grid-template-columns:104px 1fr;gap:10px}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:14px 18px;font-weight:600;-webkit-tap-highlight-color:transparent}
.btn{background:var(--btn);color:#fff;width:100%;font-size:16px;margin-top:18px;transition:background .15s,transform .1s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:var(--btn-h)}.btn:active{transform:scale(.985)}.btn:disabled{opacity:.6}
.btn2{background:transparent;color:var(--pri);padding:10px 0;font-weight:600;width:100%;font-size:14px}
.msg{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;margin:12px 0 0;font-size:14.5px}
.msg svg{margin-top:2px}
.msg.bad{background:var(--badb);color:var(--bad)}.msg.ok{background:var(--okb);color:var(--ok)}.msg.warn{background:var(--warnb);color:var(--warn)}
.tips{display:grid;gap:10px;margin:18px 0 0;padding:14px;list-style:none;font-size:13.5px;color:var(--mut);background:var(--bg);border-radius:12px}
.tips li{display:flex;gap:10px;align-items:flex-start}
.rub-h{font-size:14px;margin:16px 0 6px;color:var(--ink2)}.rub{list-style:none;margin:0;padding:0;font-size:14px}.rub li{display:flex;gap:10px;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line)}.rub b{white-space:nowrap;color:var(--pri)}
.drop{display:flex;flex-direction:column;align-items:center;gap:4px;padding:22px 12px;border:2px dashed var(--line);border-radius:14px;cursor:pointer;text-align:center;color:var(--ink2);transition:border-color .15s,background .15s}.drop:hover{border-color:var(--btn);background:var(--pri2)}.drop svg{width:28px;height:28px;color:var(--pri)}.drop small{color:var(--mut);font-size:12.5px}.drop input,.camb input{display:none}
.camb{display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.pf{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;margin-top:10px}.pf>svg{color:var(--pri);flex:none}.pf div{flex:1;min-width:0}.pf b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pf small{color:var(--mut);font-size:12px}.pf.bad{border-color:var(--bad)}.pf.bad small{color:var(--bad)}
.pb{display:block;height:4px;background:var(--line);border-radius:4px;margin-top:6px;overflow:hidden}.pb em{display:block;height:100%;width:0;background:var(--ok);transition:width .2s}
.px{background:none;border:0;color:var(--mut);padding:6px;cursor:pointer;border-radius:8px}.px:hover{background:var(--bg)}.tips svg{color:var(--pri);margin-top:2px}
.bar{background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:10px 16px}
.bar .in{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:10px}
.bar .t{flex:1;min-width:0}.bar .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}.bar .t span{font-size:12px;color:var(--mut)}
.timer{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;font-weight:700;font-size:17px;padding:7px 11px;border-radius:10px;background:var(--pri2);color:var(--pri)}
.timer.low{background:var(--badb);color:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.55}}
.prog{height:3px;background:var(--line)}.prog div{height:100%;background:var(--btn);transition:width .35s}
.exam main{margin-top:14px}
.q .n{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--mut);font-weight:600}
.q .n i{font-style:normal;min-width:28px;height:28px;padding:0 6px;border-radius:8px;background:var(--pri2);color:var(--pri);display:grid;place-items:center;font-size:13px;font-weight:700;transition:background .2s,color .2s}
.q.done .n i{background:var(--btn);color:#fff}
.q .n span{margin-left:auto;border:1px solid var(--line);padding:1px 9px;border-radius:99px;font-size:12px}
.q .tx{font-size:16.5px;font-weight:600;margin:12px 0 14px;white-space:pre-wrap;line-height:1.45}
.op{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;margin:8px 0;cursor:pointer;transition:border-color .15s,background .15s}
.op:hover{border-color:color-mix(in srgb,var(--btn) 40%,var(--line))}
.op input{position:absolute;opacity:0;pointer-events:none}
.op .l{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:12.5px;color:var(--mut);transition:all .15s}
.op.on{border-color:var(--btn);background:var(--pri2)}.op.on .l{background:var(--btn);border-color:var(--btn);color:#fff}
.op span.t{padding-top:1px}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tf .op{justify-content:center;align-items:center;font-weight:600;margin:0}
.cnt{font-size:12px;color:var(--mut);text-align:right;margin-top:4px}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.foot .in{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:12px}.foot .btn{margin:0;width:auto;flex:1}
.saved{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);min-width:110px;line-height:1.3}
#wb:empty{display:none}
.center{text-align:center}
.ico{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;margin:4px auto 14px;background:var(--pri2);color:var(--pri)}
.ico svg{width:30px;height:30px}
.ico.ok{background:var(--okb);color:var(--ok);border-radius:50%;width:76px;height:76px;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.ico.bad{background:var(--badb);color:var(--bad)}.ico.warn{background:var(--warnb);color:var(--warn)}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
.small{font-size:13px;color:var(--mut)}
.ov{position:fixed;inset:0;background:rgba(2,6,23,.6);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:16px}
.ov .card{width:100%;max-width:480px;margin:0;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.ov .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ov .two button{margin-top:16px}
.gray{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.spin{display:inline-block;width:17px;height:17px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:s .8s linear infinite;vertical-align:-3px}
@keyframes s{to{transform:rotate(360deg)}}
.thm{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:#e2e8f0;border-radius:99px;padding:6px 12px;font-size:12.5px;font-weight:600}
.bar .thm{background:var(--bg);border-color:var(--line);color:var(--ink2);padding:7px 9px}.bar .thm span{display:none}
/* Resultado */
.res-h{display:flex;align-items:center;gap:16px}
.ring{--p:0;width:96px;height:96px;flex:none;border-radius:50%;display:grid;place-items:center;background:radial-gradient(closest-side,var(--card) 78%,transparent 80%),conic-gradient(var(--c,var(--btn)) calc(var(--p)*1%),var(--line) 0);transition:--p 1s}
@property --p{syntax:'<number>';inherits:false;initial-value:0}
.ring b{font-size:22px}
.res-h .big{font-size:28px;font-weight:800;letter-spacing:-.5px}
.pill{display:inline-block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:3px 10px;border-radius:99px}
.pill.ok{background:var(--okb);color:var(--ok)}.pill.mid{background:var(--warnb);color:var(--warn)}.pill.bad{background:var(--badb);color:var(--bad)}
.det{margin-top:16px;display:grid;gap:8px}
.det .d{border:1px solid var(--line);border-left:4px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px}
.det .d.ok{border-left-color:var(--ok)}.det .d.bad{border-left-color:var(--bad)}.det .d.half{border-left-color:var(--warn)}
.det .d b{display:block;margin-bottom:4px}.det .d small{display:block;color:var(--mut)}
.det .d .pt{float:right;font-weight:700;font-size:12.5px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.who{display:flex;gap:12px;align-items:center;padding:12px 14px;margin-top:14px;border-radius:12px;background:var(--pri2);color:var(--ink)}
.who svg{color:var(--ok);width:22px;height:22px}.who b{display:block}.who small{color:var(--mut);font-size:13px}
.instr a,.card a{color:var(--pri);word-break:break-all}
html.embed .hero{padding:12px 16px 58px}html.embed .hero .top,html.embed .hero h1,html.embed .hero .kind{display:none}html.embed .hero p{font-size:13.5px;color:#cbd5e1}
html.embed main{padding-bottom:40px}

/* ---------- Diseño (v29): más limpio y ordenado, igual que Mi aula ---------- */
:root{--btn:#3157e8;--btn-h:#2448cf;--pri:#3157e8;--pri2:#eaf0ff;--bg:#f5f6f8;--ink:#0f1728;--ink2:#344054;--mut:#5b6476;--line:#e3e6eb;--r:18px;--sh:0 1px 2px rgba(16,24,40,.04)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--btn:#5b7cfa;--btn-h:#7690ff;--pri:#8aa1ff;--pri2:#1a2348;--bg:#0a0e18;--card:#111725;--ink:#e8ebf2;--ink2:#c8cedb;--mut:#9aa3b6;--line:#222b3f;--sh:none}}
:root[data-theme=dark]{--btn:#5b7cfa;--btn-h:#7690ff;--pri:#8aa1ff;--pri2:#1a2348;--bg:#0a0e18;--card:#111725;--ink:#e8ebf2;--ink2:#c8cedb;--mut:#9aa3b6;--line:#222b3f;--sh:none}
html,body{font-size:16px;letter-spacing:-.003em}
h1,h2,.hero h1,.ex-t b,.q .tx{font-family:Manrope,Inter,system-ui,sans-serif}
.hero{background:#0b1020;padding:18px 20px 76px}
.hero:before{display:none}
.hero:after{background-image:radial-gradient(rgba(255,255,255,.075) 1px,transparent 1px);background-size:22px 22px;-webkit-mask-image:linear-gradient(180deg,#000,transparent 95%);mask-image:linear-gradient(180deg,#000,transparent 95%)}
.hero .in,main,.bar .in,.foot .in{max-width:720px}
.brand i{background:var(--btn);border-radius:9px;width:30px;height:30px}
.kind{color:#9db0ff;letter-spacing:.08em;font-size:11px}
.hero h1{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:10px 0 6px}
.hero p{color:#a9b3cb;font-size:14.5px}
main{margin-top:-52px;padding:0 18px 140px}
.card{border-radius:var(--r);padding:24px;margin:0 0 16px;box-shadow:var(--sh)}
h2{font-size:20px;font-weight:800;letter-spacing:-.015em;margin-bottom:6px}
.sub{font-size:14.5px;line-height:1.55}
label.f{font-size:13px;margin:18px 0 7px}
input[type=text],input[type=number],input[type=password],textarea{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:13px 15px;font-size:16px;transition:border-color .15s,box-shadow .2s}
input[type=text]:hover,input[type=number]:hover,input[type=password]:hover,textarea:hover{border-color:color-mix(in srgb,var(--mut) 55%,var(--line))}
input:focus,textarea:focus{box-shadow:0 0 0 4px color-mix(in srgb,var(--btn) 18%,transparent)}
.btn{border-radius:12px;min-height:52px;font-size:16px;margin-top:22px;box-shadow:0 1px 0 rgba(255,255,255,.12) inset,0 1px 2px rgba(16,24,40,.15)}
.tips{background:var(--bg);border-radius:14px;padding:16px;gap:12px;margin-top:20px;font-size:14px}
.msg{border-radius:14px;padding:13px 15px}
/* Resumen del examen */
.ex-sum{display:flex;align-items:center;gap:16px;padding:18px 22px}
.ex-r{--p:0;width:48px;height:48px;border-radius:50%;flex:none;background:radial-gradient(closest-side,var(--card) 70%,transparent 72%),conic-gradient(var(--btn) calc(var(--p)*1%),var(--line) 0);transition:--p .4s}
.ex-t b{display:block;font-size:16px;font-weight:700}.ex-t small{display:block;color:var(--mut);font-size:13px;margin-top:2px}
.ex-instr{display:flex;gap:12px;align-items:flex-start;padding:18px 22px;font-size:14.5px;color:var(--ink2);white-space:pre-wrap;line-height:1.55}
.ex-instr>svg{color:var(--pri);margin-top:3px}
/* Preguntas */
.q{padding:24px 24px 22px}
.q .n{gap:10px;font-size:12.5px}
.q .n i{min-width:30px;height:30px;border-radius:9px;font-size:13.5px}
.q .n em{font-style:normal;color:var(--mut);font-weight:600;letter-spacing:.01em}
.q .n span{background:var(--bg);border:0;padding:3px 10px;font-weight:600;color:var(--ink2)}
.q .tx{font-size:18px;font-weight:700;line-height:1.45;margin:16px 0 18px;letter-spacing:-.01em}
.op{padding:14px 16px;border-radius:14px;margin:10px 0;gap:14px;align-items:center;background:var(--card)}
.op .l{width:28px;height:28px;font-size:13px}
.op span.t{padding-top:0;font-size:15.5px}
.tf{gap:12px}.tf .op{min-height:54px}
.q textarea{min-height:128px;resize:vertical;line-height:1.55}
.cnt{margin-top:6px}
.q.done{border-color:color-mix(in srgb,var(--btn) 22%,var(--line))}
.bar{padding:12px 18px}.bar .t b{font-family:Manrope,Inter,sans-serif;font-weight:700;font-size:15.5px}
.timer{border-radius:12px;padding:8px 12px}
.prog{height:4px}
.exam main{margin-top:18px}
.foot{padding:14px 18px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -8px 24px -18px rgba(16,24,40,.35)}
.foot .btn{min-height:50px;max-width:280px;margin-left:auto}
/* Práctica */
.rub-h{font-size:15px;margin:22px 0 8px;color:var(--ink);font-family:Manrope,Inter,sans-serif}
.rub li{padding:11px 0;font-size:14.5px}
.drop{padding:30px 16px;border-radius:16px;gap:6px;background:var(--bg)}
.drop b{font-size:16px}
.pf{border-radius:14px;padding:12px 14px}
.ico{border-radius:20px}
@media (max-width:560px){.card{padding:20px}.q{padding:20px 18px}.hero h1{font-size:24px}.q .tx{font-size:17px}.foot .btn{max-width:none}main{padding:0 14px 140px}.ex-sum,.ex-instr{padding:16px 18px}}

/* ---------- v39: el examen se ve completo en el celular y en la PC ---------- */
/* La barra de «Entregar» va dentro de la página y se queda pegada abajo: al llegar al final queda DEBAJO de la última pregunta, nunca encima */
body.exam main{padding-bottom:calc(14px + env(safe-area-inset-bottom))}
body.exam .foot{position:-webkit-sticky;position:sticky;left:auto;right:auto;bottom:calc(12px + env(safe-area-inset-bottom));margin:20px 0 0;border:1px solid var(--line);border-radius:18px;padding:10px 10px 10px 16px;background:color-mix(in srgb,var(--card) 96%,transparent);box-shadow:0 12px 32px -14px rgba(16,24,40,.35),0 2px 6px -2px rgba(16,24,40,.08)}
body.exam .foot .in{max-width:none}
html.embed body.exam .foot{bottom:10px}
.foot{transition:transform .22s ease}
body.typing .foot{transform:translateY(calc(100% + 26px));opacity:0;pointer-events:none}
.foot{transition:transform .22s ease,opacity .18s ease}
html.embed .bar{padding:8px 16px}
html.embed .bar .t b{display:none}
html.embed .bar .t span{font-size:13.5px;font-weight:600;color:var(--ink2)}
html.embed .timer{font-size:15.5px;padding:6px 11px}
.ex-sum{flex-wrap:wrap}
.ex-t{flex:1;min-width:0}
.ex-nav{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;width:100%}
.ex-nav button{min-width:34px;height:34px;padding:0 8px;margin:0;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--mut);font-size:13px;font-weight:700;line-height:1;transition:background .15s,border-color .15s,color .15s}
.ex-nav button:hover{border-color:var(--btn);color:var(--pri)}
.ex-nav button.on{background:var(--btn);border-color:var(--btn);color:#fff}
.ex-nav small{flex-basis:100%;color:var(--mut);font-size:12px}
.q{scroll-margin-top:calc(var(--barH,76px) + 14px)}

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>Mi aula</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi aula">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<style>
:root{
  --bg:#f5f6f8;--s1:#fff;--s2:#f0f2f5;--s3:#e8ebf0;--line:#e3e6eb;--line2:#eef0f3;
  --ink:#0f1728;--ink2:#344054;--mut:#667085;--mut2:#98a2b3;
  --acc:#3157e8;--acc-h:#2448cf;--acc-s:#eaf0ff;--acc-t:#2340b8;
  --ok:#14804a;--ok-s:#e3f6ec;--warn:#b54708;--warn-s:#fdf0e1;--bad:#c4271c;--bad-s:#fdeceb;
  --nav:#0b1020;--nav2:#151c33;--nav3:#1e2742;--navt:#a9b3cb;
  --r:14px;--r2:20px;--sh1:0 1px 2px rgba(16,24,40,.05);--sh2:0 1px 2px rgba(16,24,40,.04),0 8px 24px -12px rgba(16,24,40,.18);--sh3:0 24px 48px -18px rgba(16,24,40,.35);
  --ease:cubic-bezier(.2,.7,.2,1);--spring:cubic-bezier(.34,1.4,.64,1);
  color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0a0e18;--s1:#111725;--s2:#161d2e;--s3:#1d2538;--line:#222b3f;--line2:#1a2234;--ink:#e8ebf2;--ink2:#c3c9d6;--mut:#8b94a8;--mut2:#5f6880;--acc:#6f8cff;--acc-h:#8aa1ff;--acc-s:#1a2348;--acc-t:#b9c6ff;--ok:#46c98a;--ok-s:#0f2a1f;--warn:#f0a44b;--warn-s:#2c1d0c;--bad:#f2786f;--bad-s:#2e1414;--nav:#070a12;--nav2:#10162a;--nav3:#18203a;--sh2:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6);--sh3:0 24px 48px -18px rgba(0,0,0,.7);color-scheme:dark}}
:root[data-theme=dark]{--bg:#0a0e18;--s1:#111725;--s2:#161d2e;--s3:#1d2538;--line:#222b3f;--line2:#1a2234;--ink:#e8ebf2;--ink2:#c3c9d6;--mut:#8b94a8;--mut2:#5f6880;--acc:#6f8cff;--acc-h:#8aa1ff;--acc-s:#1a2348;--acc-t:#b9c6ff;--ok:#46c98a;--ok-s:#0f2a1f;--warn:#f0a44b;--warn-s:#2c1d0c;--bad:#f2786f;--bad-s:#2e1414;--nav:#070a12;--nav2:#10162a;--nav3:#18203a;--sh2:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6);--sh3:0 24px 48px -18px rgba(0,0,0,.7);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
body{transition:background-color .3s var(--ease),color .3s var(--ease)}
h1,h2,h3,.disp{font-family:Manrope,Inter,system-ui,sans-serif;letter-spacing:-.015em}
a{color:var(--acc);text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:8px}
svg.i{width:20px;height:20px;flex:none;stroke-width:1.75}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:12px;background:var(--acc);color:#fff;font-weight:600;font-size:14.5px;transition:background .15s,transform .12s var(--ease),box-shadow .15s;box-shadow:0 1px 0 rgba(255,255,255,.12) inset,0 1px 2px rgba(16,24,40,.12)}
.btn:hover{background:var(--acc-h)}.btn:active{transform:scale(.98)}.btn:disabled{opacity:.6;cursor:default}
.btn.ghost{background:var(--s1);color:var(--ink);border:1px solid var(--line);box-shadow:var(--sh1)}
.btn.ghost:hover{background:var(--s2)}
.btn.sm{height:36px;padding:0 13px;font-size:13.5px;border-radius:10px}
.icb{width:40px;height:40px;border-radius:12px;display:inline-grid;place-items:center;color:var(--ink2);transition:background .15s,transform .12s}
.icb:hover{background:var(--s2)}.icb:active{transform:scale(.94)}
.spin{display:inline-block;width:17px;height:17px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
.spin.d{border-color:var(--line);border-top-color:var(--acc)}
@keyframes sp{to{transform:rotate(360deg)}}
/* ---------- Entrar ---------- */
.lg{position:relative;min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.lg-side{position:relative;overflow:hidden;background:var(--nav);color:#fff;padding:48px 56px;display:flex;flex-direction:column}
.lg-side::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1px);background-size:22px 22px;mask-image:linear-gradient(180deg,#000 0%,transparent 85%);-webkit-mask-image:linear-gradient(180deg,#000 0%,transparent 85%)}
.lg-side>*{position:relative}
.mark{display:flex;align-items:center;gap:11px;font-weight:700;font-family:Manrope,Inter,sans-serif;font-size:17px;letter-spacing:-.01em}
.mark i{width:38px;height:38px;border-radius:11px;background:var(--acc);display:grid;place-items:center;box-shadow:0 6px 18px -6px rgba(49,87,232,.7)}
.mark i svg{stroke:#fff;width:20px;height:20px}
.lg-side h1{font-size:44px;line-height:1.05;margin:auto 0 18px;max-width:440px;font-weight:800}
.lg-side h1 em{font-style:normal;color:#9db0ff}
.lg-side p{color:var(--navt);max-width:420px;margin:0 0 28px;font-size:16px}
.lg-feats{display:grid;gap:12px;margin:0 0 auto;padding:0;list-style:none;max-width:420px}
.lg-feats li{display:flex;gap:12px;align-items:center;color:#d5dbea;font-size:14.5px}
.lg-feats li span{width:34px;height:34px;border-radius:10px;background:var(--nav3);display:grid;place-items:center;flex:none}
.lg-feats svg{width:18px;height:18px;stroke:#9db0ff}
.lg-foot{color:#6b7591;font-size:12.5px;margin-top:28px}
.lg-main{position:relative;display:flex;align-items:center;justify-content:center;padding:40px 24px}
.lg-th{position:absolute;top:18px;right:18px}
.lg-card{width:100%;max-width:400px;animation:rise .6s var(--ease) both}
.lg-card h2{font-size:28px;margin:0 0 6px;font-weight:800}
.lg-card .lead{color:var(--mut);margin:0 0 26px}
.fld{position:relative;margin-bottom:16px}
.fld label{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:7px}
.fld input{width:100%;height:50px;font:inherit;font-size:16px;color:var(--ink);background:var(--s1);border:1.5px solid var(--line);border-radius:12px;padding:0 46px 0 44px;outline:none;transition:border-color .15s,box-shadow .2s,background .2s}
.fld input:hover{border-color:var(--mut2)}
.fld input:focus{border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 18%,transparent)}
.fld .ico{position:absolute;left:14px;bottom:15px;color:var(--mut);pointer-events:none}
.fld .eye{position:absolute;right:6px;bottom:5px;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--mut)}
.fld .eye:hover{background:var(--s2)}
.caps{font-size:12.5px;color:var(--warn);margin-top:6px;display:none}
.chk{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink2);margin:4px 0 20px;cursor:pointer;user-select:none}
.chk input{appearance:none;width:20px;height:20px;border:1.5px solid var(--mut2);border-radius:6px;display:grid;place-items:center;transition:all .15s;margin:0;flex:none}
.chk input:checked{background:var(--acc);border-color:var(--acc)}
.chk input:checked::after{content:"";width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.lg-card .btn{width:100%;height:50px;font-size:15.5px}
.note{font-size:13px;color:var(--mut);text-align:center;margin:18px 0 0}
.err{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--bad-s);color:var(--bad);font-size:14px;margin:0 0 16px;animation:shake .4s var(--ease)}
.err small{display:block;opacity:.75;margin-top:2px}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
/* ---------- Aplicación ---------- */
.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh;min-height:100dvh}
.side{position:sticky;top:0;height:100vh;height:100dvh;background:var(--nav);color:var(--navt);padding:22px 14px 16px;display:flex;flex-direction:column;gap:2px}
.side .mark{color:#fff;padding:2px 10px 22px}
.side .mark small{display:block;font:500 12px Inter,sans-serif;color:#7d88a6;letter-spacing:0}
.nv{position:relative;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:11px;color:var(--navt);font-size:14.5px;font-weight:500;width:100%;text-align:left;transition:background .15s,color .15s}
.nv:hover{background:var(--nav2);color:#fff}
.nv.on{background:var(--nav3);color:#fff;font-weight:600}
.nv.on svg{stroke:#9db0ff}
.nv .cnt{margin-left:auto;min-width:22px;height:22px;padding:0 7px;border-radius:99px;background:#f79009;color:#1a1204;font-size:12px;font-weight:700;display:grid;place-items:center}
.side-sec{margin-top:auto;display:flex;flex-direction:column;gap:2px;padding-top:12px;border-top:1px solid var(--nav2)}
.mod{width:100%;margin:0 0 6px;font:inherit;font-size:13.5px;padding:9px 10px;border-radius:10px;border:1px solid var(--nav3);background:var(--nav2);color:#fff}
.me{display:flex;align-items:center;gap:11px;padding:10px;border-radius:12px;width:100%;text-align:left;transition:background .15s}
.me:hover{background:var(--nav2)}
.av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#3b4a7a,#26305a);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;letter-spacing:.02em}
.me b{display:block;color:#fff;font-size:14px;line-height:1.25}.me small{color:#7d88a6;font-size:12px}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:14px 32px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid transparent;transition:border-color .2s,box-shadow .2s}
.top.sc{border-bottom-color:var(--line);box-shadow:0 6px 18px -16px rgba(16,24,40,.5)}
.crumb{flex:1;min-width:0;font-size:13.5px;color:var(--mut)}
.crumb b{color:var(--ink);font-weight:600}
.mbrand{display:none}
.bell{position:relative}
.bell i{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:#f79009;box-shadow:0 0 0 2px var(--bg)}
.view{padding:8px 32px 56px;max-width:1160px;width:100%;margin:0 auto}
.view.enter>*{animation:rise .5s var(--ease) both}
.view.enter>*:nth-child(2){animation-delay:.04s}.view.enter>*:nth-child(3){animation-delay:.08s}.view.enter>*:nth-child(4){animation-delay:.12s}.view.enter>*:nth-child(5){animation-delay:.16s}.view.enter>*:nth-child(n+6){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:6px 0 22px}
.hd h1{font-size:32px;line-height:1.15;margin:0;font-weight:800}
.hd p{margin:6px 0 0;color:var(--mut)}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r2);box-shadow:var(--sh1)}
.pad{padding:18px 20px}
.sec-t{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 4px}
.sec-t h2{font-size:15px;margin:0;font-weight:700;letter-spacing:-.005em}
.sec-t a,.sec-t button{font-size:13px;font-weight:600;color:var(--acc)}
/* Tarjetas de datos */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:16px}
.stat{padding:18px 20px;display:flex;flex-direction:column;gap:2px;transition:transform .2s var(--ease),box-shadow .2s;cursor:pointer;text-align:left}
.stat:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.stat .k{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);font-weight:500}
.stat .k span{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--s2);color:var(--ink2)}
.stat .k svg{width:16px;height:16px}
.stat b{font:800 34px/1.15 Manrope,Inter,sans-serif;letter-spacing:-.02em;margin-top:8px}
.stat small{font-size:13px;font-weight:500;color:var(--mut)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-s);color:var(--ok)}.pill.risk,.pill.warn{background:var(--warn-s);color:var(--warn)}.pill.bad{background:var(--bad-s);color:var(--bad)}.pill.info{background:var(--acc-s);color:var(--acc-t)}.pill.neutral{background:var(--s2);color:var(--mut)}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
/* Listas */
.row{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line2)}
.row:first-of-type{border-top:0}
.tile{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none}
.tile.w{background:var(--warn-s);color:var(--warn)}.tile.o{background:var(--ok-s);color:var(--ok)}.tile.a{background:var(--acc-s);color:var(--acc)}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-weight:600;font-size:14.5px;line-height:1.35}
.row .tx small{display:block;font-size:13px;color:var(--mut);margin-top:1px}
.row .tx small.w{color:var(--warn)}.row .tx small.o{color:var(--ok)}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:26px 10px;color:var(--mut);font-size:14px}
.empty .tile{width:52px;height:52px;border-radius:16px;background:var(--s2);color:var(--mut);margin-bottom:4px}
.empty b{color:var(--ink);font-size:15px}
.news{padding:14px 0;border-top:1px solid var(--line2)}
.news:first-of-type{border-top:0}
.news p{margin:0;font-size:14.5px;white-space:pre-wrap;color:var(--ink)}
.news small{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mut);margin-top:4px}
.news small i{width:6px;height:6px;border-radius:50%;background:var(--acc)}
/* Notas */
.hero{position:relative;overflow:hidden;display:flex;align-items:center;gap:26px;flex-wrap:wrap;padding:24px 26px;border-radius:var(--r2);background:var(--nav);color:#fff;margin-bottom:16px}
.hero{border:1px solid rgba(255,255,255,.06)}
.hero::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.08) 1px,transparent 1px);background-size:20px 20px;mask-image:linear-gradient(90deg,transparent 35%,#000);-webkit-mask-image:linear-gradient(90deg,transparent 35%,#000);pointer-events:none}
.hero>*{position:relative;z-index:1}
.ring{position:relative;width:118px;height:118px;flex:none}
.ring svg{width:118px;height:118px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10;stroke-linecap:round}
.ring .tr{stroke:rgba(255,255,255,.1)}
.ring .vl{stroke:#9db0ff;transition:stroke-dashoffset 1.2s var(--ease)}
.ring div{position:absolute;inset:0;display:grid;place-items:center;font:800 30px Manrope,Inter,sans-serif}
.hero .lbl{color:#a9b3cb;font-size:13.5px}
.hero .big{font:700 22px/1.25 Manrope,Inter,sans-serif;margin:2px 0 8px}
.hero .meta{display:flex;gap:22px;flex-wrap:wrap;margin-left:auto;position:relative}
.hero .meta div{min-width:90px}
.hero .meta b{display:block;font:800 24px Manrope,Inter,sans-serif}
.hero .meta span{font-size:12.5px;color:#a9b3cb}
.ras{display:grid;gap:12px}
.ra{overflow:hidden;transition:box-shadow .2s,border-color .2s}
.ra:hover{border-color:color-mix(in srgb,var(--acc) 30%,var(--line))}
.ra-h{display:flex;align-items:center;gap:16px;width:100%;padding:16px 20px;text-align:left}
.ra-n{width:44px;height:44px;border-radius:12px;background:var(--s2);display:grid;place-items:center;font:800 14px Manrope,Inter,sans-serif;color:var(--ink2);flex:none}
.ra-t{flex:1;min-width:0}
.ra-t b{display:block;font-size:14.5px;font-weight:600;line-height:1.35;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.bar{height:6px;background:var(--s3);border-radius:6px;margin-top:9px;overflow:hidden}
.bar div{height:100%;width:0;border-radius:6px;transition:width 1s var(--ease)}
.ra-s{text-align:right;flex:none}
.ra-s b{display:block;font:800 18px Manrope,Inter,sans-serif}
.ra-s small{font-size:12px;color:var(--mut)}
.chev{color:var(--mut);transition:transform .25s var(--ease);flex:none}
.ra.open .chev{transform:rotate(180deg)}
.ra-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s var(--ease)}
.ra.open .ra-b{grid-template-rows:1fr}
.ra-b>div{overflow:hidden}
.acts{padding:0 20px 14px 80px}
.act{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line2);font-size:14px}
.act b{font-variant-numeric:tabular-nums}
.act .m{color:var(--mut2)}
.lock{display:flex;align-items:center;gap:14px;padding:16px 20px;border-style:dashed;color:var(--mut);background:transparent;box-shadow:none}
.lock .tile{background:var(--s2);color:var(--mut)}
.lock b{color:var(--ink2);display:block}
/* Segmentos y chips */
.seg{display:inline-flex;padding:4px;background:var(--s2);border-radius:12px;gap:2px;position:relative}
.seg button{position:relative;z-index:1;padding:7px 14px;border-radius:9px;font-size:13.5px;font-weight:500;color:var(--mut);transition:color .2s}
.seg button.on{color:var(--ink);font-weight:600}
.seg i{position:absolute;top:4px;bottom:4px;left:0;border-radius:9px;background:var(--s1);box-shadow:var(--sh1);transition:transform .3s var(--spring),width .3s var(--spring)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:7px 13px;border-radius:99px;border:1px solid var(--line);background:var(--s1);font-size:13px;font-weight:500;color:var(--ink2);transition:all .15s}
.chip:hover{border-color:var(--mut2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--s1)}
.search{position:relative;flex:1;min-width:200px;max-width:340px}
.search input{width:100%;height:40px;font:inherit;font-size:14px;color:var(--ink);background:var(--s1);border:1px solid var(--line);border-radius:11px;padding:0 12px 0 38px;outline:none;transition:border-color .15s,box-shadow .2s}
.search input:focus{border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 15%,transparent)}
.search svg{position:absolute;left:12px;top:11px;width:18px;height:18px;color:var(--mut)}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
/* Documentos */
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.doc{display:flex;gap:14px;align-items:center;padding:14px 16px;color:var(--ink);transition:transform .2s var(--ease),box-shadow .2s,border-color .2s}
.doc:hover{transform:translateY(-2px);box-shadow:var(--sh2);border-color:color-mix(in srgb,var(--acc) 30%,var(--line))}
.dk{width:44px;height:48px;border-radius:10px;display:grid;place-items:center;font:800 10.5px Manrope,Inter,sans-serif;letter-spacing:.04em;flex:none;position:relative}
.dk.pdf{background:#fde8e7;color:#b42318}.dk.doc{background:#e3ebff;color:#2448cf}.dk.ppt{background:#fdeadb;color:#c4320a}.dk.xls{background:#dff5e8;color:#107a42}.dk.video{background:#f3e8ff;color:#7a2bc9}.dk.link{background:var(--acc-s);color:var(--acc)}
:root[data-theme=dark] .dk,.dark-auto .dk{filter:saturate(.9) brightness(.92)}
.doc .tx{flex:1;min-width:0}.doc b{display:block;font-weight:600;font-size:14.5px;line-height:1.35}.doc small{color:var(--mut);font-size:12.5px}
.new{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--acc-s);color:var(--acc-t);flex:none}
/* Esqueletos */
.sk{background:linear-gradient(90deg,var(--s2) 25%,var(--s3) 50%,var(--s2) 75%);background-size:200% 100%;animation:shim 1.3s infinite;border-radius:12px}
@keyframes shim{to{background-position:-200% 0}}
/* Menú de cuenta, avisos y diálogos */
.pop{position:fixed;z-index:60;min-width:260px;max-width:min(360px,calc(100vw - 24px));background:var(--s1);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh3);padding:8px;transform-origin:top right;animation:pop .22s var(--spring) both}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(-4px)}to{opacity:1;transform:none}}
.pop .it{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:10px;font-size:14px;text-align:left;color:var(--ink)}
.pop .it:hover{background:var(--s2)}
.pop hr{border:0;border-top:1px solid var(--line2);margin:6px 4px}
.pop .hd2{padding:10px 12px 6px;font-size:12px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.scrim{position:fixed;inset:0;z-index:55}
.dlg-bg{position:fixed;inset:0;z-index:70;background:rgba(8,12,24,.5);backdrop-filter:blur(3px);display:grid;place-items:center;padding:20px;animation:fade .2s both}
@keyframes fade{from{opacity:0}}
.dlg{width:100%;max-width:380px;background:var(--s1);border-radius:20px;padding:24px;box-shadow:var(--sh3);animation:pop .25s var(--spring) both}
.dlg h3{margin:0 0 6px;font-size:18px}.dlg p{margin:0 0 20px;color:var(--mut)}
.dlg .acts2{display:flex;gap:10px;justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:28px;z-index:80;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:14px;background:var(--ink);color:var(--s1);font-size:14px;font-weight:500;box-shadow:var(--sh3);animation:toast .35s var(--spring) both;max-width:calc(100vw - 32px)}
.toast.out{animation:toastOut .25s ease both}
@keyframes toast{from{opacity:0;transform:translate(-50%,16px)}}
@keyframes toastOut{to{opacity:0;transform:translate(-50%,10px)}}
.inst{display:flex;align-items:center;gap:14px;padding:14px 16px;margin-bottom:16px;border-radius:16px;background:var(--acc-s);color:var(--acc-t)}
.inst .tx{flex:1;font-size:14px}.inst b{display:block}
.off{display:none;align-items:center;justify-content:center;gap:8px;padding:8px;font-size:13px;background:var(--warn-s);color:var(--warn)}
body.offline .off{display:flex}
.loading{min-height:100vh;min-height:100dvh;display:grid;place-items:center}
.bx{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;color:var(--mut);padding:24px}
/* Barra inferior (celular) */
.tabs{display:none}
@media (max-width:980px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}}
@media (max-width:860px){
  .lg{grid-template-columns:1fr}
  .lg-side{padding:28px 22px 30px;min-height:auto;border-bottom:1px solid var(--line)}
  .lg-side h1{font-size:30px;margin:26px 0 8px}
  .lg-side p{margin:0;font-size:15px}
  .lg-feats,.lg-foot{display:none}
  .lg-main{position:static;align-items:flex-start;padding:26px 20px 40px}
  .mobme{display:inline-grid!important}
  .lg-th{top:20px;right:16px;color:#fff;position:absolute}
  .lg-th:hover{background:var(--nav3)}
  .app{grid-template-columns:1fr}
  .side{display:none}
  .top{padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
  .crumb{font:700 17px Manrope,Inter,sans-serif;color:var(--ink)}
  .crumb b,.crumb span{display:none}
  .crumb .mbrand{display:flex;align-items:center;gap:10px}
  .mbrand i{width:32px;height:32px;border-radius:10px;background:var(--acc);display:grid;place-items:center}.mbrand i svg{stroke:#fff;width:18px;height:18px}
  .stat:first-child:nth-last-child(3){grid-column:1/-1}
  .row{flex-wrap:wrap}.row .tx{min-width:calc(100% - 56px)}.row>.btn,.row>.pill{margin-left:56px}
  .view{padding:6px 16px calc(96px + env(safe-area-inset-bottom))}
  .hd h1{font-size:25px}
  .hd{margin-bottom:16px}
  .stats{gap:10px}.stat{padding:14px 16px}.stat b{font-size:28px}
  .hero{padding:18px;gap:18px}.hero .meta{margin-left:0;width:100%;gap:14px}.ring,.ring svg{width:96px;height:96px}.ring div{font-size:24px}
  .acts{padding:0 16px 12px}
  .ra-h{padding:14px 16px;gap:12px}
  .tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--s1) 88%,transparent);backdrop-filter:saturate(1.4) blur(16px);-webkit-backdrop-filter:saturate(1.4) blur(16px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .tb{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 5px;font-size:11px;font-weight:500;color:var(--mut);transition:color .2s}
  .tb svg{transition:transform .25s var(--spring)}
  .tb.on{color:var(--acc);font-weight:600}.tb.on svg{transform:translateY(-1px) scale(1.06)}
  .tb .dot{position:absolute;top:4px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:#f79009;box-shadow:0 0 0 2px var(--s1)}
  .tabs .ind{position:absolute;top:0;left:0;height:2px;background:var(--acc);border-radius:2px;transition:transform .35s var(--spring)}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom))}
  .search{max-width:none}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
@media print{.side,.tabs,.top{display:none}.app{display:block}}

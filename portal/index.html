<style>
:root{--acc:#4f46e5;--acc-h:#4338ca;--acc2:#eef2ff;--acct:#3730a3;--bg:#f4f6fb;--card:#fff;--ink:#0f172a;--ink2:#334155;--mut:#64748b;--line:#e3e8f0;--line2:#eef1f6;--nav:#0f172a;--nav2:#1e293b;--navt:#cbd5e1;--ok:#15803d;--okb:#dcfce7;--warn:#b45309;--warnb:#fef3c7;--bad:#b91c1c;--badb:#fee2e2;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--acc:#6366f1;--acc-h:#818cf8;--acc2:#1e1b4b;--acct:#c7d2fe;--bg:#0a0f1c;--card:#111827;--ink:#e5e7eb;--ink2:#cbd5e1;--mut:#94a3b8;--line:#1f2a3d;--line2:#1a2335;--nav:#060a14;--nav2:#141c2e;--ok:#4ade80;--okb:#052e16;--warn:#fbbf24;--warnb:#3a2005;--bad:#f87171;--badb:#3f0d0d;color-scheme:dark}}
:root[data-theme=dark]{--acc:#6366f1;--acc-h:#818cf8;--acc2:#1e1b4b;--acct:#c7d2fe;--bg:#0a0f1c;--card:#111827;--ink:#e5e7eb;--ink2:#cbd5e1;--mut:#94a3b8;--line:#1f2a3d;--line2:#1a2335;--nav:#060a14;--nav2:#141c2e;--ok:#4ade80;--okb:#052e16;--warn:#fbbf24;--warnb:#3a2005;--bad:#f87171;--badb:#3f0d0d;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
a{color:var(--acc);text-decoration:none}
button{font:inherit;cursor:pointer}
svg.i{width:20px;height:20px;flex:none}
.hide{display:none!important}
/* Entrar */
.login{min-height:100vh;display:flex;flex-direction:column}
.lg-hero{background:var(--nav);color:#fff;padding:56px 24px 84px}
.lg-in{max-width:440px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:600}
.brand i{width:40px;height:40px;border-radius:12px;background:var(--acc);display:grid;place-items:center}
.brand i svg{stroke:#fff}
.lg-hero h1{margin:22px 0 8px;font-size:30px;line-height:1.15}
.lg-hero p{margin:0;color:#cbd5e1}
.lg-card{max-width:440px;width:calc(100% - 32px);margin:-48px auto 0;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px 20px;box-shadow:0 10px 30px -18px rgba(15,23,42,.35)}
.lg-card h2{margin:0 0 6px;font-size:20px}
label.f{display:block;font-weight:600;font-size:13px;margin:14px 0 6px;color:var(--ink2)}
input[type=text],input[type=password]{width:100%;font:inherit;font-size:16px;color:inherit;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;outline:none}
input:focus{border-color:var(--acc);box-shadow:0 0 0 4px var(--acc2)}
.chk{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:14px;color:var(--ink2)}
.chk input{width:18px;height:18px;accent-color:var(--acc)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 18px;border:0;border-radius:12px;background:var(--acc);color:#fff;font-weight:600;font-size:15px}
.btn:hover{background:var(--acc-h)}.btn:disabled{opacity:.6}
.btn.w{width:100%;margin-top:18px;height:50px;font-size:16px}
.btn2{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-weight:600;font-size:14px}
.msg{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;margin:14px 0 0;font-size:14px}
.msg.bad{background:var(--badb);color:var(--bad)}.msg.ok{background:var(--okb);color:var(--ok)}.msg.info{background:var(--acc2);color:var(--acct)}
.lg-tip{max-width:440px;width:calc(100% - 32px);margin:16px auto 24px}
.spin{display:inline-block;width:18px;height:18px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite}
.spin.d{border-color:var(--line);border-top-color:var(--acc)}
@keyframes sp{to{transform:rotate(360deg)}}
/* Aplicación */
.app{min-height:100vh;display:flex}
.side{width:248px;flex:none;background:var(--nav);color:var(--navt);padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.side .brand{color:#fff;padding:0 10px 18px}
.side .brand small{display:block;font-size:12px;color:#94a3b8;font-weight:500}
.nv{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;color:var(--navt);font-size:15px;font-weight:500;background:none;border:0;text-align:left;width:100%}
.nv:hover{background:var(--nav2);color:#fff}.nv.on{background:var(--nav2);color:#fff;font-weight:600}
.nv .cnt{margin-left:auto;font-size:12px;font-weight:700;background:#f59e0b;color:#0f172a;border-radius:99px;padding:1px 8px}
.side-foot{margin-top:auto;border-top:1px solid var(--nav2);padding-top:12px;display:flex;flex-direction:column;gap:4px}
.me{display:flex;align-items:center;gap:10px;padding:6px 10px}
.av{width:36px;height:36px;border-radius:50%;background:#334155;color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.me b{color:#fff;font-size:14px;display:block}.me small{color:#94a3b8;font-size:12px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:none}
.content{flex:1;padding:28px 32px 40px;max-width:1120px;width:100%;margin:0 auto}
.tabs{display:none}
h1.t{margin:0 0 4px;font-size:30px;line-height:1.2}
.sub{color:var(--mut);margin:0 0 18px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.card h2{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);font-weight:600}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi span{font-size:13px;color:var(--mut);font-weight:600}.kpi b{font-size:32px;line-height:1.2}.kpi small{font-size:13px;font-weight:600}
.cols{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.cols>.c1{flex:3 1 420px;min-width:0}.cols>.c2{flex:2 1 280px;min-width:0}
.it{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line2)}
.it:first-of-type{border-top:0}
.ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none}
.ico.w{background:var(--warnb);color:var(--warn)}.ico.o{background:var(--okb);color:var(--ok)}.ico.a{background:var(--acc2);color:var(--acc)}
.it .tx{flex:1;min-width:0}.it .tx b{display:block;font-size:15px}.it .tx small{display:block;font-size:13px;color:var(--mut)}
.it .tx small.w{color:var(--warn)}.it .tx small.o{color:var(--ok)}
.go{padding:10px 14px;border-radius:10px;background:var(--acc);color:#fff;font-weight:600;font-size:14px;white-space:nowrap}
.go.g{background:transparent;border:1.5px solid var(--line);color:var(--acc)}
.done{font-size:13px;font-weight:700;color:var(--ok);white-space:nowrap}
.news{padding:12px 0;border-top:1px solid var(--line2);font-size:15px;white-space:pre-wrap}
.news:first-of-type{border-top:0}
.news small{display:block;font-size:12px;color:var(--mut);margin-top:2px;white-space:normal}
.empty{color:var(--mut);font-size:14px;padding:6px 0}
.tot{display:flex;align-items:center;gap:22px;background:var(--nav);color:#fff;border-radius:18px;padding:18px 22px;margin-bottom:16px;flex-wrap:wrap}
.ring{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;flex:none}
.ring div{width:76px;height:76px;border-radius:50%;background:var(--nav);display:grid;place-items:center;font-weight:700;font-size:24px}
.tot span{color:#cbd5e1;font-size:14px}.tot b{display:block;font-size:20px}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px}
.pill.ok{background:var(--okb);color:var(--ok)}.pill.risk{background:var(--warnb);color:var(--warn)}.pill.bad{background:var(--badb);color:var(--bad)}
.ras{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.ra h3{margin:0;font-size:16px;display:flex;justify-content:space-between;gap:10px}
.ra h3 span{white-space:nowrap}
.ra p{margin:2px 0 0;font-size:13px;color:var(--mut)}
.bar{height:7px;background:var(--line2);border-radius:7px;margin:10px 0 4px;overflow:hidden}.bar div{height:100%;border-radius:7px}
.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line2);font-size:14px}
.row:first-of-type{margin-top:6px}.row .m{color:var(--mut)}
.lock{display:flex;gap:12px;align-items:center;color:var(--mut);border-style:dashed}
.lock b{color:var(--ink2)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:8px 13px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink2);font-size:13px;font-weight:500}
.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink);font-weight:600}
.doc{display:flex;gap:12px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);margin-bottom:10px}
.doc:hover{border-color:var(--acc)}
.dk{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:11px;font-weight:800;flex:none}
.dk.pdf{background:#fee2e2;color:#b91c1c}.dk.doc{background:#dbeafe;color:#1d4ed8}.dk.ppt{background:#ffedd5;color:#c2410c}.dk.xls{background:#dcfce7;color:#15803d}.dk.video{background:#fef2f2;color:#dc2626}.dk.link{background:var(--acc2);color:var(--acc)}
.doc .tx{flex:1;min-width:0}.doc b{display:block;font-size:15px}.doc small{color:var(--mut);font-size:13px}
.new{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--acc2);color:var(--acct)}
.inst{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--acc2);color:var(--acct);font-size:14px;margin-bottom:16px}
.inst button{margin-left:auto}
.sel{width:100%;font:inherit;font-size:14px;padding:9px 10px;border-radius:10px;border:1px solid var(--nav2);background:var(--nav2);color:#fff}
.loading{min-height:100vh;display:grid;place-items:center;color:var(--mut)}
/* Celular */
@media (max-width:899px){
  .kpi b{font-size:26px}
  .side{display:none}
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border-bottom:1px solid var(--line);padding:calc(14px + env(safe-area-inset-top)) 16px 12px;position:sticky;top:0;z-index:5}
  .top .who{min-width:0}.top .who small{display:block;font-size:12px;color:var(--mut)}.top .who b{font-size:16px}
  .content{padding:16px 16px 96px}
  h1.t{font-size:24px}
  .tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(8px + env(safe-area-inset-bottom));z-index:6}
  .tb{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;font-weight:500;color:var(--mut);background:none;border:0;position:relative}
  .tb.on{color:var(--acc);font-weight:600}
  .tb .dot{position:absolute;top:2px;left:55%;width:8px;height:8px;border-radius:50%;background:#f59e0b}
  .ras{grid-template-columns:1fr}
  .tot{padding:16px}
}
@media print{.side,.tabs,.top{display:none}}
